name: Update wire every 30 minutes

on:
  schedule:
    - cron: "9,39 * * * *"
  workflow_dispatch:
    inputs:
      submit_all:
        description: "Also submit every page in sitemap.xml to IndexNow (tick once after a big change)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-wire
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Start from the latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Pull feeds, triage, write data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ruby scripts/update.rb
      # Static, crawlable case pages + sitemap + llms.txt. Deterministic, so it
      # only produces a diff when a case file or translation actually changed.
      # Never allowed to block the wire update.
      - name: Build case pages, sitemap and llms.txt
        continue-on-error: true
        run: ruby scripts/build_pages.rb
      - name: Commit changes
        id: commit
        run: |
          git config user.name "aithreat-bot"
          git config user.email "bot@aithreat.io"
          git add -A site
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "wire: $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              git push origin HEAD:main && break
              git fetch origin main && git rebase origin/main
            done
            echo "pushed=1" >> "$GITHUB_OUTPUT"
          fi
      # Bing, Yandex and friends learn about new or edited case pages within
      # minutes. Google ignores IndexNow and reads sitemap.xml instead.
      - name: Tell search engines which pages changed (IndexNow)
        if: steps.commit.outputs.pushed == '1'
        continue-on-error: true
        run: ruby scripts/indexnow.rb
      - name: Submit the whole sitemap to IndexNow (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.submit_all
        continue-on-error: true
        run: ruby scripts/indexnow.rb --all
