name: Update wire every 30 minutes

on:
  schedule:
    - cron: "9,39 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-wire
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Start from the latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Pull feeds, triage, write data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ruby scripts/update.rb
      - name: Commit changes
        run: |
          git config user.name "aithreat-bot"
          git config user.email "bot@aithreat.io"
          git add site/data site/feed.xml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "wire: $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              git push origin HEAD:main && break
              git fetch origin main && git rebase origin/main
            done
          fi
