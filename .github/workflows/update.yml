name: Update wire every 30 minutes

on:
  schedule:
    - cron: "9,39 * * * *"
  workflow_dispatch:
    inputs:
      submit_all:
        description: "Also submit every page in sitemap.xml to IndexNow (tick once after a big change)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-wire
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Start from the latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Pull feeds, triage, write data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
        run: ruby scripts/update.rb
      # Static, crawlable case pages + sitemap + llms.txt. Deterministic, so it
      # only produces a diff when a case file or translation actually changed.
      # Never allowed to block the wire update.
      - name: Build case pages, sitemap and llms.txt
        continue-on-error: true
        run: ruby scripts/build_pages.rb
      - name: Commit changes
        id: commit
        run: |
          git config user.name "aithreat-bot"
          git config user.email "bot@aithreat.io"
          git add -A site
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "wire: $(date -u +'%Y-%m-%d %H:%M UTC')"
            # If someone pushed while this run was working, replay the robot's commit on top
            # of theirs. Conflicting hunks take the robot's side (its data is the newer read),
            # then the generated pages are rebuilt from the merged data so they match.
            pushed=0
            for i in 1 2 3; do
              if git push origin HEAD:main; then pushed=1; break; fi
              git fetch origin main
              if ! git rebase -X theirs origin/main; then git rebase --abort; continue; fi
              ruby scripts/build_pages.rb || true
              git add -A site
              git diff --cached --quiet || git commit -q --amend --no-edit
            done
            [ "$pushed" = 1 ] || { echo "Could not push after 3 attempts"; exit 1; }
            echo "pushed=1" >> "$GITHUB_OUTPUT"
          fi
      # Bing, Yandex and friends learn about new or edited case pages within
      # minutes. Google ignores IndexNow and reads sitemap.xml instead.
      - name: Tell search engines which pages changed (IndexNow)
        if: steps.commit.outputs.pushed == '1'
        continue-on-error: true
        run: ruby scripts/indexnow.rb
      - name: Submit the whole sitemap to IndexNow (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.submit_all
        continue-on-error: true
        run: ruby scripts/indexnow.rb --all
      # A commit made by the robot does not start other workflows, so the robot
      # publishes the site itself. Human pushes still go through pages.yml.
      - name: Publish the site to GitHub Pages
        if: steps.commit.outputs.pushed == '1'
        uses: actions/configure-pages@v5
      - if: steps.commit.outputs.pushed == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        if: steps.commit.outputs.pushed == '1'
        uses: actions/deploy-pages@v4
      # Each newly verified case goes to Bluesky, Mastodon and Telegram once the
      # page is live. Platforms without secrets are skipped; see scripts/social.rb.
      - name: Post new case files to social accounts
        id: social
        if: steps.commit.outputs.pushed != '1' || steps.deployment.outcome == 'success'
        continue-on-error: true
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_OWNER_CHAT_ID: ${{ secrets.TELEGRAM_OWNER_CHAT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: ruby scripts/social.rb
      # Once a day from 05:00 UTC: Reddit threads that a case file answers, with draft replies,
      # sent privately to Karl on Telegram. Nothing is posted to Reddit; see scripts/reddit_watch.rb.
      - name: Reddit reading list (once a day)
        id: reddit
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 12
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: ruby scripts/reddit_watch.rb
      - name: Save which cases were posted
        if: always() && (steps.social.outcome != 'skipped' || steps.reddit.outcome != 'skipped')
        run: |
          git add config/social_posted.json config/reddit_watch.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "social: posted state $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              git push origin HEAD:main && break
              git fetch origin main && git rebase origin/main
            done
          fi
