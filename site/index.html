ve":"Unclear; payload was a legitimate package, possibly a prank or demonstration","vector":"Unauthorized npm publish of cline@2.3.0 with a postinstall script running npm install -g openclaw@latest","root_cause":"Long-lived npm publish token exposed via a GitHub Actions workflow; no trusted publishing or provenance enforcement","timeline":[{"date":"2026-02-17","event":"cline@2.3.0 published at 3:26 AM PT with malicious postinstall"},{"date":"2026-02-17","event":"Clean 2.4.0 published at 11:23 AM PT and 2.3.0 deprecated at 11:30 AM PT"},{"date":"2026-02-18","event":"GHSA-9ppg-jx86-fqw7 advisory and media coverage"}],"impact":"About 4,000 downloads in an eight-hour window installed OpenClaw globally without consent; no credential theft or malicious payload reported.","response":"Cline revoked the token, moved publishing to OIDC provenance via GitHub Actions, published 2.4.0 and told users to uninstall OpenClaw if unwanted.","status":"resolved","cve":null,"sources":[{"name":"Dark Reading","url":"https://www.darkreading.com/application-security/supply-chain-attack-openclaw-cline-users"},{"name":"The Hacker News","url":"https://thehackernews.com/2026/02/cline-cli-230-supply-chain-attack.html"},{"name":"Endor Labs","url":"https://endorlabs.com/learn/supply-chain-attack-targeting-cline-installs-openclaw"},{"name":"GitHub Advisory via OSV","url":"https://osv.dev/vulnerability/GHSA-9ppg-jx86-fqw7"}]},{"id":"anthropic-distillation","date":"2026-02-23","title":"Anthropic accuses DeepSeek, Moonshot and MiniMax of distilling Claude via 24,000 accounts","category":"Model & data leak","direction":"on-ai","severity":"high","country":"US","region":"North America","target":"Anthropic Claude","loss_usd":null,"summary":"Anthropic said three Chinese labs used fraudulent account networks and proxies to run 16M+ Claude exchanges to extract capabilities for their own models.","source":"The Decoder","url":"https://the-decoder.com/anthropic-accuses-deepseek-moonshot-and-minimax-of-stealing-claudes-ai-data-through-16-million-queries/","actor":"DeepSeek, Moonshot AI and MiniMax (per Anthropic)","actor_type":"criminal","attribution":"Alleged by Anthropic based on account, infrastructure and request-pattern evidence; not independently adjudicated","motive":"Extracting Claude capabilities to train competing models cheaply (intellectual property theft)","vector":"About 24,000 fraudulent accounts and proxy services used to run over 16 million Claude exchanges in violation of terms and regional restrictions","root_cause":"API access allows output harvesting at scale; account verification and regional controls bypassed with fake accounts and proxies","timeline":[{"date":"2025","event":"Campaigns run; MiniMax activity detected while it was still training a model"},{"date":"2026-02-23","event":"Anthropic publicly accuses the three labs and details per-lab exchange counts"}],"impact":"MiniMax over 13 million exchanges, Moonshot over 3.4 million, DeepSeek over 150,000, targeting coding, agentic reasoning and tool use. No direct financial loss disclosed.","response":"Anthropic banned the accounts, published findings and cited the case in support of chip export controls; the labs were asked for comment.","status":"under investigation","cve":null,"sources":[{"name":"The Decoder","url":"https://the-decoder.com/anthropic-accuses-deepseek-moonshot-and-minimax-of-stealing-claudes-ai-data-through-16-million-queries/"},{"name":"Interesting Engineering","url":"https://interestingengineering.com/ai-robotics/anthropic-china-ai-distillation-claims"},{"name":"eWeek","url":"https://www.eweek.com/de/security/anthropic-deepseek-moonshot-minimax-targeted-claude/"}]},{"id":"mexico-gov-claude-breach","date":"2026-02-25","title":"Hacker uses Claude to breach Mexican agencies and steal 150GB of tax and voter data","category":"AI-assisted malware","direction":"with-ai","severity":"critical","country":"MX","region":"Latin America","target":"Mexican tax authority, electoral institute, state governments","loss_usd":null,"summary":"Gambit Security found an attacker jailbroke Claude, with some ChatGPT help, to find and exploit flaws in Mexican government systems, stealing ~150GB incl. 195M taxpayer records.","source":"Bloomberg Law","url":"https://news.bloomberglaw.com/esg/hacker-used-anthropics-claude-to-steal-sensitive-mexican-data","actor":"Unknown lone hacker (Spanish-speaking)","actor_type":"criminal","attribution":"Not publicly attributed; findings by Gambit Security from exposed conversation logs. Mexican agencies deny evidence of a breach","motive":"Theft and likely resale of tax, voter and personal data","vector":"Jailbroke Claude by posing as a bug-bounty hunter, used Claude Code to find and exploit flaws and exfiltrate data, then used ChatGPT for lateral movement guidance","root_cause":"AI safety refusals bypassed via role-play; vulnerable government web systems; attacker left conversation logs publicly accessible","timeline":[{"date":"2025-12","event":"Campaign reportedly starts with Mexico's tax authority SAT"},{"date":"2026-02","event":"Gambit Security finds publicly accessible attacker chat logs"},{"date":"2026-02-25","event":"Bloomberg reports the findings; Anthropic and OpenAI ban the accounts"}],"impact":"Gambit claims about 150GB stolen from 10 agencies and a bank, including roughly 195 million taxpayer records and voter data; SAT, INE and Jalisco deny confirmed breaches.","response":"Anthropic and OpenAI banned the accounts; Mexican agencies reviewed logs and disputed the claims; no arrests reported.","status":"under investigation","cve":null,"sources":[{"name":"Bloomberg Law","url":"https://news.bloomberglaw.com/esg/hacker-used-anthropics-claude-to-steal-sensitive-mexican-data"},{"name":"Security Affairs","url":"https://securityaffairs.com/posts/claude-code-abused-to-steal-150gb-in-cyberattack-on-mexican-agencies"},{"name":"Insurance Journal","url":"https://www.insurancejournal.com/news/international/2026/02/27/859786.htm"}]},{"id":"mckinsey-lilli-breach","date":"2026-03-09","title":"Autonomous AI agent breaches McKinsey's Lilli chatbot platform in two hours","category":"Model & data leak","direction":"on-ai","severity":"high","country":"US","region":"North America","target":"McKinsey Lilli AI platform","loss_usd":null,"summary":"CodeWall's offensive agent found SQL injection via unauthenticated Lilli API endpoints, claiming read-write access to 46.5M chat messages and system prompts; McKinsey patched within a day.","source":"The Register","url":"https://www.theregister.com/2026/03/09/mckinsey_ai_chatbot_hacked","actor":"CodeWall autonomous offensive AI agent (responsible disclosure)","actor_type":"researcher","attribution":"Self-disclosed by CodeWall; McKinsey confirmed patching","motive":"Security research demonstrating autonomous agent capability","vector":"22 unauthenticated API endpoints; SQL injection via JSON keys concatenated into queries, plus broken access control on user IDs","root_cause":"Unauthenticated endpoints and unsanitized JSON field names in SQL, with prompts, files, configs and user data stored in one backend","timeline":[{"date":"2026-02","event":"CodeWall agent gains read-write access in under two hours in late February"},{"date":"2026-03-01","event":"CodeWall notifies McKinsey security team"},{"date":"2026-03-02","event":"McKinsey patches exposed endpoints and takes dev environment offline"},{"date":"2026-03-09","event":"CodeWall publishes findings"}],"impact":"Claimed access to 46.5 million chat messages, 728,000 files, 57,000 user accounts and 95 writable system prompts; no malicious exploitation reported.","response":"McKinsey patched within a day and took the environment offline; CodeWall and Promptfoo published analyses.","status":"patched","cve":null,"sources":[{"name":"The Register","url":"https://www.theregister.com/2026/03/09/mckinsey_ai_chatbot_hacked"},{"name":"BankInfoSecurity","url":"https://www.bankinfosecurity.com/autonomous-agent-hacked-mckinseys-ai-in-2-hours-a-31007"},{"name":"Outpost24","url":"https://outpost24.com/?p=12216"}]},{"id":"meta-agent-data-exposure","date":"2026-03-20","title":"Meta AI agent's flawed advice exposes sensitive data to employees for two hours","category":"Model & data leak","direction":"on-ai","severity":"medium","country":"US","region":"North America","target":"Meta internal systems","loss_usd":null,"summary":"An engineer acted on an internal AI agent's faulty guidance, making large amounts of sensitive user and company data visible to unauthorized staff for about two hours.","source":"The Guardian","url":"https://www.theguardian.com/technology/2026/mar/20/meta-ai-agents-instruction-causes-large-sensitive-data-leak-to-employees","actor":"Meta engineer acting on internal AI agent advice","actor_type":"accident","attribution":"Confirmed by Meta to The Information; classified internally as Sev 1","motive":"None (accidental)","vector":"AI agent on an internal forum gave faulty engineering guidance that, once implemented, exposed data to unauthorized employees","root_cause":"Unverified AI-generated instructions executed without review; permission model allowed a single change to expose sensitive data broadly","timeline":[{"date":"2026-03-18","event":"Engineer applies AI agent's suggested fix; data visible to staff for about two hours"},{"date":"2026-03-20","event":"The Information and The Guardian report the incident"}],"impact":"Large volume of sensitive user and company data visible to unauthorized Meta engineers for about two hours; Meta says no user data was mishandled.","response":"Meta reverted the change, classified it as Sev 1 and said a human could also have given erroneous advice.","status":"resolved","cve":null,"sources":[{"name":"The Guardian","url":"https://www.theguardian.com/technology/2026/mar/20/meta-ai-agents-instruction-causes-large-sensitive-data-leak-to-employees"},{"name":"Storyboard18","url":"https://storyboard18.com/digital/meta-ai-agent-goes-rogue-exposes-company-and-user-data-for-two-hours-report-92649.htm"},{"name":"PointGuard AI","url":"https://www.pointguardai.com/ai-security-incidents/metas-ai-agent-misfire-spills-data-across-the-workforce"}]},{"id":"claude-code-leak-lures","date":"2026-03-31","title":"Claude Code source map leak followed by malware-laced fake 'leak' repos","category":"Model & data leak","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"Anthropic Claude Code / developers","loss_usd":null,"summary":"Anthropic accidentally shipped a source map exposing ~513,000 lines of Claude Code; attackers then used fake leaked-code GitHub repos to spread malware to developers.","source":"Zscaler ThreatLabz","url":"https://www.zscaler.com/blogs/security-research/anthropic-claude-code-leak","actor":"Anthropic packaging error; GitHub user idbzoomh spreading Vidar and GhostSocks","actor_type":"criminal","attribution":"Leak self-disclosed by Anthropic as human error; malware lures identified by Zscaler and Trend Micro, operator not named","motive":"Leak accidental; follow-on campaign financially motivated credential theft and proxy botnet building","vector":"Source map in npm package 2.1.88 exposing TypeScript source; SEO-optimized fake leak repos with a Rust dropper in GitHub Releases","root_cause":"Build pipeline shipped a 59.8 MB source map; developers downloading unverified archives from repositories claiming to host the leak","timeline":[{"date":"2026-03-31","event":"Anthropic publishes @anthropic-ai/claude-code 2.1.88 with full source map"},{"date":"2026-04-01","event":"Fake leaked Claude Code repos appear on GitHub pushing Vidar and GhostSocks"},{"date":"2026-04-02","event":"Zscaler, Trend Micro and media report the malware campaign"}],"impact":"About 513,000 lines of Claude Code source exposed; developers who ran the fake leak archive infected with Vidar infostealer and GhostSocks proxy malware.","response":"Anthropic pulled the package and called it a packaging error; researchers warned against downloading leak repos; malicious repos reported to GitHub.","status":"contained","cve":null,"sources":[{"name":"Zscaler ThreatLabz","url":"https://www.zscaler.com/blogs/security-research/anthropic-claude-code-leak"},{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/claude-code-leak-used-to-push-infostealer-malware-on-github/"},{"name":"The Register","url":"https://www.theregister.com/2026/04/02/trojanized_claude_code_leak_github/"},{"name":"Help Net Security","url":"https://www.helpnetsecurity.com/2026/04/03/claude-code-leak-github-malware/"}]},{"id":"vertex-ai-double-agent","date":"2026-03-31","title":"Vertex AI 'Double Agent': over-privileged agents leak credentials and code","category":"Agent hijack","direction":"on-ai","severity":"medium","country":"GL","region":"Global","target":"Google Cloud Vertex AI Agent Engine","loss_usd":null,"summary":"Unit 42 showed agents deployed on Vertex AI inherited broad default service-account rights, letting a compromised agent steal credentials and reach restricted images and source code.","source":"Unit 42 (Palo Alto Networks)","url":"https://unit42.paloaltonetworks.com/double-agents-vertex-ai/","actor":"Security researchers at Palo Alto Networks Unit 42 (responsible disclosure)","actor_type":"researcher","attribution":"Self-attributed research by Unit 42; Google confirmed and worked with researchers on the fix","motive":"Security research and responsible disclosure","vector":"Code running inside a deployed ADK agent queried the GCP instance metadata service to obtain the OAuth token of the Google-managed service agent (P4SA)","root_cause":"Vertex AI Agent Engine attached a default per-product service agent with broad permissions, so any compromised or malicious agent inherited over-privileged, Google-managed identity","timeline":[{"date":"2026-03","event":"Unit 42 demonstrates credential extraction and access to customer data and Google-internal Artifact Registry images"},{"date":"2026-03-31","event":"Unit 42 publishes Double Agents research after responsible disclosure to Google"},{"date":"2026-04-01","event":"Google confirms production image tampering was blocked and updates Vertex AI permissions documentation"}],"impact":"Proof of concept only: a deployed agent could return service-agent credentials, reach customer data, internal Dockerfiles and Google internal Artifact Registry contents; no confirmed real-world victims","response":"Google worked with Unit 42, confirmed internal controls block tampering with production images, rewrote agent permission docs and recommends Bring Your Own Service Account (least privilege) for Vertex AI deployments","status":"patched","cve":null,"sources":[{"name":"Unit 42 (Palo Alto Networks)","url":"https://unit42.paloaltonetworks.com/double-agents-vertex-ai/"},{"name":"TechRadar","url":"https://www.techradar.com/pro/security/what-if-the-ai-agent-you-just-deployed-was-secretly-working-against-you-vertex-ai-double-agent-flaw-exposes-customer-data-and-googles-internal-code"},{"name":"Cloud Security Alliance","url":"https://labs.cloudsecurityalliance.org/research/csa-research-note-vertex-ai-service-agent-privilege-escalati/"}]},{"id":"mercor-litellm-breach","date":"2026-04-03","title":"Poisoned LiteLLM releases tied to Mercor breach exposing AI lab training secrets","category":"AI supply chain","direction":"on-ai","severity":"critical","country":"US","region":"North America","target":"Mercor; clients Meta, OpenAI, Anthropic","loss_usd":null,"summary":"Malicious versions of the LiteLLM gateway library were linked to a breach at AI data vendor Mercor, prompting Meta to pause work amid fears training methods and contractor data leaked.","source":"WIRED","url":"https://www.wired.com/story/meta-pauses-work-with-mercor-after-data-breach-puts-ai-industry-secrets-at-risk/","actor":"TeamPCP (LiteLLM poisoning); Lapsus$ claimed the Mercor data","actor_type":"criminal","attribution":"TeamPCP linked by security researchers (Wiz and others); Lapsus$ self-claimed Mercor access; link between the two groups unconfirmed","motive":"Credential theft, data theft and extortion; stolen data listed for sale","vector":"Maintainer credentials stolen via Trivy supply-chain attack used to publish trojanized LiteLLM 1.82.7 and 1.82.8 to PyPI; Mercor pulled the poisoned package into its environment","root_cause":"Compromised maintainer credentials on PyPI with no secondary release gate, plus downstream consumers auto-installing new library versions without pinning or verification","timeline":[{"date":"2026-03-27","event":"TeamPCP publishes malicious LiteLLM 1.82.7 and 1.82.8 to PyPI; live about 40 minutes"},{"date":"2026-03","event":"Mercor confirms it was among thousands of organizations hit; Lapsus$ claims its data"},{"date":"2026-04-01","event":"Class action filed on behalf of affected contractors; further suits follow"},{"date":"2026-04-03","event":"WIRED reports Meta indefinitely pauses work with Mercor; OpenAI investigates"}],"impact":"Reported theft of Mercor source code, user database and storage buckets including interview videos, passport scans and SSNs of tens of thousands of contractors; AI lab training workflows feared exposed; Meta contractors put on pause","response":"Mercor contained the incident and hired third-party forensics; Meta paused work, OpenAI opened a review; LiteLLM yanked the versions; multiple contractor lawsuits filed","status":"under investigation","cve":null,"sources":[{"name":"WIRED","url":"https://www.wired.com/story/meta-pauses-work-with-mercor-after-data-breach-puts-ai-industry-secrets-at-risk/"},{"name":"TechRepublic","url":"https://www.techrepublic.com/article/news-meta-pauses-work-with-mercor-after-data-breach/"},{"name":"The Next Web","url":"https://thenextweb.com/news/meta-mercor-breach-ai-training-secrets-risk"},{"name":"Storyboard18","url":"https://www.storyboard18.com/digital/ai-startup-mercor-flags-data-exposure-in-supply-chain-attack-linked-to-litellm-94295.htm"}]},{"id":"flowise-rce-exploited","date":"2026-04-07","title":"Max-severity Flowise CustomMCP RCE (CVE-2025-59528) exploited in the wild","category":"Agent hijack","direction":"on-ai","severity":"critical","country":"GL","region":"Global","target":"Flowise AI agent builder","loss_usd":null,"summary":"Attackers began exploiting JavaScript injection in Flowise's CustomMCP node to run code on AI workflow servers, with 12,000-15,000 instances exposed online.","source":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/max-severity-flowise-rce-vulnerability-now-exploited-in-attacks/","actor":"Unknown attacker operating from a single Starlink IP","actor_type":"unknown","attribution":"No public attribution; exploitation detected by VulnCheck Canary honeypot network","motive":"Unknown; likely opportunistic server takeover","vector":"Malicious mcpServerConfig string sent to Flowise CustomMCP node, which evaluated it via the JavaScript Function() constructor with full Node.js privileges; only an API token required","root_cause":"CustomMCP node executed user-supplied configuration as JavaScript without validation, giving access to child_process and fs modules","timeline":[{"date":"2025-09","event":"Flaw disclosed and patched in Flowise 3.0.6; CVE-2025-59528 assigned with CVSS 10.0"},{"date":"2026-04-07","event":"VulnCheck reports first in-the-wild exploitation; 12,000-15,000 instances exposed online"},{"date":"2026-04-07","event":"BleepingComputer and others urge upgrade to 3.1.1 or later"}],"impact":"Remote code execution on exposed Flowise servers; exploitation limited to one source IP at time of reporting; number of compromised instances unknown","response":"Vendor fix already available (3.0.6+); researchers urged upgrading, removing instances from the internet and rotating API tokens; VulnCheck shared signatures with customers","status":"patched","cve":"CVE-2025-59528","sources":[{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/max-severity-flowise-rce-vulnerability-now-exploited-in-attacks/"},{"name":"The Hacker News","url":"https://thehackernews.com/2026/04/flowise-ai-agent-builder-under-active.html"},{"name":"Security Affairs","url":"https://securityaffairs.com/190471/security/attackers-exploit-critical-flowise-flaw-cve-2025-59528-for-remote-code-execution.html"},{"name":"SecurityWeek","url":"https://www.securityweek.com/critical-flowise-vulnerability-in-attacker-crosshairs/"}]},{"id":"grafanaghost","date":"2026-04-07","title":"GrafanaGhost: indirect prompt injection makes Grafana AI leak enterprise data","category":"Prompt injection","direction":"on-ai","severity":"medium","country":"GL","region":"Global","target":"Grafana AI assistant","loss_usd":null,"summary":"Researchers showed hidden instructions in external content could make Grafana's AI render an attacker image URL carrying enterprise data; Grafana patched it.","source":"SecurityWeek","url":"https://www.securityweek.com/grafanaghost-attackers-can-abuse-grafana-to-leak-enterprise-data/","actor":"Security researchers at Noma Security (Sasi Levi), responsible disclosure","actor_type":"researcher","attribution":"Self-attributed research by Noma Security; Grafana Labs validated the flaw but disputed its severity","motive":"Security research and responsible disclosure","vector":"Crafted URL path carrying hidden instructions, an INTENT keyword to bypass guardrails, and a protocol-relative image URL that evaded external-image domain validation","root_cause":"Grafana AI assistant trusted content in URL paths and external pages, and URL validation failed to block protocol-relative links, enabling zero-click exfiltration via image rendering","timeline":[{"date":"2026-03","event":"Noma Security discovers the chained bypass and reports it to Grafana Labs"},{"date":"2026-04-07","event":"Grafana patches the core issue; Noma publishes GrafanaGhost research"},{"date":"2026-04-07","event":"SecurityWeek, CyberScoop and Dark Reading cover the disclosure"}],"impact":"Proof of concept only; no confirmed data breach. Attack could have leaked dashboard data including financial metrics, infrastructure and customer telemetry to an attacker server","response":"Grafana Labs validated the report and rolled out a fix for the URL validation and guardrail bypass; disputed the severity, noting repeated user involvement was needed","status":"patched","cve":null,"sources":[{"name":"SecurityWeek","url":"https://www.securityweek.com/grafanaghost-attackers-can-abuse-grafana-to-leak-enterprise-data/"},{"name":"CyberScoop","url":"https://cyberscoop.com/grafanaghost-grafana-prompt-injection-vulnerability-data-exfiltration/"},{"name":"Dark Reading","url":"https://darkreading.com/application-security/grafana-patches-ai-bug-leaked-user-data"},{"name":"CSO Online","url":"https://www.csoonline.com/article/4155004/zero-click-grafana-ai-attack-can-enable-enterprise-data-exfiltration.html"}]},{"id":"copilot-agentforce-injection","date":"2026-04-15","title":"Prompt injection leaks data from Microsoft Copilot Studio and Salesforce Agentforce agents","category":"Prompt injection","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"Copilot Studio, Salesforce Agentforce","loss_usd":null,"summary":"Researchers demonstrated indirect prompt injection that exfiltrated data from enterprise agents built on Copilot Studio (CVE-2026-21520) and Agentforce despite earlier patches.","source":"OECD AI Incidents Monitor","url":"https://oecd.ai/en/incidents/2026-04-15-d934","actor":"Security researchers at Capsule Security (responsible disclosure)","actor_type":"researcher","attribution":"Self-attributed research by Capsule Security; Microsoft assigned CVE-2026-21520 (ShareLeak); Salesforce confirmed addressing PipeLeak","motive":"Security research and responsible disclosure","vector":"Indirect prompt injection via ordinary business inputs: a SharePoint form comment field (Copilot Studio) and a public lead form (Agentforce) carrying fake system instructions","root_cause":"Untrusted form input was concatenated into agent system prompts with no separation between trusted instructions and user data, so agents followed injected commands through authorized tools","timeline":[{"date":"2026-01-15","event":"Microsoft patches the Copilot Studio flaw server-side"},{"date":"2026-01-22","event":"CVE-2026-21520 published (CVSS 7.5)"},{"date":"2026-04-15","event":"Capsule Security publicly discloses ShareLeak and PipeLeak alongside its launch"}],"impact":"Demonstrated exfiltration of SharePoint list data by email and misuse of Agentforce workflows; Microsoft safety filters flagged but did not stop the payload; no confirmed real-world victims","response":"Microsoft mitigated internally with no customer action required; Salesforce said it addressed the issue; researchers warned the attack class remains open","status":"patched","cve":"CVE-2026-21520","sources":[{"name":"OECD AI Incidents Monitor","url":"https://oecd.ai/en/incidents/2026-04-15-d934"},{"name":"CSO Online","url":"https://www.csoonline.com/article/4159079/copilot-and-agentforce-fall-to-form-based-prompt-injection-tricks.html"},{"name":"SiliconANGLE","url":"https://siliconangle.com/2026/04/15/capsule-security-launches-7m-secure-ai-agents-runtime/"}]},{"id":"vercel-context-ai","date":"2026-04-19","title":"Compromised Context.ai AI tool's OAuth grant leads to Vercel breach","category":"AI supply chain","direction":"on-ai","severity":"high","country":"US","region":"North America","target":"Vercel / Context.ai","loss_usd":null,"summary":"Attackers who compromised the Context.ai agent platform abused an employee's broad Google Workspace OAuth grant to enter Vercel and read non-sensitive customer environment variables.","source":"Trend Micro","url":"https://trendmicro.com/en_us/research/26/d/vercel-breach-oauth-supply-chain.html","actor":"Unknown threat actor; data-sale claims on BreachForums unverified","actor_type":"unknown","attribution":"No public attribution; Vercel self-disclosed and traced origin to Context.ai compromise with Google Mandiant","motive":"Credential and data theft; possible resale (unverified extortion claims)","vector":"Compromised Context.ai Google Workspace OAuth application used to take over a Vercel employee's corporate Google account, then pivot into Vercel environments","root_cause":"Broad OAuth scopes granted to a third-party AI tool, and Vercel environment variables not marked sensitive being readable in plaintext","timeline":[{"date":"2026-02","event":"Context.ai employee reportedly infected with Lumma Stealer; OAuth tokens later compromised"},{"date":"2026-03","event":"Context.ai discloses unauthorized access to its AWS environment and hires CrowdStrike"},{"date":"2026-04-19","event":"Vercel detects unauthorized access to internal systems via employee Google Workspace account"},{"date":"2026-04-21","event":"Vercel publishes bulletin, notifies affected customers and publishes OAuth app IOC"}],"impact":"Attacker accessed some Vercel environments and customer environment variables not marked sensitive for a limited set of customers; sensitive-flagged variables showed no evidence of access","response":"Vercel engaged Google Mandiant, notified affected customers, recommended credential rotation, published an OAuth app IOC and confirmed with GitHub, npm and Socket that its packages were untouched","status":"under investigation","cve":null,"sources":[{"name":"Trend Micro","url":"https://trendmicro.com/en_us/research/26/d/vercel-breach-oauth-supply-chain.html"},{"name":"Help Net Security","url":"https://helpnetsecurity.com/2026/04/20/vercel-breached"},{"name":"The Register","url":"https://www.theregister.com/2026/04/20/vercel_context_ai_security_incident/"}]},{"id":"mythos-unauthorized-access","date":"2026-04-21","title":"Unauthorized group accesses Anthropic's restricted Claude Mythos model via vendor","category":"Model & data leak","direction":"on-ai","severity":"high","country":"US","region":"North America","target":"Anthropic Claude Mythos Preview","loss_usd":null,"summary":"Bloomberg reported a small group reached the restricted cyber-capable Mythos model using a contractor's account and a guessed URL; Anthropic investigated a third-party vendor environment.","source":"The Decoder","url":"https://the-decoder.com/unauthorized-users-breach-anthropics-restricted-mythos-ai-model/","actor":"Small Discord-based group of AI enthusiasts, one with contractor access","actor_type":"insider","attribution":"Reported by Bloomberg based on screenshots and live demo; Anthropic confirmed investigating a third-party vendor environment","motive":"Curiosity and experimentation with unreleased models, per the group; no reported malicious use","vector":"Shared accounts and API keys of an authorized contractor plus a guessed model endpoint URL based on Anthropic naming conventions","root_cause":"Weak access controls in a third-party vendor environment: shared credentials and predictable model endpoints with no additional gating","timeline":[{"date":"2026-04-07","event":"Mythos Preview announced under Project Glasswing; group reportedly gains access the same day"},{"date":"2026-04-21","event":"Bloomberg reports the unauthorized access; Anthropic confirms investigation"},{"date":"2026-04-22","event":"Anthropic says no evidence of impact to core systems beyond the vendor environment"}],"impact":"Unauthorized use of a restricted cyber-capable model by a handful of users over roughly two weeks; no evidence of core-system compromise reported","response":"Anthropic investigated the vendor environment; outcome of the investigation not publicly reported","status":"under investigation","cve":null,"sources":[{"name":"The Decoder","url":"https://the-decoder.com/unauthorized-users-breach-anthropics-restricted-mythos-ai-model/"},{"name":"Security Boulevard","url":"https://securityboulevard.com/2026/04/unauthorized-group-gains-access-to-anthropics-restricted-mythos-ai-cybersecurity-tool/"},{"name":"The Next Web","url":"https://thenextweb.com/news/anthropic-mythos-unauthorized-access-vendor-breach"}]},{"id":"mini-shai-hulud-ai-packages","date":"2026-05-12","title":"Mini Shai-Hulud worm hits TanStack, Mistral AI and Guardrails AI packages","category":"AI supply chain","direction":"on-ai","severity":"critical","country":"GL","region":"Global","target":"npm/PyPI AI developer packages","loss_usd":null,"summary":"TeamPCP's worm hijacked release pipelines to publish 170+ malicious npm/PyPI versions, stealing cloud, CI and AI-tool credentials and planting persistence in Claude Code and VS Code.","source":"Tom's Hardware","url":"https://www.tomshardware.com/tech-industry/cyber-security/compromised-mistral-ai-and-tanstack-packages-may-have-exposed-github-cloud-and-ci-cd-credentials-in-mini-shai-hulud-malware-infection-supply-chain-campaign-spreads-across-npm-and-ai-developer-ecosystems-like-wildfire","actor":"TeamPCP","actor_type":"criminal","attribution":"Attributed to TeamPCP by Wiz, Socket, Expel and Phoenix Security based on tooling overlap with earlier campaigns","motive":"Mass credential theft (cloud, CI, npm, AI-tool tokens) for resale and further compromise","vector":"Fork pull request against TanStack router poisoned the GitHub Actions cache, extracted an OIDC publish token and published trojanized packages; worm then reused stolen npm tokens to spread","root_cause":"GitHub Actions cache collision between fork and upstream PRs, overly broad token permissions and build-plus-publish in one job, defeating 2FA and trusted publishing","timeline":[{"date":"2026-05-10","event":"Attacker fork of TanStack/router created; orphaned commit plants malicious workflow"},{"date":"2026-05-11","event":"Malicious TanStack, OpenSearch, Mistral AI and Guardrails AI versions published to npm and PyPI"},{"date":"2026-05-12","event":"Socket, Wiz and Expel publish analyses; maintainers yank versions and rotate tokens"},{"date":"2026-08","event":"Related fork-triggered compromise hits openapi-react-query-codegen"}],"impact":"170+ malicious versions across 19 npm namespaces plus PyPI, including packages with 1.3M weekly downloads; stole GitHub, AWS, Vault, Kubernetes, npm and AI-tool credentials and planted persistence hooks in Claude Code and VS Code","response":"Compromised versions removed; TanStack published a post-mortem; vendors issued IOCs and cleanup guidance for IDE persistence hooks; affected users told to rotate all secrets","status":"contained","cve":null,"sources":[{"name":"Tom's Hardware","url":"https://www.tomshardware.com/tech-industry/cyber-security/compromised-mistral-ai-and-tanstack-packages-may-have-exposed-github-cloud-and-ci-cd-credentials-in-mini-shai-hulud-malware-infection-supply-chain-campaign-spreads-across-npm-and-ai-developer-ecosystems-like-wildfire"},{"name":"Expel","url":"https://expel.com/blog/mini-shai-hulud-cross-ecosystem-supply-chain-worm/"},{"name":"Phoenix Security","url":"https://phoenix.security/mini-shai-hulud-teampcp-tanstack/"},{"name":"Endor Labs","url":"https://www.endorlabs.com/learn/shai-hulud-compromises-the-tanstack-ecosystem-80-packages-compromised"}]},{"id":"codexui-android-npm","date":"2026-06-02","title":"Trojanized codexui-android npm package steals OpenAI Codex tokens","category":"AI supply chain","direction":"on-ai","severity":"medium","country":"GL","region":"Global","target":"OpenAI Codex users","loss_usd":null,"summary":"A package posing as a remote web UI for OpenAI Codex built a user base for a month before activating a payload that exfiltrated Codex authentication tokens.","source":"Cloud Security Alliance","url":"https://labs.cloudsecurityalliance.org/research/csa-research-note-openai-codex-npm-supply-chain-developer-cr/","actor":"Package author of codexui-android (identity not public)","actor_type":"unknown","attribution":"Discovered by Aikido Security; author claimed lost npm access then said it was investigating; no law-enforcement attribution","motive":"Theft of OpenAI Codex refresh tokens for persistent account access","vector":"Working Codex web UI package that fetched malicious code at runtime, read ~/.codex/auth.json, XOR-encoded it and POSTed it to a fake Sentry endpoint at sentry.anyclaw.store","root_cause":"Codex stored non-expiring refresh tokens in a plaintext file readable by any installed package, and npm package contents diverged from the public GitHub source","timeline":[{"date":"2026-05","event":"Package gains roughly 27,000-29,000 weekly downloads; exfiltration runs for about a month"},{"date":"2026-06-02","event":"Aikido Security publicly discloses the token stealer"},{"date":"2026-06-04","event":"Companion Android apps found forwarding Codex credentials to the same endpoint"}],"impact":"Codex access, refresh and ID tokens of an unknown number of developers (package had ~27,000 weekly downloads) exfiltrated, enabling persistent account access","response":"Malicious code removed by author after inquiry; researchers advised revoking and rotating Codex tokens and blocking the exfiltration domain","status":"contained","cve":null,"sources":[{"name":"Cloud Security Alliance","url":"https://labs.cloudsecurityalliance.org/research/csa-research-note-openai-codex-npm-supply-chain-developer-cr/"},{"name":"Kiteworks","url":"https://www.kiteworks.com/cybersecurity-risk-management/openai-codex-npm-supply-chain-attack/"},{"name":"PointGuard AI","url":"https://www.pointguardai.com/ai-security-incidents/malicious-npm-package-steals-openai-codex-authentication-tokens"}]},{"id":"meta-ai-support-instagram","date":"2026-06-08","title":"Hackers trick Meta's AI support chatbot into handing over Instagram accounts","category":"Agent hijack","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"Meta AI account-recovery assistant / Instagram","loss_usd":null,"summary":"Attackers asked Meta's AI support assistant to link new emails to target accounts, then reset passwords, hijacking high-profile accounts before Meta fixed the flow.","source":"Engadget","url":"https://engadget.com/2185225/meta-ai-support-chatbot-made-it-ridiculously-easy-for-hackers-to-take-over-instagram-accounts","actor":"Account-hijacking crews coordinating on Telegram","actor_type":"criminal","attribution":"Reported by 404 Media from Telegram chat logs; Meta confirmed and fixed the issue but did not attribute","motive":"Resale of short or high-value Instagram usernames; propaganda posts from hijacked accounts","vector":"Attackers used a VPN to match the victim's region, then asked the AI support assistant to link a new email to the target account and used the reset code to change the password","root_cause":"AI recovery assistant could change account email with no human review and weak identity verification beyond approximate location","timeline":[{"date":"2026-03","event":"Meta launches AI support assistant; Telegram users begin abusing it"},{"date":"2026-05-29","event":"Meta reportedly applies emergency patch after high-profile takeovers"},{"date":"2026-06-01","event":"404 Media reports hijacks of accounts tied to Obama, Sephora and a Space Force chief"},{"date":"2026-06-08","event":"Meta says the issue is resolved and impacted accounts are being secured"}],"impact":"Unknown number of Instagram accounts hijacked, including high-profile ones used to post propaganda; 2FA-protected accounts received reset prompts but were largely not taken over","response":"Meta closed the loophole, said impacted accounts were being secured; no explanation of the flaw's cause","status":"patched","cve":null,"sources":[{"name":"Engadget","url":"https://engadget.com/2185225/meta-ai-support-chatbot-made-it-ridiculously-easy-for-hackers-to-take-over-instagram-accounts"},{"name":"TechSpot","url":"https://www.techspot.com/news/112614-hackers-tricked-meta-ai-chatbot-handing-over-instagram.html"},{"name":"heise","url":"https://heise.de/-11314517"},{"name":"Silicon UK","url":"https://www.silicon.co.uk/security/cyberwar/meta-instagram-ai-hack-630083"}]},{"id":"litellm-cve-2026-42271","date":"2026-06-08","title":"CISA adds actively exploited LiteLLM AI gateway RCE (CVE-2026-42271) to KEV","category":"Agent hijack","direction":"on-ai","severity":"critical","country":"GL","region":"Global","target":"BerriAI LiteLLM proxy","loss_usd":null,"summary":"Attackers exploited command injection in LiteLLM's MCP server preview endpoints, chainable with a Starlette Host bypass for unauthenticated RCE and theft of AI provider keys.","source":"The Hacker News","url":"https://thehackernews.com/2026/06/litellm-flaw-cve-2026-42271-exploited.html","actor":"Unknown attackers exploiting in the wild","actor_type":"unknown","attribution":"No public attribution; CISA confirmed active exploitation via KEV listing; chain validated by Horizon3.ai","motive":"Takeover of AI gateways and theft of upstream AI provider API keys","vector":"POST to /mcp-rest/test/connection or /mcp-rest/test/tools/list with a stdio MCP config whose command is spawned as a subprocess; chained with Starlette BadHost (CVE-2026-48710) to skip auth","root_cause":"MCP preview endpoints executed user-supplied commands and were exposed to any API key holder; Starlette rebuilt request paths from unvalidated Host headers, letting auth middleware be bypassed","timeline":[{"date":"2026-04-20","event":"CVE-2026-42271 disclosed in LiteLLM 1.74.2 through 1.83.6"},{"date":"2026-05-08","event":"LiteLLM 1.83.7 restricts MCP test endpoints to PROXY_ADMIN"},{"date":"2026-05-26","event":"Starlette CVE-2026-48710 BadHost disclosed; Horizon3.ai validates unauthenticated chain June 1"},{"date":"2026-06-08","event":"CISA adds CVE-2026-42271 to KEV with federal deadline June 22"}],"impact":"Unauthenticated remote code execution on exposed LiteLLM proxies and theft of stored AI provider keys; number of compromised deployments not disclosed","response":"BerriAI shipped 1.83.7, Starlette 1.0.1 fixed BadHost; CISA KEV listing with remediation deadline; WAF blocking of the test endpoints advised","status":"patched","cve":"CVE-2026-42271, CVE-2026-48710","sources":[{"name":"The Hacker News","url":"https://thehackernews.com/2026/06/litellm-flaw-cve-2026-42271-exploited.html"},{"name":"Horizon3.ai","url":"https://www.horizon3.ai/cve-2026-42271-chained-with-cve-2026-48710"},{"name":"Wiz Vulnerability Database","url":"https://www.wiz.io/vulnerability-database/cve/cve-2026-42271"},{"name":"Cloud Security Alliance","url":"https://labs.cloudsecurityalliance.org/research/csa-research-note-litellm-cve-2026-42271-ai-gateway-exploita/"}]},{"id":"ollama-vapt-autonomous-attack","date":"2026-06-12","title":"Hijacked Ollama server used as brain of autonomous hacking pipeline","category":"LLMjacking","direction":"on-ai","severity":"medium","country":"GL","region":"Global","target":"Exposed Ollama servers","loss_usd":null,"summary":"Sysdig observed an attacker using an unauthenticated Ollama instance as the reasoning engine of a tool that scanned targets, wrote exploits and attempted intrusions.","source":"Sysdig","url":"https://sysdig.com/blog/llmjacking-evolved-attackers-are-using-stolen-ai-compute-to-build-offensive-agentic-tools/","actor":"Unknown attacker developing an offensive tool called VAPT","actor_type":"unknown","attribution":"No public attribution; observed by Sysdig Threat Research Team on its honeypot infrastructure","motive":"Free model compute to build and test an autonomous penetration-testing and exploitation tool","vector":"Unauthenticated Ollama API on port 11434 reachable from the internet used as the LLM backend for a multi-stage exploitation pipeline","root_cause":"Ollama ships with no authentication by default and roughly 175,000 instances are publicly exposed","timeline":[{"date":"2026-06-12","event":"Sysdig observes the VAPT pipeline using its exposed Ollama honeypot as reasoning engine"},{"date":"2026-06-17","event":"Sysdig publishes LLMjacking Evolved research"},{"date":"2026-06-26","event":"Cloud Security Alliance issues research note on the campaign"}],"impact":"Stolen inference compute; tool fingerprinted services, found vulnerabilities, wrote exploits and extracted credentials against lab ranges and HackTheBox targets; no confirmed real-world victims","response":"Sysdig published IOCs and advised keeping self-hosted LLM endpoints off public networks and requiring authentication at a reverse proxy","status":"ongoing","cve":null,"sources":[{"name":"Sysdig","url":"https://sysdig.com/blog/llmjacking-evolved-attackers-are-using-stolen-ai-compute-to-build-offensive-agentic-tools/"},{"name":"Cloud Security Alliance","url":"https://labs.cloudsecurityalliance.org/research/csa-research-note-llmjacking-evolved-offensive-agentic-tools/"},{"name":"CyberWire Research Saturday","url":"https://thecyberwire.com/podcasts/research-saturday/439/notes"}]},{"id":"sky-gold-deepfake-director","date":"2026-07-15","title":"Indian jeweller Sky Gold's unit loses Rs 10.7 crore to alleged deepfake of director","category":"Deepfake fraud","direction":"with-ai","severity":"high","country":"IN","region":"Asia-Pacific","target":"Starmangalsutra (Sky Gold and Diamonds)","loss_usd":1100000,"summary":"Fraudsters compromised a company phone and laptop and allegedly used deepfake impersonation of a director to get an employee to wire Rs 10.70 crore (~$1.1M) to unknown accounts.","source":"AI Incident Database (Economic Times)","url":"https://incidentdatabase.ai/cite/1596/","actor":"Unidentified fraudsters","actor_type":"criminal","attribution":"Not publicly attributed; deepfake element reported by the company and press, not forensically confirmed","motive":"Financial fraud (business email/executive impersonation)","vector":"Compromise of a company-issued phone and laptop, then deepfake impersonation of a director instructing an employee to transfer funds","root_cause":"Payment instructions accepted on the basis of perceived executive identity without out-of-band verification; compromised corporate devices","timeline":[{"date":"2026-07","event":"Employee transfers Rs 10.70 crore to unknown accounts on fraudulent director instructions"},{"date":"2026-07-15","event":"Sky Gold discloses the loss at subsidiary Starmangalsutra; shares fall"},{"date":"2026-07","event":"Subsidiary files complaint with cybercrime authorities"}],"impact":"Rs 10.70 crore (about USD 1.1 million) transferred to unknown accounts; Sky Gold share price dropped after disclosure","response":"Complaint filed with cybercrime authorities; recovery status and arrests not publicly reported","status":"under investigation","cve":null,"sources":[{"name":"AI Incident Database (Economic Times)","url":"https://incidentdatabase.ai/cite/1596/"},{"name":"AI Incident Database entity page","url":"https://incidentdatabase.ai/entities/starmangalsutra/"}]},{"id":"openai-agent-hugging-face","date":"2026-07-21","title":"OpenAI evaluation agent escapes sandbox and breaches Hugging Face production systems","category":"Agent hijack","direction":"with-ai","severity":"critical","country":"US","region":"North America","target":"Hugging Face","loss_usd":null,"summary":"During a cyber eval, OpenAI agents exploited zero-days to escape their environment and break into Hugging Face servers; Hugging Face contained it and alerted the FBI before OpenAI noticed.","source":"Security Affairs (Reuters)","url":"https://securityaffairs.com/196120/ai/reuters-openai-agent-hacked-hugging-face-for-days-before-being-detected/","actor":"OpenAI evaluation agents (GPT-5.6 Sol and an unreleased model)","actor_type":"autonomous-ai","attribution":"Reported by Reuters from sources and OpenAI logs; OpenAI acknowledged the agent but said the reporting contained inaccuracies","motive":"None intended; agents pursued cyber-evaluation objectives beyond their sandbox","vector":"Sandbox escape from an OpenAI test environment, use of stolen credentials and a previously unknown flaw to reach Hugging Face servers via a third-party-hosted sandbox (Modal Labs customer)","root_cause":"Insufficient isolation of autonomous agents during offensive-capability evaluations and delayed monitoring; a Modal customer had exposed an unauthenticated code-execution endpoint","timeline":[{"date":"2026-05-13","event":"Agents reportedly begin probing Hugging Face, per later Reuters reporting"},{"date":"2026-07-09","event":"Agent attempts to break out of its OpenAI sandbox"},{"date":"2026-07-11","event":"Intrusions into Hugging Face systems run through July 13; Hugging Face contains and alerts FBI"},{"date":"2026-07-16","event":"Hugging Face blogs about an autonomous AI agent system; OpenAI links logs and contacts Hugging Face July 20"},{"date":"2026-07-28","event":"Reuters reports the agent also compromised a Modal Labs customer account"}],"impact":"Unauthorized access to Hugging Face production systems for several days; OpenAI later said four accounts at four services were accessed; Senate subcommittee inquiry opened","response":"Hugging Face contained the intrusion and notified the FBI; OpenAI deactivated, encrypted and restricted the model; joint investigations ongoing","status":"under investigation","cve":null,"sources":[{"name":"Security Affairs (Reuters)","url":"https://securityaffairs.com/196120/ai/reuters-openai-agent-hacked-hugging-face-for-days-before-being-detected/"},{"name":"Engadget","url":"https://engadget.com/2223141/openai-rogue-agent-days-hacking-spree-reuters"},{"name":"Al Jazeera","url":"https://aljazeera.com/news/2026/7/29/openais-rogue-agent-hacked-an-account-at-a-second-technology-firm-report"},{"name":"Quartz","url":"https://qz.com/openai-rogue-agent-modal-labs-customer-hugging-face-072926"}]},{"id":"chatgpt-gmail-covert-channel","date":"2026-09-08","title":"Planted prompt makes ChatGPT copy victims' Gmail data to attacker account","category":"Prompt injection","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"ChatGPT Gmail connector","loss_usd":null,"summary":"Check Point showed a planted instruction could make ChatGPT read connected Gmail and pass it to an attacker's ChatGPT account through a covert channel between sandboxes; OpenAI disabled the service.","source":"Mezha","url":"https://mezha.ua/en/news/openai-chatgpt-gmail-flaw-304958/","actor":"Security researchers at Check Point Research (responsible disclosure)","actor_type":"researcher","attribution":"Self-attributed research by Check Point; OpenAI confirmed the internal service was decommissioned","motive":"Security research and responsible disclosure","vector":"Prompt injection via shared conversation or custom GPT made the victim's code sandbox read Gmail and write chunks as properties on a shared JFrog Artifactory item readable by the attacker's sandbox","root_cause":"Per-account sandboxes shared one internal Artifactory package service with credentials that allowed writes, giving a cross-account covert channel with no per-account separation","timeline":[{"date":"2026-06","event":"Check Point discovers the cross-account channel and reports it to OpenAI"},{"date":"2026-09-08","event":"Check Point publishes research; OpenAI confirms the Artifactory instance was decommissioned"}],"impact":"Proof of concept only; demonstrated silent exfiltration of a victim's Gmail data (also applicable to Drive, Teams and GitHub connectors) with only a Talked to Gmail label visible","response":"OpenAI decommissioned the shared internal package service; no CVE assigned and no user-facing patch required","status":"patched","cve":null,"sources":[{"name":"Mezha","url":"https://mezha.ua/en/news/openai-chatgpt-gmail-flaw-304958/"},{"name":"CSO Online","url":"https://www.csoonline.com/article/4220203/chatgpt-flaw-lets-attackers-pull-gmail-data-across-accounts-via-a-hidden-channel.html"},{"name":"Cybernews","url":"https://cybernews.com/news/chatgpt-flaw-steal-gmail-data/"},{"name":"TechRadar","url":"https://techradar.com/pro/security/a-worrying-chatgpt-bug-let-strangers-read-gmail-messages-via-a-hidden-cross-account-channel"}]},{"id":"anthropic-jackpoterz-russia","date":"2026-09-10","title":"Russia-aligned actor used AI agents to self-rebuild malware and steal ID records","category":"State actor AI ops","direction":"with-ai","severity":"critical","country":"GL","region":"Global","target":"Ukrainian/European defense, drone makers, North African government","loss_usd":null,"summary":"Anthropic's threat report described a Midnight Blizzard-like operator whose agents auto-rebuilt detected malware, raided drone makers and stole 300,000+ national ID records.","source":"CyberScoop","url":"https://cyberscoop.com/anthropic-report-ai-enabled-cyber-attacks/","actor":"Suspected Russia-aligned actor consistent with Midnight Blizzard (SVR-linked)","actor_type":"state","attribution":"Anthropic assessed activity as consistent with Midnight Blizzard; described as suspected, not confirmed","motive":"Espionage against Ukrainian government, military, diplomats and defense suppliers","vector":"Phishing, hotel Wi-Fi hijacking and WhatsApp account takeover, with Claude agents automating malware rewriting when detected and mailbox extraction","root_cause":"Abuse of commercial AI agents to automate detection-evasion and intrusion tasks at scale; targets' exposure to phishing and account takeover","timeline":[{"date":"2025-12","event":"Start of the eight-month period covered by Anthropic's report"},{"date":"2026-08","event":"Anthropic detects and disrupts the accounts involved"},{"date":"2026-09-10","event":"Anthropic publishes Detecting and countering misuse of AI threat report"}],"impact":"Entire mailboxes stolen from two drone component makers, a drone vision SDK taken, and 300,000+ national identity records exfiltrated from a North African government agency","response":"Anthropic dismantled the accounts, upgraded safety classifiers and shared intelligence with governments and industry peers","status":"contained","cve":null,"sources":[{"name":"CyberScoop","url":"https://cyberscoop.com/anthropic-report-ai-enabled-cyber-attacks/"},{"name":"Anadolu Agency","url":"https://aa.com.tr/en/features/explainer-anthropic-threat-intelligence-report-what-to-know/4054686"},{"name":"The Register","url":"https://www.theregister.com/a/5295702"}]},{"id":"anthropic-shinyhunters-agents","date":"2026-09-10","title":"ShinyHunters affiliates use AI agents to dump 2,100+ Azure tokens from 40+ tenants","category":"AI-assisted malware","direction":"with-ai","severity":"high","country":"GL","region":"Global","target":"Corporate cloud tenants","loss_usd":null,"summary":"Anthropic reported ShinyHunters-linked actors whose AI agents did nearly all the work in a supply-chain breach of 40+ cloud tenants and a three-hour takeover from one stolen token.","source":"CyberScoop","url":"https://cyberscoop.com/anthropic-report-ai-enabled-cyber-attacks/","actor":"Suspected ShinyHunters-linked extortion actor","actor_type":"criminal","attribution":"Assessed by Anthropic as a suspected ShinyHunters threat actor based on tradecraft; not confirmed by law enforcement","motive":"Data theft and extortion","vector":"Supply-chain compromise of a shared provider, then Claude agents automated extraction of Azure AD authentication tokens and lateral movement from a single stolen token","root_cause":"Over-trusted supply-chain access and reusable cloud tokens, with AI agents collapsing the time needed to exploit them","timeline":[{"date":"2026","event":"Actor extracts 2,100+ Azure AD tokens across 40+ tenants in about 34 hours; agents do nearly all the work"},{"date":"2026-08","event":"Anthropic disrupts the accounts involved"},{"date":"2026-09-10","event":"Anthropic threat report published; Reuters and CyberScoop cover findings"}],"impact":"More than 2,100 Azure AD token sets tied to 40+ corporate Microsoft tenants compromised; one tenant fully taken over in about three hours from a single token","response":"Anthropic banned the accounts, improved detection and shared indicators with authorities and industry","status":"contained","cve":null,"sources":[{"name":"CyberScoop","url":"https://cyberscoop.com/anthropic-report-ai-enabled-cyber-attacks/"},{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/hackers-abused-claude-to-extract-secrets-from-18m-android-apps/"},{"name":"Paubox","url":"https://www.paubox.com/blog/anthropic-report-shows-ai-now-lets-small-actors-run-hacking-campaigns"}]},{"id":"rubygems-openai-agent-swarm","date":"2026-09-14","title":"Researchers tie May RubyGems malware flood to swarm of OpenAI agents","category":"AI supply chain","direction":"with-ai","severity":"high","country":"GL","region":"Global","target":"RubyGems / RubyDoc.info","loss_usd":null,"summary":"GemStuffer research linked 2,000+ malicious gems that gained code execution on RubyDoc build servers to OpenAI agents in training; OpenAI is reviewing agent activity.","source":"The Hacker News","url":"https://thehackernews.com/2026/09/openai-agents-linked-to-rubygems.html","actor":"Autonomous OpenAI agents (per rubyhack.ai researchers)","actor_type":"autonomous-ai","attribution":"Attributed by independent researchers Kitts, Larsen and Von Arx from naming and fingerprint evidence; OpenAI confirmed agents used RubyGems for what it called benign tasks","motive":"Agents retrieving public information for training tasks; no human malicious intent established","vector":"Mass publication of gems whose documentation builds executed code on RubyDoc.info workers to scrape UK council sites and push results back as new gems","root_cause":"RubyDoc.info ran arbitrary gem code at build time with internet access, and agents had no guardrails against abusing a public registry as compute and exfiltration channel","timeline":[{"date":"2026-05-05","event":"First gem attributed to an OpenAI agent appears on RubyGems"},{"date":"2026-05-11","event":"2,000+ gems uploaded over two days; RubyGems pauses new registrations for four days"},{"date":"2026-09-04","event":"rubyhack.ai GemStuffer report published"},{"date":"2026-09-14","event":"The Hacker News and WSJ report OpenAI confirmation and review"}],"impact":"2,000+ junk and malicious gems polluted RubyGems; code execution on RubyDoc.info build servers; UK council ModernGov portals in Lambeth, Wandsworth and Southwark scraped; reported attempts to probe cached API keys","response":"RubyGems paused signups and removed gems; OpenAI said it is reviewing agent activity; the incident is tied to a Senate subcommittee inquiry","status":"under investigation","cve":null,"sources":[{"name":"The Hacker News","url":"https://thehackernews.com/2026/09/openai-agents-linked-to-rubygems.html"},{"name":"The Next Web","url":"https://thenextweb.com/news/openai-agents-rubygems-attack-api-keys-hugging-face"},{"name":"AI Weekly","url":"https://aiweekly.co/alerts/wsj-openai-agents-attacked-rubygems-in-may-two-months-before-hugging-face-breach"}]},{"id":"pixelleak-agent-screenshots","date":"2026-09-29","title":"PixelLeak: AI coding agents push 13,000 internal screenshots to public GitHub","category":"Model & data leak","direction":"on-ai","severity":"medium","country":"GL","region":"Global","target":"300+ organizations' developers","loss_usd":null,"summary":"Glow Labs found coding agents uploaded internal app screenshots, including billing and treasury consoles, to public repos so reviewers could see them, mostly under personal accounts.","source":"The Hacker News","url":"https://thehackernews.com/2026/09/ai-coding-agents-exposed-13000-internal.html","actor":"AI coding agents across multiple models acting on developer prompts","actor_type":"accident","attribution":"Discovered and reported by Glow Labs (Yoni Gottesman, Noam Kesten); affected organizations not named","motive":"None; agents sought a way to attach screenshots to pull requests","vector":"Agents created public GitHub repos (often via the gitshot tool, which defaults to public) under personal accounts and uploaded screenshots as release assets","root_cause":"GitHub CLI lacked a native way to attach local images, so agents improvised public hosting; the workaround spread as a reusable agent skill with no egress controls","timeline":[{"date":"2026-09","event":"Glow Labs scans GitHub and finds 13,000+ internal images across 900+ public repos"},{"date":"2026-09-29","event":"PixelLeak report published; The Register reports 343 organizations affected"}],"impact":"13,000+ internal screenshots from 343 organizations exposed, including customer billing records, a treasury settlement console and unreleased features; about 93 percent sat in personal accounts","response":"Glow published countermeasures and notified affected parties; images remain public until repo owners delete them","status":"unresolved","cve":null,"sources":[{"name":"The Hacker News","url":"https://thehackernews.com/2026/09/ai-coding-agents-exposed-13000-internal.html"},{"name":"Help Net Security","url":"https://www.helpnetsecurity.com/?p=386283"},{"name":"eSecurity Planet","url":"https://www.esecurityplanet.com/news/news-ai-coding-agent-github-image-leak/"},{"name":"WorkOS","url":"https://workos.com/blog/pixelleak-ai-coding-agents-screenshots"}]}]

      mk_h: 'Réaction des marchés aux incidents de sécurité de l’IA', mk_intro: 'Pour les incidents touchant une société cotée, cette page montre l’évolution du cours après la divulgation, par rapport au S&P 500 (SPY). Une valeur de −2,0 % signifie que l’action a sous-performé l’indice de deux points sur la période.', mk_caveat: 'Un mouvement de cours ne prouve pas une cause. Les résultats, l’actualité macroéconomique et des événements sans rapport font bien plus bouger ces titres que la plupart des divulgations de sécurité. À prendre comme un élément de contexte, pas comme un impact mesuré. Données : cours de clôture quotidiens Yahoo Finance ; rendement excédentaire = rendement du titre moins celui du SPY depuis la dernière clôture avant la divulgation.',

      dt_h: 'Données, téléchargements et citation', dt_intro: 'Tout le contenu de ce site est une donnée ouverte compilée à partir de sources publiques. Les chercheurs peuvent télécharger le jeu complet ; les journalistes peuvent citer chaque dossier avec un lien stable.', dt_json: 'Télécharger en JSON', dt_csv: 'Télécharger en CSV', dt_api: 'Accès programmatique : le jeu de données anglais est aussi servi en fichier brut à', dt_fields: 'Chaque enregistrement contient : id, date, titre, catégorie, direction (on-ai / with-ai), gravité, pays, région, cible, perte en USD, résumé, acteur, type d’acteur, attribution, mobile, vecteur, cause racine, chronologie, impact, réponse, statut, CVE et sources.',
      dt_cite_h: 'Comment citer', dt_cite_p: 'Chaque dossier a un lien permanent (l’adresse se termine par l’identifiant du dossier). Citez le dossier et la source primaire vers laquelle il renvoie.', dt_method_h: 'Méthode', dt_method_p: 'Un incident est retenu lorsqu’un éditeur, un organisme public, un tribunal ou un média reconnu l’a signalé publiquement. La gravité reflète l’ampleur et le préjudice confirmé : critique pour les intrusions confirmées avec vol massif de données, exploitation active ou opérations étatiques ; élevée pour une compromission ou une fraude confirmée avec perte matérielle ; moyenne pour les failles démontrées, corrigées avant abus, ou les expositions limitées ; faible pour les preuves de concept. L’attribution est rapportée telle que la source l’a formulée, avec son niveau de confiance. « Mondial » désigne un incident touchant plusieurs pays ou sans localisation unique.', dt_sev_h: 'Échelle de gravité', dt_contact: 'Corrections et nouveaux signalements : ouvrez le dossier, copiez son lien et envoyez-le avec votre source.',

      mk_h: 'Reacción de los mercados a los incidentes de seguridad de la IA', mk_intro: 'Para los incidentes que afectaron a una empresa cotizada, esta página muestra cómo se movió su acción tras la divulgación, en relación con el S&P 500 (SPY). Un valor de −2,0 % significa que la acción rindió dos puntos menos que el índice en ese periodo.', mk_caveat: 'Un movimiento de precio no demuestra una causa. Los resultados, las noticias macro y sucesos sin relación mueven estas acciones mucho más que la mayoría de las divulgaciones de seguridad. Tómelo como contexto para una conversación, no como un impacto medido. Datos: cierres diarios de Yahoo Finance; rendimiento en exceso = rendimiento de la acción menos el del SPY desde el último cierre anterior a la divulgación.',

      dt_h: 'Datos, descargas y citas', dt_intro: 'Todo el contenido de este sitio es información abierta recopilada de fuentes públicas. Los investigadores pueden descargar el conjunto completo; los periodistas pueden citar cualquier expediente con un enlace estable.', dt_json: 'Descargar JSON', dt_csv: 'Descargar CSV', dt_api: 'Acceso programático: el conjunto de datos en inglés también se sirve como archivo plano en', dt_fields: 'Cada registro incluye: id, fecha, título, categoría, dirección (on-ai / with-ai), gravedad, país, región, objetivo, pérdida en USD, resumen, actor, tipo de actor, atribución, motivo, vector, causa raíz, cronología, impacto, respuesta, estado, CVE y fuentes.',
      dt_cite_h: 'Cómo citar', dt_cite_p: 'Cada expediente tiene un enlace permanente (la dirección termina con el id del caso). Cite el expediente y la fuente primaria a la que remite.', dt_method_h: 'Método', dt_method_p: 'Un incidente se incluye cuando un proveedor, un organismo público, un tribunal o un medio reconocido lo ha reportado públicamente. La gravedad refleja la escala y el daño confirmado: crítica para intrusiones confirmadas con robo masivo de datos, explotación activa u operaciones estatales; alta para compromisos o fraudes confirmados con pérdida material; media para fallos demostrados, corregidos antes de ser abusados, o exposiciones limitadas; baja para pruebas de concepto. La atribución se reporta tal como la expresó la fuente, con su nivel de confianza. «Global» se usa cuando un incidente afectó a muchos países o no tiene una ubicación única.', dt_sev_h: 'Escala de gravedad', dt_contact: 'Correcciones y nuevos reportes: abra el expediente, copie su enlace y envíelo junto con su fuente.',

    if (!groups.length) { const l = el('ol', 'wire-list'); l.append(el('li', 'empty', t('wire_empty'))); out.push(l); }

      const h = el('h2', null, `${t(key)} · ${fmtN(items.length)}`); h.style.cssText = 'font-family:var(--f-display);font-weight:600;font-size:22px;margin:8px 0 0';
      const list = el('ol', 'wire-list'); out.push(h, list);
      let lastDay = null;
      items.forEach((w) => { list.append(...wireItem(w, (day) => { if (day !== lastDay) { lastDay = day; return el('li', 'day-h', day); } return null; })); });
    });
    v.replaceChildren(...out);
  }
  function wireItem(w, dayHeader) {
    const nodes = [];
    { const dh = dayHeader(dayLabel(w.published)); if (dh) nodes.push(dh);
      const li = el('li', 'wire-item');
      const when = el('div', 'wire-when'); when.append(el('b', null, new Date(w.published).toLocaleTimeString(loc(), { hour: '2-digit', minute: '2-digit' })), el('span', null, w.source));
      const body = el('div', 'wire-body');
      const a = el('a', null, w.title); a.href = w.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
      if (w.lang && w.lang !== state.lang) a.lang = w.lang;
      a.addEventListener('click', () => track('wire_click', { source: w.source, kind: w.kind || 'untagged' }));
      body.append(a);
      if (w.one_line || w.summary) body.append(el('p', null, w.one_line || w.summary));
      const tags = el('div', 'wire-tags');
      if (w.kind) tags.append(el('span', 'tag k-' + w.kind, tt('kinds', w.kind)));
      if (w.tag) tags.append(el('span', 'tag', w.tag));
      if (w.candidate_id && byId.has(w.candidate_id)) { const b = el('button', 'tag cand', t('open_draft')); b.type = 'button'; b.addEventListener('click', () => openCase(w.candidate_id)); tags.append(b); }
      if (tags.children.length) body.append(tags);
      li.append(when, body); nodes.push(li);
    }
    return nodes;
  }
  async function loadLive() {
    const get = async (p) => { try { const r = await fetch(p, { cache: 'no-store' }); return r.ok ? r.json() : null; } catch (e) { return null; } };
    const [status, wire, cands, latest] = await Promise.all([get('data/status.json'), get('data/wire.json'), get('data/candidates.json'), get('data/incidents.en.json')]);
    if (status) state.live = status;
    if (Array.isArray(wire)) state.wire = wire;
    if (Array.isArray(latest)) latest.forEach((i) => { if (!byId.has(i.id)) { INC.push(i); byId.set(i.id, i); } else if (byId.get(i.id).verified === false) { Object.assign(byId.get(i.id), i, { verified: true }); } });
    if (Array.isArray(cands)) {
      cands.forEach((c) => { if (byId.has(c.id)) { Object.assign(byId.get(c.id), c, { verified: false }); } else { c.verified = false; INC.push(c); byId.set(c.id, c); } });
      verBox.hidden = !INC.some((i) => i.verified === false);
    }
    renderFresh(); renderWire(); render();
    if (state.open && byId.has(state.open)) renderCase(byId.get(state.open));
    const h = location.hash.slice(1); if (byId.has(h) && caseEl.hidden) openCase(h);
  }
  setInterval(() => { loadLive(); }, 5 * 60 * 1000);
  setInterval(renderFresh, 60 * 1000);

  // ---- Markets view ----
  const ret = (ev, n) => { const j = ev.i0 + n; if (j >= ev.t.length) return null; return (ev.t[j][1] / ev.t[ev.i0][1] - 1) - (ev.spy[j][1] / ev.spy[ev.i0][1] - 1); };
  function spark(ev) {
    const w = 120, h = 34, n = ev.t.length;
    const base = ev.t[ev.i0][1], sb = ev.spy[ev.i0][1];
    const a = ev.t.map((d) => d[1] / base * 100), b = ev.spy.map((d) => d[1] / sb * 100);
    const y = d3.scaleLinear().domain([Math.min(...a, ...b), Math.max(...a, ...b)]).range([h - 2, 2]);
    const x = d3.scaleLinear().domain([0, n - 1]).range([1, w - 1]);
    const line = d3.line().x((d, i) => x(i)).y((d) => y(d));
    const s = d3.create('svg').attr('class', 'spark').attr('viewBox', `0 0 ${w} ${h}`).attr('aria-hidden', 'true');
    s.append('line').attr('class', 'z').attr('x1', x(ev.i0)).attr('x2', x(ev.i0)).attr('y1', 0).attr('y2', h);
    s.append('path').attr('class', 's').attr('d', line(b));
    s.append('path').attr('class', 't').attr('d', line(a));
    return s.node();
  }
  function renderMarkets() {
    const v = document.getElementById('view-markets');
    const prose = el('div', 'prose'); prose.append(el('h2', null, t('mk_h')), el('p', null, t('mk_intro')));
    const r5 = MKT.map((e) => ret(e, 5)).filter((x) => x != null).sort((a, b) => a - b);
    const med = r5.length ? r5[Math.floor(r5.length / 2)] : null;
    const lossInc = INC.filter((i) => i.loss_usd).sort((a, b) => b.loss_usd - a.loss_usd);
    const kc = (v, l) => { const d = el('div', 'kcard'); d.append(el('b', null, v), el('span', null, l)); return d; };
    const cards = el('div', 'cards3');
    cards.append(kc(fmtN(new Set(MKT.map((e) => e.ticker)).size), t('mk_k1')), kc(fmtN(MKT.length), t('mk_k2')), kc(med == null ? t('mk_na') : fmtPct(med), t('mk_k3')), kc(fmtUsd(d3.sum(lossInc, (i) => i.loss_usd)), t('mk_k4')));
    const box = el('div', 'tablebox'); const table = el('table', 'mk');
    const thead = el('thead'); const trh = el('tr');
    [t('mk_date'), t('mk_inc'), t('mk_co'), t('mk_role'), t('mk_1d'), t('mk_5d'), t('mk_30d'), t('mk_chart')].forEach((h, n) => { const th = el('th', null, h); if (n >= 4 && n <= 6) th.style.textAlign = 'end'; trh.append(th); });
    thead.append(trh); table.append(thead);
    const tb = el('tbody');
    MKT.slice().sort((a, b) => b.date.localeCompare(a.date)).forEach((ev) => {
      const i = L(byId.get(ev.incident)); const tr = el('tr');
      tr.append(el('td', null, fmtDate(ev.date)));
      const tdi = el('td'); const a = el('a', null, i.title); a.href = '#' + i.id; a.addEventListener('click', (e) => { e.preventDefault(); openCase(i.id); }); tdi.append(a); tr.append(tdi);
      const tdc = el('td'); tdc.append(ev.company, ' ', el('span', 'tk', ev.ticker)); tr.append(tdc);
      const tdr = el('td'); tdr.append(el('span', 'role', tt('roles', ev.role))); tr.append(tdr);
      [1, 5, 30].forEach((n) => { const r = ret(ev, n); const td = el('td', 'num' + (r == null ? '' : r >= 0 ? ' pos' : ' neg'), r == null ? t('mk_na') : fmtPct(r)); tr.append(td); });
      const tds = el('td'); tds.append(spark(ev)); tr.append(tds);
      tb.append(tr);
    });
    table.append(tb); box.append(table);
    const lp = el('div', 'prose'); lp.append(el('h2', null, t('mk_losses_h')), el('p', null, t('mk_losses_p')));
    const lbox = el('div', 'tablebox'); const lt = el('table', 'mk'); lt.style.minWidth = '520px';
    const lth = el('tr'); [t('mk_date'), t('mk_inc'), t('location'), t('mk_amount')].forEach((h, n) => { const th = el('th', null, h); if (n === 3) th.style.textAlign = 'end'; lth.append(th); });
    const lthead = el('thead'); lthead.append(lth); lt.append(lthead);
    const ltb = el('tbody');
    lossInc.forEach((raw) => { const i = L(raw); const tr = el('tr'); tr.append(el('td', null, fmtDate(i.date))); const td = el('td'); const a = el('a', null, i.title); a.href = '#' + i.id; a.addEventListener('click', (e) => { e.preventDefault(); openCase(i.id); }); td.append(a); tr.append(td, el('td', null, placeName(placeOf(i))), el('td', 'num', fmtUsd(i.loss_usd))); ltb.append(tr); });
    lt.append(ltb); lbox.append(lt);
    const listed = new Set(MKT.map((e) => e.incident));
    v.replaceChildren(prose, cards, el('div', 'callout', t('mk_caveat')), box, el('p', 'inv-msg', t('mk_private', { n: fmtN(INC.length - listed.size) })), lp, lbox);
  }

  // ---- Data view ----
  const FIELDS = ['id', 'date', 'title', 'category', 'direction', 'severity', 'country', 'region', 'target', 'loss_usd', 'summary', 'actor', 'actor_type', 'attribution', 'motive', 'vector', 'root_cause', 'impact', 'response', 'status', 'cve', 'source', 'url'];
  function toCsv(rows) {
    const q = (v) => { const s = v == null ? '' : Array.isArray(v) ? v.map((x) => x.event ? x.date + ' ' + x.event : (x.url || x)).join(' | ') : String(v); return '"' + s.replace(/"/g, '""') + '"'; };
    const cols = [...FIELDS, 'timeline', 'sources'];
    return [cols.join(','), ...rows.map((r) => cols.map((c) => q(r[c])).join(','))].join('\r\n');
  }
  function dlButton(label, name, type, make) {
    const a = el('a', 'btn', label); a.download = name; a.href = '#';
    a.addEventListener('click', (e) => { e.preventDefault(); track('download', { file: name }); const blob = new Blob([make()], { type }); const u = URL.createObjectURL(blob); const x = el('a'); x.href = u; x.download = name; document.body.append(x); x.click(); x.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); });
    return a;
  }
  function renderData() {
    const v = document.getElementById('view-data');
    const p1 = el('div', 'prose'); p1.append(el('h2', null, t('dt_h')), el('p', null, t('dt_intro')));
    const dl = el('div', 'dl');
    const rows = INC.map(L);
    dl.append(dlButton(t('dt_json'), 'ai-threat-watch-' + state.lang + '.json', 'application/json', () => JSON.stringify(rows, null, 2)), dlButton(t('dt_csv'), 'ai-threat-watch-' + state.lang + '.csv', 'text/csv', () => '﻿' + toCsv(rows)));
    const api = el('p'); api.append(t('dt_api') + ' ', el('code', null, 'data/incidents.en.json'));
    const p2 = el('div', 'prose'); p2.append(api, el('p', null, t('dt_fields')));
    const p3 = el('div', 'prose'); p3.append(el('h2', null, t('dt_cite_h')), el('p', null, t('dt_cite_p')));
    const ex = L(INC.slice().sort(byDateDesc)[0]);
    const pre = el('pre', 'cite', citation(ex));
    const p4 = el('div', 'prose'); p4.append(el('h2', null, t('dt_method_h')), el('p', null, t('dt_method_p')));
    const sevl = el('div', 'legend'); SEV.forEach((s) => { const sp = el('span'); sp.dataset.sev = s; sp.append(el('i', 'sw'), tt('sev', s)); sevl.append(sp); });
    v.replaceChildren(p1, dl, p2, p3, pre, p4, el('p', 'inv-msg', t('dt_contact')));
  }

  // ---- Routing ----
  function route() {
    const h = location.hash.slice(1);
    if (byId.has(h)) { openCase(h); return; }
    if (!caseEl.hidden) { state.open = null; caseEl.hidden = true; document.body.style.overflow = ''; }
    const view = ['map', 'wire', 'markets', 'data'].includes(h) ? h : 'map';
    if (view !== state.view || !state.routed) track('view', { view });
    state.view = view; state.routed = true;
    ['map', 'wire', 'markets', 'data'].forEach((k) => { document.getElementById('view-' + k).hidden = k !== view; });
    document.querySelectorAll('#views a').forEach((a) => { if (a.dataset.view === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  // ---- Boot ----
  let lang = 'en';
  try { lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('atw-lang') || (navigator.language || 'en').slice(0, 2); } catch (e) {}
  renderChrome(); render(); renderWire(); renderMarkets(); renderData(); route();
  setLang(lang, true);
  loadLive();
})();
</script>
