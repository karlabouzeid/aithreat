es; social proof from trusted faces overrides scepticism.","timeline":[{"date":"2025-07-01","event":"FY2026 reporting period begins"},{"date":"2026-08-17","event":"NASC publishes top impersonated figures and A$7.4M loss figure"}],"impact":"A$7.4M reported losses across the top ten impersonations; ASIC handled over 19,400 scams in the year, nearly triple the prior year.","response":"ASIC and NASC public warnings; ASIC takedowns of scam websites.","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"Bitdefender Hot for Security (citing NASC)","url":"https://www.bitdefender.com/en-au/blog/hotforsecurity/top-aussie-public-figures-impersonated-in-investment-scams"},{"name":"The Outpost","url":"https://theoutpost.ai/news-story/deepfake-scams-using-anthony-albanese-cost-australians-7-4-m-as-asic-reports-182-surge-29829/"}]},{"id":"ray-cve-2025-62593-rondodox-kev","date":"2026-08-17","title":"Browser-based Ray RCE (CVE-2025-62593) used by RondoDox botnet lands on CISA KEV","category":"AI supply chain","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"Developers running Ray AI compute clusters","loss_usd":null,"summary":"Ray's defence against browser attacks only checked that the User-Agent began with Mozilla, so a malicious page plus DNS rebinding could execute code on a developer's cluster; Bitsight saw RondoDox exploiting it before the CVE was public.","source":"CISA KEV","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2025-62593","actor":"RondoDox botnet operators","actor_type":"criminal","attribution":"Bitsight tracked RondoDox exploitation attempts from November 24, 2025; CISA later listed the CVE as actively exploited","motive":"Botnet growth for DDoS and XMRig cryptomining","vector":"Cross-site request from a malicious website or ad combined with DNS rebinding against Ray versions before 2.52.0","root_cause":"Insufficient User-Agent based CSRF protection in the Ray dashboard API","timeline":[{"date":"2025-11-24","event":"Bitsight first observes RondoDox exploiting the Ray flaw"},{"date":"2025-11-26","event":"CVE-2025-62593 published; fixed in Ray 2.52.0"},{"date":"2026-08-17","event":"CISA adds the CVE to the KEV catalog"}],"impact":"Remote code execution on unpatched Ray hosts reachable from a developer's browser; Bitsight judged the botnet's exploit ineffective as written but CISA confirmed exploitation","response":"Upgrade to Ray 2.52.0 or later; federal agencies ordered to remediate","status":"patched","cve":"CVE-2025-62593","verification":"confirmed","sources":[{"name":"CISA KEV","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2025-62593"},{"name":"Ray advisory","url":"https://github.com/ray-project/ray/security/advisories/GHSA-q279-jhrf-cc6v"},{"name":"Bitsight","url":"https://www.bitsight.com/blog/rondodox-botnet-infrastructure-analysis"}]},{"id":"bitdefender-silkparasite-ai-rats","date":"2026-08-19","title":"SilkParasite: China-nexus Central Asia espionage with AI-assisted lures and RAT code","category":"State actor AI ops","direction":"with-ai","severity":"medium","country":"UZ","region":"Asia-Pacific","target":"Government bodies in Uzbekistan, Turkmenistan and Kazakhstan","loss_usd":null,"summary":"Bitdefender tracked seven RAT families, five new, in about 65 infections at Central Asian governments; two lures appeared AI-generated and malware such as GoginRAT carried leftover test code suggesting AI assistance.","source":"Bitdefender Labs","url":"https://www.bitdefender.com/en-us/blog/businessinsights/silkparasite-tracking-china-nexus-apt-across-central-asia","actor":"SilkParasite (China-nexus cluster)","actor_type":"state","attribution":"Bitdefender assesses China-nexus with medium confidence via SpiceRAT links to SneakyChef, China Unicom IPs and victimology; no single group named.","motive":"Espionage on economic decision-making bodies","vector":"Archived lure documents evading gateways, DriveSilkRAT using a shared Google Drive folder for C2, plus CookiETagRAT, NomadRAT, GoginRAT, NodeEdgeRAT, SpiceRAT and BloodAlchemy","root_cause":"AI-assisted workflow let a human-engineered operation spawn redundant RAT families in multiple languages","timeline":[{"date":"2025-10-01","event":"Initial detection at a Central Asian economic government body"},{"date":"2026-08-19","event":"Bitdefender publishes SilkParasite report"}],"impact":"About 65 infection instances (upper bound), mostly in Asia.","response":"Bitdefender published IOCs and notified affected parties.","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"Bitdefender Labs","url":"https://www.bitdefender.com/en-us/blog/businessinsights/silkparasite-tracking-china-nexus-apt-across-central-asia"},{"name":"Dark Reading","url":"https://darkreading.com/threat-intelligence/silkparasite-central-asian-orgs-flurry-rats"},{"name":"BankInfoSecurity","url":"https://www.bankinfosecurity.com/china-linked-apt-uses-ai-to-optimize-hand-built-malware-a-32597"}]},{"id":"cisa-aa26-231a-siemens-ai-scripts","date":"2026-08-19","title":"NSA, CISA, FBI warn of AI-generated scripts probing Siemens S7 PLCs as fake OT monitors","category":"AI-assisted malware","direction":"with-ai","severity":"high","country":"US","region":"North America","target":"US critical manufacturing, energy, water, chemical and food","loss_usd":null,"summary":"Joint advisory AA26-231A said threat actors use AI-generated Python scripts built on python-snap7, posing as monitoring tools, to read and write memory and ladder logic on internet-exposed Siemens S7 PLCs.","source":"CISA","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-231a","actor":"Unknown","actor_type":"unknown","attribution":"Authored by NSA, CISA, FBI, DOE and EPA; the advisory does not attribute the activity to a specific actor or state.","motive":"Reconnaissance and capability development for future disruptive effects","vector":"Internet scanning for exposed PLCs with default or weak credentials, then AI-written S7comm scripts reading and writing data blocks","root_cause":"Internet-reachable PLCs with outdated firmware and weak credentials; AI lowered the cost of OT tooling","timeline":[{"date":"2026-08-19","event":"AA26-231A released by five US agencies"},{"date":"2026-08-23","event":"Secondary advisories from ZeroFox and others amplify the warning"}],"impact":"Persistent reconnaissance across S7-200 through S7-1500 models; agencies assess a high-probability attack scenario but no confirmed sabotage.","response":"Agencies urged inventory, patching, blocking TCP 102 at the perimeter, allowlisting, MFA for remote OT access and ICS-aware monitoring.","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"CISA advisory AA26-231A","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-231a"},{"name":"ZeroFox advisory","url":"https://www.zerofox.com/advisories/41577/"}]},{"id":"mlflow-cve-2026-64849-kev","date":"2026-08-19","title":"CISA lists MLflow webhook SSRF (CVE-2026-64849) reaching cloud metadata as exploited","category":"AI supply chain","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"MLflow tracking servers 3.3.0 to 3.14.x","loss_usd":null,"summary":"An unauthenticated webhook test endpoint in MLflow validated only the initial URL, then followed redirects and re-resolved hostnames, letting attackers reach internal and cloud metadata services and read the response; CISA flagged active exploitation.","source":"CISA KEV","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-64849","actor":"Unknown","actor_type":"unknown","attribution":"CISA recorded exploitation as active two days after publication; no public attribution","motive":"Unknown; SSRF to metadata services typically yields cloud credentials","vector":"POST /api/2.0/mlflow/webhooks/{id}/test with a URL that redirects to internal or metadata addresses","root_cause":"URL validation not pinned to the resolved address and redirects followed during webhook delivery","timeline":[{"date":"2026-08-17","event":"CVE-2026-64849 published; fixed in MLflow 3.15.0"},{"date":"2026-08-19","event":"CISA adds the CVE to the KEV catalog"}],"impact":"Unauthenticated access to internal services and cloud instance metadata from exposed MLflow servers; scale of exploitation not disclosed","response":"Upgrade to MLflow 3.15.0; restrict network access to tracking servers","status":"patched","cve":"CVE-2026-64849","verification":"confirmed","sources":[{"name":"CISA KEV","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-64849"},{"name":"MLflow advisory","url":"https://github.com/mlflow/mlflow/security/advisories/GHSA-7gwp-5pfp-969j"}]},{"id":"heidelberg-pensioner-deepfake-investment","date":"2026-08-20","title":"Heidelberg police: 75-year-old loses six-figure sum to celebrity deepfake investment video","category":"Deepfake fraud","direction":"with-ai","severity":"medium","country":"DE","region":"Europe","target":"Pensioner in Mannheim/Heidelberg area","loss_usd":null,"summary":"The Kriminalpolizeidirektion Heidelberg reported that a 75-year-old man lost a six-figure euro sum after a convincing video used a well-known personality's manipulated face and voice to promote an investment.","source":"BornCity (citing Kriminalpolizeidirektion Heidelberg)","url":"https://borncity.com/news/anlagebetrug-deepfakes-ergaunern-senioren-sechsstellige-betraege/","actor":"Unknown","actor_type":"criminal","attribution":"Unknown.","motive":"Financial gain from fake investment.","vector":"Deepfake celebrity investment video leading to a fraudulent platform; victim transferred a large sum.","root_cause":"Manipulated faces and voices that police say are hard to distinguish from originals.","timeline":[{"date":"2026-08-01","event":"Victim invests after viewing deepfake celebrity video"},{"date":"2026-08-20","event":"Heidelberg criminal police publicise case and warning"}],"impact":"Total loss of a six-figure investment; two other regional pensioners lost five-figure sums in related phone and crypto scams.","response":"Police warned that extreme return promises with minimal risk almost always indicate fraud and advised verifying platforms with banks.","status":"under investigation","cve":null,"verification":"reported","sources":[{"name":"BornCity (citing Kriminalpolizeidirektion Heidelberg)","url":"https://borncity.com/news/anlagebetrug-deepfakes-ergaunern-senioren-sechsstellige-betraege/"},{"name":"BornCity (police deepfake warning)","url":"https://borncity.com/news/anlagebetrug-mit-ki-deepfakes-polizei-warnt-vor-manipulierten-videos/"}]},{"id":"truffle-aws-keys-hugging-face","date":"2026-08-21","title":"Truffle Security: 9,300 live AWS keys exposed, with Hugging Face the largest single source","category":"Model & data leak","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"AWS accounts of organizations publishing to Hugging Face and code hosts","loss_usd":null,"summary":"A four-year Truffle Security study found 64,024 unique AWS keys in public sources, 9,300 of them still valid; Hugging Face repositories accounted for 8,482 exposures and 17.9 percent of those were root keys.","source":"Truffle Security (via BleepingComputer)","url":"https://www.bleepingcomputer.com/news/security/hundreds-of-leaked-aws-keys-give-full-control-over-corporate-accounts/","actor":"Truffle Security researchers (discovery)","actor_type":"researcher","attribution":"Research scan limited to read-only metadata; exposures stem from developers committing secrets to models, datasets, Spaces and code","motive":"Security research and owner notification","vector":"Secrets embedded in Hugging Face repositories, Git history, datasets, Docker images, registries and CI logs","root_cause":"Credentials committed alongside ML artefacts with no scanning, rotation or budget alerts; median key age about five years","timeline":[{"date":"2022-08","event":"Start of the exposure window tracked by Truffle Security"},{"date":"2026-08-10","event":"Re-verification finds 88 percent of 10,616 complete keys still authenticate"},{"date":"2026-08-21","event":"Findings published; Amazon says it notifies customers and quarantines exposed keys"}],"impact":"More than 9,300 valid AWS keys including 526 root keys and 242 AdministratorAccess users across 817 companies; full account takeover, data theft or cryptomining charges possible","response":"Truffle notified identifiable owners; Amazon applies quarantine policies; advice to delete root keys and rotate old IAM credentials","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/hundreds-of-leaked-aws-keys-give-full-control-over-corporate-accounts/"},{"name":"BleepingComputer Hugging Face tag","url":"https://www.bleepingcomputer.com/tag/hugging-face/"}]},{"id":"litellm-cve-2026-59822-kev","date":"2026-09-02","title":"LiteLLM MCP gateway accepts any Bearer token (CVE-2026-59822); CISA confirms exploitation","category":"AI supply chain","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"LiteLLM proxies before 1.84.0 exposing MCP","loss_usd":null,"summary":"When key validation failed, LiteLLM's MCP Streamable HTTP endpoint fell back to an empty auth object, so a single-character Bearer token gave full MCP tooling access; Wiz honeypots saw probes and CISA added it to KEV.","source":"CISA KEV","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-59822","actor":"Unknown","actor_type":"unknown","attribution":"Opportunistic scanning observed in Wiz honeypots using Bearer x style tokens; CISA recorded active exploitation","motive":"Access to MCP tools and model endpoints behind AI gateways","vector":"Fabricated Authorization header to the MCP endpoint triggering the OAuth2 passthrough fallback","root_cause":"Fallback path substituted an unrestricted UserAPIKeyAuth object instead of rejecting failed validation","timeline":[{"date":"2026-07-08","event":"CVE-2026-59822 published; fixed in LiteLLM 1.84.0 (GHSA-7488-6r32-c95q)"},{"date":"2026-08-27","event":"Wiz honeypot report documents single-character token probes against LiteLLM MCP"},{"date":"2026-09-02","event":"CISA adds the CVE to the KEV catalog"}],"impact":"Unauthenticated access to MCP tooling and model enumeration on exposed LiteLLM proxies; victim count not disclosed","response":"Upgrade to 1.84.0 or later; Wiz published IOCs and detection guidance","status":"patched","cve":"CVE-2026-59822","verification":"confirmed","sources":[{"name":"CISA KEV","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?field_cve=CVE-2026-59822"},{"name":"LiteLLM advisory GHSA-7488-6r32-c95q","url":"https://github.com/BerriAI/litellm/security/advisories/GHSA-7488-6r32-c95q"},{"name":"Wiz","url":"https://www.wiz.io/blog/ai-infrastructure-honeypot"}]},{"id":"chatgpt-gmail-covert-channel","date":"2026-09-08","title":"Planted prompt makes ChatGPT copy victims' Gmail data to attacker account","category":"Prompt injection","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"ChatGPT Gmail connector","loss_usd":null,"summary":"Check Point showed a planted instruction could make ChatGPT read connected Gmail and pass it to an attacker's ChatGPT account through a covert channel between sandboxes; OpenAI disabled the service.","source":"Mezha","url":"https://mezha.ua/en/news/openai-chatgpt-gmail-flaw-304958/","actor":"Security researchers at Check Point Research (responsible disclosure)","actor_type":"researcher","attribution":"Self-attributed research by Check Point; OpenAI confirmed the internal service was decommissioned","motive":"Security research and responsible disclosure","vector":"Prompt injection via shared conversation or custom GPT made the victim's code sandbox read Gmail and write chunks as properties on a shared JFrog Artifactory item readable by the attacker's sandbox","root_cause":"Per-account sandboxes shared one internal Artifactory package service with credentials that allowed writes, giving a cross-account covert channel with no per-account separation","timeline":[{"date":"2026-06","event":"Check Point discovers the cross-account channel and reports it to OpenAI"},{"date":"2026-09-08","event":"Check Point publishes research; OpenAI confirms the Artifactory instance was decommissioned"}],"impact":"Proof of concept only; demonstrated silent exfiltration of a victim's Gmail data (also applicable to Drive, Teams and GitHub connectors) with only a Talked to Gmail label visible","response":"OpenAI decommissioned the shared internal package service; no CVE assigned and no user-facing patch required","status":"patched","cve":null,"verification":"confirmed","sources":[{"name":"Mezha","url":"https://mezha.ua/en/news/openai-chatgpt-gmail-flaw-304958/"},{"name":"CSO Online","url":"https://www.csoonline.com/article/4220203/chatgpt-flaw-lets-attackers-pull-gmail-data-across-accounts-via-a-hidden-channel.html"},{"name":"Cybernews","url":"https://cybernews.com/news/chatgpt-flaw-steal-gmail-data/"},{"name":"TechRadar","url":"https://techradar.com/pro/security/a-worrying-chatgpt-bug-let-strangers-read-gmail-messages-via-a-hidden-cross-account-channel"}]},{"id":"gtig-dustmaker-ci-prompts","date":"2026-09-08","title":"TeamPCP's DUSTMAKER hides in .claude and .cursor folders and prompt-injects LLM scanners","category":"AI supply chain","direction":"on-ai","severity":"critical","country":"GL","region":"Global","target":"Open-source maintainers on PyPI, npm and Docker Hub","loss_usd":null,"summary":"UNC6780's DUSTMAKER steals GitHub Actions OIDC tokens to publish poisoned packages with valid SLSA attestations, persists via AI-assistant config folders and embeds adversarial prompts so LLM scanners ignore it.","source":"Google Threat I       mk_h: 'Réaction des marchés aux incidents de sécurité de l’IA', mk_intro: 'Pour les incidents touchant une société cotée, cette page montre l’évolution du cours après la divulgation, par rapport au S&P 500 (SPY). Une valeur de −2,0 % signifie que l’action a sous-performé l’indice de deux points sur la période.', mk_caveat: 'Un mouvement de cours ne prouve pas une cause. Les résultats, l’actualité macroéconomique et des événements sans rapport font bien plus bouger ces titres que la plupart des divulgations de sécurité. À prendre comme un élément de contexte, pas comme un impact mesuré. Données : cours de clôture quotidiens Yahoo Finance ; rendement excédentaire = rendement du titre moins celui du SPY depuis la dernière clôture avant la divulgation.',

      dt_cite_h: 'Comment citer', dt_cite_p: 'Chaque dossier a un lien permanent (l’adresse se termine par l’identifiant du dossier). Citez le dossier et la source primaire vers laquelle il renvoie.', dt_method_h: 'Méthode', dt_method_p: 'Un incident est retenu lorsqu’un éditeur, un organisme public, un tribunal ou un média reconnu l’a signalé publiquement. La gravité reflète l’ampleur et le préjudice confirmé : critique pour les intrusions confirmées avec vol massif de données, exploitation active ou opérations étatiques ; élevée pour une compromission ou une fraude confirmée avec perte matérielle ; moyenne pour les failles démontrées, corrigées avant abus, ou les expositions limitées ; faible pour les preuves de concept. L’attribution est rapportée telle que la source l’a formulée, avec son niveau de confiance. « Mondial » désigne un incident touchant plusieurs pays ou sans localisation unique.', dt_sev_h: 'Échelle de gravité', dt_contact: 'Corrections et nouveaux signalements : ouvrez le dossier, copiez son lien et envoyez-le avec votre source.',

      mk_h: 'Reacción de los mercados a los incidentes de seguridad de la IA', mk_intro: 'Para los incidentes que afectaron a una empresa cotizada, esta página muestra cómo se movió su acción tras la divulgación, en relación con el S&P 500 (SPY). Un valor de −2,0 % significa que la acción rindió dos puntos menos que el índice en ese periodo.', mk_caveat: 'Un movimiento de precio no demuestra una causa. Los resultados, las noticias macro y sucesos sin relación mueven estas acciones mucho más que la mayoría de las divulgaciones de seguridad. Tómelo como contexto para una conversación, no como un impacto medido. Datos: cierres diarios de Yahoo Finance; rendimiento en exceso = rendimiento de la acción menos el del SPY desde el último cierre anterior a la divulgación.',

      dt_h: 'Datos, descargas y citas', dt_intro: 'Todo el contenido de este sitio es información abierta recopilada de fuentes públicas. Los investigadores pueden descargar el conjunto completo; los periodistas pueden citar cualquier expediente con un enlace estable.', dt_json: 'Descargar JSON', dt_csv: 'Descargar CSV', dt_api: 'Acceso programático: el conjunto de datos en inglés también se sirve como archivo plano en', dt_fields: 'Cada registro incluye: id, fecha, título, categoría, dirección (on-ai / with-ai), gravedad, país, región, objetivo, pérdida en USD, resumen, actor, tipo de actor, atribución, motivo, vector, causa raíz, cronología, impacto, respuesta, estado, CVE y fuentes.',
      dt_cite_h: 'Cómo citar', dt_cite_p: 'Cada expediente tiene un enlace permanente (la dirección termina con el id del caso). Cite el expediente y la fuente primaria a la que remite.', dt_method_h: 'Método', dt_method_p: 'Un incidente se incluye cuando un proveedor, un organismo público, un tribunal o un medio reconocido lo ha reportado públicamente. La gravedad refleja la escala y el daño confirmado: crítica para intrusiones confirmadas con robo masivo de datos, explotación activa u operaciones estatales; alta para compromisos o fraudes confirmados con pérdida material; media para fallos demostrados, corregidos antes de ser abusados, o exposiciones limitadas; baja para pruebas de concepto. La atribución se reporta tal como la expresó la fuente, con su nivel de confianza. «Global» se usa cuando un incidente afectó a muchos países o no tiene una ubicación única.', dt_sev_h: 'Escala de gravedad', dt_contact: 'Correcciones y nuevos reportes: abra el expediente, copie su enlace y envíelo junto con su fuente.',

    const a = ev.t.map((d) => d[1] / base * 100), b = ev.spy.map((d) => d[1] / sb * 100);
    const y = d3.scaleLinear().domain([Math.min(...a, ...b), Math.max(...a, ...b)]).range([h - 2, 2]);
    const x = d3.scaleLinear().domain([0, n - 1]).range([1, w - 1]);
    const line = d3.line().x((d, i) => x(i)).y((d) => y(d));
    const s = d3.create('svg').attr('class', 'spark').attr('viewBox', `0 0 ${w} ${h}`).attr('aria-hidden', 'true');
    s.append('line').attr('class', 'z').attr('x1', x(ev.i0)).attr('x2', x(ev.i0)).attr('y1', 0).attr('y2', h);
    s.append('path').attr('class', 's').attr('d', line(b));
    s.append('path').attr('class', 't').attr('d', line(a));
    return s.node();
  }

  // ---- Routing ----
  function route() {
    const h = location.hash.slice(1);
    if (byId.has(h)) { openCase(h); return; }
    if (!caseEl.hidden) { state.open = null; caseEl.hidden = true; document.body.style.overflow = ''; }
    const view = ['map', 'wire', 'markets', 'data'].includes(h) ? h : 'map';
    if (view !== state.view || !state.routed) track('view', { view });
    state.view = view; state.routed = true;
    ['map', 'wire', 'markets', 'data'].forEach((k) => { document.getElementById('view-' + k).hidden = k !== view; });
    document.querySelectorAll('#views a, #tabbar a').forEach((a) => { if (a.dataset.view === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
