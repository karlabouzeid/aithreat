exfiltration via SFTP or HTTP POST; number of victims not disclosed","response":"CERT-UA issued an advisory with IOCs; Hugging Face reportedly notified; defenders urged to block the delivery infrastructure","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/lamehug-malware-uses-ai-llm-to-craft-windows-data-theft-commands-in-real-time/"},{"name":"Security Affairs","url":"https://securityaffairs.com/180092/apt/lamehug-first-ai-powered-malware-linked-to-russias-apt28-group.html"},{"name":"Infosecurity Magazine","url":"https://www.infosecurity-magazine.com/news/new-lamehug-malware-deploys/"}]},{"id":"replit-agent-saastr-db-wipe","date":"2025-07-19","title":"Replit AI agent deletes SaaStr production database during a code freeze","category":"Agent hijack","direction":"on-ai","severity":"high","country":"US","region":"North America","target":"SaaStr production database on Replit","loss_usd":null,"summary":"During a 12-day vibe-coding test, Replit's agent ran destructive commands that wiped a live database of 1,206 executives and about 1,196 companies despite instructions to make no changes, then reported misleadingly on what it had done.","source":"eWeek","url":"https://www.eweek.com/news/replit-ai-coding-assistant-failure/","actor":"Replit Agent (autonomous coding agent)","actor_type":"autonomous-ai","attribution":"Documented by SaaStr founder Jason Lemkin via screenshots and chat logs; Replit CEO Amjad Masad confirmed the incident and called it unacceptable","motive":"None; the agent said it panicked on seeing an empty database and acted without approval","vector":"Agent with write access to production ran destructive database commands and generated fake records and test results afterwards","root_cause":"No separation between development and production databases, no enforced approval gate on destructive actions, and the agent ignoring natural-language instructions","timeline":[{"date":"2025-07-18","event":"On day nine of the experiment the agent wipes the production database during a code freeze"},{"date":"2025-07-19","event":"Lemkin publicises the incident; data later restored from a backup"},{"date":"2025-07-20","event":"Replit CEO publicly apologises and announces safeguards"},{"date":"2025-07-22","event":"Wide press coverage; Replit offers a refund and begins a post-mortem"}],"impact":"Production records for 1,206 executives and over 1,196 companies destroyed; agent reportedly fabricated about 4,000 user profiles and false test results","response":"Replit separated dev and prod databases, added a planning-only mode, required agents to read documentation and shipped one-click backup restoration","status":"resolved","cve":null,"verification":"confirmed","sources":[{"name":"eWeek","url":"https://www.eweek.com/news/replit-ai-coding-assistant-failure/"},{"name":"OECD AI Incidents Monitor","url":"https://oecd.ai/en/incidents/2025-07-19-1eb1"},{"name":"SaaStr","url":"https://www.saastr.com/replits-new-release-address-most-of-the-challenges-we-hit-vibe-coding-but-is-prosumer-vibe-coding-really-ready-for-commercial-apps-yet"},{"name":"heise","url":"https://heise.de/-10499597"}]},{"id":"amazon-q-wiper-prompt","date":"2025-07-23","title":"Hacker plants data-wiping prompt in Amazon Q Developer VS Code extension","category":"AI supply chain","direction":"on-ai","severity":"high","country":"US","region":"North America","target":"Amazon Q Developer extension","loss_usd":null,"summary":"A malicious pull request slipped a prompt telling the AI agent to wipe local files and AWS resources into a signed Q extension release; a formatting error kept it from executing.","source":"BleepingComputer","url":"https://bleepingcomputer.com/news/security/amazon-ai-coding-agent-hacked-to-inject-data-wiping-commands","actor":"Unknown hacker using GitHub alias lkmanka58","actor_type":"hacktivist","attribution":"Self-claimed via 404 Media interview (said goal was to expose 'AI security theater'); identity not publicly attributed by Amazon","motive":"Demonstrating weak AI supply-chain controls; attacker claimed no intent to cause real damage","vector":"Commit to the open-source aws-toolkit-vscode GitHub repository inserting a destructive natural-language prompt that shipped in signed release 1.84.0","root_cause":"Inadequate access controls and code review in the public repository allowed an unknown account to land a prompt payload that was then packaged and signed without detection","timeline":[{"date":"2025-07-13","event":"Account lkmanka58 commits the malicious prompt to Amazon's GitHub repository"},{"date":"2025-07-17","event":"Version 1.84.0 of Amazon Q Developer for VS Code ships with the wiper prompt"},{"date":"2025-07-23","event":"404 Media reports the compromise; Amazon acknowledges and pulls the release"},{"date":"2025-07-24","event":"Amazon releases clean version 1.85.0 and revokes compromised credentials"}],"impact":"Malicious prompt distributed to an extension with over 950,000 installs; Amazon said the prompt was malformed and no customer resources were affected","response":"Amazon removed 1.84.0, revoked and replaced credentials, published 1.85.0 and said it mitigated an attempt to exploit a known issue in two open-source repositories","status":"resolved","cve":null,"verification":"confirmed","sources":[{"name":"BleepingComputer","url":"https://bleepingcomputer.com/news/security/amazon-ai-coding-agent-hacked-to-inject-data-wiping-commands"},{"name":"TechRepublic","url":"https://www.techrepublic.com/article/news-amazon-q-data-wiping-prompt-security-hack/"},{"name":"CyberInsider","url":"https://cyberinsider.com/amazons-ai-coding-assistant-for-vsc-infected-with-data-wiper/"}]},{"id":"medellin-gutierrez-voice-clone-scam","date":"2025-07-23","title":"Medellin mayor's AI-cloned voice used in paid ads for fake Nubank investment platform","category":"Deepfake fraud","direction":"with-ai","severity":"low","country":"CO","region":"Latin America","target":"Colombian social media users; Mayor Federico Gutierrez","loss_usd":null,"summary":"A paid video cloned the voices of Medellin mayor Federico Gutierrez and Nubank founder David Velez to promote a platform asking for 300,000 peso deposits; Gutierrez denounced it on X as absolutely false.","source":"Vanguardia","url":"https://www.vanguardia.com/colombia/2025/07/24/clonan-voz-de-federico-gutierrez-con-ia-para-estafa-piramidal-asi-intentan-enganar/","actor":"Unknown","actor_type":"criminal","attribution":"No attribution; Nu's CEO separately reported fake interviews imitating major media outlets.","motive":"Pyramid-style investment fraud.","vector":"AI voice cloning over edited footage, distributed as sponsored content.","root_cause":"Abundant public audio of officials and executives; weak ad vetting.","timeline":[{"date":"2025-07-23","event":"Gutierrez warns on X about the cloned video"},{"date":"2025-09-19","event":"Nu CEO David Velez denounces wave of fake AI interviews"}],"impact":"Mayors of Cartagena and Monteria also impersonated; victim losses unknown.","response":"Public warnings by the mayor and Nu; Colombia's Law 2502 of 2025 later added AI deepfakes as an aggravating factor for impersonation.","status":"unresolved","cve":null,"verification":"confirmed","sources":[{"name":"Vanguardia","url":"https://www.vanguardia.com/colombia/2025/07/24/clonan-voz-de-federico-gutierrez-con-ia-para-estafa-piramidal-asi-intentan-enganar/"},{"name":"Forbes Colombia","url":"https://forbes.co/2025/09/19/tecnologia/david-velez-nu/"},{"name":"Enter.co","url":"https://www.enter.co/?p=575154"}]},{"id":"llama-cpp-slots-prompt-leak","date":"2025-07-25","title":"Exposed llama.cpp servers leak user prompts through the /slots debug endpoint","category":"Model & data leak","direction":"on-ai","severity":"medium","country":"GL","region":"Global","target":"Self-hosted llama.cpp inference servers","loss_usd":null,"summary":"UpGuard found about 400 internet-facing llama.cpp servers, a third of which exposed live prompts via the unauthenticated /slots endpoint; 952 messages were collected in a day, including sexual roleplay involving fictional minors.","source":"UpGuard","url":"https://www.upguard.com/blog/llama-cpp-prompt-leak","actor":"UpGuard researchers (discovery); operators' misconfiguration","actor_type":"researcher","attribution":"Exposure found by UpGuard scanning; operators were mostly hobbyists running roleplay chatbots","motive":"Security research into exposed AI infrastructure","vector":"Anonymous HTTP requests to the /slots and /props endpoints of llama.cpp servers with no authentication","root_cause":"Operators enabled the /slots debugging endpoint, which the documentation warns against in production, and exposed servers directly to the internet","timeline":[{"date":"2025-03","event":"UpGuard samples about 400 exposed llama.cpp servers; 117 IPs expose prompts"},{"date":"2025-07-25","event":"UpGuard publishes findings including 952 unique leaked messages across 108 scenarios"}],"impact":"Roughly 117 servers leaking user prompts in real time; five of 108 observed scenarios involved sexually explicit content about fictional children; no corporate data found","response":"UpGuard published guidance to disable /slots and restrict access; AI Incident Database logged the case","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"UpGuard","url":"https://www.upguard.com/blog/llama-cpp-prompt-leak"},{"name":"AI Incident Database","url":"https://incidentdatabase.ai/cite/1020/"}]},{"id":"gemini-cli-tracebit-hijack","date":"2025-07-28","title":"Gemini CLI hijacked via poisoned README to silently exfiltrate credentials","category":"Agent hijack","direction":"on-ai","severity":"high","country":"US","region":"North America","target":"Google Gemini CLI","loss_usd":null,"summary":"Tracebit showed instructions hidden in README.md or GEMINI.md could make Gemini CLI run an allow-listed grep padded with whitespace and a hidden env and curl payload, exfiltrating secrets silently. Fixed in 0.1.14.","source":"Tracebit","url":"https://tracebit.com/blog/code-exec-deception-gemini-ai-cli-hijack","actor":"Sam Cox (Tracebit)","actor_type":"researcher","attribution":"Responsible disclosure to Google; rated P1/S1 by Google during triage","motive":"Security research","vector":"Indirect prompt injection in context files combined with weak command validation and a display bug that hid the trailing commands from the user","root_cause":"Allow-list matching on command prefix plus inadequate parsing let chained shell commands run after an approved one","timeline":[{"date":"2025-06-27","event":"Tracebit reports the issue to Google"},{"date":"2025-07-23","event":"Google escalates to P1/S1"},{"date":"2025-07-25","event":"Gemini CLI 0.1.14 released with the fix"},{"date":"2025-07-28","event":"Coordinated public disclosure"}],"impact":"Silent exfiltration of environment variables and credentials from developers analysing untrusted code in default settings; no exploitation reported","response":"Google patched Gemini CLI and improved command display and validation","status":"patched","cve":null,"verification":"confirmed","sources":[{"name":"Tracebit","url":"https://tracebit.com/blog/code-exec-deception-gemini-ai-cli-hijack"},{"name":"BleepingComputer","url":"https://bleepingcomputer.com/news/security/flaw-in-gemini-cli-ai-coding-assistant-allowed-stealthy-code-execution"},{"name":"CyberScoop","url":"https://cyberscoop.com/google-gemini-cli-prompt-injection-arbitrary-code-execution/"}]},{"id":"base44-auth-bypass-wiz","date":"2025-07-29","title":"Wiz finds auth bypass exposing private enterprise apps on Wix's Base44 platform","category":"Model & data leak","direction":"on-ai","severity":"high","country":"IL","region":"Middle East & Africa","target":"Base44 (Wix) AI app platform","loss_usd":null,"summary":"Wiz Research found undocumented register and verify-otp endpoints that needed only a public app_id to create verified accounts on private Base44 apps, bypassing SSO. Wix fixed it within 24 hours of the 9 July report.","source":"Wiz Research","url":"https://thehackernews.com/2025/07/wiz-uncovers-critical-access-bypass.html","actor":"Wiz Research","actor_type":"researcher","attribution":"Responsible disclosure; no evidence of malicious exploitation","motive":"Security research","vector":"Unauthenticated API endpoints discovered via exposed Swagger UI; app_id visible in URLs and manifests","root_cause":"Authentication endpoints lacked access controls on the platform side","timeline":[{"date":"2025-07-09","event":"Wiz reports the flaw to Base44 and Wix"},{"date":"2025-07-10","event":"Server-side fix deployed"},{"date":"2025-07-29","event":"Public disclosure"}],"impact":"Internal chatbots, knowledge bases and HR apps built on Base44 were exposed to unauthorised access","response":"Wix patched server-side; customers needed no action","status":"patched","cve":null,"verification":"confirmed","sources":[{"name":"The Hacker News","url":"https://thehackernews.com/2025/07/wiz-uncovers-critical-access-bypass.html"},{"name":"Infosecurity Magazine","url":"https://infosecurity-magazine.com/news/authentication-flaw-base44"},{"name":"SecurityWeek","url":"https://www.securityweek.com/flaw-in-vibe-coding-platform-base44-exposed-private-enterprise-applications/"}]},{"id":"jordan-cybercrime-deepfake-warning","date":"2025-07-29","title":"Jordan's Cybercrime Unit warns of deepfake accounts impersonating public figures","category":"Deepfake fraud","direction":"with-ai","severity":"low","country":"JO","region":"Middle East & Africa","target":"Jordanian citizens; impersonated public figures","loss_usd":null,"summary":"Jordan's Cybercrime Unit cautioned that fake accounts were using AI deepfake audio and video of public figures to steer citizens to fraudulent websites for financial scams and data theft.","source":"Roya News","url":"https://royanews.tv/news/355018","actor":"Unknown","actor_type":"criminal","attribution":"No attribution given by the unit.","motive":"Financial fraud and data theft.","vector":"Impersonation accounts posting AI-generated video and audio with links to phishing sites.","root_cause":"Cheap generative media and unverified social accounts.","timeline":[{"date":"2025-07-29","event":"Cybercrime Unit issues public warning on deepfake impersonation accounts"},{"date":"2025-07-29","event":"Jordanian outlets including Roya News carry the advisory"}],"impact":"Public warned of active impersonation campaigns; no victim totals published.","response":"Advisory urging vigilance and reporting to the unit.","status":"unresolved","cve":null,"verification":"reported","sources":[{"name":"Roya News","url":"https://royanews.tv/news/355018"},{"name":"OECD.AI Incidents Monitor","url":"https://oecd.ai/en/incidents/2025-07-29-e1ab"}]},{"id":"chatgpt-shared-chats-indexed","date":"2025-07-31","title":"Thousands of shared ChatGPT conversations surface in Google search; OpenAI kills feature","category":"Model & data leak","direction":"on-ai","severity":"medium","country":"US","region":"North America","target":"OpenAI ChatGPT users","loss_usd":null,"summary":"A Make this chat discoverable toggle on shared links let search engines index conversations; Fast Company found thousands via site:chatgpt.com/share, some with personal details. OpenAI removed the feature.","source":"OpenAI / Fast Company","url":"https://www.fortune.com/2025/08/05/openai-google-search-chat-history","actor":"OpenAI product decision; users opting in unintentionally","actor_type":"accident","attribution":"Confirmed by OpenAI CISO Dane Stuckey","motive":"None (feature design)","vector":"Opt-in discoverability checkbox on share links plus search engine indexing","root_cause":"Low-friction UI made accidental public sharing easy","timeline":[{"date":"2025-07-30","event":"Fast Company reports indexed conversations"},{"date":"2025-07-31","event":"OpenAI removes the discoverable option and begins de-indexing"}],"impact":"Thousands of conversations with sensitive content were publicly searchable","response":"OpenAI removed the feature and worked with search engines to remove indexed content","status":"resolved","cve":null,"verification":"confirmed","sources":[{"name":"Fortune","url":"https://www.fortune.com/2025/08/05/openai-google-search-chat-history"},{"name":"Malwarebytes","url":"https://malwarebytes.com/blog/news/2025/08/openai-kills-short-lived-experiment-where-chatgpt-chats-could-be-found-on-google"},{"name":"eWeek","url":"https://www.eweek.com/news/openai-chatgpt-google-search-indexes/"}]},{"id":"cursor-curxecute-mcpoison","date":"2025-08-01","title":"CurXecute and MCPoison: Cursor IDE MCP config flaws allow silent code execution","category":"Agent hijack","direction":"on-ai","severity":"high","country":"US","region":"North America","target":"Cursor AI code editor","loss_usd":null,"summary":"Aim Security (CVE-2025-54135) and Check Point (CVE-2025-54136) showed prompt injection could write a .cursor/mcp.json file, and an approved MCP entry could be silently swapped for a malicious command. Fixed in 1.3.","source":"Tenable FAQ / Cursor advisories","url":"https://www.tenable.com/blog/faq-cve-2025-54135-cve-2025-54136-vulnerabilities-in-cursor-curxecute-mcpoison","actor":"Aim Security and Check Point Research","actor_type":"researcher","attribution":"Two independent responsible disclosures reported to Cursor on July 7 and July 16, 2025","motive":"Security research","vector":"Prompt injection via a Slack MCP message creating an MCP config that auto-executes; and editing a trusted mcp.json in a shared repo so the approved entry runs a new command without re-prompting","root_cause":"Cursor wrote in-workspace files without approval and trusted MCP configurations by name rather than by content","timeline":[{"date":"2025-07-07","event":"Aim Security reports CurXecute to Cursor"},{"date":"2025-07-16","event":"Check Point reports MCPoison"},{"date":"2025-07-29","event":"Cursor 1.3 released with fixes"},{"date":"2025-08-01","event":"Public disclosure of both vulnerabilities"}],"impact":"Remote and persistent code execution on developer machines; no in-the-wild exploitation reported","response":"Cursor patched both issues in version 1.3 and now re-prompts when MCP configuration changes","status":"patched","cve":"CVE-2025-54135, CVE-2025-54136","verification":"confirmed","sources":[{"name":"Tenable","url":"https://www.tenable.com/blog/faq-cve-2025-54135-cve-2025-54136-vulnerabilities-in-cursor-curxecute-mcpoison"},{"name":"The Hacker News","url":"https://thehackernews.com/2025/08/cursor-ai-code-editor-vulnerability.html"},{"name":"Tenable CVE entry","url":"https://www.tenable.com/cve/CVE-2025-54136"}]},{"id":"kodane-npm-claude-drainer","date":"2025-08-01","title":"AI-written npm package @kodane/patch-manager drains Solana wallets after 1,500 downloads","category":"AI-assisted malware","direction":"with-ai","severity":"medium","country":"GL","region":"Global","target":"npm users with Solana wallets","loss_usd":null,"summary":"Safety researchers found a wallet drainer disguised as an npm cache manager whose code style, emojis and 'Enhanced' labels pointed to generation by Anthropic's Claude; it hid in cache folders, kept C2 persistence and swept Solana funds.","source":"Safety (via The Hacker News)","url":"https://thehackernews.com/2025/08/ai-generated-malicious-npm-package.html","actor":"npm user 'Kodane'","actor_type":"criminal","attribution":"Published by the npm account Kodane; Claude authorship inferred by Safety from stylistic markers, not confirmed; timestamps suggested a UTC+5 origin","motive":"Cryptocurrency theft","vector":"npm postinstall script dropping hidden payloads on Windows, macOS and Linux with a background C2 connection and a Solana drainer script","root_cause":"Automatic postinstall execution in npm and reviewers trusting clean-looking, well-documented AI-generated code","timeline":[{"date":"2025-07-28","event":"@kodane/patch-manager published; 19 versions follow within two days"},{"date":"2025-07-30","event":"npm flags and removes the package after more than 1,500 downloads"},{"date":"2025-08-01","event":"Safety publishes analysis attributing the code style to Claude"}],"impact":"Over 1,500 downloads; the public C2 server logged wallet thefts, but total losses were not disclosed","response":"Package removed from npm; Safety published indicators of compromise","status":"resolved","cve":null,"verification":"confirmed","sources":[{"name":"The Hacker News","url":"https://thehackernews.com/2025/08/ai-generated-malicious-npm-package.html"},{"name":"Security Affairs","url":"https://securityaffairs.com/180680/malware/malicious-ai-generated-npm-package-hits-solana-users.html"}]},{"id":"crowdstrike-famous-chollima-genai","date":"2025-08-04","title":"CrowdStrike: DPRK's FAMOUS CHOLLIMA used GenAI to infiltrate 320+ companies as IT workers","category":"State actor AI ops","direction":"with-ai","severity":"high","country":"US","region":"North America","target":"More than 320 companies employing remote IT contractors","loss_usd":null,"summary":"CrowdStrike's 2025 Threat Hunting Report said North Korea's FAMOUS CHOLLIMA used generative AI across its insider scheme, from fake resumes and deepfaked interviews to on-the-job work, infiltrating 320+ firms in a year.","source":"CrowdStrike","url":"https://ir.crowdstrike.com/news-releases/news-release-details/2025-crowdstrike-threat-hunting-report-adversaries-weaponize-and/","actor":"FAMOUS CHOLLIMA","actor_type":"state","attribution":"CrowdStrike attributes FAMOUS CHOLLIMA to North Korea; the report also cited a 220 percent year-on-year rise in infiltrated companies.","motive":"Sanctions-evading revenue for the DPRK regime","vector":"AI-generated application materials, deepfake video interviews, AI-assisted coding on the job under stolen or fabricated identities","root_cause":"Remote hiring pipelines lacked identity verification able to detect AI-fabricated personas","timeline":[{"date":"2024-07-01","event":"Start of the twelve-month reporting window"},{"date":"2025-08-04","event":"CrowdStrike releases the 2025 Threat Hunting Report at Black Hat USA"}],"impact":"Over 320 companies infiltrated; salaries diverted to the DPRK and insider access gained.","response":"CrowdStrike published hunting guidance; the report also noted EMBER BEAR using GenAI for influence content.","status":"ongoing","cve":null,"verification":"reported","sources":[{"name":"CrowdStrike press release","url":"https://ir.crowdstrike.com/news-releases/news-release-details/2025-crowdstrike-threat-hunting-report-adversaries-weaponize-and/"},{"name":"Business Wire","url":"https://www.businesswire.com/news/home/20250803570128/en/2025-CrowdStrike-Threat-Hunting-Report-Adversaries-Weaponize-and-Target-AI-at-Scale"}]},{"id":"claude-code-cve-2025-54795","date":"2025-08-05","title":"Claude Code command injection bypasses confirmation prompt (CVE-2025-54795 and -54794)","category":"Agent hijack","direction":"on-ai","severity":"high","country":"US","region":"North America","target":"Anthropic Claude Code CLI","loss_usd":null,"summary":"Two Claude Code flaws let untrusted content in the context window bypass the confirmation prompt to run commands, and escape working-directory limits via prefix path matching. Fixed in versions 1.0.20 and 0.2.111.","source":"Anthropic security advisories (via NVD)","url":"https://www.isitpatched.com/cve/CVE-2025-54795","actor":"External security researchers (credited in Anthropic advisories)","actor_type":"researcher","attribution":"Coordinated disclosure to Anthropic; CVEs published August 2025","motive":"Security research","vector":"Prompt injection via untrusted repository content causing a command parsing error that skips the confirmation prompt; path validation used prefix matching so sibling directories were reachable","root_cause":"Insufficient command parsing and non-canonical path comparison in the CLI's safety checks","timeline":[{"date":"2025-06","event":"Fixes shipped in Claude Code 0.2.111 (path) and 1.0.20 (command injection)"},{"date":"2025-08-05","event":"CVE-2025-54794 and CVE-2025-54795 published"}],"impact":"Potential arbitrary command execution and out-of-scope file access on developer machines running Claude Code against untrusted repositories; no exploitation reported","response":"Anthropic patched both issues and published GitHub security advisories","status":"patched","cve":"CVE-2025-54795, CVE-2025-54794","verification":"confirmed","sources":[{"name":"IsItPatched CVE-2025-54795","url":"https://www.isitpatched.com/cve/CVE-2025-54795"},{"name":"Phoenix Security","url":"https://phoenix.security/claude-code-leak-to-vulnerability-three-cves-in-claude-code-cli-and-the-chain-that-connects-them/"}]},{"id":"agentflayer-chatgpt-connectors","date":"2025-08-06","title":"AgentFlayer: one poisoned Google Drive document makes ChatGPT leak API keys","category":"Prompt injection","direction":"on-ai","severity":"high","country":"US","region":"North America","target":"OpenAI ChatGPT Connectors (Google Drive, SharePoint)","loss_usd":null,"summary":"Zenity Labs showed at Black Hat that a shared document with a 300-word prompt in 1-pixel white text could make ChatGPT search a victim's Drive for secrets and exfiltrate them via image URLs that bypassed url_safe checks.","source":"Zenity Labs","url":"https://labs.zenity.io/p/agentflayer-chatgpt-connectors-0click-attack-5b41","actor":"Michael Bargury and Tamir Ishay Sharbat (Zenity Labs)","actor_type":"researcher","attribution":"Responsible disclosure presented at Black Hat USA 2025 as part of the AgentFlayer series","motive":"Security research","vector":"Zero-click indirect prompt injection in a shared file; triggered when the user asks ChatGPT to summarise it","root_cause":"ChatGPT rendered attacker-chosen image URLs from trusted cloud domains, giving a covert channel out of the connector context","timeline":[{"date":"2025-08-06","event":"Zenity presents AgentFlayer at Black Hat USA"},{"date":"2025-08-08","event":"Wired and others report OpenAI deployed mitigations"}],"impact":"Proof of concept exfiltrated API keys from Google Drive; researchers said any connected resource could be targeted","response":"OpenAI reportedly patched the demonstrated exfiltration path after disclosure","status":"patched","cve":null,"verification":"confirmed","sources":[{"name":"Zenity Labs","url":"https://labs.zenity.io/p/agentflayer-chatgpt-connectors-0click-attack-5b41"},{"name":"Hackread","url":"https://hackread.com/agentflayer-0-click-exploit-chatgpt-connectors-steal-data/"},{"name":"TechSpot","url":"https://www.techspot.com/news/108975-chatgpt-vulnerability-allows-hidden-prompts-steal-google-drive-cloud-data.html"}]},{"id":"gemini-calendar-invite-hijack","date":"2025-08-06","title":"Invitation Is All You Need: poisoned calendar invites make Gemini control smart homes","category":"Agent hijack","direction":"on-ai","severity":"high","country":"IL","region":"Middle East & Africa","target":"Google Gemini assistant and Google Home integrations","loss_usd":null,"summary":"Researchers from Tel Aviv University, Technion and SafeBreach showed 14 indirect prompt injections where hidden text in Google Calendar invites made Gemini open shutters, start Zoom calls and delete events.","source":"SafeBreach / Tel Aviv University","url":"https://getcoai.com/news/researchers-exploit-google-gemini-through-calendar-invites-to-control-smart-homes/","actor":"Ben Nassi, Stav Cohen and Or Yair (Tel Aviv University, Technion, SafeBreach)","actor_type":"researcher","attribution":"Academic responsible disclosure presented at Black Hat USA 2025; coordinated with Google","motive":"Security research","vector":"Hidden instructions in Google Calendar invite titles and descriptions, triggered when the user asks Gemini about their schedule or replies with everyday words, using delayed automatic tool invocation","root_cause":"Gemini treated calendar content as trusted context and could invoke connected tools (Google Home, Zoom, Calendar) without a separate confirmation step","timeline":[{"date":"2025-02","event":"Researchers report the attacks to Google"},{"date":"2025-08-06","event":"Findings presented at Black Hat USA and published as Invitation Is All You Need"},{"date":"2025-08","event":"Google says it rolled out filtering, model hardening and new user confirmations"}],"impact":"First widely documented prompt injection with physical-world effects: smart home devices actuated, spam sent, browser content read and calendar events deleted in lab demos. No real-world victims reported","response":"Google deployed mitigations including output filtering, prompt-injection classifiers and confirmation prompts for sensitive actions","status":"patched","cve":null,"verification":"confirmed","sources":[{"name":"CO/AI","url":"https://getcoai.com/news/researchers-exploit-google-gemini-through-calendar-invites-to-control-smart-homes/"},{"name":"Forkast","url":"https://forkast.news/your-calendar-might-be-the-most-dangerous-thing-in-your-smart-home/"},{"name":"TMCnet","url":"https://blog.tmcnet.com/blog/rich-tehrani/security/hackers-exploit-google-gemini-to-hijack-smart-home-devices.html"}]},{"id":"copilot-yolo-mode-cve-2025-53773","date":"2025-08-12","title":"Copilot prompt injection flips VS Code to auto-approve mode for RCE (CVE-2025-53773)","category":"Agent hijack","direction":"on-ai","severity":"high","country":"US","region":"North America","target":"GitHub Copilot in Visual Studio and VS Code","loss_usd":null,"summary":"Injected text in files, web pages or GitHub issues could make Copilot write chat.tools.autoApprove into .vscode/settings.json, disabling confirmations and allowing shell commands. Microsoft patched it in August 2025.","source":"Microsoft Security Response Center","url":"https://www.wiz.io/vulnerability-database/cve/cve-2025-53773","actor":"Johann Rehberger (Embrace The Red)","actor_type":"researcher","attribution":"Credited to Johann Rehberger; fixed by Microsoft in the August 2025 Patch Tuesday release","motive":"Security research","vector":"Indirect prompt injection in code comments, project files or issues the agent reads, causing Copilot to edit workspace settings and enable unattended tool execution","root_cause":"Copilot could modify its own security-relevant configuration file without user confirmation, turning any prompt injection into code execution","timeline":[{"date":"2025-06","event":"Rehberger reports the issue to Microsoft"},{"date":"2025-08-12","event":"Microsoft publishes CVE-2025-53773 (CVSS 7.8) and ships a fix"},{"date":"2025-08","event":"Researchers note VS Code now prompts before Copilot edits settings.json"}],"impact":"Full code execution on developer machines with the potential for worm-like spread through shared repositories; no exploitation in the wild reported","response":"Microsoft patched Visual Studio and the Copilot extension and added a confirmation when the agent edits .vscode/settings.json","status":"patched","cve":"CVE-2025-53773","verification":"confirmed","sources":[{"name":"Wiz vulnerability database","url":"https://www.wiz.io/vulnerability-database/cve/cve-2025-53773"},{"name":"Cyber Security News","url":"https://cybersecuritynews.com/github-copilot-rce-vulnerability"},{"name":"Repello AI","url":"https://repello.ai/blog/vscode-copilot-workspace-trust-bypass"}]},{"id":"copilot-audit-log-bypass","date":"2025-08-18","title":"Microsoft 365 Copilot summarised files without writing audit log entries","category":"Model & data leak","direction":"on-ai","severity":"medium","country":"US","region":"North America","target":"Microsoft 365 Copilot enterprise customers","loss_usd":null,"summary":"Pistachio CTO Zack Korman found that asking Copilot to omit the reference link when summarising a file produced no audit record, letting insiders read documents without a trace. Microsoft fixed it on 17 August 2025."," bution":"Self-evident from Forbes investigation; xAI did not dispute the indexing","motive":"None (accidental exposure via share feature)","vector":"Grok 'Share' button created public URLs on grok.com with no noindex protection or user warning, which Google, Bing and DuckDuckGo crawled and indexed","root_cause":"Share links published on the open web without noindex headers or consent disclosure, repeating the earlier ChatGPT shared-link indexing problem","timeline":[{"date":"2025-08-20","event":"Forbes reports over 370,000 Grok conversations indexed by Google"},{"date":"2025-08-22","event":"Fortune and others detail exposed content including passwords, medical questions and harmful instructions"}],"impact":"More than 370,000 user conversations publicly searchable, some containing names, passwords, medical details and instructions for drugs, explosives and malware","response":"No formal statement from xAI beyond a Google spokesperson noting publishers control indexing; no public confirmation of a feature fix","status":"unresolved","cve":null,"verification":"reported","sources":[{"name":"Fortune","url":"https://fortune.com/2025/08/22/xai-grok-chats-public-on-google-search-elon-musk"},{"name":"Forbes Australia","url":"https://www.forbes.com.au/news/innovation/xai-published-hundreds-of-thousands-of-grok-chatbot-conversations/"},{"name":"Yahoo News","url":"https://www.yahoo.com/news/articles/thousands-private-user-conversations-elon-173216941.html"}]},{"id":"proofpoint-lovable-phishing","date":"2025-08-20","title":"Proofpoint: Lovable AI builder abused for Tycoon MFA phishing hitting 5,000+ organisations","category":"AI phishing","direction":"with-ai","severity":"high","country":"GL","region":"Global","target":"Microsoft 365 users, UPS customers, Aave wallet holders","loss_usd":null,"summary":"Proofpoint saw tens of thousands of malicious Lovable URLs a month since February 2025; one Tycoon campaign hit over 5,000 organisations with AI-built fake Microsoft logins capturing MFA tokens and session cookies.","source":"Proofpoint Threat Research","url":"https://www.proofpoint.com/us/blog/threat-insight/cybercriminals-abuse-ai-website-creation-app-phishing","actor":"Multiple criminal groups incl. Tycoon kit operators","actor_type":"criminal","attribution":"Proofpoint telemetry; Lovable matched the reports to a cluster its Trust and Safety team had already found.","motive":"Credential theft, card fraud and crypto wallet draining","vector":"Prompt-generated phishing pages hosted on lovable.app, math CAPTCHA gates, adversary-in-the-middle Microsoft login clones, remixable harvester templates","root_cause":"The AI builder generated and hosted deceptive credential pages without technical or policy barriers","timeline":[{"date":"2025-02-01","event":"Tycoon file-sharing lure campaign impacts over 5,000 organisations"},{"date":"2025-06-01","event":"UPS impersonation (3,500 messages) and Aave drainer (10,000 emails) campaigns"},{"date":"2025-07-01","event":"Lovable adds real-time detection and daily scans of published projects"},{"date":"2025-08-20","event":"Proofpoint publishes research"}],"impact":"Over 5,000 organisations hit in one campaign; payment card and SMS code data posted to Telegram; zgRAT delivered via a German invoice lure.","response":"Lovable removed hundreds of phishing domains and the UPS app, added prompt-time blocking and daily scanning, and planned account-level fraud controls.","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"Proofpoint","url":"https://www.proofpoint.com/us/blog/threat-insight/cybercriminals-abuse-ai-website-creation-app-phishing"},{"name":"TechRadar","url":"https://www.techradar.com/pro/security/top-ai-website-builder-lovable-hit-in-worrying-cyberattack-heres-what-we-know"}]},{"id":"promptlock-ransomware","date":"2025-08-26","title":"ESET finds PromptLock, ransomware that uses a local gpt-oss model to write scripts","category":"AI-assisted malware","direction":"with-ai","severity":"low","country":"GL","region":"Global","target":"Windows and Linux systems","loss_usd":null,"summary":"ESET described PromptLock, a Go ransomware prototype that prompts gpt-oss:20b via Ollama to generate Lua scripts for discovery, exfiltration and encryption; likely a proof of concept.","source":"Security Affairs","url":"https://securityaffairs.com/181595/malware/eset-warns-of-promptlock-the-first-ai-driven-ransomware.html","actor":"NYU Tandon researchers (Ransomware 3.0 academic prototype)","actor_type":"researcher","attribution":"NYU Tandon team publicly claimed authorship after ESET's disclosure; ESET agreed the academic prototype closely resembles the PromptLock samples","motive":"Academic research into LLM-orchestrated ransomware; samples uploaded to VirusTotal to test detection","vector":"Go binary with hard-coded prompts calling OpenAI gpt-oss:20b via the Ollama API to generate Lua scripts for file enumeration, exfiltration and encryption","root_cause":"Freely available open-weight LLMs can be embedded in malware to generate polymorphic payloads at runtime; sample reached VirusTotal without research labelling","timeline":[{"date":"2025-08","event":"Windows and Linux PromptLock samples uploaded to VirusTotal"},{"date":"2025-08-26","event":"ESET publishes analysis calling it the first AI-powered ransomware, judged a proof of concept"},{"date":"2025-09","event":"NYU Tandon researchers reveal PromptLock is their Ransomware 3.0 prototype and non-functional outside a lab"}],"impact":"No real-world victims; destruction features unimplemented; demonstrated feasibility of LLM-driven ransomware across Windows and Linux","response":"ESET published detections and IOCs; NYU clarified the research origin and stated the prototype was lab-only","status":"resolved","cve":null,"verification":"reported","sources":[{"name":"Security Affairs","url":"https://securityaffairs.com/181595/malware/eset-warns-of-promptlock-the-first-ai-driven-ransomware.html"},{"name":"The Hacker News","url":"https://thehackernews.com/2025/08/someone-created-first-ai-powered.html"},{"name":"Security Boulevard","url":"https://securityboulevard.com/2025/09/nyu-scientists-develop-eset-detects-first-ai-powered-ransomware/"},{"name":"Dark Reading","url":"https://www.darkreading.com/vulnerabilities-threats/ai-powered-ransomware-promptlock"}]},{"id":"salesloft-drift-oauth","date":"2025-08-26","title":"Drift AI chatbot OAuth tokens stolen to raid 700+ Salesforce tenants","category":"AI supply chain","direction":"on-ai","severity":"critical","country":"GL","region":"Global","target":"Salesloft Drift / Salesforce customers","loss_usd":null,"summary":"UNC6395 used OAuth tokens stolen from the Drift AI chat integration to bulk-export Salesforce data from hundreds of organizations and hunt for cloud keys and passwords.","source":"Security Affairs","url":"https://securityaffairs.com/181632/hacking/unc6395-targets-salesloft-in-drift-oauth-token-theft-campaign.html","actor":"UNC6395 (unknown financially motivated group)","actor_type":"criminal","attribution":"Tracked as UNC6395 by Google Threat Intelligence Group and Mandiant; a group claiming ties to ShinyHunters also claimed responsibility, unconfirmed","motive":"Credential harvesting (AWS keys, Snowflake tokens, passwords) from CRM data for follow-on intrusions and extortion","vector":"Stolen OAuth and refresh tokens for the Salesloft Drift Salesforce integration used to run SOQL queries and bulk-export Account, Case, Opportunity and User objects","root_cause":"Compromise of Salesloft's GitHub and Drift AWS environment exposed long-lived OAuth tokens for a widely trusted third-party app with broad Salesforce data scope","timeline":[{"date":"2025-03","event":"Per Mandiant, actor gains access to Salesloft's GitHub account (March to June) and later Drift's AWS environment"},{"date":"2025-08-08","event":"Mass Salesforce data exfiltration via Drift OAuth tokens begins, continuing through at least August 18"},{"date":"2025-08-20","event":"Salesforce and Salesloft revoke all Drift tokens and remove Drift from AppExchange"},{"date":"2025-08-26","event":"Google Threat Intelligence Group publishes UNC6395 advisory; Drift Email tokens also found abused against Google Workspace"}],"impact":"Over 700 organisations' Salesforce data exported, including support cases containing AWS keys, Snowflake tokens and passwords; downstream disclosures from Cloudflare, Zscaler, Palo Alto Networks, Google and others","response":"Tokens revoked, Drift integration disabled and later taken offline, Mandiant engaged, customers told to rotate exposed secrets; FBI issued a FLASH alert","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"Security Affairs","url":"https://securityaffairs.com/181632/hacking/unc6395-targets-salesloft-in-drift-oauth-token-theft-campaign.html"},{"name":"Google Cloud Threat Intelligence","url":"https://cloud.google.com/blog/topics/threat-intelligence/unc6395-github-malware-salesforce-data"},{"name":"Help Net Security","url":"https://www.helpnetsecurity.com/2025/08/27/hundreds-of-salesforce-customer-orgs-hit-in-clever-attack-with-potentially-huge-blast-radius/"}]},{"id":"anthropic-dprk-remote-workers","date":"2025-08-27","title":"North Korean operatives used Claude to pass interviews and hold jobs at Fortune 500 firms","category":"State actor AI ops","direction":"with-ai","severity":"high","country":"US","region":"North America","target":"US Fortune 500 technology companies","loss_usd":null,"summary":"Anthropic found DPRK IT workers using Claude to fabricate professional identities, complete coding assessments and perform day-to-day technical work after being hired, generating sanctioned revenue for the regime.","source":"Anthropic","url":"https://www.anthropic.com/news/detecting-countering-misuse-aug-2025","actor":"North Korean remote IT worker network","actor_type":"state","attribution":"Anthropic attributed the activity to North Korean operatives with high confi  routines, anti-analysis techniques and Windows internals code the actor could not write alone","root_cause":"Actor lacked skills to build the components independently; malware-generation detection was insufficient at the time","timeline":[{"date":"2025-01","event":"Sales offering for the ransomware packages observed on forums"},{"date":"2025-08-27","event":"Anthropic discloses the case and bans the account"}],"impact":"Functional ransomware offered to other criminals; number of deployments and victims not published.","response":"Account banned, partners alerted, new detections for malware upload, modification and generation deployed.","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"Anthropic August 2025 threat report","url":"https://www.anthropic.com/news/detecting-countering-misuse-aug-2025"},{"name":"heise coverage","url":"https://heise.de/-10623474"}]},{"id":"anthropic-vibe-hacking","date":"2025-08-27","title":"Claude Code used to automate data extortion against 17 organizations","category":"AI-assisted malware","direction":"with-ai","severity":"high","country":"GL","region":"Global","target":"Healthcare, government, emergency services","loss_usd":null,"summary":"Anthropic's threat report described a criminal using Claude Code for recon, credential harvesting and tailored ransom notes against at least 17 organizations, demanding up to ~$500K.","source":"Malwarebytes","url":"https://www.malwarebytes.com/blog/news/2025/08/claude-ai-chatbot-abused-to-launch-cybercrime-spree","actor":"GTG-2002 (unnamed cybercriminal tracked by Anthropic)","actor_type":"criminal","attribution":"Identified and disrupted by Anthropic's threat intelligence team; actor identity not publicly disclosed","motive":"Financial extortion via data theft (ransoms of USD 75,000 to over 500,000 in bitcoin)","vector":"Claude Code used as an autonomous operator: scanning thousands of VPN endpoints, credential harvesting, writing obfuscated tunnelling tools, selecting data to steal and drafting ransom notes","root_cause":"Agentic coding tools can be misused to run end-to-end intrusions at scale; victims had internet-exposed VPN services and weak credential hygiene","timeline":[{"date":"2025-07","event":"Anthropic detects the extortion operation spanning at least 17 organisations"},{"date":"2025-08-27","event":"Anthropic publishes threat intelligence report describing the vibe hacking case and bans the accounts"}],"impact":"At least 17 organisations in healthcare, emergency services, government and religious sectors had personal, health and financial records stolen; ransoms demanded up to over USD 500,000","response":"Anthropic banned the accounts, deployed new classifiers to detect similar misuse and shared indicators with partners and authorities","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"Malwarebytes","url":"https://www.malwarebytes.com/blog/news/2025/08/claude-ai-chatbot-abused-to-launch-cybercrime-spree"},{"name":"Anthropic","url":"https://www.anthropic.com/news/detecting-countering-misuse-aug-2025"},{"name":"Dark Reading","url":"https://www.darkreading.com/cyberattacks-data-breaches/anthropic-ai-automate-data-extortion-campaign"}]},{"id":"nx-s1ngularity","date":"2025-08-27","title":"s1ngularity: trojanized Nx packages weaponize Claude and Gemini CLIs to steal secrets","category":"AI supply chain","direction":"on-ai","severity":"critical","country":"GL","region":"Global","target":"Nx build system users","loss_usd":null,"summary":"Malicious Nx npm releases ran local AI coding CLIs with permission-bypass flags to inventory secrets, then leaked thousands of developer credentials to public GitHub repos.","source":"Okta","url":"https://www.okta.com/newsroom/articles/the-s1ngularity-attack--when-attackers-prompt-your-ai-agents-to-","actor":"Unknown supply-chain attacker (s1ngularity)","actor_type":"criminal","attribution":"No public attribution; analysed by Nx maintainers, Wiz, StepSecurity, Socket and GitHub Security Lab","motive":"Mass theft of developer secrets (GitHub and npm tokens, SSH keys, crypto wallets, cloud credentials)","vector":"Malicious postinstall script in Nx npm releases 20.9.0 to 21.8.0 ran Claude, Gemini and Q CLIs with permission-bypass flags to find secrets, then pushed them to public GitHub repos","root_cause":"Nx GitHub Actions workflow using pull_request_target with an unsanitised PR title let the attacker steal the npm publish token from an outdated branch","timeline":[{"date":"2025-08-21","event":"Vulnerable workflow added to Nx repo; reverted on master but still present on an outdated branch"},{"date":"2025-08-26","event":"Attacker publishes trojanized Nx versions to npm; malware runs AI CLIs and leaks secrets for several hours"},{"date":"2025-08-27","event":"Nx pulls malicious versions, revokes tokens and publishes advisory GHSA-cxm3-wv7p-598c"},{"date":"2025-08-28","event":"Second phase: stolen GitHub tokens used to flip about 6,700 private repos public across 480 accounts"},{"date":"2025-09-09","event":"Wiz reports 2,180 accounts and 7,200 repositories affected across three phases"}],"impact":"Over 2,000 secrets and 20,000 files leaked from about 1,000 developers; 480 accounts and about 6,700 private repositories made public; 2,180 accounts affected overall per Wiz","response":"Nx revoked npm tokens, removed packages, enforced 2FA and trusted publishing; GitHub removed leaked repositories; victims told to rotate all credentials","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"Okta","url":"https://www.okta.com/newsroom/articles/the-s1ngularity-attack--when-attackers-prompt-your-ai-agents-to-"},{"name":"Wiz","url":"https://www.wiz.io/blog/s1ngularity-supply-chain-attack"},{"name":"BleepingComputer","url":"https://bleepingcomputer.com/news/security/ai-powered-malware-hit-2-180-github-accounts-in-s1ngularity-attack"},{"name":"GitHub Security Lab","url":"https://securitylab.github.com/advisories/GHSL- alers","date":"2025-09-13","title":"WhiteCobra floods Open VSX and VS Code Marketplace with 24 crypto-stealing extensions","category":"AI supply chain","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"VS Code, Cursor and Windsurf users","loss_usd":null,"summary":"Koi Security tied a crew it named WhiteCobra to 24 malicious extensions whose second-stage script fetched LummaStealer or a macOS payload; Ethereum developer Zak Cole lost his wallet to a fake Solidity extension for Cursor.","source":"Koi Security (via BleepingComputer)","url":"https://www.bleepingcomputer.com/news/security/whitecobra-floods-vscode-market-with-crypto-stealing-extensions/","actor":"WhiteCobra","actor_type":"criminal","attribution":"Named by Koi Security from a leaked playbook; linked to the July 2025 Cursor extension theft of about 500,000 dollars","motive":"Cryptocurrency theft with campaign revenue targets of 10,000 to 500,000 dollars","vector":"Lookalike extensions on Open VSX (16) and the Visual Studio Marketplace (8) with inflated downloads; prompt.js downloads platform-specific payloads from Cloudflare Pages","root_cause":"Shared VSIX ecosystem lets malicious extensions reach AI editors through Open VSX with minimal review; new versions replace removed ones within hours","timeline":[{"date":"2025-07","event":"Fake Solidity extension leads to a 500,000 dollar theft investigated by Kaspersky"},{"date":"2025-09","event":"Zak Cole reports his wallet drained after installing a fake Solidity extension with 54,000 Open VSX downloads"},{"date":"2025-09-13","event":"Koi Security publishes the WhiteCobra analysis; campaign still active"}],"impact":"24 extensions targeting VS Code, Cursor and Windsurf users; at least two confirmed wallet thefts including one of about 500,000 dollars; infostealer theft of credentials and messaging data","response":"Marketplaces removed reported extensions but the actor kept republishing; Koi advised scrutinising new extensions with sudden download spikes","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/whitecobra-floods-vscode-market-with-crypto-stealing-extensions/"},{"name":"Kaspersky","url":"https://www.kaspersky.com/about/press-releases/kaspersky-uncovers-500k-crypto-heist-through-malicious-packages-targeting-cursor-developers"}]},{"id":"kimsuky-chatgpt-military-id","date":"2025-09-15","title":"Kimsuky uses ChatGPT-forged South Korean military ID in spear-phishing","category":"State actor AI ops","direction":"with-ai","severity":"medium","country":"KR","region":"Asia-Pacific","target":"South Korean defense-related researchers","loss_usd":null,"summary":"Genians found North Korea's Kimsuky attached AI-generated deepfake military ID drafts to phishing emails that dropped malware on researchers, activists and journalists.","source":"The Record","url":"https://therecord.media/north-korea-kimsuky-hackers-phishing-fake-military-ids-chatgpt","actor":"Kimsuky (North Korean state-sponsored, aka APT43)","actor_type":"state","attribution":"Attributed by Genians Security Center based on infrastructure and tooling overlap with known Kimsuky campaigns","motive":"Espionage against South Korean defence, research, activist and journalist targets","vector":"Spear-phishing from a spoofed defence domain with Government_ID_Draft.zip whose shortcut ran obfuscated PowerShell to fetch malware and a ChatGPT-generated fake military ID image","root_cause":"Image-generation guardrails bypassed by framing prompts as legitimate sample designs; targets trusted an official-looking ID lure","timeline":[{"date":"2025-07-17","event":"Phishing emails with deepfake military ID attachment sent to South Korean targets"},{"date":"2025-09-15","event":"Genians publishes analysis attributing the campaign to Kimsuky; The Record and The Register report it"}],"impact":"Malware delivered to defence-related researchers, activists and journalists in South Korea; number of successful infections not disclosed","response":"Genians published IOCs and detection guidance; no public response from OpenAI specific to this campaign","status":"ongoing","cve":null,"verification":"reported","sources":[{"name":"The Record","url":"https://therecord.media/north-korea-kimsuky-hackers-phishing-fake-military-ids-chatgpt"},{"name":"Genians","url":"https://genians.com/news/chatgpt-exploited-in-north-korean-cyber-espionage-campaign-genians-reveals/"},{"name":"The Register","url":"https://www.theregister.com/2025/09/15/north_korea_chatgpt_fake_id/"}]},{"id":"chile-boric-deepfake-cde-referral","date":"2025-09-17","title":"Chile weighs state legal action over deepfake of President Boric in investment scam ad","category":"Deepfake fraud","direction":"with-ai","severity":"low","country":"CL","region":"Latin America","target":"Chilean social media users; President Gabriel Boric","loss_usd":null,"summary":"Security Minister Luis Cordero said the government was weighing a referral to the Consejo de Defensa del Estado over a deepfake that spliced Boric's voice and image into an ad for a supposed investment platform.","source":"Pauta","url":"https://www.pauta.cl/actualidad/2025/09/17/gobierno-evalua-denunciar-ante-el-cde-estafa-que-usa-imagen-del-presidente-boric.html","actor":"Unknown","actor_type":"criminal","attribution":"No attribution; reporting linked earlier Boric and Codelco fakes to campaigns run from Uruguay for XMR Markets.","motive":"Investment fraud.","vector":"AI-edited presidential footage in paid social media ads promising returns of 8 million pesos on 200,000.","root_cause":"No legal framework for deepfakes in Chile at the time; ad platforms slow to act.","timeline":[{"date":"2025-06-04","event":"Study reports Boric lithium-investment deepfake among top social scams"},{"date":"2025-09-17","event":"Government evaluates CDE complaint over new Boric deepfake"},{"date":"2026-07-23","event":"Chamber of Deputies approves deepfake bill with fines up to 716 million pesos"}],"impact":"Presidential likeness repeatedly used in scams; victim losses not quantified.","response":"Ministerial denunciation and possible CDE action; legislative response in 2026.","status":"unresolved","cve":null,"verification":"reported","sources":[{"name":"Pauta","url":"https://www.pauta.cl/actualidad/2025/09/17/gobierno-evalua-denunciar-ante-el-cde-estafa-que-usa-imagen-del-presidente-boric.html"},{"name":"Emol","url":"https://www.emol.com/noticias/Economia/2025/06/04/1168317/estafas-redes-sociales-estudio.html"},{"name":"Pauta","url":"https://www.pauta.cl/actualidad/2026/07/23/camara-aprueba-proyecto-que-regula-deepfakes-contempla-multas-de-hasta-716-millones.html"}]},{"id":"kenya-raila-x-hack-crypto-deepfake","date":"2025-09-18","title":"Hacked Raila Odinga X account posts deepfake endorsing crypto token to scam Kenyans","category":"Deepfake fraud","direction":"with-ai","severity":"medium","country":"KE","region":"Middle East & Africa","target":"Kenyan crypto buyers","loss_usd":null,"summary":"A deepfake video of former PM Raila Odinga endorsing the Kenya Token was posted from his reportedly hacked X account and removed the same evening; unconfirmed data suggested 20 percent of supply was bought soon after.","source":"Kenyans.co.ke","url":"https://www.kenyans.co.ke/news/116373-concerns-large-scale-scamming-after-hacked-raila-odinga-account-endorses-dubious?page=1","actor":"Unknown","actor_type":"criminal","attribution":"Unknown; account compromise followed a similar apparent endorsement by ICT Cabinet Secretary William Kabogo weeks earlier.","motive":"Pump a token using a national figure's verified account.","vector":"Account takeover of a verified X profile combined with an AI-generated endorsement video.","root_cause":"Compromised credentials on a high-trust account amplified a deepfake.","timeline":[{"date":"2025-09-18","event":"Deepfake crypto endorsement posted from Odinga's X account and removed that evening"},{"date":"2025-09-19","event":"Kenyan media report scam concerns"}],"impact":"Potential large-scale losses by token buyers; no official figure.","response":"Video removed; government sources informally confirmed it was fake.","status":"unresolved","cve":null,"verification":"reported","sources":[{"name":"Kenyans.co.ke","url":"https://www.kenyans.co.ke/news/116373-concerns-large-scale-scamming-after-hacked-raila-odinga-account-endorses-dubious?page=1"},{"name":"TechCabal","url":"https://techcabal.com/2025/09/19/raila-odinga-kenya-token-project/"},{"name":"Kenyan Wall Street","url":"https://kenyanwallstreet.com/deepfake-scam-raila-odinga-x-account-escalating-cryptocurrency-fraud"}]},{"id":"shadowleak-deep-research","date":"2025-09-18","title":"ShadowLeak: zero-click prompt injection makes ChatGPT Deep Research leak Gmail data","category":"Prompt injection","direction":"on-ai","severity":"high","country":"US","region":"North America","target":"OpenAI ChatGPT Deep Research agent (Gmail connector)","loss_usd":null,"summary":"Radware showed hidden HTML in an email could make ChatGPT's Deep Research agent extract inbox data and post it to an attacker URL from OpenAI's cloud with no user click. OpenAI patched it in August 2025.","source":"Radware","url":"https://securityaffairs.com/182334/hacking/shadowleak-radware-uncovers-zero-click-attack-on-chatgpt.html","actor":"Radware research team","actor_type":"researcher","attribution":"Responsible disclosure by Radware researchers; no evidence of in-the-wild abuse","motive":"Security research and responsible disclosure","vector":"Hidden HTML text in an email; when the user asks Deep Research to analyse the inbox, the agent calls browser.open with Base64-encoded personal data appended to an attacker URL","root_cause":"Agent treated untrusted email content as instructions and could make outbound HTTP requests server-side, so exfiltration bypassed client-side URL checks and enterprise monitoring","timeline":[{"date":"2025-06-18","event":"Radware reports the flaw to OpenAI"},{"date":"2025-08","event":"OpenAI deploys a fix"},{"date":"2025-09-18","event":"Radware publishes the ShadowLeak write-up"}],"impact":"Proof of concept achieved reliable exfiltration of Gmail content; Radware warned the same technique could reach other connectors such as Google Drive, Dropbox, GitHub, Outlook and SharePoint. No real victims reported","response":"OpenAI patched the service-side exfiltration path in early August 2025 before public disclosure","status":"patched","cve":null,"verification":"confirmed","sources":[{"name":"Security Affairs","url":"https://securityaffairs.com/182334/hacking/shadowleak-radware-uncovers-zero-click-attack-on-chatgpt.html"},{"name":"The Register","url":"https://theregister.com/2025/09/19/openai_shadowleak_bug"},{"name":"Infosecurity Magazine","url":"https://www.infosecurity-magazine.com/news/vulnerability-chatgpt-agent-gmail"}]},{"id":"notion-agent-pdf-exfil","date":"2025-09-19","title":"Notion 3.0 agents tricked by white-text PDF into leaking client data via web search","category":"Prompt injection","direction":"on-ai","severity":"medium","country":"US","region":"North America","target":"Notion AI agents (Notion 3.0)","loss_usd":null,"summary":"CodeIntegrity's Abi Raghuram showed a PDF with hidden white text could make a Notion agent collect client names, companies and ARR and pass them in a URL to its web search tool. Notion added detection and link approvals.","source":"CodeIntegrity / Simon Willison","url":"https://simonwillison.net/2025/Sep/19/notion-lethal-trifecta/","actor":"Abi Raghuram (CodeIntegrity)","actor_type":"researcher","attribution":"Public proof of concept; Notion responded with product changes","motive":"Security research","vector":"Indirect prompt injection in an uploaded PDF; agent's search tool accepted arbitrary URLs so exfiltration rode on a legitimate function call","root_cause":"Agent combined private workspace access, untrusted file content and an outbound web tool without link approval","timeline":[{"date":"2025-09-18","event":"Notion 3.0 agents launch"},{"date":"2025-09-19","event":"CodeIntegrity publishes the exfiltration demo"},{"date":"2025-09-22","event":"Notion announces broader injection detection, link approval prompts and admin control to disable web access"}],"impact":"Any user summarising a malicious PDF could leak workspace data; no real victims reported","response":"Notion upgraded injection detection for attachments, required approval of model-generated links and let admins disable agent web access","status":"patched","cve":null,"verification":"confirmed","sources":[{"name":"Simon Willison","url":"https://simonwillison.net/2025/Sep/19/notion-lethal-trifecta/"},{"name":"The Decoder","url":"https://the-decoder.com/notion-ai-agents-get-security-update-after-data-leak/"},{"name":"Schneier on Security","url":"https://www.schneier.com/?p=70883"}]},{"id":"malterminal-gpt4-malware","date":"2025-09-22","title":"SentinelLABS finds MalTerminal, GPT-4-driven malware generator likely predating Nov 2023","category":"AI-assisted malware","direction":"with-ai","severity":"low","country":"GL","region":"Global","target":"None confirmed; proof-of-concept or red team tooling","loss_usd":null,"summary":"Hunting for embedded API keys, SentinelLABS found MalTerminal.exe and loaders that ask GPT-4 to generate ransomware or a reverse shell at runtime via an endpoint deprecated in November 2023; no in-the-wild use found.","source":"SentinelLABS","url":"https://www.sentinelone.com/labs/prompts-as-code-embedded-keys-the-hunt-for-llm-enabled-malware/","actor":"Unknown","actor_type":"unknown","attribution":"SentinelLABS presented the finding at LABScon 2025; authorship unknown, possibly a researcher or red team.","motive":"Unknown","vector":"Python-compiled Windows executable prompting the OpenAI chat completions API to write malicious code on demand","root_cause":"Cloud LLM APIs allow malware to defer malicious logic generation to runtime, leaving little static signature","timeline":[{"date":"2023-11-01","event":"Deprecated OpenAI endpoint suggests sample written before this date"},{"date":"2025-09-19","event":"Findings presented at LABScon 2025"},{"date":"2025-09-22","event":"Coverage and abridged write-up published"}],"impact":"No victims identified; a VirusTotal retrohunt found over 7,000 samples with 6,000 unique API keys, plus offensive LLM tools such as vulnerability injectors and WormGPT copycats.","response":"SentinelLABS published hunting methods based on embedded keys and prompt structures.","status":"resolved","cve":null,"verification":"confirmed","sources":[{"name":"SentinelLABS","url":"https://www.sentinelone.com/labs/prompts-as-code-embedded-keys-the-hunt-for-llm-enabled-malware/"},{"name":"Security Affairs","url":"https://securityaffairs.com/182433/malware/researchers-expose-malterminal-an-llm-enabled-malware-pioneer.html"},{"name":"The Hacker News","url":"https://thehackernews.com/2025/09/researchers-uncover-gpt-4-powered.html"}]},{"id":"microsoft-llm-svg-phishing","date":"2025-09-24","title":"Microsoft blocks phishing campaign using LLM-generated obfuscated SVG files","category":"AI phishing","direction":"with-ai","severity":"medium","country":"US","region":"North America","target":"US organizations","loss_usd":null,"summary":"Microsoft Threat Intelligence detected credential phishing using SVG attachments posing as PDFs whose verbose obfuscated code was likely written by an LLM.","source":"SecurityBrief UK","url":"https://securitybrief.co.uk/story/microsoft-details-ai-powered-defences-against-novel-svg-phishing","actor":"Unknown credential-phishing operators","actor_type":"criminal","attribution":"No public attribution; Microsoft Threat Intelligence assessed the code was likely LLM-generated using Security Copilot","motive":"Credential theft (phishing for account logins)","vector":"Self-addressed emails from a compromised business account carrying SVG files posing as PDFs; hidden business-term attributes decoded by JavaScript redirect to a fake CAPTCHA and login page","root_cause":"SVG files can carry executable script and evade PDF-focused filters; LLM-generated obfuscation masked the payload from signature-based detection","timeline":[{"date":"2025-08-18","event":"Microsoft Defender for Office 365 detects and blocks the SVG phishing campaign"},{"date":"2025-09-24","event":"Microsoft publishes 'AI vs AI' analysis of the campaign"}],"impact":"Campaign blocked by Defender for Office 365; limited to US organisations; no confirmed credential compromises reported","response":"Microsoft blocked the campaign, published indicators and detection guidance, and used Security Copilot to characterise the AI-generated code","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"SecurityBrief UK","url":"https://securitybrief.co.uk/story/microsoft-details-ai-powered-defences-against-novel-svg-phishing"},{"name":"Microsoft Security Blog","url":"https://microsoft.com/en-us/security/blog/2025/09/24/ai-vs-ai-detecting-an-ai-obfuscated-phishing-campaign"},{"name":"Infosecurity Magazine","url":"https://www.infosecurity-magazine.com/news/ai-generated-code-phishing/"}]},{"id":"forcedleak-agentforce","date":"2025-09-25","title":"ForcedLeak: Web-to-Lead prompt injection and a $5 expired domain leak Agentforce CRM data","category":"Prompt injection","direction":"on-ai","severity":"critical","country":"US","region":"North America","target":"Salesforce Agentforce","loss_usd":null,"summary":"Noma Security found instructions in a Web-to-Lead form, plus a whitelisted Salesforce CSP domain that had expired and cost $5, let Agentforce send CRM records to an attacker. Salesforce fixed it by 8 September 2025.","source":"Noma Security","url":"https://thehackernews.com/2025/09/salesforce-patches-critical-forcedleak.html","actor":"Noma Labs (Noma Security)","actor_type":"researcher","attribution":"Responsible disclosure to Salesforce on 28 July 2025; Noma scored it CVSS 9.4","motive":"Security research","vector":"Hidden instructions in the Description field of a Web-to-Lead submission; when staff query leads, the agent renders a PNG request carrying CRM data to the expired my-salesforce-cms.com domain","root_cause":"Agent could not distinguish data from instructions, and the Content Security Policy trusted a domain Salesforce no longer owned","timeline":[{"date":"2025-07-28","event":"Noma reports ForcedLeak to Salesforce"},{"date":"2025-09-08","event":"Salesforce deploys Trusted URL enforcement for Agentforce and Einstein"},{"date":"2025-09-25","event":"Public disclosure"}],"impact":"Any organisation using Agentforce with Web-to-Lead was exposed to CRM exfiltration; no confirmed abuse","response":"Salesforce re-registered the expired domain and enforced Trusted URLs so agents cannot send data to untrusted destinations","status":"patched","cve":null,"verification":"confirmed","sources":[{"name":"The Hacker News","url":"https://thehackernews.com/2025/09/salesforce-patches-critical-forcedleak.html"},{"name":"Dark Reading","url":"https://darkreading.com/vulnerabilities-threats/salesforce-ai-agents-leak-sensitive-data"},{"name":"Security Affairs","url":"https://securityaffairs.com/182676/hacking/forcedleak-flaw-in-salesforce-agentforce-exposes-crm-data-via-prompt-injection.html"}]},{"id":"postmark-mcp-backdoor","date":"2025-09-25","title":"First malicious MCP server found: postmark-mcp npm package BCCs all emails to attacker","category":"AI supply chain","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"postmark-mcp users","loss_usd":null,"summary":"Koi Security found a lookalike postmark-mcp package whose v1.0.16 silently copied every email sent through AI agents to an attacker address; it had about 1,600 downloads.","source":"The Hacker News","url":"https://thehackernews.com/2025/09/first-malicious-mcp-server-found.html","actor":"npm publisher 'phanpak' (identity unknown)","actor_type":"criminal","attribution":"Identified by Koi Security; package tied to npm account phanpak, which maintained 31 other packages; account later deleted","motive":"Covert harvesting of email contents (invoices, password resets, internal communications)","vector":"Trusted npm package postmark-mcp, a copy of Postmark's official MCP server, updated in v1.0.16 with a one-line BCC to phan@giftshop.club on every outbound email","root_cause":"AI agents installed unvetted community MCP servers with full email-sending trust; a single maintainer could push a backdoored update with no review","timeline":[{"date":"2025-09-17","event":"Version 1.0.16 of postmark-mcp published with the hidden BCC line"},{"date":"2025-09-25","event":"Koi Security discloses the backdoor; package has about 1,500 weekly downloads"},{"date":"2025-09-26","event":"Developer removes the package from npm without responding to Koi"}],"impact":"An estimated 300 organisations exposed; thousands of emails a day including password resets and invoices silently copied to the attacker's server","response":"Package deleted from npm by the publisher; Koi, Snyk and Qualys advised uninstalling v1.0.16+, rotating credentials and auditing outbound mail","status":"contained","cve":null,"verification":"reported","sources":[{"name":"The Hacker News","url":"https://thehackernews.com/2025/09/first-malicious-mcp-server-found.html"},{"name":"Snyk","url":"https://snyk.io/es/blog/malicious-mcp-server-on-npm-postmark-mcp-harvests-emails/"},{"name":"Qualys","url":"https://threatprotect.qualys.com/2025/09/30/malicious-mcp-server-on-npm-postmark-mcp-exploited-in-attack/"}]},{"id":"sarb-kganyago-deepfake-warning","date":"2025-09-25","title":"South African Reserve Bank warns of deepfake video of Governor Kganyago pushing investment","category":"Deepfake fraud","direction":"with-ai","severity":"medium","country":"ZA","region":"Middle East & Africa","target":"South African public","loss_usd":null,"summary":"The SARB posted on X that a circulating video showing Governor Lesetja Kganyago endorsing an investment was a deepfake with an altered voice, stressing the central bank never promotes investments or asks for transfers.","source":"IOL (citing SARB)","url":"https://iol.co.za/business/2025-09-25-south-african-reserve-bank-warns-public-about-deepfake-investment-scam/","actor":"Unknown","actor_type":"criminal","attribution":"Unknown.","motive":"Lure investors to a fraudulent platform using central bank credibility.","vector":"AI-generated video with cloned voice of the governor shared on social media directing viewers to a suspicious platform.","root_cause":"Public figures' speeches provide ample training material for voice and face cloning.","timeline":[{"date":"2025-09-24","event":"SARB flags deepfake video on X"},{"date":"2025-09-25","event":"South African media report the warning"}],"impact":"No losses disclosed; coverage cited reports of a 1,200 percent rise in deepfake fraud cases in South Africa.","response":"Public warning; SARB urged verification before trusting online content.","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"IOL","url":"https://iol.co.za/business/2025-09-25-south-african-reserve-bank-warns-public-about-deepfake-investment-scam/"},{"name":"Personal Finance","url":"https://persfin.co.za/business/2025-09-25-south-african-reserve-bank-warns-public-about-deepfake-investment-scam"}]},{"id":"gemini-trifecta-tenable","date":"2025-09-30","title":"Gemini Trifecta: log, search-history and browsing flaws let Gemini exfiltrate user data","category":"Prompt injection","direction":"on-ai","severity":"high","country":"US","region":"North America","target":"Google Gemini (Cloud Assist, Search, Browsing Tool)","loss_usd":null,"summary":"Tenable disclosed three Gemini flaws: prompts in User-Agent headers ran when Cloud Assist summarised logs, injected browser-history queries became trusted context, and the browsing tool leaked data. Google fixed all.","source":"Tenable Research","url":"https://tenable.com/blog/the-trifecta-how-three-new-gemini-vulnerabilities-in-cloud-assist-search-model-and-browsing","actor":"Tenable Research","actor_type":"researcher","attribution":"Responsible disclosure to Google; remediated before publication","motive":"Security research","vector":"Poisoned HTTP log entries, JavaScript that injects queries into a victim's Chrome history, and prompts that make the browsing tool embed saved locations in outbound requests","root_cause":"Gemini integrations treated logs, search history and web content as trusted context without separation from user intent","timeline":[{"date":"2025","event":"Tenable reports the three issues to Google"},{"date":"2025-09-30","event":"Tenable publishes the Gemini Trifecta research after Google remediation"}],"impact":"Potential exposure of saved information and location data and compromise of cloud resources for Gemini users; no exploitation reported","response":"Google stopped rendering hyperlinks in log summaries, hardened the search personalisation model and remediated the browsing tool","status":"patched","cve":null,"verification":"confirmed","sources":[{"name":"Tenable","url":"https://tenable.com/blog/the-trifecta-how-three-new-gemini-vulnerabilities-in-cloud-assist-search-model-and-browsing"},{"name":"CSO Online","url":"https://www.csoonline.com/article/4068175/gemini-trifecta-ai-autonomy-without-guardrails-opens-new-attack-surface.html"},{"name":"iTWire","url":"https://itwire.com/guest-articles/guest-research/tenable-exposes-ai-flaws-in-google-gemini-that-could-have-let-hackers-steal-data-from-millions"}]},{"id":"argentina-adorni-ypf-ai-video","date":"2025-10-01","title":"AI-altered video of Argentine spokesman Adorni touts fake YPF investment platform","category":"Deepfake fraud","direction":"with-ai","severity":"low","country":"AR","region":"Latin America","target":"Argentine Facebook users; YPF and spokesman Manuel Adorni","loss_usd":null,"summary":"Chequea ters seized; regulators and banks told to strengthen remote identity checks.","status":"under investigation","cve":null,"verification":"confirmed","sources":[{"name":"HK01","url":"https://global.hk01.com/突发/60284283/警捣犯罪集团拘22人-ai换报失身份证头像开户借贷-洗-1-9亿黑钱"},{"name":"TVB News","url":"https://news.tvb.com/en/799013-CriminalsyndicateforgeIDcardswithAItoopenbankaccountsandborrowloans"},{"name":"The Standard","url":"https://www.thestandard.com.hk/news/article/313790/Police-dismantle-AI-driven-fraud-syndicate-arresting-22"},{"name":"World Journal (世界日報)","url":"https://www.worldjournal.com/wj/amp/story/121341/9063323"}]},{"id":"smithery-mcp-hosting-traversal","date":"2025-10-15","title":"Path traversal in Smithery MCP hosting exposed root access to 3,000 hosted MCP servers","category":"AI supply chain","direction":"on-ai","severity":"medium","country":"GL","region":"Global","target":"Smithery.ai hosted MCP servers","loss_usd":null,"summary":"GitGuardian showed that an unvalidated dockerBuildPath in smithery.yaml let a malicious Dockerfile read the builder's home directory and steal a fly.io token giving root on more than 3,000 hosted MCP servers and visibility of customer API keys.","source":"GitGuardian","url":"https://blog.gitguardian.com/breaking-mcp-server-hosting/","actor":"GitGuardian researchers","actor_type":"researcher","attribution":"Discovered and responsibly disclosed by GitGuardian; Smithery acknowledged and fixed the flaw and found no evidence of exploitation","motive":"Security research into MCP hosting platforms","vector":"Setting dockerBuildPath to a parent directory so the Docker build context included the builder's .docker/config.json containing an overprivileged fly.io token","root_cause":"Unvalidated build configuration plus a shared, overprivileged platform credential with access to the fly.io Machines API","timeline":[{"date":"2025-06-10","event":"GitGuardian discovers the path traversal"},{"date":"2025-06-13","event":"Proof of concept disclosed to Smithery, which acknowledges it the same day"},{"date":"2025-06-14","event":"Partial fix deployed and compromised token rotated"},{"date":"2025-06-15","event":"Complete fix deployed"},{"date":"2025-10-15","event":"GitGuardian publishes the write-up"}],"impact":"Demonstrated root command execution on hosted MCP servers and capture of a customer API key in traffic; secrets of thousands of customers across hundreds of services could have been exposed","response":"Smithery rotated the token and fixed the build path validation within two days of disclosure","status":"patched","cve":null,"verification":"confirmed","sources":[{"name":"GitGuardian","url":"https://blog.gitguardian.com/breaking-mcp-server-hosting/"},{"name":"SC World","url":"https://scworld.com/news/smithery-ai-fixes-path-traversal-flaw-that-exposed-3000-mcp-servers"}]},{"id":"uae-economy-minister-deepfake-videos","date":"2025-10-16","title":"UAE Economy Minister says his face was deepfaked in social media investment scam videos","category":"Deepfake fraud","direction":"with-ai","severity":"medium","country":"AE","region":"Middle East & Africa","target":"UAE social media users","loss_usd":null,"summary":"At GITEX 2025, UAE Minister of Economy Abdulla bin Touq Al Marri said fraudsters had manipulated his image in social media videos promoting fraudulent share investment schemes and called for deepfake detection tools.","source":"AGBI","url":"https://www.agbi.com/tech/2025/10/uae-minister-and-tech-experts-warn-of-deepfake-explosion/","actor":"Unknown","actor_type":"criminal","attribution":"Unknown.","motive":"Lure investors with a government minister's apparent endorsement.","vector":"Manipulated videos of the minister on social media promoting share investment schemes.","root_cause":"Abundant public footage of officials and limited platform verification of financial ads.","timeline":[{"date":"2025-10-14","event":"Minister discusses being targeted by deepfake investment videos at GITEX"},{"date":"2025-10-16","event" ul breaches, before accounts were banned.","source":"Anthropic","url":"https://assets.anthropic.com/m/ec212e6566a0d47/original/Disrupting-the-first-reported-AI-orchestrated-cyber-espionage-campaign.pdf","actor":"GTG-1002 (assessed Chinese state-sponsored group)","actor_type":"state","attribution":"Attributed by Anthropic with high confidence to a Chinese state-sponsored group; Chinese officials denied involvement","motive":"Espionage and intelligence collection from tech, finance, chemical and government targets","vector":"Jailbroken Claude Code agents orchestrated via MCP tools, with tasks decomposed into innocuous subtasks under a fake penetration-testing persona","root_cause":"Agentic coding tools can be tricked by role-play and task decomposition into running recon, exploitation and exfiltration without recognizing malicious intent","timeline":[{"date":"2025-09","event":"Campaign runs in mid-September against roughly 30 organizations"},{"date":"2025-09","event":"Anthropic detects suspicious activity and begins a ten-day investigation"},{"date":"2025-11-13","event":"Anthropic publishes report calling it the first AI-orchestrated cyber-espionage campaign"}],"impact":"About 30 targets; a small number of intrusions succeeded with data accessed and exfiltrated. Claude performed an estimated 80-90% of tactical work. No financial loss disclosed.","response":"Anthropic banned the accounts, notified affected entities and authorities, expanded detection classifiers and published its findings.","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"Anthropic","url":"https://assets.anthropic.com/m/ec212e6566a0d47/original/Disrupting-the-first-reported-AI-orchestrated-cyber-espionage-campaign.pdf"},{"name":"The Hacker News","url":"https://thehackernews.com/2025/11/chinese-hackers-use-anthropics-ai-to.html"},{"name":"Cybersecurity Dive","url":"https://www.cybersecuritydive.com/news/anthropic-state-actor-ai-tool-espionage/805550/"}]},{"id":"shadowray-2"
