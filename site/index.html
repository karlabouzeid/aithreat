,{"date":"2025-05-15","event":"FBI issues public service announcement"},{"date":"2025-07-08","event":"State Department cable reports AI-voice impersonation of Secretary Rubio on Signal"}],"impact":"Compromised accounts were used to reach further officials and solicit information or money; number of victims not disclosed.","response":"FBI advised independent verification, MFA, family code words and reporting to IC3.","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"FBI IC3 PSA","url":"https://www.ic3.gov/PSA/2025/PSA250515"},{"name":"BleepingComputer","url":"https://bleepingcomputer.com/news/security/fbi-us-officials-targeted-in-voice-deepfake-attacks-since-april"}]},{"id":"aliyun-ai-labs-pypi-pickle","date":"2025-05-22","title":"PyPI packages posing as Alibaba AI Labs SDK hide infostealer in PyTorch model","category":"AI supply chain","direction":"on-ai","severity":"high","country":"CN","region":"Asia-Pacific","target":"Developers using Alibaba Cloud AI Labs services","loss_usd":null,"summary":"Packages aliyun-ai-labs-snippets-sdk, ai-labs-snippets-sdk and aliyun-ai-labs-sdk shipped a model.pt whose pickle payload collected host details and .gitconfig and sent them to an Alibaba Cloud OSS bucket; about 1,600 downloads.","source":"JFrog Security Research","url":"https://research.jfrog.com/post/malicious-ai-models-hit-pypi/","actor":"PyPI account 'ai-aliyun'","actor_type":"criminal","attribution":"Published by the PyPI user ai-aliyun imitating Alibaba's Aliyun brand; ReversingLabs noted checks for AliMeeting data suggesting developers in China were the targets","motive":"Developer identity and infrastructure reconnaissance, likely as a first stage for further intrusion","vector":"Fake SDK packages on PyPI whose import loads a PyTorch pickle that decodes base64 Python and exfiltrates data to aksjdbajkb2jeblad.oss-cn-hongkong.aliyuncs.com","root_cause":"Pickle-based model files execute code on load; package registries do not inspect embedded ML artefacts","timeline":[{"date":"2025-05-19","event":"Packages appear on PyPI and are available for less than 24 hours"},{"date":"2025-05-22","event":"JFrog publishes analysis of the model-embedded payload"},{"date":"2025-05-28","event":"ReversingLabs reports about 1,600 total downloads and the AliMeeting targeting"}],"impact":"Roughly 1,600 downloads; victims' IP, username, system information and Git configuration were exfiltrated","response":"Packages removed from PyPI; JFrog, ReversingLabs and OpenSSF published malicious-package records and indicators","status":"resolved","cve":null,"verification":"confirmed","sources":[{"name":"JFrog Security Research","url":"https://research.jfrog.com/post/malicious-ai-models-hit-pypi/"},{"name":"Hackread","url":"https://hackread.com/malware-ai-models-pypi-targets-alibaba-ai-labs-users/"},{"name":"OSV MAL-2025-5096","url":"https://osv.dev/vulnerability/MAL-2025-5096"}]},{"id":"gitlab-duo-hidden-prompt","date":"2025-05-22","title":"GitLab Duo prompt injection leaks private source code via hidden merge request text","category":"Prompt injection","direction":"on-ai","severity":"medium","country":"US","region":"North America","target":"GitLab Duo AI assistant","loss_usd":null,"summary":"Legit Security showed prompts hidden with Unicode smuggling, Base16 or white KaTeX text in merge requests and issues could make GitLab Duo exfiltrate private code and inject HTML into its responses. GitLab patched it.","source":"Legit Security","url":"https://www.legitsecurity.com/blog/remote-prompt-injection-in-gitlab-duo","actor":"Legit Security research team","actor_type":"researcher","attribution":"Reported to GitLab on 12 February 2025 and fixed before disclosure","motive":"Security research","vector":"Indirect prompt injection in project content Duo reads; streamed markdown rendered as HTML enabled script and image-based exfiltration","root_cause":"Duo ingested full page context including comments and descriptions as instructions, and rendered output as HTML before sanitisation","timeline":[{"date":"2025-02-12","event":"Legit Security reports the issues to GitLab"},{"date":"2025-05","event":"GitLab ships fixes"},{"date":"2025-05-22","event":"Public disclosure"}],"impact":"Potential leak of private source code and malicious package suggestions to developers; no exploitation reported","response":"GitLab addressed the rendering and injection issues","status":"patched","cve":null,"verification":"confirmed","sources":[{"name":"Legit Security","url":"https://www.legitsecurity.com/blog/remote-prompt-injection-in-gitlab-duo"},{"name":"The Hacker News","url":"https://thehackernews.com/2025/05/gitlab-duo-vulnerability-enabled.html"},{"name":"TechRepublic","url":"https://www.techrepublic.com/article/news-gitlab-duo-vulnerability-hidden-prompts/"}]},{"id":"lovable-rls-cve-2025-48757","date":"2025-05-29","title":"Lovable-built apps leak user data: 303 endpoints across 170 projects lacked row-level security","category":"Model & data leak","direction":"on-ai","severity":"high","country":"SE","region":"Europe","target":"Apps generated by the Lovable AI app builder","loss_usd":null,"summary":"Researcher Matt Palmer found Lovable-generated Supabase backends shipped without working row-level security, letting anyone read or write tables; a scan of 1,645 apps found 170 exposing emails, phones, payment data and API keys.","source":"Superblocks analysis of CVE-2025-48757","url":"https://www.superblocks.com/blog/lovable-rls-breach","actor":"Matt Palmer (researcher); exposure caused by generated-code defaults","actor_type":"researcher","attribution":"Discovered and disclosed by researcher Matt Palmer; Lovable disputed the CVE, arguing customers are responsible for securing their own data","motive":"Security research and coordinated disclosure","vector":"Direct queries to Supabase REST endpoints using the public anon key embedded in generated front ends, bypassing missing or ineffective RLS policies","root_cause":"AI-generated backends defaulted to no effective row-level security and Lovable's later scanner only checked that a policy existed, not that it blocked unauthorized access","timeline":[{"date":"2025-01","event":"Palmer first notices the issue on a Lovable-built site"},{"date":"2025-03-21","event":"Palmer reports the flaw to Lovable with proof-of-concept examples"},{"date":"2025-04-14","event":"A Palantir engineer publicly posts an exploit; Palmer starts a 45-day disclosure window"},{"date":"2025-04-24","event":"Lovable 2.0 ships with a security scan feature"},{"date":"2025-05-29","event":"CVE-2025-48757 published; Lovable marks it disputed"}],"impact":"170 of 1,645 scanned apps (303 endpoints) exposed usernames, emails, phone numbers, subscription and payment status and third-party API keys; public exploit reportedly revealed debt amounts and home addresses","response":"Lovable added a security review tool and API-key warnings but disputed the CVE and published no post-mortem; researchers criticised the scanner as giving a false sense of security","status":"unresolved","cve":"CVE-2025-48757","verification":"disputed","sources":[{"name":"Superblocks","url":"https://www.superblocks.com/blog/lovable-rls-breach"},{"name":"SentinelOne CVE database","url":"https://www.sentinelone.com/vulnerability-database/cve-2025-48757/"},{"name":"Cyber Security News","url":"https://cybersecuritynews.com/lovable-security-vulnerability/"},{"name":"Superblocks (vulnerability write-up)","url":"https://superblocks.com/blog/lovable-vulnerabilities"},{"name":"Gigazine","url":"https://gigazine.net/gsc_news/en/20250602-loveable-ai-made-service-vulnerability"},{"name":"Vibe App Scanner","url":"https://vibeappscanner.com/lovable-vulnerability-cve-2025-48757"}]},{"id":"open-webui-sysdig-cryptojacking","date":"2025-06-02","title":"Exposed Open WebUI instance hijacked to run AI-generated cryptominer and infostealer","category":"LLMjacking","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"Internet-exposed Open WebUI deployment","loss_usd":null,"summary":"Sysdig observed an attacker abuse an Open WebUI server exposed with admin rights and no login, uploading an obfuscated, partly AI-written Python Tool that deployed XMRig and T-Rex miners on Linux and Java infostealers on Windows.","source":"Sysdig Threat Research Team","url":"https://www.sysdig.com/blog/attacker-exploits-misconfigured-ai-tool-to-run-ai-generated-payload","actor":"Unknown","actor_type":"criminal","attribution":"Unattributed; Sysdig judged the Python payload mostly AI-generated with some human-written parts and noted Discord webhook C2","motive":"Cryptomining and credential theft on compromised infrastructure","vector":"Open WebUI Tools plugin feature used to upload and execute a Python script obfuscated through 64 layers of reversed compressed base64","root_cause":"Self-hosted AI interface exposed to the internet with administrator privileges and authentication disabled","timeline":[{"date":"2025-05","event":"Sysdig runtime detections flag miner traffic and LD_PRELOAD process hiding on a customer training system"},{"date":"2025-06-02","event":"Sysdig publishes the investigation of the AI-generated payload"},{"date":"2025-06-03","event":"Wiz adds the case to its cloud threat landscape as an Open WebUI cryptojacking incident"}],"impact":"Compromised host mined Monero and Kawpow with hidden processes and systemd persistence; Windows stage stole Chrome extension data and Discord tokens with sandbox evasion","response":"Detected at runtime via YARA and behavioral rules; Sysdig advised keeping AI interfaces off the public internet and enforcing authentication","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"Sysdig","url":"https://www.sysdig.com/blog/attacker-exploits-misconfigured-ai-tool-to-run-ai-generated-payload"},{"name":"Wiz Cloud Threat Landscape","url":"https://threats.wiz.io/all-incidents/open-webui-misconfiguration-exploited-for-cryptojacking"}]},{"id":"openai-scopecreep-malware","date":"2025-06-09","title":"ScopeCreep: Russian-speaking actor built Windows malware with ChatGPT throwaway accounts","category":"AI-assisted malware","direction":"with-ai","severity":"high","country":"GL","region":"Global","target":"Gamers downloading a trojanized gaming tool","loss_usd":null,"summary":"A Russian-speaking group used temporary ChatGPT accounts, one per code change, to build modular Windows malware with DLL sideloading, obfuscation, credential theft and Telegram alerts, spread via a trojanized game tool.","source":"OpenAI","url":"https://cdn.openai.com/threat-intelligence-reports/5f73af09-a3a3-4a55-992e-069237681620/disrupting-malicious-uses-of-ai-june-2025.pdf","actor":"ScopeCreep (Russian-speaking)","actor_type":"criminal","attribution":"OpenAI named the operation ScopeCreep and assessed the operators as Russian-speaking.","motive":"Credential theft and financial gain","vector":"Iterative malware development through disposable ChatGPT accounts; distribution via a trojanized gaming tool","root_cause":"Account-per-request opsec defeated per-account abuse detection until behaviour clustering caught it","timeline":[{"date":"2025-06","event":"Security press reports the trojanized gaming tool and malware repository takedown"},{"date":"2025-06-09","event":"OpenAI bans the accounts; partners take down the malicious code repository"}],"impact":"Working malware with stealthy C2; OpenAI said impact may have been mitigated by fast reporting.","response":"Accounts banned, repository removed by industry partners, indicators shared.","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"OpenAI June 2025 report PDF","url":"https://cdn.openai.com/threat-intelligence-reports/5f73af09-a3a3-4a55-992e-069237681620/disrupting-malicious-uses-of-ai-june-2025.pdf"},{"name":"Security Affairs coverage","url":"https://securityaffairs.com/178797/intelligence/openai-bans-chatgpt-accounts-linked-to-russian-chinese-cyber-ops.html"},{"name":"TechRadar coverage","url":"https://www.techradar.com/pro/security/openai-says-it-disrupted-at-least-10-malicious-ai-campaigns-already-this-year"}]},{"id":"openai-vague-focus","date":"2025-06-09","title":"VAGue Focus: China-linked accounts used ChatGPT to social-engineer US officials and press","category":"AI phishing","direction":"with-ai","severity":"medium","country":"US","region":"North America","target":"US senator's office, journalists and researchers","loss_usd":null,"summary":"Accounts active in mainland Chinese business hours posed as staff of Focus Lens News, BrightWave Media Europe and Visionary Advisory Group, translating social-engineering messages and polishing letters to a US senator.","source":"OpenAI","url":"https://openai.com/index/disrupting-malicious-uses-of-ai-vague-focus","actor":"VAGue Focus network (China-linked)","actor_type":"unknown","attribution":"OpenAI assessed Chinese-language, China-hours activity; state sponsorship not asserted.","motive":"Intelligence collection and influence through social engineering","vector":"LLM translation and drafting of pretext messages from fake media and advisory personas","root_cause":"Persona-based outreach is indistinguishable from legitimate PR without behavioural clustering","timeline":[{"date":"2025-06","event":"Translated messages posted as replies to journalists and researchers on social media"},{"date":"2025-06-09","event":"OpenAI publishes the VAGue Focus case and bans the accounts"}],"impact":"Messages posted to journalists on social media; whether senator correspondence was sent is unconfirmed.","response":"Accounts banned; OpenAI judged the hacking questions low-sophistication.","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"OpenAI VAGue Focus case study","url":"https://openai.com/index/disrupting-malicious-uses-of-ai-vague-focus"},{"name":"OpenAI June 2025 report PDF","url":"https://cdn.openai.com/threat-intelligence-reports/5f73af09-a3a3-4a55-992e-069237681620/disrupting-malicious-uses-of-ai-june-2025.pdf"}]},{"id":"openai-vixen-keyhole-panda","date":"2025-06-09","title":"OpenAI bans APT15 and APT5 accounts using ChatGPT for pentest automation and US recon","category":"State actor AI ops","direction":"with-ai","severity":"medium","country":"US","region":"North America","target":"US defence and telecom infrastructure","loss_usd":null,"summary":"Chinese state groups Vixen Panda (APT15) and Keyhole Panda (APT5) used ChatGPT for script edits, system configuration, pentest automation and Android social-media tooling while researching US defence and telecom targets.","source":"OpenAI","url":"https://cdn.openai.com/threat-intelligence-reports/5f73af09-a3a3-4a55-992e-069237681620/disrupting-malicious-uses-of-ai-june-2025.pdf","actor":"Vixen Panda (APT15) and Keyhole Panda (APT5)","actor_type":"state","attribution":"OpenAI attributed the accounts to the two China-nexus groups with industry input.","motive":"Espionage against US infrastructure","vector":"LLM assistance across reconnaissance, tooling and automation stages","root_cause":"Productivity use of a public model by state operators; no capability beyond public tools","timeline":[{"date":"2025-06","event":"Press coverage notes four of ten June 2025 cases likely originated in China"},{"date":"2025-06-09","event":"OpenAI publishes the case and bans the linked accounts"}],"impact":"Incremental uplift only, per OpenAI; targeting of US defence and telecom sectors confirmed.","response":"Accounts banned; findings shared with partners.","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"OpenAI June 2025 report PDF","url":"https://cdn.openai.com/threat-intelligence-reports/5f73af09-a3a3-4a55-992e-069237681620/disrupting-malicious-uses-of-ai-june-2025.pdf"},{"name":"Security Affairs coverage","url":"https://securityaffairs.com/178797/intelligence/openai-bans-chatgpt-accounts-linked-to-russian-chinese-cyber-ops.html"}]},{"id":"openai-wrong-number-task-scam","date":"2025-06-09","title":"Wrong Number: Cambodia task scam used ChatGPT to translate SMS lures into six languages","category":"AI phishing","direction":"with-ai","severity":"medium","country":"GB","region":"Europe","target":"UK mobile users recruited via SMS, WhatsApp and Telegram","loss_usd":null,"summary":"A centralised Cambodia-based operation generated recruitment-style messages in six languages offering pay for trivial tasks, routing responders from SMS to WhatsApp to a Telegram mentor; one lure hit an OpenAI staffer.","source":"OpenAI","url":"https://openai.com/index/disrupting-malicious-uses-of-ai-wrong-number","actor":"Unknown Cambodia-based scam operation","actor_type":"criminal","attribution":"OpenAI assessed the operation as likely originating in Cambodia; entities not independently verified.","motive":"Task-scam fraud","vector":"Translation between Chinese and victim languages for SMS and chat lures","root_cause":"Scam centres embedding LLM translation into existing workflows","timeline":[{"date":"2025-06","event":"Lure SMS sent to UK numbers, one belonging to an OpenAI investigator"},{"date":"2025-06-09","event":"OpenAI publishes the Wrong Number case and bans the accounts"}],"impact":"Scam reach extended to UK numbers; losses not quantified.","response":"Accounts banned; indicators shared with partners.","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"OpenAI Wrong Number case study","url":"https://openai.com/index/disrupting-malicious-uses-of-ai-wrong-number"},{"name":"OpenAI June 2025 report PDF","url":"https://cdn.openai.com/threat-intelligence-reports/5f73af09-a3a3-4a55-992e-069237681620/disrupting-malicious-uses-of-ai-june-2025.pdf"}]},{"id":"stockholm-police-doctor-deepfake-ads","date":"2025-06-09","title":"Stockholm police warn of AI deepfakes of Anders Tegnell and Agnes Wold in card-theft ads","category":"Deepfake fraud","direction":"with-ai","severity":"medium","country":"SE","region":"Europe","target":"Swedish consumers","loss_usd":null,"summary":"Stockholm County Police reported multiple complaints since late May 2025 about social media ads using AI to imitate well-known doctors in fake health product promotions that harvested card details.","source":"Polisen (Swedish Police)","url":"https://polisen.se/aktuellt/nyheter/stockholm/2025/juni/aibedragerier/","actor":"Unknown","actor_type":"criminal","attribution":"Unknown.","motive":"Card data theft and unauthorised charges.","vector":"Deepfake videos of former state epidemiologist Anders Tegnell and professor Agnes Wold in social media ads leading to fraudulent shops that captured card details.","root_cause":"Trusted public health figures impersonated with AI on ad platforms lacking advertiser verification.","timeline":[{"date":"2025-05-25","event":"Deepfake doctor ads begin circulating on social media"},{"date":"2025-06-09","event":"Stockholm police publish warning about AI scams on social media"}],"impact":"Several reported victims had card details stolen and faced large unauthorised charges; no total loss figure published.","response":"Police issued a public warning; impersonated doctors complained publicly.","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"Polisen","url":"https://polisen.se/aktuellt/nyheter/stockholm/2025/juni/aibedragerier/"},{"name":"Dagens Nyheter","url":"https://www.dn.se/sverige/bedragare-utnyttjar-kanda-lakare-for-att-lura-svenskar/"},{"name":"AI Incident Database","url":"https://incidentdatabase.ai/cite/1242/"}]},{"id":"echoleak-m365-copilot","date":"2025-06-11","title":"EchoLeak: zero-click prompt injection in Microsoft 365 Copilot (CVE-2025-32711)","category":"Prompt injection","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"Microsoft 365 Copilot","loss_usd":null,"summary":"Aim Security showed a crafted email could make M365 Copilot silently exfiltrate tenant data with no clicks; Microsoft fixed it server-side, CVSS 9.3, no in-the-wild abuse reported.","source":"SOC Prime","url":"https://socprime.com/blog/cve-2025-32711-zero-click-ai-vulnerability/","actor":"Security researchers at Aim Security (responsible disclosure)","actor_type":"researcher","attribution":"Self-disclosed by Aim Security; vulnerability confirmed and rated critical by Microsoft (MSRC)","motive":"Security research; no malicious exploitation reported","vector":"Indirect prompt injection via a crafted inbound email that Copilot ingests through RAG, exfiltrating data via an allowlisted Teams image proxy while bypassing the XPIA classifier and link redaction","root_cause":"LLM scope violation: untrusted email content could steer Copilot into reading privileged tenant data and emitting it in outbound requests without user interaction","timeline":[{"date":"2025-01","event":"Aim Security discovers the zero-click chain and reports it to Microsoft"},{"date":"2025-05","event":"Microsoft deploys a server-side fix (some reports place final remediation in June)"},{"date":"2025-06-11","event":"CVE-2025-32711 published (CVSS 9.3); Aim Security publishes EchoLeak research"}],"impact":"Proof-of-concept only: could silently exfiltrate emails, files and chat context from a Microsoft 365 tenant; no evidence of in-the-wild exploitation","response":"Microsoft fixed the issue server-side with no customer action required and assigned a critical CVE; Aim criticised the roughly five-month remediation time","status":"patched","cve":"CVE-2025-32711","verification":"confirmed","sources":[{"name":"SOC Prime","url":"https://socprime.com/blog/cve-2025-32711-zero-click-ai-vulnerability/"},{"name":"The Hacker News","url":"https://thehackernews.com/2025/06/zero-click-ai-vulnerability-exposes.html"},{"name":"Hack The Box","url":"https://www.hackthebox.com/blog/cve-2025-32711-echoleak-copilot-vulnerability"}]},{"id":"meta-ai-discover-feed","date":"2025-06-12","title":"Meta AI app's Discover feed broadcasts users' private medical and legal chats","category":"Model & data leak","direction":"on-ai","severity":"medium","country":"US","region":"North America","target":"Meta AI app users","loss_usd":null,"summary":"The Meta AI app's public Discover feed showed conversations users appeared to have shared by accident, including medical, financial and legal details, because the share flow gave no clear warning. Meta added a warning.","source":"Business Insider / Mozilla Foundation","url":"https://oecd.ai/en/incidents/2025-06-09-84d2","actor":"Meta (product design); users sharing unintentionally","actor_type":"accident","attribution":"Documented by journalists and the Mozilla Foundation; Meta said the feed was not a bug","motive":"None (feature design)","vector":"Share button that posted chats to a public feed without explicit visibility cues","root_cause":"Interface lacked clear indication that shared content was public","timeline":[{"date":"2025-06-09","event":"Reports of sensitive chats on the Discover feed"},{"date":"2025-06","event":"Mozilla launches campaign with over 10,000 signatures"},{"date":"2025-07-03","event":"Mozilla reports Meta added a mandatory warning screen before sharing"}],"impact":"Unknown number of users exposed private conversations and identities","response":"Meta added a warning step before sharing; feed remained","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"OECD AI Incidents Monitor","url":"https://oecd.ai/en/incidents/2025-06-09-84d2"},{"name":"Mozilla Foundation","url":"https://www.mozillafoundation.org/en/campaigns/meta-help-users-stop-accidentally-sharing-private-ai-conversations/"}]},{"id":"asana-mcp-cross-tenant","date":"2025-06-17","title":"Asana MCP server logic flaw exposed customer data across organisations for a month","category":"Model & data leak","direction":"on-ai","severity":"medium","country":"US","region":"North America","target":"Asana MCP server customers","loss_usd":null,"summary":"A logic bug in Asana's new MCP server, live from early May, could show tasks, project metadata, comments and files from other organisations to users of AI tools. Asana took it offline on 5 June and fixed it.","source":"Asana","url":"https://bleepingcomputer.com/news/security/asana-warns-mcp-ai-feature-exposed-customer-data-to-other-orgs","actor":"Asana (software defect)","actor_type":"accident","attribution":"Disclosed by Asana to affected customers; no attacker involved","motive":"None (bug)","vector":"Cross-tenant data retrieval through the MCP integration used by LLM clients","root_cause":"Logic flaw in tenant scoping of the MCP server","timeline":[{"date":"2025-05-01","event":"Asana launches its MCP server for AI integrations"},{"date":"2025-06-04","event":"Bug discovered"},{"date":"2025-06-05","event":"MCP server taken offline"},{"date":"2025-06-17","event":"Service restored with fix; customers notified"}],"impact":"Roughly 1,000 customers potentially affected; no confirmed unauthorised viewing","response":"Asana patched, reset MCP connections and offered logs to customers to review exposure","status":"resolved","cve":null,"verification":"confirmed","sources":[{"name":"BleepingComputer","url":"https://bleepingcomputer.com/news/security/asana-warns-mcp-ai-feature-exposed-customer-data-to-other-orgs"},{"name":"The Register","url":"https://theregister.com/2025/06/18/asana_mcp_server_bug/"},{"name":"UpGuard","url":"https://upguard.com/blog/asana-discloses-data-exposure-bug-in-mcp-server"}]},{"id":"langflow-flodrix","date":"2025-06-17","title":"Langflow AI agent builder RCE (CVE-2025-3248) exploited to spread Flodrix botnet","category":"AI supply chain","direction":"on-ai","severity":"critical","country":"GL","region":"Global","target":"Langflow servers","loss_usd":null,"summary":"After CISA added the unauthenticated Langflow code-injection flaw to KEV, attackers used public exploits on exposed AI workflow servers to install the Flodrix DDoS botnet.","source":"Trend Micro","url":"https://www.trendmicro.com/en_us/research/25/f/langflow-vulnerability-flodric-botnet.html","actor":"Unknown Flodrix botnet operators","actor_type":"criminal","attribution":"No public attribution; campaign documented by Trend Micro Research, exploitation confirmed by CISA KEV listing","motive":"Building a DDoS botnet; potential data theft from compromised AI servers","vector":"Unauthenticated code injection in the /api/v1/validate/code endpoint of Langflow, exploited with public PoCs to drop a 'docker' shell script that fetches Flodrix ELF binaries","root_cause":"Missing authentication and unsafe evaluation of user-supplied Python in the code-validation endpoint of Langflow versions before 1.3.0; many instances exposed to the internet unpatched","timeline":[{"date":"2025-03","event":"Langflow 1.3.0 released fixing CVE-2025-3248 (CVSS 9.8)"},{"date":"2025-05-05","event":"CISA adds CVE-2025-3248 to the Known Exploited Vulnerabilities catalog"},{"date":"2025-06-17","event":"Trend Micro publishes analysis of Flodrix botnet campaign exploiting exposed Langflow servers"}],"impact":"Full compromise of unpatched internet-exposed Langflow servers, enrolment into the Flodrix DDoS botnet and possible exposure of AI workflows and credentials; victim count not disclosed","response":"Langflow patched in v1.3.0; CISA mandated federal patching via KEV; Trend Micro published IOCs and urged upgrades and network isolation","status":"patched","cve":"CVE-2025-3248","verification":"confirmed","sources":[{"name":"Trend Micro","url":"https://www.trendmicro.com/en_us/research/25/f/langflow-vulnerability-flodric-botnet.html"},{"name":"SecurityWeek","url":"https://www.securityweek.com/recent-langflow-vulnerability-exploited-by-flodrix-botnet/"},{"name":"Dark Reading","url":"https://www.darkreading.com/vulnerabilities-threats/hackers-exploit-langflow-flaw-flodrix-botnet"}]},{"id":"wormgpt-grok-mixtral-variants","date":"2025-06-17","title":"Cato CTRL: new WormGPT variants are jailbroken wrappers on Grok and Mixtral","category":"AI-assisted malware","direction":"with-ai","severity":"medium","country":"GL","region":"Global","target":"Phishing and credential-theft victims of subscribers","loss_usd":null,"summary":"Cato CTRL obtained two WormGPT variants sold via Telegram and showed one runs on xAI Grok and the other on Mistral Mixtral with guardrail-stripping system prompts; both wrote phishing emails and credential stealers.","source":"Cato Networks CTRL","url":"https://www.catonetworks.com/blog/cato-ctrl-wormgpt-variants-powered-by-grok-and-mixtral/","actor":"keanu and xzin0vich (forum handles)","actor_type":"criminal","attribution":"Cato researcher Vitaly Simonovich extracted system prompt fragments identifying the underlying models; high confidence on model identity.","motive":"Subscription revenue from uncensored AI access, about 550 EUR per year or up to 5,000 EUR for private setups","vector":"Telegram chatbot wrappers around commercial LLM APIs with manipulated system prompts","root_cause":"Prompt-level guardrails on commercial models can be overridden by a hostile system prompt","timeline":[{"date":"2024-10-26","event":"Mixtral-based variant advertised on BreachForums"},{"date":"2025-02-25","event":"Grok-based variant advertised"},{"date":"2025-06-17","event":"Cato CTRL publishes findings; xAI and Mistral did not comment"}],"impact":"Working uncensored assistants available to paying criminals; direct victim counts not reported.","response":"Cato published the analysis; no provider action was reported at publication.","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"Cato Networks","url":"https://www.catonetworks.com/blog/cato-ctrl-wormgpt-variants-powered-by-grok-and-mixtral/"},{"name":"CyberScoop","url":"https://cyberscoop.com/uncensored-ai-tool-traced-to-mistral-xai-grok/"},{"name":"TechRepublic","url":"https://www.techrepublic.com/article/news-wormgpt-variants-ai-models-grok-mixtral/"}]},{"id":"pickai-comfyui-backdoor","date":"2025-06-18","title":"Pickai backdoor spreads through ComfyUI flaws to nearly 700 AI image servers","category":"AI supply chain","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"ComfyUI image-generation servers; Rubick.ai platform","loss_usd":null,"summary":"Qi'anxin XLab tracked a C++ backdoor delivered via ComfyUI vulnerabilities that disguised itself as config files, stole AI-related data and gave reverse shells; samples were also served from commercial AI vendor Rubick.ai's site.","source":"Qi'anxin XLab","url":"https://blog.xlab.qianxin.com/pickai-the_backdoor_hiding_in_your_ai_stack/","actor":"Unknown","actor_type":"criminal","attribution":"Unattributed; XLab traced distribution to IP 185.189.149.151 and six C2 servers and found early samples uploaded from Hong Kong","motive":"Remote access to AI infrastructure and theft of AI-related data","vector":"Exploitation of several high-risk ComfyUI vulnerabilities to drop ELF executables disguised as config.json and vim.json, with systemd and init.d persistence","root_cause":"Unpatched, internet-exposed ComfyUI instances; a compromised upstream AI vendor hosting the payloads","timeline":[{"date":"2025-02-28","event":"Early Pickai sample uploaded to VirusTotal from Hong Kong"},{"date":"2025-03-17","event":"XLab detects ComfyUI exploitation delivering Pickai and registers an unclaimed C2 domain"},{"date":"2025-05-03","event":"XLab notifies Rubick.ai that its site hosts Pickai payloads; no response"},{"date":"2025-05-27","event":"China's National Cybersecurity Notification Center warns ComfyUI flaws are being exploited"},{"date":"2025-06-18","event":"XLab publishes the Pickai report counting at least 695 infected servers"}],"impact":"At least 695 servers compromised, mainly in Germany, the United States and China; downstream risk to Rubick.ai e-commerce customers","response":"XLab sinkholed one C2 domain and published IOCs; Chinese authorities issued a warning; Rubick.ai did not respond to notification","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"Qi'anxin XLab","url":"https://blog.xlab.qianxin.com/pickai-the_backdoor_hiding_in_your_ai_stack/"},{"name":"Cyber Press","url":"https://cyberpress.org/hackers-compromise-700-comfyui-ai-image-generation-servers/"},{"name":"SC World","url":"https://www.scworld.com/brief/malware-distributed-via-comfyui-server-exploits"}]},{"id":"skynet-prompt-injection-malware","date":"2025-06-25","title":"Skynet malware sample embeds prompt injection to fool AI malware analysis tools","category":"Prompt injection","direction":"on-ai","severity":"low","country":"NL","region":"Europe","target":"LLM-based malware analysis pipelines","loss_usd":null,"summary":"Check Point found a half-finished Windows sample on VirusTotal with a string telling any analysing LLM to ignore instructions, act as a calculator and reply NO MALWARE DETECTED; it failed against o3 and GPT-4.1.","source":"Check Point Research","url":"https://research.checkpoint.com/2025/ai-evasion-prompt-injection/","actor":"Unknown","actor_type":"unknown","attribution":"Uploaded anonymously from the Netherlands in early June 2025; author unknown.","motive":"Evade AI-assisted detection and triage","vector":"Hardcoded natural-language prompt inside the binary alongside sandbox checks, Tor proxy and string obfuscation","root_cause":"AI analysis tools ingest attacker-controlled code as text, creating an injection surface","timeline":[{"date":"2025-06-05","event":"Sample uploaded to VirusTotal via web interface"},{"date":"2025-06-25","event":"Check Point publishes analysis after testing injection against OpenAI models"}],"impact":"No successful evasion observed; Check Point called it an early sign of malware targeting AI auditing tools.","response":"Check Point tested the injection and published the sample analysis as a warning to AI-tool builders.","status":"unresolved","cve":null,"verification":"confirmed","sources":[{"name":"Check Point Research","url":"https://research.checkpoint.com/2025/ai-evasion-prompt-injection/"},{"name":"GovInfoSecurity","url":"https://www.govinfosecurity.com/skynet-tries-to-outwit-ai-malware-analysis-a-28875"}]},{"id":"microsoft-jasper-sleet-ai-identities","date":"2025-06-30","title":"Microsoft: DPRK's Jasper Sleet IT workers use AI to forge IDs; 3,000 accounts suspended","category":"Deepfake fraud","direction":"with-ai","severity":"high","country":"US","region":"North America","target":"US companies hiring remote IT workers","loss_usd":null,"summary":"Microsoft reported DPRK remote IT workers (Jasper Sleet) use AI to swap faces into stolen ID documents, polish photos and resumes and test voice changers; it suspended 3,000 Outlook and Hotmail accounts they created.","source":"Microsoft Security Blog","url":"https://www.microsoft.com/en-us/security/blog/2025/06/30/jasper-sleet-north-korean-remote-it-workers-evolving-tactics-to-infiltrate-organizations/","actor":"Jasper Sleet (North Korean remote IT worker program)","actor_type":"state","attribution":"Microsoft Threat Intelligence attribution to North Korea; consistent with US DOJ indictments of DPRK IT workers and facilitators","motive":"Sanctions-evading revenue for the DPRK regime, with potential for data theft and extortion","vector":"AI-edited identity and employment documents, enhanced profile photos, stolen US identities and laptop farms to secure remote jobs","root_cause":"Remote hiring and identity checks that accept scanned documents and photos which generative tools can convincingly alter","timeline":[{"date":"2024-10","event":"Microsoft finds a public repository with worker photos, resumes, VPN guides and payment records"},{"date":"2025-01-03","event":"DOJ indicts two North Koreans and three facilitators who earned at least $866,255 from ten of 64 infiltrated US firms"},{"date":"2025-06-30","event":"Microsoft publishes Jasper Sleet report and suspends 3,000 accounts"},{"date":"2025-07-03","event":"The Record reports ZachXBT tracing over $16.5 million in crypto to known DPRK IT workers since January 2025"}],"impact":"Hundreds of jobs at US firms believed infiltrated; crypto payments averaging nearly $3 million per month traced to DPRK-linked workers in 2025","response":"Account suspensions, detection guidance for employers, coordination with DOJ actions against laptop farms in 16 states","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"Microsoft Security Blog","url":"https://www.microsoft.com/en-us/security/blog/2025/06/30/jasper-sleet-north-korean-remote-it-workers-evolving-tactics-to-infiltrate-organizations/"},{"name":"The Record","url":"https://therecord.media/microsoft-shuts-down-3000-north-korea-it-worker-email"}]},{"id":"mumbai-valueleaf-deepfake-stock-ads","date":"2025-07-01","title":"Mumbai cyber police bust Bengaluru agency running deepfake stock-expert ads","category":"Deepfake fraud","direction":"with-ai","severity":"medium","country":"IN","region":"Asia-Pacific","target":"Indian retail investors; impersonated market analysts","loss_usd":null,"summary":"After an analyst found deepfake videos of himself, Mumbai Cyber Police traced paid promotions run in July 2025 by Bengaluru firm Valueleaf, reportedly for Hong Kong client First Bridge, and arrested four in October.","source":"Lokmat Times","url":"https://www.lokmattimes.com/mumbai/mumbai-cyber-police-bust-chinese-backed-deepfake-share-trading-scam-a522/","actor":"Valueleaf staff; alleged client First Bridge (Hong Kong)","actor_type":"criminal","attribution":"Police reportedly described Chinese companies hiring Indian marketing firms for multi-crore ad contracts; four arrested including two engineers and an MBA graduate.","motive":"Drive investors to fraudulent share-trading schemes.","vector":"Deepfake videos of market experts distributed as paid Meta ads; after Meta flagged them, operators expanded ad accounts and moved domains to Dubai.","root_cause":"Ad-agency intermediaries ran synthetic endorsement campaigns without verifying consent.","timeline":[{"date":"2025-07-01","event":"Deepfake ads begin circulating as paid promotions"},{"date":"2025-07-18","event":"Videos removed after being flagged as misinformation"},{"date":"2025-10-18","event":"Four arrested in Bengaluru; remanded to police custody"}],"impact":"Reputations of named analysts misused; investor losses not quantified; police called it possibly India's first deepfake investment-fraud case.","response":"Case registered under BNS and IT Act; arrests and raid on Valueleaf office.","status":"under investigation","cve":null,"verification":"reported","sources":[{"name":"Lokmat Times","url":"https://www.lokmattimes.com/mumbai/mumbai-cyber-police-bust-chinese-backed-deepfake-share-trading-scam-a522/"},{"name":"AI Incident Database","url":"https://incidentdatabase.ai/cite/1235/"}]},{"id":"supabase-mcp-cursor-token-leak","date":"2025-07-06","title":"Support ticket prompt injection makes Cursor plus Supabase MCP dump integration tokens","category":"Prompt injection","direction":"on-ai","severity":"medium","country":"US","region":"North America","target":"Supabase MCP server used from Cursor","loss_usd":null,"summary":"General Analysis showed a support ticket with hidden instructions could make a Cursor agent, connected to Supabase via MCP with a service role, read the integration_tokens table and write the secrets into the ticket.","source":"General Analysis / Simon Willison","url":"https://simonwillison.net/2025/Jul/06/supabase-mcp-lethal-trifecta/","actor":"General Analysis","actor_type":"researcher","attribution":"Public proof of concept; Supabase responded with documentation and default changes","motive":"Security research","vector":"Indirect prompt injection in user-submitted ticket text processed by an agent with privileged database access and write capability","root_cause":"MCP connection ran as a role that bypassed row-level security and could both read private tables and write attacker-visible records","timeline":[ ipted rise"},{"date":"2025-05-15","event":"Deepfake ads and WhatsApp groups intensify"},{"date":"2025-07-06","event":"OST collapses nearly 93 percent to about $0.17"},{"date":"2025-07-07","event":"Israeli media report widespread losses"}],"impact":"Losses in the hundreds of thousands of shekels overall, including individual losses of 250,000 and 150,000 shekels.","response":"Authorities said to be pursuing perpetrators; Israeli Internet Association pushed for platform accountability legislation; Meta said it invests in detection.","status":"under investigation","cve":null,"verification":"reported","sources":[{"name":"Ynetnews","url":"https://www.ynetnews.com/business/article/hkzaj8krll"},{"name":"AI Incident Database","url":"https://incidentdatabase.ai/cite/1154"}]},{"id":"kenya-ruto-resignation-deepfakes","date":"2025-07-08","title":"AI videos of President Ruto resigning hit 1.4M views on TikTok during Kenya protests","category":"Deepfake fraud","direction":"with-ai","severity":"medium","country":"KE","region":"Middle East & Africa","target":"Kenyan public; President William Ruto","loss_usd":null,"summary":"During deadly protests, AI videos built on State House footage showed Ruto announcing his resignation; one TikTok clip drew over 1.4 million views before deletion and Africa Check rated the claims false.","source":"Africa Check","url":"https://africacheck.org/fact-checks/meta-programme-fact-checks/ignore-ai-generated-videos-used-falsely-claim-kenyan","actor":"Unknown","actor_type":"unknown","attribution":"No attribution; clips reused footage from June 2025 State House meetings.","motive":"Political disinformation amid unrest.","vector":"Lip-synced AI video dubbed over real presidential footage, spread on TikTok and Facebook.","root_cause":"Fast synthetic video generation during a volatile news event.","timeline":[{"date":"2025-06-27","event":"Fake resignation letter surfaces online"},{"date":"2025-07-07","event":"At least 10 killed in Nairobi protests; resignation videos spread"},{"date":"2025-07-08","event":"Africa Check and Africanews debunk the videos"}],"impact":"Millions of views of a false head-of-state announcement during a security crisis.","response":"Fact-check debunks; one video deleted by TikTok; no official statement reported.","status":"resolved","cve":null,"verification":"confirmed","sources":[{"name":"Africa Check","url":"https://africacheck.org/fact-checks/meta-programme-fact-checks/ignore-ai-generated-videos-used-falsely-claim-kenyan"},{"name":"Africanews","url":"https://www.africanews.com/2025/07/08/ai-videos-falsely-show-kenyan-president-resigning-following-deadly-protests/"}]},{"id":"rubio-ai-impersonation","date":"2025-07-08","title":"AI voice impersonator of Marco Rubio contacts foreign ministers via Signal","category":"Deepfake fraud","direction":"with-ai","severity":"high","country":"US","region":"North America","target":"US State Department / senior officials","loss_usd":null,"summary":"A State Department cable warned an impostor used AI-generated voice and text on Signal to pose as Secretary Rubio, contacting three foreign ministers, a governor and a member of Congress.","source":"Anchorage Daily News (Washington Post)","url":"https://www.adn.com/nation-world/2025/07/08/a-marco-rubio-impostor-is-using-ai-voice-to-call-high-level-officials/","actor":"Unknown impostor","actor_type":"unknown","attribution":"Not publicly attributed; State Department cable said identity unknown; FBI had warned in May 2025 of similar impersonation of senior US officials","motive":"Likely access to information or accounts of targeted officials (per State Department cable)","vector":"Signal account with display name Marco.Rubio@state.gov sending AI-generated voicemails and text messages mimicking Rubio's voice and writing style","root_cause":"Public availability of Rubio's voice samples for cloning; reliance on consumer messaging apps where identity is unverified","timeline":[{"date":"2025-05","event":"FBI warns of AI voice and text campaigns impersonating senior US officials"},{"date":"2025-06","event":"Impostor contacts three foreign ministers, a US governor and a member of Congress via Signal in mid-June"},{"date":"2025-07-03","event":"State Department cable alerts diplomatic posts to the impersonation"},{"date":"2025-07-08","event":"Washington Post and Reuters report the cable publicly"}],"impact":"At least five non-Department individuals contacted; no confirmed compromise of information or accounts was publicly reported","response":"State Department opened an investigation, warned partners about fake accounts and advised officials to report impersonation attempts to Diplomatic Security","status":"under investigation","cve":null,"verification":"confirmed","sources":[{"name":"Anchorage Daily News (Washington Post)","url":"https://www.adn.com/nation-world/2025/07/08/a-marco-rubio-impostor-is-using-ai-voice-to-call-high-level-officials/"},{"name":"KSL (Reuters)","url":"https://www.ksl.com/article/news/politics/rubio-impersonator-using-ai-contacted-foreign-ministers-cable-says/51342064"},{"name":"Yahoo News","url":"https://www.yahoo.com/news/fake-ai-voice-impersonating-secretary-131407943.html"}]},{"id":"mchire-paradox-exposure","date":"2025-07-09","title":"McDonald's McHire AI hiring bot exposed up to 64M applicant records via '123456' login","category":"Model & data leak","direction":"on-ai","severity":"high","country":"US","region":"North America","target":"McDonald's / Paradox.ai","loss_usd":null,"summary":"Researchers accessed the admin panel of the Olivia hiring chatbot with default 123456 credentials and an IDOR flaw, exposing chat logs and contact data tied to up to 64M applications.","source":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/123456-password-exposed-chats-for-64-million-mcdonalds-job-chatbot-applications","actor":"Security researchers Ian Carroll and Sam Curry (responsible disclosure)","actor_type":"researcher","attribution":"Self-disclosed by the researchers; confirmed by Paradox.ai and McDonald's","motive":"Security research; no malicious access reported","vector":"Default credentials 123456/123456 on a Paradox.ai test franchise account in the McHire admin portal, plus an IDOR on an internal API allowing lead_id enumeration","root_cause":"Unchanged default test credentials on a production-connected admin portal and missing authorisation checks on an applicant-data API","timeline":[{"date":"2025-06-30","event":"Researchers find the flaws and report to Paradox.ai and McDonald's"},{"date":"2025-06-30","event":"Default credentials disabled and IDOR fixed the same day, per McDonald's and Paradox.ai"},{"date":"2025-07-09","event":"Public disclosure via Wired and BleepingComputer; Paradox.ai announces a bug bounty programme"}],"impact":"Names, emails, phone numbers, addresses and chatbot transcripts tied to up to 64 million McHire applications were reachable; Paradox said only the researchers accessed a portion of records","response":"Paradox.ai and McDonald's fixed the issues the day they were reported; Paradox launched a vulnerability disclosure bounty programme","status":"patched","cve":null,"verification":"confirmed","sources":[{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/123456-password-exposed-chats-for-64-million-mcdonalds-job-chatbot-applications"},{"name":"CSO Online","url":"https://www.csoonline.com/article/4020919/mcdonalds-ai-hiring-tools-password-123456-exposes-data-of-64m-applicants.html"},{"name":"Cyber Daily","url":"https://www.cyberdaily.au/security/12382-not-lovin-it-mcdonalds-hiring-backend-exposes-64m-chatbot-job-discussions"}]},{"id":"cursor-solidity-extension-theft","date":"2025-07-10","title":"Fake 'Solidity Language' extension on Open VSX drains $500K from Cursor developer","category":"AI supply chain","direction":"on-ai","severity":"high","country":"RU","region":"Europe","target":"Cursor IDE users installing Solidity extensions","loss_usd":500000,"summary":"A spoofed Solidity extension on Open VSX, ranked above the real one through inflated downloads, ran a PowerShell script that installed ScreenConnect, Quasar RAT and a stealer, letting attackers take a developer's seed phrases and about 500,000 dollars in crypto.","source":"Kaspersky","url":"https://www.kaspersky.com/about/press-releases/kaspersky-uncovers-500k-crypto-heist-through-malicious-packages-targeting-cursor-developers","actor":"Unknown","actor_type":"criminal","attribution":"Unattributed; Kaspersky later linked related extensions (solaibot, among-eth, blankebesxstnion) and the npm package solsafe; Koi Security tied the activity to the WhiteCobra crew in September 2025","motive":"Cryptocurrency theft","vector":"Malicious VSIX extension in the Open VSX registry used by Cursor, with download counts inflated to 54,000 and later 2 million to outrank the legitimate extension","root_cause":"AI editors rely on Open VSX, which lacks the vetting of the Visual Studio Marketplace, and ranking can be gamed with fake install counts","timeline":[{"date":"2025-06","event":"Russian blockchain developer asks Kaspersky to investigate after losing crypto"},{"date":"2025-07-02","event":"Open VSX removes 'Solidity Language' after Kaspersky's report"},{"date":"2025-07-03","event":"Attacker republishes a near-identical 'solidity' extension with an inflated install count"},{"date":"2025-07-10","event":"Kaspersky publishes findings and requests removal of the second extension"}],"impact":"About 500,000 dollars in cryptocurrency stolen from one developer; the extension had tens of thousands of claimed installs, so additional victims are possible","response":"Open VSX removed the extensions on request; Kaspersky published IOCs and warned Cursor and Windsurf users about unvetted marketplace extensions","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"Kaspersky","url":"https://www.kaspersky.com/about/press-releases/kaspersky-uncovers-500k-crypto-heist-through-malicious-packages-targeting-cursor-developers"},{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/malicious-vscode-extension-in-cursor-ide-led-to-500k-crypto-theft/"},{"name":"SC World","url":"https://www.scworld.com/news/fake-visual-studio-code-extension-for-cursor-led-to-500k-theft"}]},{"id":"gemini-gmail-summary-phishing","date":"2025-07-10","title":"Hidden email text makes Gemini for Workspace summaries deliver fake security alerts","category":"Prompt injection","direction":"on-ai","severity":"medium","country":"US","region":"North America","target":"Google Gemini for Workspace (Gmail summaries)","loss_usd":null,"summary":"Mozilla 0din's Marco Figueroa showed white-on-white or zero-size text in an email could make Gemini's Summarize this email feature append a fake Google warning with an attacker phone number. Google acknowledged it.","source":"Mozilla 0din","url":"https://bleepingcomputer.com/news/security/google-gemini-flaw-hijacks-email-summaries-for-phishing","actor":"Marco Figueroa (Mozilla 0din)","actor_type":"researcher","attribution":"Disclosed through Mozilla's 0din GenAI bug bounty programme","motive":"Security research","vector":"Indirect prompt injection via hidden HTML and CSS in email body; no links or attachments needed","root_cause":"Summariser treated hidden email content as instructions","timeline":[{"date":"2025-07-10","event":"0din publishes the proof of concept"},{"date":"2025-07","event":"Google says it runs red-teaming and has deployed defences"}],"impact":"Enables phishing that bypasses spam filters by riding on trusted AI summaries; no abuse confirmed","response":"Google acknowledged the issue and cited layered prompt-injection mitigations","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"BleepingComputer","url":"https://bleepingcomputer.com/news/security/google-gemini-flaw-hijacks-email-summaries-for-phishing"},{"name":"Tom's Hardware","url":"https://www. z nor xAI commented; researchers questioned DOGE's handling of far more sensitive data","status":"resolved","cve":null,"verification":"confirmed","sources":[{"name":"KrebsOnSecurity","url":"https://krebsonsecurity.com/2025/07/doge-denizen-marko-elez-leaked-api-key-for-xai/"},{"name":"TechRadar","url":"https://www.techradar.com/pro/security/doge-employee-with-sensitive-database-access-leaks-private-xai-api-key"},{"name":"Quartz","url":"https://qz.com/doge-staffer-xai-leak-elon-musk-marko-elez"}]},{"id":"global-group-ai-negotiator","date":"2025-07-15","title":"GLOBAL GROUP RaaS deploys AI chatbot negotiators to press seven-figure ransoms","category":"AI-assisted malware","direction":"with-ai","severity":"high","country":"US","region":"North America","target":"17 victims incl. US and Australian healthcare, UK industry","loss_usd":null,"summary":"EclecticIQ found the BlackLock rebrand GLOBAL GROUP running an AI-driven chatbot in its ransom negotiation panel so non-English affiliates could pressure victims; one affiliate demanded 1 million USD within 48 hours.","source":"EclecticIQ","url":"https://blog.eclecticiq.com/global-group-emerging-ransomware-as-a-service","actor":"GLOBAL GROUP (actor $$$, ex-BlackLock and Mamona)","actor_type":"criminal","attribution":"EclecticIQ, medium confidence that GLOBAL GROUP is a BlackLock rebrand and high confidence that $$$ runs it, based on shared mutex, infrastructure and qTOX name change.","motive":"Financial extortion with 80 percent affiliate payouts","vector":"Initial access brokers selling edge-appliance and RDP access, Go-based multi-platform encryptor, AI chatbot negotiation portal","root_cause":"AI negotiation automation removed language barriers for affiliates and scaled extortion pressure","timeline":[{"date":"2025-06-02","event":"GLOBAL GROUP promoted on Ramp4u forum"},{"date":"2025-06-26","event":"Group announces GLOBAL RaaS officially released"},{"date":"2025-07-14","event":"Victim count reaches 17 across US, UK, Australia and Brazil"},{"date":"2025-07-15","event":"EclecticIQ publishes analysis"}],"impact":"17 claimed victims in six weeks, mostly healthcare; ransom demands up to 1 million USD.","response":"EclecticIQ published indicators; no law enforcement action reported.","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"EclecticIQ","url":"https://blog.eclecticiq.com/global-group-emerging-ransomware-as-a-service"},{"name":"The Hacker News","url":"https://thehackernews.com/2025/07/newly-emerged-global-group-raas-expands.html"},{"name":"Axios","url":"https://www.axios.com/2025/07/29/ransomware-gang-ai-chatbot-negotiate"}]},{"id":"meta-ai-prompt-idor","date":"2025-07-15","title":"Meta AI bug let any logged-in user read other people's private prompts and replies","category":"Model & data leak","direction":"on-ai","severity":"medium","country":"US","region":"North America","target":"Meta AI chatbot","loss_usd":null,"summary":"AppSecure's Sandeep Hodkasia found that changing the guessable ID of an edited prompt returned another user's prompt and reply because Meta skipped authorisation checks. Meta fixed it in January 2025 and paid $10,000.","source":"TechCrunch","url":"https://techcrunch.com/2025/07/15/meta-fixes-bug-that-could-leak-users-ai-prompts-and-generated-content","actor":"Sandeep Hodkasia (AppSecure)","actor_type":"researcher","attribution":"Responsible disclosure via Meta bug bounty; Meta found no evidence of abuse","motive":"Security research","vector":"Insecure direct object reference on prompt IDs in browser traffic","root_cause":"Missing authorisation check on prompt retrieval endpoint","timeline":[{"date":"2024-12-26","event":"Bug reported to Meta"},{"date":"2025-01-24","event":"Meta deploys a fix"},{"date":"2025-07-15","event":"Public disclosure"}],"impact":"Private prompts and generated content could be scraped at scale; no abuse found","response":"Meta patched the endpoint and rewarded the researcher","status":"patched","cve":null,"verifica
