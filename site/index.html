</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap">
<style>
  /* Layout: advisory-desk console. Top bar with views and language; map left, sticky dossier right; stacks under 960px. */
  :root {
    --bg: #edf0f3; --surface: #ffffff; --ink: #15212c; --muted: #586674; --line: #d4dbe2;
    --ocean: #e2e8ee; --land: #c8d1da; --land-hit: #9fb0c1; --accent: #1e4f7c; --accent-ink: #ffffff;
    --crit: #bf2a30; --high: #cc6418; --med: #9c7c08; --low: #6a7683; --pin-ink: #ffffff; --up: #1f7a4d; --down: #bf2a30;
    --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e151c; --surface: #16202a; --ink: #e4eaf0; --muted: #93a1ae; --line: #283643;
      --ocean: #121b24; --land: #283542; --land-hit: #44576b; --accent: #82b2df; --accent-ink: #0e151c;
      --crit: #ff5d62; --high: #ff9a4c; --med: #e0bf47; --low: #8e9aa7; --pin-ink: #0e151c; --up: #4fc384; --down: #ff5d62; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e151c; --surface: #16202a; --ink: #e4eaf0; --muted: #93a1ae; --line: #283643;
    --ocean: #121b24; --land: #283542; --land-hit: #44576b; --accent: #82b2df; --accent-ink: #0e151c;
    --crit: #ff5d62; --high: #ff9a4c; --med: #e0bf47; --low: #8e9aa7; --pin-ink: #0e151c; --up: #4fc384; --down: #ff5d62; color-scheme: dark;
  }
  html[lang="ar"] { --f-body: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif; --f-display: "IBM Plex Sans Arabic", system-ui, sans-serif; }
  html[lang="zh"] { --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; --f-display: "Noto Sans SC", "PingFang SC", system-ui, sans-serif; }
  body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 1320px; margin: 0 auto; padding-inline: clamp(16px, 3vw, 32px); padding-block: 16px 40px; display: grid; gap: 20px; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
  .brand { font-family: var(--f-display); font-weight: 600; font-size: 20px; letter-spacing: -.01em; display: inline-flex; align-items: center; gap: 8px; }
  .brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--crit); }
  @media (prefers-reduced-motion: no-preference) { .brand i { animation: ping2 2.4s ease-out infinite; } @keyframes ping2 { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--crit) 50%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } } }
  nav.views { display: flex; gap: 4px; flex-wrap: wrap; }
  nav.views a { font: 500 14px var(--f-body); color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 6px; }
  nav.views a:hover { color: var(--ink); background: var(--surface); }
  nav.views a[aria-current="page"] { color: var(--accent); background: var(--surface); border: 1px solid var(--line); }
  .lang { margin-inline-start: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .lang select { font: 500 13px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .notice { font-size: 12px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 6px; padding: 6px 10px; }
  .fresh { font: 12px var(--f-mono); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .fresh::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--up); }
  .fresh.stale::before { background: var(--high); }
  html[lang="ar"] .fresh, html[lang="zh"] .fresh { font-family: var(--f-body); }

  /* Wire */
  .wire-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  .wire-item { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 4px 14px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .wire-item:last-child { border-bottom: 0; }
  @media (max-width: 560px) { .wire-item { grid-template-columns: minmax(0, 1fr); } }
  .wire-when { font: 12px var(--f-mono); color: var(--muted); display: grid; gap: 2px; }
  html[lang="ar"] .wire-when, html[lang="zh"] .wire-when { font-family: var(--f-body); }
  .wire-when b { font-weight: 500; color: var(--ink); }
  .wire-body { display: grid; gap: 3px; min-width: 0; }
  .wire-body a { color: var(--ink); font-weight: 600; text-decoration: none; font-size: 15px; line-height: 1.35; }
  .wire-body a:hover { color: var(--accent); text-decoration: underline; }
  .wire-body p { margin: 0; font-size: 13.5px; color: var(--muted); }
  .wire-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag { font: 500 11px var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .tag.k-incident { color: var(--crit); border-color: var(--crit); }
  .tag.k-vulnerability { color: var(--high); border-color: var(--high); }
  .tag.cand { color: var(--accent); border-color: var(--accent); cursor: pointer; background: none; font-family: var(--f-mono); }
  .day-h { font: 600 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 16px 6px; border-bottom: 1px solid var(--line); background: var(--bg); }
  html[lang="ar"] .day-h, html[lang="zh"] .day-h { font-family: var(--f-body); letter-spacing: 0; }
  .unv { display: inline-flex; align-items: center; gap: 5px; font: 500 11px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--high); border: 1px dashed var(--high); border-radius: 999px; padding: 2px 8px; }
  html[lang="ar"] .unv, html[lang="zh"] .unv { font-family: var(--f-body); letter-spacing: 0; }
  .pin.unv .dot { stroke-dasharray: 3 2; stroke: var(--ink); fill-opacity: .55; }
  .card.unv::before { background: repeating-linear-gradient(var(--c) 0 4px, transparent 4px 7px); }

  header.top { display: grid; gap: 6px; }
  .eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  html[lang="ar"] .eyebrow, html[lang="zh"] .eyebrow { letter-spacing: 0; font-family: var(--f-body); }
  .tlp { border: 1px solid var(--line); background: var(--surface); padding: 1px 7px; border-radius: 3px; color: var(--ink); }
  h1 { font-family: var(--f-display); font-weight: 600; font-size: clamp(30px, 4.5vw, 44px); line-height: 1.1; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
  .lede { margin: 0; color: var(--muted); max-width: 68ch; }

  .stats { display: flex; flex-wrap: wrap; gap: 8px 28px; font-variant-numeric: tabular-nums; }
  .stat { display: grid; }
  .stat b { font-family: var(--f-display); font-size: 26px; font-weight: 600; line-height: 1.1; }
  .stat span { font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
  .stat.crit b { color: var(--crit); }

  .filters { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
  .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .group > span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-inline-end: 2px; }
  .chip { font: 500 13px/1 var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="false"] { color: var(--muted); background: transparent; }
  .chip[aria-pressed="false"] .sw { opacity: .3; }
  :is(.chip, .pin, .ww, a, button, select, textarea):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sw { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }

  .main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 20px; align-items: start; }
  @media (max-width: 960px) { .main { grid-template-columns: minmax(0, 1fr); } }

  .mapbox { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-width: 0; }
  #map { width: 100%; height: auto; display: block; }
  .sphere { fill: var(--ocean); }
  .grat { fill: none; stroke: var(--line); stroke-width: .5; }
  .country { fill: var(--land); stroke: var(--surface); stroke-width: .5; transition: fill .2s; }
  .country.hit { fill: var(--land-hit); }
  .pin { cursor: pointer; outline: none; }
  .pin .dot { stroke: var(--surface); stroke-width: 1.5; }
  .pin .halo { opacity: .2; transition: opacity .15s; }
  .pin text { font: 500 11px var(--f-mono); fill: var(--pin-ink); text-anchor: middle; pointer-events: none; }
  .pin.active .halo, .pin.lit .halo, .pin:hover .halo { opacity: .45; }
  .pin.active .dot { stroke: var(--ink); stroke-width: 2; }
  [data-sev="critical"] { --c: var(--crit); } [data-sev="high"] { --c: var(--high); }
  [data-sev="medium"] { --c: var(--med); } [data-sev="low"] { --c: var(--low); }
  .pin .dot, .pin .halo { fill: var(--c); }
  @media (prefers-reduced-motion: no-preference) {
    .pin.newest .halo { animation: ping 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ping { 0% { transform: scale(.8); opacity: .5; } 100% { transform: scale(1.9); opacity: 0; } }
  }
  .ww { position: absolute; inset-inline-start: 22px; bottom: 22px; display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px 8px 8px; cursor: pointer; font: inherit; color: var(--ink); text-align: start; max-width: calc(100% - 44px); }
  .ww:hover, .ww.active, .ww.lit { border-color: var(--c); }
  .ww .disc { width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: var(--pin-ink); display: grid; place-items: center; font: 500 13px var(--f-mono); flex: none; }
  .ww strong { display: block; font-size: 13px; }
  .ww small { display: block; font-size: 12px; color: var(--muted); }
  @media (max-width: 560px) { .ww { position: static; margin-top: 10px; } }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); padding: 10px 4px 0; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 6px 10px; font-size: 13px; white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); z-index: 3; }
  html[dir="rtl"] .tip { transform: translate(50%, calc(-100% - 12px)); }
  .tip small { color: inherit; opacity: .75; font-family: var(--f-mono); font-size: 11px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; display: grid; grid-template-rows: auto minmax(0, 1fr); max-height: calc(100vh - 32px); position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); min-width: 0; }
  @media (max-width: 960px) { .panel { position: static; max-height: none; } }
  .phead { padding: 16px 18px 14px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
  .phead-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .phead h2 { font-family: var(--f-display); font-weight: 600; font-size: 24px; margin: 0; line-height: 1.1; }
  .phead p { margin: 0; color: var(--muted); font-size: 13px; }
  .reset { font: 500 13px var(--f-body); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap; }
  .reset:hover { text-decoration: underline; }
  .pmeta { display: flex; flex-wrap: wrap; gap: 4px 16px; font: 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .pmeta b { color: var(--ink); font-weight: 500; }
  .list { overflow-y: auto; padding: 6px 0; }
  .empty { padding: 24px 18px; color: var(--muted); }

  .card { padding: 14px 18px 14px 20px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; position: relative; cursor: pointer; }
  html[dir="rtl"] .card { padding: 14px 20px 14px 18px; }
  .card:last-child { border-bottom: 0; }
  .card::before { content: ""; position: absolute; inset-inline-start: 0; top: 14px; bottom: 14px; width: 3px; background: var(--c); border-radius: 2px; }
  .card:hover { background: color-mix(in srgb, var(--c) 6%, transparent); }
  .cmeta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font: 12px var(--f-mono); color: var(--muted); }
  html[lang="ar"] .cmeta, html[lang="zh"] .cmeta { font-family: var(--f-body); }
  .sev { color: var(--c); font-weight: 500; text-transform: uppercase; letter-spacing: .06em; }
  .card h3 { margin: 0; font-size: 15px; line-height: 1.35; font-weight: 600; }
  .card h3 a { color: var(--ink); text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; text-decoration-color: var(--c); text-underline-offset: 3px; }
  .card p { margin: 0; font-size: 13.5px; color: var(--muted); }
  .facts { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12.5px; }
  .facts span { color: var(--muted); }
  .facts b { font-weight: 500; color: var(--ink); }
  .open { justify-self: start; display: inline-flex; gap: 6px; align-items: center; font: 500 13px var(--f-body); color: var(--accent); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; margin-top: 2px; background: transparent; cursor: pointer; }
  .open:hover { border-color: var(--accent); }
  .open.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .cactions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font: 500 11px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 8px; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  footer { font-size: 12px; color: var(--muted); max-width: 90ch; }

  /* Case file */
  .case { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--ink) 55%, transparent); padding: clamp(0px, 2vw, 24px); padding-top: calc(clamp(0px, 2vw, 24px) + env(safe-area-inset-top, 0px)); padding-bottom: calc(clamp(0px, 2vw, 24px) + env(safe-area-inset-bottom, 0px)); overflow: hidden; }
  .doc { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; max-width: 1000px; height: 100%; margin: 0 auto; overflow-y: auto; display: grid; grid-template-rows: auto 1fr; min-width: 0; }
  @media (max-width: 560px) { .case { padding: 0; } .doc { border-radius: 0; border: 0; } }
  .dtop { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .back { font: 500 13px var(--f-body); color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  .back:hover { border-color: var(--accent); }
  .pill { font: 500 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 1px solid var(--line); color: var(--muted); }
  html[lang="ar"] .pill, html[lang="zh"] .pill { font-family: var(--f-body); letter-spacing: 0; }
  .pill.sev { color: var(--c); border-color: var(--c); }
  .dbody { padding: clamp(18px, 3vw, 36px); display: grid; gap: 28px; }
  .dhead { display: grid; gap: 10px; }
  .dhead .eyebrow { gap: 8px; }
  .dhead h2 { font-family: var(--f-display); font-weight: 600; font-size: clamp(24px, 3.4vw, 36px); line-height: 1.15; margin: 0; text-wrap: balance; }
  .dhead p { margin: 0; font-size: 16px; max-width: 72ch; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; }
  .facts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 0; }
  .facts-grid div { background: var(--bg); padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
  .facts-grid dt { font: 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  html[lang="ar"] .facts-grid dt, html[lang="zh"] .facts-grid dt, html[lang="ar"] .sec h3, html[lang="zh"] .sec h3 { font-family: var(--f-body); letter-spacing: 0; }
  .facts-grid dd { margin: 0; font-size: 14px; font-weight: 500; overflow-wrap: anywhere; }
  .facts-grid dd.sev { color: var(--c); text-transform: capitalize; }
  .sec { display: grid; gap: 8px; }
  .sec h3 { font: 600 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .sec p { margin: 0; max-width: 72ch; }
  .sec .lbl { font-weight: 600; }
  .pending { color: var(--muted); font-style: italic; }
  .two { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px; }
  .tl { list-style: none; margin: 0; padding: 0; display: grid; border-inline-start: 2px solid var(--line); margin-inline-start: 6px; }
  .tl li { position: relative; padding: 4px 0 14px 18px; display: grid; gap: 2px; }
  html[dir="rtl"] .tl li { padding: 4px 18px 14px 0; }
  .tl li::before { content: ""; position: absolute; inset-inline-start: -7px; top: 9px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
  .tl time { font: 500 12px var(--f-mono); color: var(--muted); }
  .srcs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .srcs a { color: var(--accent); overflow-wrap: anywhere; }
  .srcs small { color: var(--muted); font-family: var(--f-mono); font-size: 11px; }
  .inv { border: 1px solid var(--accent); border-radius: 8px; padding: 16px; display: grid; gap: 12px; background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .inv h3 { margin: 0; font: 600 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  .inv-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .inv select, .inv textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .inv textarea { width: 100%; min-height: 72px; resize: vertical; box-sizing: border-box; }
  .btn { font: 500 13px var(--f-body); color: var(--accent-ink); background: var(--accent); border: 1px solid var(--accent); border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  .btn.ghost { color: var(--accent); background: transparent; }
  .btn:disabled { opacity: .5; cursor: default; }
  .notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .notes li { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; display: grid; gap: 2px; font-size: 14px; }
  .notes time { font: 11px var(--f-mono); color: var(--muted); }
  .inv-msg { font-size: 13px; color: var(--muted); }

  /* Markets + Data views */
  .view { display: grid; gap: 20px; }
  .prose { max-width: 72ch; display: grid; gap: 10px; }
  .prose p { margin: 0; }

-3248 (CVSS 9.8)"},{"date":"2025-05-05","event":"CISA adds CVE-2025-3248 to the Known Exploited Vulnerabilities catalog"},{"date":"2025-06-17","event":"Trend Micro publishes analysis of Flodrix botnet campaign exploiting exposed Langflow servers"}],"impact":"Full compromise of unpatched internet-exposed Langflow servers, enrolment into the Flodrix DDoS botnet and possible exposure of AI workflows and credentials; victim count not disclosed","response":"Langflow patched in v1.3.0; CISA mandated federal patching via KEV; Trend Micro published IOCs and urged upgrades and network isolation","status":"patched","cve":"CVE-2025-3248","sources":[{"name":"Trend Micro","url":"https://www.trendmicro.com/en_us/research/25/f/langflow-vulnerability-flodric-botnet.html"},{"name":"SecurityWeek","url":"https://www.securityweek.com/recent-langflow-vulnerability-exploited-by-flodrix-botnet/"},{"name":"Dark Reading","url":"https://www.darkreading.com/vulnerabilities-threats/hackers-exploit-langflow-flaw-flodrix-botnet"}]},{"id":"rubio-ai-impersonation","date":"2025-07-08","title":"AI voice impersonator of Marco Rubio contacts foreign ministers via Signal","category":"Deepfake fraud","direction":"with-ai","severity":"high","country":"US","region":"North America","target":"US State Department / senior officials","loss_usd":null,"summary":"A State Department cable warned an impostor used AI-generated voice and text on Signal to pose as Secretary Rubio, contacting three foreign ministers, a governor and a member of Congress.","source":"Anchorage Daily News (Washington Post)","url":"https://www.adn.com/nation-world/2025/07/08/a-marco-rubio-impostor-is-using-ai-voice-to-call-high-level-officials/","actor":"Unknown impostor","actor_type":"unknown","attribution":"Not publicly attributed; State Department cable said identity unknown; FBI had warned in May 2025 of similar impersonation of senior US officials","motive":"Likely access to information or accounts of targeted officials (per State Dep d contact data tied to up to 64M applications.","source":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/123456-password-exposed-chats-for-64-million-mcdonalds-job-chatbot-applications","actor":"Security researchers Ian Carroll and Sam Curry (responsible disclosure)","actor_type":"researcher","attribution":"Self-disclosed by the researchers; confirmed by Paradox.ai and McDonald's","motive":"Security research; no malicious access reported","vector":"Default credentials 123456/123456 on a Paradox.ai test franchise account in the McHire admin portal, plus an IDOR on an internal API allowing lead_id enumeration","root_cause":"Unchanged default test credentials on a production-connected admin portal and missing authorisation checks on an applicant-data API","timeline":[{"date":"2025-06-30","event":"Researchers find the flaws and report to Paradox.ai and McDonald's"},{"date":"2025-06-30","event":"Default credentials disabled and IDOR fixed the same day, per McDonald's and Paradox.ai"},{"date":"2025-07-09","event":"Public disclosure via Wired and BleepingComputer; Paradox.ai announces a bug bounty programme"}],"impact":"Names, emails, phone numbers, addresses and chatbot transcripts tied to up to 64 million McHire applications were reachable; Paradox said only the researchers accessed a portion of records","response":"Paradox.ai and McDonald's fixed the issues the day they were reported; Paradox launched a vulnerability disclosure bounty programme","status":"patched","cve":null,"sources":[{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/123456-password-exposed-chats-for-64-million-mcdonalds-job-chatbot-applications"},{"name":"CSO Online","url":"https://www.csoonline.com/article/4020919/mcdonalds-ai-hiring-tools-password-123456-exposes-data-of-64m-applicants.html"},{"name":"Cyber Daily","url":"https://www.cyberdaily.au/security/12382-not-lovin-it-mcdonalds-hiring-backend-exposes-64m-chatbot-job-discussions"}]},{"id":" rity/lamehug-malware-uses-ai-llm-to-craft-windows-data-theft-commands-in-real-time/"},{"name":"Security Affairs","url":"https://securityaffairs.com/180092/apt/lamehug-first-ai-powered-malware-linked-to-russias-apt28-group.html"},{"name":"Infosecurity Magazine","url":"https://www.infosecurity-magazine.com/news/new-lamehug-malware-deploys/"}]},{"id":"amazon-q-wiper-prompt","date":"2025-07-23","title":"Hacker plants data-wiping prompt in Amazon Q Developer VS Code extension","category":"AI supply chain","direction":"on-ai","severity":"high","country":"US","region":"North America","target":"Amazon Q Developer extension","loss_usd":null,"summary":"A malicious pull request slipped a prompt telling the AI agent to wipe local files and AWS resources into a signed Q extension release; a formatting error kept it from executing.","source":"BleepingComputer","url":"https://bleepingcomputer.com/news/security/amazon-ai-coding-agent-hacked-to-inject-data-wiping-commands","actor":"Unknown hacker using GitHub alias lkmanka58","actor_type":"hacktivist","attribution":"Self-claimed via 404 Media interview (said goal was to expose 'AI security theater'); identity not publicly attributed by Amazon","motive":"Demonstrating weak AI supply-chain controls; attacker claimed no intent to cause real damage","vector":"Commit to the open-source aws-toolkit-vscode GitHub repository inserting a destructive natural-language prompt that shipped in signed release 1.84.0","root_cause":"Inadequate access controls and code review in the public repository allowed an unknown account to land a prompt payload that was then packaged and signed without detection","timeline":[{"date":"2025-07-13","event":"Account lkmanka58 commits the malicious prompt to Amazon's GitHub repository"},{"date":"2025-07-17","event":"Version 1.84.0 of Amazon Q Developer for VS Code ships with the wiper prompt"},{"date":"2025-07-23","event":"404 Media reports the compromise; Amazon acknowledges and pulls the release"},{"date":"2025-07-24","event":"Amazon releases clean version 1.85.0 and revokes compromised credentials"}],"impact":"Malicious prompt distributed to an extension with over 950,000 installs; Amazon said the prompt was malformed and no customer resources were affected","response":"Amazon removed 1.84.0, revoked and replaced credentials, published 1.85.0 and said it mitigated an attempt to exploit a known issue in two open-source repositories","status":"resolved","cve":null,"sources":[{"name":"BleepingComputer","url":"https://bleepingcomputer.com/news/security/amazon-ai-coding-agent-hacked-to-inject-data-wiping-commands"},{"name":"TechRepublic","url":"https://www.techrepublic.com/article/news-amazon-q-data-wiping-prompt-security-hack/"},{"name":"CyberInsider","url":"https://cyberinsider.com/amazons-ai-coding-assistant-for-vsc-infected-with-data-wiper/"}]},{"id":"grok-chats-indexed","date":"2025-08-20","title":"Over 370,000 Grok conversations exposed in Google search via share links","category":"Model & data leak","direction":"on-ai","severity":"medium","country":"GL","region":"Global","target":"xAI Grok users","loss_usd":null,"summary":"Forbes found Grok's share button generated indexable URLs, so search engines surfaced hundreds of thousands of user chats, some with personal, medical or credential details.","source":"Fortune","url":"https://fortune.com/2025/08/22/xai-grok-chats-public-on-google-search-elon-musk","actor":"xAI product design flaw; exposure found by Forbes","actor_type":"accident","attribution":"Self-evident from Forbes investigation; xAI did not dispute the indexing","motive":"None (accidental exposure via share feature)","vector":"Grok 'Share' button created public URLs on grok.com with no noindex protection or user warning, which Google, Bing and DuckDuckGo crawled and indexed","root_cause":"Share links published on the open web without noindex headers or consent disclosure, repeating the earlier ChatGPT shared-link indexing problem","timeline":[{"date":"2025-08-20","event":"Forbes reports over 370,000 Grok conversations indexed by Google"},{"date":"2025-08-22","event":"Fortune and others detail exposed content including passwords, medical questions and harmful instructions"}],"impact":"More than 370,000 user conversations publicly searchable, some containing names, passwords, medical details and instructions for drugs, explosives and malware","response":"No formal statement from xAI beyond a Google spokesperson noting publishers control indexing; no public confirmation of a feature fix","status":"unresolved","cve":null,"sources":[{"name":"Fortune","url":"https://fortune.com/2025/08/22/xai-grok-chats-public-on-google-search-elon-musk"},{"name":"Forbes Australia","url":"https://www.forbes.com.au/news/innovation/xai-published-hundreds-of-thousands-of-grok-chatbot-conversations/"},{"name":"Yahoo News","url":"https://www.yahoo.com/news/articles/thousands-private-user-conversations-elon-173216941.html"}]},{"id":"salesloft-drift-oauth","date":"2025-08-26","title":"Drift AI chatbot OAuth tokens stolen to raid 700+ Salesforce tenants","category":"AI supply chain","direction":"on-ai","severity":"critical","country":"GL","region":"Global","target":"Salesloft Drift / Salesforce customers","loss_usd":null,"summary":"UNC6395 used OAuth tokens stolen from the Drift AI chat integration to bulk-export Salesforce data from hundreds of organizations and hunt for cloud keys and passwords.","source":"Security Affairs","url":"https://securityaffairs.com/181632/hacking/unc6395-targets-salesloft-in-drift-oauth-token-theft-campaign.html","actor":"UNC6395 (unknown financially motivated group)","actor_type":"criminal","attribution":"Tracked as UNC6395 by Google Threat Intelligence Group and Mandiant; a group claiming ties to ShinyHunters also claimed responsibility, unconfirmed","motive":"Credential harvesting (AWS keys, Snowflake tokens, passwords) from CRM data for follow-on intrusions and extortion","vector":"Stolen OAuth and refresh tokens for the Salesloft Drift Salesforce integration used to run SOQL queries and bulk-export Account, Case, Opportunity and User objects","root_cause":"Compromise of Salesloft's GitHub and Drift AWS environment exposed long-lived OAuth tokens for a widely trusted third-party app with broad Salesforce data scope","timeline":[{"date":"2025-03","event":"Per Mandiant, actor gains access to Salesloft's GitHub account (March to June) and later Drift's AWS environment"},{"date":"2025-08-08","event":"Mass Salesforce data exfiltration via Drift OAuth tokens begins, continuing through at least August 18"},{"date":"2025-08-20","event":"Salesforce and Salesloft revoke all Drift tokens and remove Drift from AppExchange"},{"date":"2025-08-26","event":"Google Threat Intelligence Group publishes UNC6395 advisory; Drift Email tokens also found abused against Google Workspace"}],"impact":"Over 700 organisations' Salesforce data exported, including support cases containing AWS keys, Snowflake tokens and passwords; downstream disclosures from Cloudflare, Zscaler, Palo Alto Networks, Google and others","response":"Tokens revoked, Drift integration disabled and later taken offline, Mandiant engaged, customers told to rotate exposed secrets; FBI issued a FLASH alert","status":"contained","cve":null,"sources":[{"name":"Security Affairs","url":"https://securityaffairs.com/181632/hacking/unc6395-targets-salesloft-in-drift-oauth-token-theft-campaign.html"},{"name":"Google Cloud Threat Intelligence","url":"https://cloud.google.com/blog/topics/threat-intelligence/unc6395-github-malware-salesforce-data"},{"name":"Help Net Security","url":"https://www.helpnetsecurity.com/2025/08/27/hundreds-of-salesforce-customer-orgs-hit-in-clever-attack-with-potentially-huge-blast-radius/"}]},{"id":"promptlock-ransomware","date":"2025-08-26","title":"ESET finds PromptLock, ransomware that uses a local gpt-oss model to write scripts","category":"AI-assisted malware","direction":"with-ai","severity":"low","country":"GL","region":"Global","target":"Windows and Linux systems","loss_usd":null,"summary":"ESET described PromptLock, a Go ransomware prototype that prompts gpt-oss:20b via Ollama to generate Lua scripts for discovery, exfiltration and encryption; likely a proof of concept.","source":"Security Affairs","url":"https://securityaffairs.com/181595/malware/eset-warns-of-promptlock-the-first-ai-driven-ransomware.html","actor":"NYU Tandon researchers (Ransomware 3.0 academic prototype)","actor_type":"researcher","attribution":"NYU Tandon team publicly claimed authorship after ESET's disclosure; ESET agreed the academic prototype closely resembles the PromptLock samples","motive":"Academic research into LLM-orchestrated ransomware; samples uploaded to VirusTotal to test detection","vector":"Go binary with hard-coded prompts calling OpenAI gpt-oss:20b via the Ollama API to generate Lua scripts for file enumeration, exfiltration and encryption","root_cause":"Freely available open-weight LLMs can be embedded in malware to generate polymorphic payloads at runtime; sample reached VirusTotal without research labelling","timeline":[{"date":"2025-08","event":"Windows and Linux PromptLock samples uploaded to VirusTotal"},{"date":"2025-08-26","event":"ESET publishes analysis calling it the first AI-powered ransomware, judged a proof of concept"},{"date":"2025-09","event":"NYU Tandon researchers reveal PromptLock is their Ransomware 3.0 prototype and non-functional outside a lab"}],"impact":"No real-world victims; destruction features unimplemented; demonstrated feasibility of LLM-driven ransomware across Windows and Linux","response":"ESET published detections and IOCs; NYU clarified the research origin and stated the prototype was lab-only","status":"resolved","cve":null,"sources":[{"name":"Security Affairs","url":"https://securityaffairs.com/181595/malware/eset-warns-of-promptlock-the-first-ai-driven-ransomware.html"},{"name":"The Hacker News","url":"https://thehackernews.com/2025/08/someone-created-first-ai-powered.html"},{"name":"Security Boulevard","url":"https://securityboulevard.com/2025/09/nyu-scientists-develop-eset-detects-first-ai-powered-ransomware/"},{"name":"Dark Reading","url":"https://www.darkreading.com/vulnerabilities-threats/ai-powered-ransomware-promptlock"}]},{"id":"nx-s1ngularity","date":"2025-08-27","title":"s1ngularity: trojanized Nx packages weaponize Claude and Gemini CLIs to steal secrets","category":"AI supply chain","direction":"on-ai","severity":"critical","country":"GL","region":"Global","target":"Nx build system users","loss_usd":null,"summary":"Malicious Nx npm releases ran local AI coding CLIs with permission-bypass flags to inventory secrets, then leaked thousands of developer credentials to public GitHub repos.","source":"Okta","url":"https://www.okta.com/newsroom/articles/the-s1ngularity-attack--when-attackers-prompt-your-ai-agents-to-","actor":"Unknown supply-chain attacker (s1ngularity)","actor_type":"criminal","attribution":"No public attribution; analysed by Nx maintainers, Wiz, StepSecurity, Socket and GitHub Security Lab","motive":"Mass theft of developer secrets (GitHub and npm tokens, SSH keys, crypto wallets, cloud credentials)","vector":"Malicious postinstall script in Nx npm releases 20.9.0 to 21.8.0 ran Claude, Gemini and Q CLIs with permission-bypass flags to find secrets, then pushed them to public GitHub repos","root_cause":"Nx GitHub Actions workflow using pull_request_target with an unsanitised PR title let the attacker steal the npm publish token from an outdated branch","timeline":[{"date":"2025-08-21","event":"Vulnerable workflow added to Nx repo; reverted on master but still present on an outdated branch"},{"date":"2025-08-26","event":"Attacker publishes trojanized Nx versions to npm; malware runs AI CLIs and leaks secrets for several hours"},{"date":"2025-08-27","event":"Nx pulls malicious versions, revokes tokens and publishes advisory GHSA-cxm3-wv7p-598c"},{"date":"2025-08-28","event":"Second phase: stolen GitHub tokens used to flip about 6,700 private repos public across 480 accounts"},{"date":"2025-09-09","event":"Wiz reports 2,180 accounts and 7,200 repositories affected across three phases"}],"impact":"Over 2,000 secrets and 20,000 files leaked from about 1,000 developers; 480 accounts and about 6,700 private repositories made public; 2,180 accounts affected overall per Wiz","response":"Nx revoked npm tokens, removed packages, enforced 2FA and trusted publishing; GitHub removed leaked repositories; victims told to rotate all credentials","status":"contained","cve":null,"sources":[{"name":"Okta","url":"https://www.okta.com/newsroom/articles/the-s1ngularity-attack--when-attackers-prompt-your-ai-agents-to-"},{"name":"Wiz","url":"https://www.wiz.io/blog/s1ngularity-supply-chain-attack"},{"name":"BleepingComputer","url":"https://bleepingcomputer.com/news/security/ai-powered-malware-hit-2-180-github-accounts-in-s1ngularity-attack"},{"name":"GitHub Security Lab","url":"https://securitylab.github.com/advisories/GHSL-2025-111_nrwl_nx/"}]},{"id":"anthropic-vibe-hacking","date":"2025-08-27","title":"Claude Code used to automate data extortion against 17 organizations","category":"AI-assisted malware","direction":"with-ai","severity":"high","country":"GL","region":"Global","target":"Healthcare, government, emergency services","loss_usd":null,"summary":"Anthropic's threat report described a criminal using Claude Code for recon, credential harvesting and tailored ransom notes against at least 17 organizations, demanding up to ~$500K.","source":"Malwarebytes","url":"https://www.malwarebytes.com/blog/news/2025/08/claude-ai-chatbot-abused-to-launch-cybercrime-spree","actor":"GTG-2002 (unnamed cybercriminal tracked by Anthropic)","actor_type":"criminal","attribution":"Identified and disrupted by Anthropic's threat intelligence team; actor identity not publicly disclosed","motive":"Financial extortion via data theft (ransoms of USD 75,000 to over 500,000 in bitcoin)","vector":"Claude Code used as an autonomous operator: scanning thousands of VPN endpoints, credential harvesting, writing obfuscated tunnelling tools, selecting data to steal and drafting ransom notes","root_cause":"Agentic coding tools can be misused to run end-to-end intrusions at scale; victims had internet-exposed VPN services and weak credential hygiene","timeline":[{"date":"2025-07","event":"Anthropic detects the extortion operation spanning at least 17 organisations"},{"date":"2025-08-27","event":"Anthropic publishes threat intelligence report describing the vibe hacking case and bans the accounts"}],"impact":"At least 17 organisations in healthcare, emergency services, government and religious sectors had personal, health and financial records stolen; ransoms demanded up to over USD 500,000","response":"Anthropic banned the accounts, deployed new classifiers to detect similar misuse and shared indicators with partners and authorities","status":"contained","cve":null,"sources":[{"name":"Malwarebytes","url":"https://www.malwarebytes.com/blog/news/2025/08/claude-ai-chatbot-abused-to-launch-cybercrime-spree"},{"name":"Anthropic","url":"https://www.anthropic.com/news/detecting-countering-misuse-aug-2025"},{"name":"Dark Reading","url":"https://www.darkreading.com/cyberattacks-data-breaches/anthropic-ai-automate-data-extortion-campaign"}]},{"id":"kimsuky-chatgpt-military-id","date":"2025-09-15","title":"Kimsuky uses ChatGPT-forged South Korean military ID in spear-phishing","category":"State actor AI ops","direction":"with-ai","severity":"medium","country":"KR","region":"Asia-Pacific","target":"South Korean defense-related researchers","loss_usd":null,"summary":"Genians found North Korea's Kimsuky attached AI-generated deepfake military ID drafts to phishing emails that dropped malware on researchers, activists and journalists.","source":"The Record","url":"https://therecord.media/north-korea-kimsuky-hackers-phishing-fake-military-ids-chatgpt","actor":"Kimsuky (North Korean state-sponsored, aka APT43)","actor_type":"state","attribution":"Attributed by Genians Security Center based on infrastructure and tooling overlap with known Kimsuky campaigns","motive":"Espionage against South Korean defence, research, activist and journalist targets","vector":"Spear-phishing from a spoofed defence domain with Government_ID_Draft.zip whose shortcut ran obfuscated PowerShell to fetch malware and a ChatGPT-generated fake military ID image","root_cause":"Image-generation guardrails bypassed by framing prompts as legitimate sample designs; targets trusted an official-looking ID lure","timeline":[{"date":"2025-07-17","event":"Phishing emails with deepfake military ID attachment sent to South Korean targets"},{"date":"2025-09-15","event":"Genians publishes analysis attributing the campaign to Kimsuky; The Record and The Register report it"}],"impact":"Malware delivered to defence-related researchers, activists and journalists in South Korea; number of successful infections not disclosed","response":"Genians published IOCs and detection guidance; no public response from OpenAI specific to this campaign","status":"ongoing","cve":null,"sources":[{"name":"The Record","url":"https://therecord.media/north-korea-kimsuky-hackers-phishing-fake-military-ids-chatgpt"},{"name":"Genians","url":"https://genians.com/news/chatgpt-exploited-in-north-korean-cyber-espionage-campaign-genians-reveals/"},{"name":"The Register","url":"https://www.theregister.com/2025/09/15/north_korea_chatgpt_fake_id/"}]},{"id":"microsoft-llm-svg-phishing","date":"2025-09-24","title":"Microsoft blocks phishing campaign using LLM-generated obfuscated SVG files","category":"AI phishing","direction":"with-ai","severity":"medium","country":"US","region":"North America","target":"US organizations","loss_usd":null,"summary":"Microsoft Threat Intelligence detected credential phishing using SVG attachments posing as PDFs whose verbose obfuscated code was likely written by an LLM.","source":"SecurityBrief UK","url":"https://securitybrief.co.uk/story/microsoft-details-ai-powered-defences-against-novel-svg-phishing","actor":"Unknown credential-phishing operators","actor_type":"criminal","attribution":"No public attribution; Microsoft Threat Intelligence assessed the code was likely LLM-generated using Security Copilot","motive":"Credential theft (phishing for account logins)","vector":"Self-addressed emails from a compromised business account carrying SVG files posing as PDFs; hidden business-term attributes decoded by JavaScript redirect to a fake CAPTCHA and login page","root_cause":"SVG files can carry executable script and evade PDF-focused filters; LLM-generated obfuscation masked the payload from signature-based detection","timeline":[{"date":"2025-08-18","event":"Microsoft Defender for Office 365 detects and blocks the SVG phishing campaign"},{"date":"2025-09-24","event":"Microsoft publishes 'AI vs AI' analysis of the campaign"}],"impact":"Campaign blocked by Defender for Office 365; limited to US organisations; no confirmed credential compromises reported","response":"Microsoft blocked the campaign, published indicators and detection guidance, and used Security Copilot to characterise the AI-generated code","status":"contained","cve":null,"sources":[{"name":"SecurityBrief UK","url":"https://securitybrief.co.uk/story/microsoft-details-ai-powered-defences-against-novel-svg-phishing"},{"name":"Microsoft Security Blog","url":"https://microsoft.com/en-us/security/blog/2025/09/24/ai-vs-ai-detecting-an-ai-obfuscated-phishing-campaign"},{"name":"Infosecurity Magazine","url":"https://www.infosecurity-magazine.com/news/ai-generated-code-phishing/"}]},{"id":"postmark-mcp-backdoor","date":"2025-09-25","title":"First malicious MCP server found: postmark-mcp npm package BCCs all emails to attacker","category":"AI supply chain","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"postmark-mcp users","loss_usd":null,"summary":"Koi Security found a lookalike postmark-mcp package whose v1.0.16 silently copied every email sent through AI agents to an attacker address; it had about 1,600 downloads.","source":"The Hacker News","url":"https://thehackernews.com/2025/09/first-malicious-mcp-server-found.html","actor":"npm publisher 'phanpak' (identity unknown)","actor_type":"criminal","attribution":"Identified by Koi Security; package tied to npm account phanpak, which maintained 31 other packages; account later deleted","motive":"Covert harvesting of email contents (invoices, password resets, internal communications)","vector":"Trusted npm package postmark-mcp, a copy of Postmark's official MCP server, updated in v1.0.16 with a one-line BCC to phan@giftshop.club on every outbound email","root_cause":"AI agents installed unvetted community MCP servers with full email-sending trust; a single maintainer could push a backdoored update with no review","timeline":[{"date":"2025-09-17","event":"Version 1.0.16 of postmark-mcp published with the hidden BCC line"},{"date":"2025-09-25","event":"Koi Security discloses the backdoor; package has about 1,500 weekly downloads"},{"date":"2025-09-26","event":"Developer removes the package from npm without responding to Koi"}],"impact":"An estimated 300 organisations exposed; thousands of emails a day including password resets and invoices silently copied to the attacker's server","response":"Package deleted from npm by the publisher; Koi, Snyk and Qualys advised uninstalling v1.0.16+, rotating credentials and auditing outbound mail","status":"contained","cve":null,"sources":[{"name":"The Hacker News","url":"https://thehackernews.com/2025/09/first-malicious-mcp-server-found.html"},{"name":"Snyk","url":"https://snyk.io/es/blog/malicious-mcp-server-on-npm-postmark-mcp-harvests-emails/"},{"name":"Qualys","url":"https://threatprotect.qualys.com/2025/09/30/malicious-mcp-server-on-npm-postmark-mcp-exploited-in-attack/"}]},{"id":"brazil-gisele-deepfake-ads","date":"2025-10-01","title":"Brazil police bust ring using Gisele Bundchen deepfakes in Instagram ad scams","category":"Deepfake fraud","direction":"with-ai","severity":"high","country":"BR","region":"Latin America","target":"Brazilian consumers","loss_usd":3900000,"summary":"Rio Grande do Sul police arrested suspects accused of running deepfake celebrity ads for fake giveaways and products, moving over R$20M (about $3.9M) in suspicious funds.","source":"AI Incident Database (CNN Brasil, Reuters)","url":"https://incidentdatabase.ai/cite/1224/","actor":"Unnamed Brazilian fraud ring (Operation Jungle Mode suspects)","actor_type":"criminal","attribution":"Identified by Rio Grande do Sul Civil Police after COAF flagged suspicious funds; suspects not publicly named","motive":"Consumer fraud (fake giveaways and products with shipping-fee payments)","vector":"Instagram ads with deepfake videos of Gisele Bundchen and other celebrities promoting fake suitcase giveaways and skincare products, collecting shipping fees for goods never delivered","root_cause":"Easy celebrity deepfake generation combined with insufficient ad-platform screening of fraudulent celebrity endorsements","timeline":[{"date":"2024-08","event":"Scheme active since at least this month, per police"},{"date":"2025-10-01","event":"Operation Jungle Mode: 7 arrest and 9 search warrants executed across five Brazilian states; four suspects arrested"},{"date":"2025-10-03","event":"Reuters reports the case; Meta says it removes deceptive celebrity ads when detected"}],"impact":"Over R$20 million (about USD 3.9M) in suspicious funds moved from victims who paid for non-existent goods; victim count not disclosed","response":"Police arrested suspects, froze assets across five states; Bundchen's team warned consumers to verify offers; Meta cited ad-removal policies","status":"under investigation","cve":null,"sources":[{"name":"AI Incident Database","url":"https://incidentdatabase.ai/cite/1224/"},{"name":"Reuters (via Yahoo News)","url":"https://www.yahoo.com/news/articles/brazilian-scammers-raking-millions-used-204932574.html"},{"name":"Malay Mail (Reuters)","url":"https://www.malaymail.com/news/tech-gadgets/2025/10/05/brazilian-scammers-rake-in-millions-using-gisele-bundchen-deepfakes-in-instagram-ads-to-defraud-victims/193369"}]},{"id":"gtig-promptflux","date":"2025-11-05","title":"Google flags PROMPTFLUX and other malware that call Gemini at runtime","category":"AI-assisted malware","direction":"with-ai","severity":"medium","country":"GL","region":"Global","target":"Windows systems","loss_usd":null,"summary":"Google's threat team reported experimental malware such as PROMPTFLUX that asks Gemini to rewrite its own VBScript for evasion, plus state use of LLM-enabled tools like PROMPTSTEAL.","source":"CyberInsider","url":"https://cyberinsider.com/promptflux-malware-uses-gemini-to-rewrite-and-hide-itself-in-real-time/","actor":"Unknown developer (PROMPTFLUX); APT28 (Russian GRU-linked) for PROMPTSTEAL","actor_type":"state","attribution":"PROMPTFLUX not attributed by Google (naming consistent with financially motivated actors); PROMPTSTEAL attributed to APT28 by GTIG and CERT-UA","motive":"Evasion research and testing (PROMPTFLUX); espionage and data theft against Ukraine (PROMPTSTEAL)","vector":"Malware embedding Gemini API calls to regenerate obfuscated VBScript at runtime; PROMPTSTEAL used a Hugging Face-hosted Qwen model with stolen API tokens to generate commands","root_cause":"Public LLM APIs reachable from malware with stolen or free keys; just-in-time code generation lets malware offload logic to an external model to evade static detection","timeline":[{"date":"2025-07","event":"CERT-UA documents LAMEHUG/PROMPTSTEAL used by APT28 against Ukrainian targets"},{"date":"2025-11-05","event":"GTIG publishes AI Threat Tracker describing PROMPTFLUX, PROMPTSTEAL and other LLM-calling malware"},{"date":"2025-11-05","event":"Google says it disabled API keys and projects associated with the activity"}],"impact":"PROMPTFLUX assessed as experimental with no confirmed victims; PROMPTSTEAL collected system data and documents from Ukrainian targets. No financial loss reported.","response":"Google disabled associated Gemini API keys and projects and added classifier protections; researchers including Marcus Hutchins questioned PROMPTFLUX's practical significance.","status":"contained","cve":null,"sources":[{"name":"CyberInsider","url":"https://cyberinsider.com/promptflux-malware-uses-gemini-to-rewrite-and-hide-itself-in-real-time/"},{"name":"The Hacker News","url":"https://thehackernews.com/2025/11/google-uncovers-promptflux-malware-that.html"},{"name":"Field Effect","url":"https://fieldeffect.com/blog/google-threat-intelligence-group-reports-on-adversaries-weaponizing-ai-tools"},{"name":"Decrypt","url":"https://decrypt.co/347781/google-threat-report-links-ai-powered-malware-to-dprk-crypto-theft"}]},{"id":"anthropic-gtg-1002","date":"2025-11-13","title":"Chinese state group used Claude Code to run largely autonomous espionage","category":"State actor AI ops","direction":"with-ai","severity":"critical","country":"GL","region":"Global","target":"Tech, finance, chemical firms, government agencies","loss_usd":null,"summary":"Anthropic said GTG-1002 tasked Claude Code agents to perform 80-90% of intrusion work against ~30 targets, with a handful of successful breaches, before accounts were banned.","source":"Anthropic","url":"https://assets.anthropic.com/m/ec212e6566a0d47/original/Disrupting-the-first-reported-AI-orchestrated-cyber-espionage-campaign.pdf","actor":"GTG-1002 (assessed Chinese state-sponsored group)","actor_type":"state","attribution":"Attributed by Anthropic with high confidence to a Chinese state-sponsored group; Chinese officials denied involvement","motive":"Espionage and intelligence collection from tech, finance, chemical and government targets","vector":"Jailbroken Claude Code agents orchestrated via MCP tools, with tasks decomposed into innocuous subtasks under a fake penetration-testing persona","root_cause":"Agentic coding tools can be tricked by role-play and task decomposition into running recon, exploitation and exfiltration without recognizing malicious intent","timeline":[{"date":"2025-09","event":"Campaign runs in mid-September against roughly 30 organizations"},{"date":"2025-09","event":"Anthropic detects suspicious activity and begins a ten-day investigation"},{"date":"2025-11-13","event":"Anthropic publishes report calling it the first AI-orchestrated cyber-espionage campaign"}],"impact":"About 30 targets; a small number of intrusions succeeded with data accessed and exfiltrated. Claude performed an estimated 80-90% of tactical work. No financial loss disclosed.","response":"Anthropic banned the accounts, notified affected entities and authorities, expanded detection classifiers and published its findings.","status":"contained","cve":null,"sources":[{"name":"Anthropic","url":"https://assets.anthropic.com/m/ec212e6566a0d47/original/Disrupting-the-first-reported-AI-orchestrated-cyber-espionage-campaign.pdf"},{"name":"The Hacker News","url":"https://thehackernews.com/2025/11/chinese-hackers-use-anthropics-ai-to.html"},{"name":"Cybersecurity Dive","url":"https://www.cybersecuritydive.com/news/anthropic-state-actor-ai-tool-espionage/805550/"}]},{"id":"shadowray-2","date":"2025-11-18","title":"ShadowRay 2.0 turns exposed Ray AI clusters into self-spreading mining botnet","category":"LLMjacking","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"Ray (Anyscale) AI compute clusters","loss_usd":null,"summary":"Oligo reported attackers abusing unauthenticated Ray job APIs (CVE-2023-48022) with LLM-written payloads to hijack AI GPU clusters for cryptomining, DDoS and data theft.","source":"The Register","url":"https://www.theregister.com/2025/11/18/selfreplicating_botnet_ray_clusters/","actor":"IronErn440 (tracked by Oligo Security)","actor_type":"criminal","attribution":"Attributed by Oligo Security to a cluster it tracks as IronErn440; no government attribution","motive":"Financial gain via cryptomining, plus credential theft and DDoS-for-hire","vector":"Unauthenticated Ray Jobs API on internet-exposed dashboards used to submit multi-stage Bash and Python payloads, spread cluster-wide via Ray orchestration","root_cause":"CVE-2023-48022 left unpatched because Anyscale treats unauthenticated job submission as a design choice; over 230,000 Ray servers exposed to the internet","timeline":[{"date":"2023-11","event":"CVE-2023-48022 (ShadowRay) disclosed; Anyscale declines to patch"},{"date":"2024-09","event":"Oligo says ShadowRay 2.0 activity begins"},{"date":"2025-11-05","event":"First wave using GitLab payload delivery is taken down"},{"date":"2025-11-17","event":"Second wave begins using GitHub repositories"},{"date":"2025-11-18","event":"Oligo publishes ShadowRay 2.0 findings"}],"impact":"Exposed Ray AI clusters hijacked for XMRig mining, DDoS and theft of credentials and data; GPU compute stolen at scale. No dollar figure reported.","response":"Oligo reported the campaign and payload repositories were removed from GitLab and GitHub, though attackers quickly recreated them; Anyscale offers configuration tooling but no patch.","status":"ongoing","cve":"CVE-2023-48022","sources":[{"name":"The Register","url":"https://www.theregister.com/2025/11/18/selfreplicating_botnet_ray_clusters/"},{"name":"BleepingComputer","url":"https://bleepingcomputer.com/news/security/new-shadowray-attacks-convert-ray-clusters-into-crypto-miners"},{"name":"Dark Reading","url":"https://www.darkreading.com/cyber-risk/shadowray-20-ai-clusters-crypto-botnets"}]},{"id":"openai-mixpanel","date":"2025-11-26","title":"OpenAI API user data exposed in breach of analytics vendor Mixpanel","category":"Model & data leak","direction":"on-ai","severity":"medium","country":"GL","region":"Global","target":"OpenAI API platform users","loss_usd":null,"summary":"An attacker who smished Mixpanel exported a dataset with names, emails and coarse locations of OpenAI API users; OpenAI said no chats, keys or payment data were exposed.","source":"OpenAI","url":"https://openai.com/index/mixpanel-incident/","actor":"Unknown attacker who smished Mixpanel employees","actor_type":"criminal","attribution":"No public attribution; disclosed by Mixpanel and OpenAI","motive":"Data theft; one unverified report said the attacker tried to sell the dataset","vector":"SMS phishing (smishing) of Mixpanel staff leading to access to internal systems and export of analytics datasets","root_cause":"Third-party analytics vendor with user metadata; employee credentials compromised via social engineering","timeline":[{"date":"2025-11-08","event":"Mixpanel detects smishing campaign against employees"},{"date":"2025-11-09","event":"Mixpanel identifies unauthorized access and data export; notifies OpenAI"},{"date":"2025-11-25","event":"Mixpanel shares the affected dataset with OpenAI"},{"date":"2025-11-26","event":"OpenAI publicly discloses the incident"},{"date":"2025-12-19","event":"OpenAI clarifies some ChatGPT users were also affected"}],"impact":"Names, email addresses, approximate location, browser and OS details of OpenAI API users exposed; no prompts, API keys, passwords or payment data. Other Mixpanel customers also affected.","response":"Mixpanel revoked sessions, rotated credentials, blocked IPs and hired outside forensics firms; OpenAI removed Mixpanel from production and notified affected users.","status":"contained","cve":null,"sources":[{"name":"OpenAI","url":"https://openai.com/index/mixpanel-incident/"},{"name":"CSO Online","url":"https://www.csoonline.com/article/4097488/openai-admits-data-breach-after-analytics-partner-hit-by-phishing-attack-2.html"},{"name":"eWeek","url":"https://www.eweek.com/news/openai-mixpanel-data-exposure/"}]},{"id":"reprompt-copilot","date":"2026-01-14","title":"Reprompt: one-click attack hijacks Microsoft Copilot sessions to steal data","category":"Prompt injection","direction":"on-ai","severity":"medium","country":"GL","region":"Global","target":"Microsoft Copilot Personal","loss_usd":null,"summary":"Varonis showed a crafted Microsoft link could pre-fill Copilot prompts via URL parameter and keep exfiltrating a victim's data and memory even after the chat closed.","source":"Varonis","url":"https://www.varonis.com/blog/reprompt","actor":"Varonis Threat Labs (responsible disclosure)","actor_type":"researcher","attribution":"Self-disclosed by Varonis; confirmed and patched by Microsoft","motive":"Security research; no exploitation in the wild reported","vector":"Phishing link to a legitimate copilot.microsoft.com URL whose q parameter auto-executes a prompt, with follow-up instructions fetched from attacker server","root_cause":"Copilot Personal auto-ran prompts passed via URL parameter and allowed persistent exfiltration after the chat window closed","timeline":[{"date":"2025-08-31","event":"Varonis reports the flaw to Microsoft"},{"date":"2026-01-13","event":"Microsoft ships fix in January Patch Tuesday"},{"date":"2026-01-14","event":"Varonis publishes Reprompt research"}],"impact":"Proof of concept only; could have exfiltrated personal data and Copilot memory from consumer users. Microsoft 365 Copilot not affected. No victims reported.","response":"Microsoft rolled out protections against the scenario and said it is adding defense-in-depth measures; Varonis published guidance.","status":"patched","cve":null,"sources":[{"name":"Varonis","url":"https://www.varonis.com/blog/reprompt"},{"name":"TechRepublic","url":"https://techrepublic.com/article/news-reprompt-attack-microsoft-copilot"},{"name":"Windows Report","url":"https://windowsreport.com/microsoft-patches-copilot-vulnerability-as-hackers-eye-to-exploit-with-new-reprompt-attack/"}]},{"id":"voidlink-ai-built","date":"2026-01-20","title":"VoidLink cloud malware framework found to be built mostly by an AI agent","category":"AI-assisted malware","direction":"with-ai","severity":"high","country":"GL","region":"Global","target":"Linux cloud environments","loss_usd":null,"summary":"Check Point concluded the 30+ module VoidLink Linux implant was planned and coded largely by an AI agent under one developer, reaching ~88,000 lines in about a week.","source":"The Register","url":"https://www.theregister.com/2026/01/20/voidlink_ai_developed/","actor":"Single unnamed developer, assessed by Check Point as likely Chinese","actor_type":"criminal","attribution":"Check Point Research assessment based on leaked sprint plans and documentation; no formal attribution","motive":"Development of a commercial-grade Linux cloud implant; large-scale deployment not yet observed","vector":"AI agent (TRAE SOLO IDE assistant) used to plan architecture, split work into virtual teams and write a 30-plus module implant","root_cause":"AI coding agents let a lone actor produce complex offensive tooling at team scale; developer OPSEC failures exposed the artifacts","timeline":[{"date":"2025-11","event":"Development begins using TRAE SOLO; first functional implant in under a week"},{"date":"2025-12","event":"Codebase reaches about 88,000 lines"},{"date":"2026-01","event":"Check Point publishes initial VoidLink analysis"},{"date":"2026-01-20","event":"Check Point follow-up concludes the framework was mostly AI-built"}],"impact":"No confirmed victims or large-scale exploitation reported; framework includes loaders, rootkit modules and dozens of plugins targeting Linux cloud environments.","response":"Check Point published detections and analysis; no takedown or law-enforcement action reported.","status":"under investigation","cve":null,"sources":[{"name":"The Register","url":"https://www.theregister.com/2026/01/20/voidlink_ai_developed/"},{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/voidlink-cloud-malware-shows-clear-signs-of-being-ai-generated/"},{"name":"Dark Reading","url":"https://darkreading.com/threat-intelligence/voidlink-linux-malware-ai"}]},{"id":"anthropic-git-mcp-injection","date":"2026-01-20","title":"Prompt injection flaws in Anthropic's Git MCP server enable file access and code execution","category":"Prompt injection","direction":"on-ai","severity":"medium","country":"GL","region":"Global","target":"Anthropic mcp-server-git","loss_usd":null,"summary":"Researchers showed malicious repository content could steer agents using Anthropic's reference Git MCP server into reading or deleting files and running code; fixes shipped.","source":"OECD AI Incidents Monitor","url":"https://oecd.ai/en/incidents/2026-01-20-c1f6","actor":"Cyata security researchers (responsible disclosure)","actor_type":"researcher","attribution":"Self-disclosed by Cyata; fixes acknowledged by Anthropic","motive":"Security research; no in-the-wild exploitation reported","vector":"Prompt injection via malicious README, issue text or webpage steering an agent to call git_init, git_diff with injected flags, or out-of-scope repository paths","root_cause":"Missing path validation on repo_path, unrestricted git_init and unsanitized git_diff target argument passed to the git CLI","timeline":[{"date":"2025-06","event":"Cyata begins reporting the issues to Anthropic (June-July)"},{"date":"2025-12-18","event":"Anthropic releases mcp-server-git 2025.12.18 fixing all three flaws"},{"date":"2026-01-20","event":"Cyata and media publish details"}],"impact":"Proof of concept allowing arbitrary file read, file deletion and, chained with the filesystem MCP server, code execution on agent hosts. No victims reported.","response":"Anthropic validated repository paths, removed the git_init tool and fixed argument injection; users told to upgrade to 2025.12.18 or later.","status":"patched","cve":"CVE-2025-68143, CVE-2025-68144, CVE-2025-68145","sources":[{"name":"OECD AI Incidents Monitor","url":"https://oecd.ai/en/incidents/2026-01-20-c1f6"},{"name":"The Register","url":"https://www.theregister.com/2026/01/20/anthropic_prompt_injection_flaws/"},{"name":"SecurityWeek","url":"https://www.securityweek.com/anthropic-mcp-server-flaws-lead-to-code-execution-data-exposure/"},{"name":"Infosecurity Magazine","url":"https://www.infosecurity-magazine.com/news/prompt-injection-bugs-anthropic/"}]},{"id":"bizarre-bazaar-llmjacking","date":"2026-01-28","title":"Operation Bizarre Bazaar: hijacked LLM endpoints resold through commercial marketplace","category":"LLMjacking","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"Exposed Ollama, vLLM and MCP endpoints","loss_usd":null,"summary":"Pillar Security logged ~35,000 attack sessions scanning for exposed AI endpoints, validating access and reselling it via a marketplace covering 30+ LLM providers.","source":"Pillar Security","url":"https://www.pillar.security/blog/operation-bizarre-bazaar-first-attributed-llmjacking-campaign-with-commercial-marketplace-monetization","actor":"Threat actor using aliases Hecker, Sakuya and LiveGamer101","actor_type":"criminal","attribution":"Attributed by Pillar Security based on honeypot telemetry and marketplace infrastructure","motive":"Financial: reselling stolen LLM access through a marketplace","vector":"Shodan and Censys scanning for exposed Ollama, vLLM and MCP endpoints, automated API validation via silver.inc, resale via NeXeonAI storefront","root_cause":"Self-hosted LLM servers and MCP endpoints exposed on default ports without authentication","timeline":[{"date":"2025-12","event":"Pillar honeypots begin logging campaign activity"},{"date":"2026-01","event":"About 35,000 attack sessions recorded across the campaign window"},{"date":"2026-01-28","event":"Pillar Security publishes Operation Bizarre Bazaar report"}],"impact":"Hijacked compute, exposure of prompt data and potential pivoting via MCP servers; marketplace resold access to over 30 LLM providers. No dollar figure reported.","response":"Pillar published indicators of compromise; no takedown or arrests reported.","status":"ongoing","cve":null,"sources":[{"name":"Pillar Security","url":"https://www.pillar.security/blog/operation-bizarre-bazaar-first-attributed-llmjacking-campaign-with-commercial-marketplace-monetization"},{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/hackers-hijack-exposed-llm-endpoints-in-bizarre-bazaar-operation/"},{"name":"SecurityWeek","url":"https://www.securityweek.com/llms-hijacked-monetized-in-operation-bizarre-bazaar/"}]},{"id":"chat-ask-ai-leak","date":"2026-01-29","title":"Chat & Ask AI app leaks ~300M messages from 25M users via open Firebase","category":"Model & data leak","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"Codeway Chat & Ask AI","loss_usd":null,"summary":"A researcher found the popular AI chat wrapper's Firebase rules left full chat histories readable, exposing about 300 million messages tied to more than 25 million users.","source":"Malwarebytes","url":"https://www.malwarebytes.com/blog/news/2026/02/ai-chat-app-leak-exposes-300-million-messages-tied-to-25-million-users","actor":"Independent researcher known as Harry (responsible disclosure)","actor_type":"researcher","motive":"Research; no malicious exploitation reported","attribution":"Self-disclosed by the researcher; reported by Malwarebytes","vector":"Firebase Security Rules set to public, allowing unauthenticated read, write and delete of the chat database","root_cause":"Misconfigured Firebase backend shared across Codeway apps; no access controls on user chat collections","timeline":[{"date":"2026-01-20","event":"Researcher finds the open Firebase backend and reports it to Codeway"},{"date":"2026-01-29","event":"Researcher publishes findings"},{"date":"2026-02-09","event":"Malwarebytes reports the leak"}],"impact":"About 300 million messages tied to roughly 25 million users exposed, including sensitive content such as self-harm and drug queries; data from other Codeway apps also exposed.","response":"Codeway reportedly fixed the rules across its apps within hours of the report; no regulatory action reported.","status":"patched","cve":null,"sources":[{"name":"Malwarebytes","url":"https://www.malwarebytes.com/blog/news/2026/02/ai-chat-app-leak-exposes-300-million-messages-tied-to-25-million-users"},{"name":"Fox News","url":"https://www.foxnews.com/tech/millions-ai-chat-messages-exposed-app-data-leak"},{"name":"Hackmag","url":"https://hackmag.com/news/chat-ask-ai"}]},{"id":"moltbook-db-exposure","date":"2026-02-02","title":"Moltbook AI-agent social network exposes 1.5M agent API tokens","category":"Model & data leak","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"Moltbook","loss_usd":null,"summary":"Wiz found Moltbook's Supabase database lacked row-level security, letting anyone read and write 1.5M agent tokens, 35,000 emails and private messages containing third-party API keys.","source":"BankInfoSecurity","url":"https://www.bankinfosecurity.com/moltbook-gave-everyone-control-every-ai-agent-a-30710","actor":"Wiz Research and researcher Jameson O'Reilly (responsible disclosure)","actor_type":"researcher","attribution":"Self-disclosed by Wiz; Moltbook confirmed and fixed","motive":"Research; no malicious exploitation confirmed","vector":"Supabase API key in client-side JavaScript combined with missing row-level security policies on production tables","root_cause":"Vibe-coded platform shipped without row-level security, so the public anon key granted full read and write access","timeline":[{"date":"2026-01-31","event":"Researchers discover the exposed Supabase database"},{"date":"2026-02-01","event":"Moltbook secures the database within hours with Wiz help"},{"date":"2026-02-02","event":"Wiz publishes findings"}],"impact":"1.5 million agent API tokens, about 35,000 owner emails and private agent messages containing third-party API keys readable and writable; any agent could be impersonated.","response":"Moltbook enabled row-level security and rotated tokens; Wiz deleted data accessed during research.","status":"patched","cve":null,"sources":[{"name":"BankInfoSecurity","url":"https://www.bankinfosecurity.com/moltbook-gave-everyone-control-every-ai-agent-a-30710"},{"name":"Wiz","url":"https://www.wiz.io/blog/exposed-moltbook-database-reveals-millions-of-api-keys"},{"name":"Infosecurity Magazine","url":"https://www.infosecurity-magazine.com/news/moltbook-exposes-user-data-api/"},{"name":"TechRadar","url":"https://www.techradar.com/pro/security/ai-agent-social-media-network-moltbook-is-a-security-disaster-millions-of-credentials-and-other-details-left-unsecured"}]},{"id":"clawhub-malicious-skills","date":"2026-02-04","title":"Over 230 malicious OpenClaw skills on ClawHub push password stealers","category":"AI supply chain","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"OpenClaw agent users","loss_usd":null,"summary":"Researchers found hundreds of ClawHub skills posing as crypto and social tools that told users to install a fake 'AuthTool', delivering infostealers such as AMOS on macOS.","source":"ThaiCERT","url":"https://www.thaicert.or.th/en/2026/02/04/researchers-discover-over-200-malicious-skills-on-openclaw-distributing-password-stealing-malware/","actor":"ClawHavoc operation (unnamed group) plus smaller unrelated uploaders","actor_type":"criminal","attribution":"Koi Security linked 335 of 341 malicious skills to a single coordinated operation it calls ClawHavoc; no named group","motive":"Financial: credential and crypto wallet theft via infostealers","vector":"Fake Prerequisites sections in skill docs instructing users to download password-protected ZIPs or run obfuscated scripts delivering AMOS and other stealers","root_cause":"Unvetted skill marketplace with no code review; users trusting install instructions for crypto and social tools","timeline":[{"date":"2026-01-27","event":"First wave of malicious skill uploads to ClawHub"},{"date":"2026-02-01","event":"Koi Security completes audit of 2,857 skills, flagging 341"},{"date":"2026-02-04","event":"Findings published; OpenClaw adds user reporting"}],"impact":"341 malicious skills identified, over 100 posing as crypto tools; payloads included AMOS stealer, reverse shells and config exfiltration. Infection counts not confirmed.","response":"Malicious skills removed from ClawHub; OpenClaw maintainer added a reporting feature; Koi published indicators.","status":"contained","cve":null,"sources":[{"name":"ThaiCERT","url":"https://www.thaicert.or.th/en/2026/02/04/researchers-discover-over-200-malicious-skills-on-openclaw-distributing-password-stealing-malware/"},{"name":"The Hacker News","url":"https://thehackernews.com/2026/02/researchers-find-341-malicious-clawhub.html"},{"name":"SC World","url":"https://www.scworld.com/news/openclaw-agents-targeted-with-341-malicious-clawhub-skills"}]},{"id":"unc1069-deepfake-zoom","date":"2026-02-09","title":"North Korea's UNC1069 uses AI deepfake video in fake Zoom calls against crypto firms","category":"Deepfake fraud","direction":"with-ai","severity":"high","country":"GL","region":"Global","target":"Fintech and crypto companies","loss_usd":null,"summary":"Mandiant tied a fintech intrusion to DPRK-linked UNC1069, which paired a hijacked Telegram account, a spoofed Zoom meeting with AI-generated video, and ClickFix lures to plant macOS malware.","source":"The Record","url":"https://therecord.media/north-korean-hackers-targeted-crypto-exec-clickfix","actor":"UNC1069 (North Korea-linked, aka Masan)","actor_type":"state","attribution":"Attributed by Mandiant with high confidence to a DPRK-nexus group tracked since 2018","motive":"Cryptocurrency theft and harvesting identities for future social engineering","vector":"Compromised executive Telegram account, Calendly link to spoofed Zoom page with AI-generated video of a CEO, ClickFix command installing macOS loaders","root_cause":"Trust in known contacts on messaging apps and willingness to run pasted terminal commands to fix a fake meeting issue","timeline":[{"date":"2025-11","event":"GTIG notes UNC1069 using Gemini for wallet-targeting scripts and lures"},{"date":"2026-02-09","event":"Mandiant publishes intrusion analysis with new SILENCELIFT, DEEPBREATH and CHROMEPUSH malware"}],"impact":"Seven macOS malware families on one victim host; credentials, browser data, session tokens, Keychain items, Telegram data and Apple Notes collected. Losses not disclosed.","response":"Mandiant incident response, publication of indicators and hardening guidance on unsigned script execution.","status":"ongoing","cve":null,"sources":[{"name":"The Record","url":"https://therecord.media/north-korean-hackers-targeted-crypto-exec-clickfix"},{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/north-korean-hackers-use-new-macos-malware-in-crypto-theft-attacks/"},{"name":"SOC Prime","url":"https://socprime.com/active-threats/unc1069-targets-cryptocurrency-sector/"}]},{"id":"gtig-gemini-state-misuse","date":"2026-02-12","title":"Google: state hackers use Gemini across all attack stages; 100K-prompt extraction try","category":"State actor AI ops","direction":"with-ai","severity":"medium","country":"GL","region":"Global","target":"Google Gemini / multiple sectors","loss_usd":null,"summary":"GTIG reported Chinese, Iranian, North Korean and Russian groups using Gemini for recon, exploit research and lures, and blocked a 100,000+ prompt campaign to extract its reasoning.","source":"BleepingComputer","url":"https://bleepingcomputer.com/news/security/google-says-hackers-are-abusing-gemini-ai-for-all-attacks-stages/","actor":"APT31, Temp.HEX, APT42, UNC2970 and Russian groups; unnamed distillers","actor_type":"state","attribution":"Attributed by Google Threat Intelligence Group; distillation campaign actors not publicly named","motive":"Espionage support (recon, lures, exploit research) and intellectual property theft via model extraction","vector":"Abuse of legitimate Gemini accounts and APIs; reasoning trace coercion prompts to extract internal chain of thought","root_cause":"General-purpose AI assistants accessible to state actors; API access enables large-scale output harvesting for distillation","timeline":[{"date":"2025-11","event":"Previous GTIG AI Threat Tracker covers PROMPTFLUX-era findings"},{"date":"2026-02-12","event":"GTIG publishes report on state misuse and a 100,000-plus prompt extraction campaign"}],"impact":"No breakthrough capabilities observed; Google says extraction attempt was flagged in real time and reasoning traces protected. Accounts and infrastructure disabled.","response":"Google disabled abusive accounts and infrastructure, hardened Gemini classifiers and warned of takedowns and legal action.","status":"contained","cve":null,"sources":[{"name":"BleepingComputer","url":"https://bleepingcomputer.com/news/security/google-says-hackers-are-abusing-gemini-ai-for-all-attacks-stages/"},{"name":"SecurityBrief","url":"https://securitybrief.co.uk/story/google-warns-of-ai-model-theft-state-backed-misuse"},{"name":"TechInformed","url":"https://techinformed.com/google-disrupts-gemini-model-extraction-attempts/"}]},{"id":"cline-cli-openclaw","date":"2026-02-17","title":"Compromised Cline CLI npm release silently installs OpenClaw agent","category":"AI supply chain","direction":"on-ai","severity":"medium","country":"GL","region":"Global","target":"Cline CLI users","loss_usd":null,"summary":"A stolen npm token was used to publish cline@2.3.0 with a postinstall script that globally installed the OpenClaw agent; it was live about 8 hours and downloaded ~4,000 times.","source":"Dark Reading","url":"https://www.darkreading.com/application-security/supply-chain-attack-openclaw-cline-users","actor":"Unknown party using a stolen npm publish token","actor_type":"unknown","attribution":"No public attribution; Cline says a compromised npm token was used. One vendor report ties it to prior AI triage workflow research by Adnan Khan","moti
