<style>
  /* Situation Room: dark by default, day mode via data-theme="light". Map is the stage; panel floats over it on wide screens, stacks below on phones. */
  :root {
    --bg: #0b1220; --surface: #121a2b; --surface2: #0e1627; --ink: #e6edf5; --muted: #8b9bb1; --line: #1c2740; --line2: #263450;
    --ocean: #0b1220; --land: #223049; --land-hit: #3a4f70; --accent: #f5b942; --accent-ink: #0b1220; --accent-soft: rgba(245,185,66,0.15);
    --crit: #ff5d62; --high: #ff9a4c; --med: #e0bf47; --low: #8e9aa7; --up: #4fc384; --down: #ff5d62; --pin-ink: #0b1220; --halo: .32; --glass: rgba(18,26,43,0.86);
    --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
    --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #eef2f7; --surface: #ffffff; --surface2: #f6f8fb; --ink: #0f1a2b; --muted: #5b6b80; --line: #d9e0ea; --line2: #c5cfdd;
    --ocean: #e3e9f1; --land: #c6d1de; --land-hit: #93a7c0; --accent: #b7791f; --accent-ink: #ffffff; --accent-soft: rgba(183,121,31,0.14);
    --crit: #c62828; --high: #d2691e; --med: #a08200; --low: #6a7683; --up: #1f7a4d; --down: #c62828; --pin-ink: #ffffff; --halo: .22; --glass: rgba(255,255,255,0.9);
    color-scheme: light;
  }
  html[lang="ar"] { --f-body: "IBM Plex Sans Arabic", "IBM Plex Sans", system-ui, sans-serif; --f-display: "IBM Plex Sans Arabic", system-ui, sans-serif; }
  html[lang="zh"] { --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; --f-display: "Noto Sans SC", "PingFang SC", system-ui, sans-serif; }
  body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
  .wrap { max-width: 1400px; margin: 0 auto; padding-inline: clamp(16px, 2.5vw, 32px); padding-block: 12px 40px; display: grid; gap: 18px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :is(.chip, .pin, .ww, a, button, select, textarea, input):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Top bar */
  .bar { display: flex; align-items: center; gap: 10px 22px; border-bottom: 1px solid var(--line); padding-bottom: 12px; flex-wrap: wrap; }
  .brand { font-family: var(--f-display); font-weight: 800; font-size: 19px; letter-spacing: -.01em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; }
  html[lang="ar"] .brand, html[lang="zh"] .brand { text-transform: none; }

  .brand .ring { transform-box: fill-box; transform-origin: center; }
  @media (prefers-reduced-motion: no-preference) { .brand .ring { animation: ping2 2.4s ease-out infinite; } @keyframes ping2 { 0% { transform: scale(.55); opacity: .9; } 100% { transform: scale(1.7); opacity: 0; } } }
  nav.views { display: flex; gap: 4px; flex-wrap: wrap; }
  nav.views a { font: 500 14px var(--f-body); color: var(--muted); text-decoration: none; padding: 8px 14px; border-radius: 999px; min-height: 36px; display: inline-flex; align-items: center; }
  nav.views a:hover { color: var(--ink); background: var(--surface); }
  nav.views a[aria-current="page"] { color: var(--accent-ink); background: var(--accent); font-weight: 600; }
  .bar-right { margin-inline-start: auto; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .fresh { font: 12px var(--f-mono); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: .04em; }
  .fresh::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--up); }
  .fresh.stale::before { background: var(--high); }
  html[lang="ar"] .fresh, html[lang="zh"] .fresh { font-family: var(--f-body); letter-spacing: 0; text-transform: none; }
  .lang { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .lang select, .iconbtn { font: 500 13px var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line2); border-radius: 8px; padding: 0 10px; min-height: 36px; cursor: pointer; }
  .iconbtn { display: inline-flex; align-items: center; gap: 6px; }
  .iconbtn svg { width: 16px; height: 16px; }
  .notice { font-size: 12px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line2); border-radius: 6px; padding: 6px 10px; }

  /* Hero: map + overlays + floating panel */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
  @media (min-width: 1100px) { .hero { grid-template-columns: minmax(0, 1fr) 380px; } }
  .mapbox { position: relative; background: var(--surface2); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; padding-bottom: 44px; min-width: 0; }
  #globe { width: 100%; height: auto; display: block; }
  .sphere { fill: var(--ocean); }
  .grat { fill: none; stroke: var(--line); stroke-width: .5; }
  .country { fill: var(--land); stroke: var(--bg); stroke-width: .5; transition: fill .2s; }
  .country.hit { fill: var(--land-hit); }
  .pin { cursor: pointer; outline: none; }
  .pin .dot { stroke: var(--bg); stroke-width: 1.5; }
  .pin .halo { opacity: var(--halo); transition: opacity .15s; }
  .pin text { font: 600 11px var(--f-mono); fill: var(--pin-ink); text-anchor: middle; pointer-events: none; }
  .pin.active .halo, .pin.lit .halo, .pin:hover .halo { opacity: .6; }
  .pin.active .dot { stroke: var(--ink); stroke-width: 2; }
  [data-sev="critical"] { --c: var(--crit); } [data-sev="high"] { --c: var(--high); }
  [data-sev="medium"] { --c: var(--med); } [data-sev="low"] { --c: var(--low); }
  .pin .dot, .pin .halo { fill: var(--c); }
  @media (prefers-reduced-motion: no-preference) {
    .pin.newest .halo { animation: ping 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ping { 0% { transform: scale(.8); opacity: .6; } 100% { transform: scale(2); opacity: 0; } }
  }
  .pin.draft .dot { stroke-dasharray: 3 2; stroke: var(--ink); fill-opacity: .55; }
  .overlay-top { order: -1; padding: 16px 18px 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px 16px; flex-wrap: wrap; }
  .stats { display: flex; flex-wrap: wrap; gap: 6px 30px; font-variant-numeric: tabular-nums; }
  .stat { display: grid; gap: 4px; }
  .stat b { font-family: var(--f-display); font-size: clamp(28px, 3vw, 44px); font-weight: 800; line-height: 1; letter-spacing: -.02em; }
  .stat span { font: 11px var(--f-mono); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
  html[lang="ar"] .stat span, html[lang="zh"] .stat span { font-family: var(--f-body); letter-spacing: 0; text-transform: none; }
  .stat.crit b { color: var(--crit); } .stat.gold b { color: var(--accent); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px 14px; justify-content: flex-end; }
  .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .group > span { font: 11px var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-inline-end: 2px; }
  html[lang="ar"] .group > span, html[lang="zh"] .group > span { font-family: var(--f-body); letter-spacing: 0; text-transform: none; }
  .chip { font: 500 13px/1 var(--f-body); color: var(--ink); background: var(--glass); border: 1px solid var(--line2); border-radius: 999px; padding: 0 12px; min-height: 36px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; backdrop-filter: blur(6px); }
  .chip:hover { border-color: var(--muted); }
  .chip[aria-pressed="true"][data-sev] { border-color: var(--c); background: color-mix(in srgb, var(--c) 16%, var(--glass)); }
  .chip[aria-pressed="true"]:not([data-sev]) { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
  .chip[aria-pressed="false"] { color: var(--muted); }
  .chip[aria-pressed="false"] .sw { opacity: .3; }
  .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .ww { display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line2); border-radius: 10px; padding: 8px 12px 8px 8px; cursor: pointer; font: inherit; color: var(--ink); text-align: start; margin: 10px 18px 0; max-width: 360px; }
  .ww:hover, .ww.active, .ww.lit { border-color: var(--c); }
  .ww .disc { width: 34px; height: 34px; border-radius: 50%; background: var(--c); color: var(--pin-ink); display: grid; place-items: center; font: 600 13px var(--f-mono); flex: none; }
  .ww strong { display: block; font-size: 13px; }
  .ww small { display: block; font-size: 12px; color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 11px var(--f-mono); color: var(--muted); padding: 8px 18px 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  html[lang="ar"] .legend, html[lang="zh"] .legend { font-family: var(--f-body); }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 6px 10px; font-size: 13px; white-space: nowrap; transform: translate(-50%, calc(-100% - 12px)); z-index: 3; }
  html[dir="rtl"] .tip { transform: translate(50%, calc(-100% - 12px)); }
  .tip small { color: inherit; opacity: .75; font-family: var(--f-mono); font-size: 11px; }
  .ticker { position: absolute; inset-inline: 0; bottom: 0; height: 44px; background: color-mix(in srgb, var(--bg) 92%, transparent); border-top: 1px solid var(--line); display: flex; align-items: center; overflow: hidden; }
  .ticker .lbl { flex: none; background: var(--accent); color: var(--accent-ink); font: 700 11px var(--f-mono); letter-spacing: .1em; padding: 0 14px; height: 100%; display: inline-flex; align-items: center; z-index: 1; }
  .ticker .track { display: flex; gap: 32px; white-space: nowrap; padding-inline-start: 16px; font: 12px var(--f-mono); color: var(--ink); will-change: transform; }
  .ticker .track a { color: inherit; text-decoration: none; }
  .ticker .track a:hover { color: var(--accent); }
  .ticker .track b { color: var(--accent); font-weight: 500; margin-inline-end: 6px; }
  html[lang="ar"] .ticker .track, html[lang="zh"] .ticker .track { font-family: var(--f-body); }
  @media (prefers-reduced-motion: no-preference) { .ticker .track { animation: slide var(--dur, 60s) linear infinite; } .ticker:hover .track { animation-play-state: paused; } @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-50%); } } html[dir="rtl"] .ticker .track { animation-name: slide-rtl; } @keyframes slide-rtl { from { transform: translateX(0); } to { transform: translateX(50%); } } }
  @media (prefers-reduced-motion: reduce) { .ticker { overflow-x: auto; } }

  .panel { background: var(--glass); backdrop-filter: blur(8px); border: 1px solid var(--line2); border-radius: 12px; display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; }
  @media (min-width: 1100px) { .panel { position: sticky; top: 12px; max-height: calc(100vh - 24px); } }
  @media (max-width: 1099px) { .panel { max-height: 70vh; grid-template-rows: auto auto minmax(0, 1fr); } .panel::before { content: ""; width: 40px; height: 4px; border-radius: 2px; background: var(--line2); margin: 10px auto 0; } }
  .phead { padding: 12px 16px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
  .phead-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .phead h2 { font-family: var(--f-display); font-weight: 700; font-size: 18px; margin: 0; line-height: 1.15; }
  .phead p { margin: 0; color: var(--muted); font-size: 12.5px; }
  .reset { font: 500 12px var(--f-mono); color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap; letter-spacing: .06em; text-transform: uppercase; }
  .reset:hover { text-decoration: underline; }
  .pmeta { display: flex; flex-wrap: wrap; gap: 4px 14px; font: 11px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .pmeta b { color: var(--ink); font-weight: 500; }
  .list { overflow-y: auto; padding: 8px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; align-content: start; }
  .empty { padding: 20px 10px; color: var(--muted); font-size: 14px; }

  .card { padding: 12px 14px; background: var(--surface2); border: 1px solid var(--line2); border-inline-start: 3px solid var(--c); border-radius: 10px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; position: relative; cursor: pointer; min-width: 0; }
  .card:hover { border-color: var(--c); }
  .card.draft { border-inline-start-style: dashed; }
  .cmeta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font: 11px var(--f-mono); color: var(--muted); }
  html[lang="ar"] .cmeta, html[lang="zh"] .cmeta { font-family: var(--f-body); }
  .sev { color: var(--c); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .card h3 { margin: 0; font-size: 14px; line-height: 1.35; font-weight: 600; }
  .card h3 a { color: var(--ink); text-decoration: none; }
  .card h3 a:hover { text-decoration: underline; text-decoration-color: var(--c); text-underline-offset: 3px; }
  .card p { margin: 0; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .facts { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; }
  .facts span { color: var(--muted); }
  .facts b { font-weight: 500; color: var(--ink); }
  .open { justify-self: start; display: inline-flex; gap: 6px; align-items: center; font: 500 12.5px var(--f-body); color: var(--accent); text-decoration: none; border: 1px solid var(--line2); border-radius: 8px; padding: 0 10px; min-height: 34px; background: transparent; cursor: pointer; }
  .open:hover { border-color: var(--accent); }
  .open.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .cactions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font: 500 10.5px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 8px; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .unv { display: inline-flex; align-items: center; gap: 5px; font: 500 10.5px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--high); border: 1px dashed var(--high); border-radius: 999px; padding: 2px 8px; }
  html[lang="ar"] .unv, html[lang="zh"] .unv, html[lang="ar"] .badge, html[lang="zh"] .badge { font-family: var(--f-body); letter-spacing: 0; }

  /* Home cards */
  .home { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .hcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }

  html[lang="ar"] .hcard .k, html[lang="zh"] .hcard .k { font-family: var(--f-body); letter-spacing: 0; text-transform: none; }

  .hcard .big small { font-size: 15px; font-weight: 600; color: var(--up); margin-inline-start: 8px; letter-spacing: 0; }
  .hcard .sub { color: var(--muted); font-size: 13px; }
  .hcard h3 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 20px; line-height: 1.2; }
  .hcard .row { display: flex; justify-content: space-between; font-size: 14px; border-bottom: 1px solid var(--line); padding: 6px 0; }
  .hcard .row:last-of-type { border-bottom: 0; }
  .hcard .row .tk { font: 12px var(--f-mono); color: var(--muted); margin-inline-start: 6px; }
  .hcard .row .pct { font-family: var(--f-mono); }
  .hcard .cta { margin-top: auto; align-self: flex-start; text-decoration: none; font-weight: 600; font-size: 13px; background: var(--line); color: var(--ink); padding: 0 14px; border-radius: 8px; min-height: 40px; display: inline-flex; align-items: center; border: 0; cursor: pointer; }
  .hcard a.link { margin-top: auto; align-self: flex-start; text-decoration: none; font-weight: 600; font-size: 13px; color: var(--accent); min-height: 40px; display: inline-flex; align-items: center; }

  .alerts button { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px; font: 600 14px var(--f-body); padding: 0 16px; min-height: 44px; cursor: pointer; }

  footer { font-size: 12px; color: var(--muted); max-width: 90ch; }

  /* Phone */
  .tabbar { display: none; }
  @media (max-width: 1099px) {
    .mapbox { display: flex; flex-direction: column; min-height: 0; padding-bottom: 44px; }

on":"Identified by police from phone and vehicle evidence; deceased by self-inflicted gunshot","motive":"Personal and political grievances described in a manifesto on his phone","vector":"Queries to ChatGPT about explosives, ammunition and fireworks; vehicle loaded with mortars and fuel canisters","root_cause":"General-purpose chatbot answered questions whose intent was not evident; safeguards did not prevent the planning","timeline":[{"date":"2025-01-01","event":"Cybertruck explodes outside Trump International Hotel"},{"date":"2025-01-07","event":"Police release ChatGPT query details"}],"impact":"Seven people injured; first widely cited case of a US attack planned with a consumer chatbot","response":"OpenAI said it was cooperating with law enforcement and that its models refused harmful instructions and warned the user","status":"resolved","cve":null,"verification":"confirmed","sources":[{"name":"KRDO","url":"https://krdo.com/news/2025/01/07/watch-live-las-vegas-metropolitan-police-give-updates-on-cybertruck-explosion/"},{"name":"KOAA","url":"https://www.koaa.com/news/crime/new-details-on-matthew-livelsberger-man-who-blew-up-cybertruck-in-las-vegas"}]},{"id":"funksec-ai-assisted-ransomware","date":"2025-01-10","title":"Check Point: FunkSec ransomware group built its Rust encryptor with AI assistance","category":"AI-assisted malware","direction":"with-ai","severity":"high","country":"GL","region":"Global","target":"85+ organisations listed on FunkSec leak site","loss_usd":null,"summary":"Check Point Research found that FunkSec, a RaaS group that claimed 85 victims in December 2024, likely developed its Rust encryptor and tooling with AI help, letting an inexperienced author iterate fast.","source":"Check Point Research","url":"https://research.checkpoint.com/2025/funksec-alleged-top-ransomware-group-powered-by-ai/","actor":"FunkSec (DesertStorm persona)","actor_type":"criminal","attribution":"Check Point Research assessed the developer is likely an inexperienced author based in Algeria, citing Ghost Algeria references and upload sources; Kaspersky later made similar AI-code observations.","motive":"Financial extortion mixed with hacktivist posturing; ransom demands as low as 10,000 USD","vector":"Double-extortion ransomware (FunkSec V1.5, Rust) plus Python DDoS tool, HVNC remote access tool and a password scraping tool, all showing AI-generated code traits","root_cause":"Generative AI lowered the skill needed to produce a working encryptor; code had polished English comments while operators showed weak English, and the group ran its own Miniapps chatbot for malicious tasks","timeline":[{"date":"2024-12-01","event":"FunkSec data leak site launches and lists 85 claimed victims within the month"},{"date":"2025-01-10","event":"Check Point Research publishes analysis calling the tooling likely AI-assisted"},{"date":"2025-07-28","event":"Kaspersky publishes its own FunkSec analysis noting LLM-style placeholder comments"}],"impact":"More than 85 claimed victims in about a month, though Check Point judged real impact modest and noted many leaked datasets were recycled from earlier hacktivist leaks. V1.5 was detected by only 3 antivirus engines at upload.","response":"Check Point published IOCs and detection guidance; the report flagged AI-assisted tooling as a sign that novices can produce functional ransomware quickly.","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"Check Point Research","url":"https://research.checkpoint.com/2025/funksec-alleged-top-ransomware-group-powered-by-ai/"},{"name":"The Hacker News","url":"https://thehackernews.com/2025/01/ai-driven-ransomware-funksec-targets-85.html"},{"name":"Infosecurity Magazine","url":"https://www.infosecurity-magazine.com/news/new-ransomware-group-uses-ai/"}]},{"id":"brazil-voiceover-mion-deepfake","date":"2025-01-16","title":"Brasilia police Operacao VoiceOver busts gang using Marcos Mion deepfakes for voucher scam","category":"Deepfake fraud","direction":"with-ai","severity":"medium","country":"BR","region":"Latin America","target":"Brazilian consumers","loss_usd":null,"summary":"The Policia Civil do Distrito Federal arrested three people aged 20 to 23 who used deepfake video and voice of TV host Marcos Mion in sponsored ads for fake Outback discount vouchers sold on cloned sites.","source":"Policia Civil do Distrito Federal","url":"https://www.portaltela.com/noticias/2025/01/16/policia-desarticula-quadrilha-que-usava-deepfake-de-marcos-mion-para-fraudes-digitais/","actor":"Taguatinga-based fraud group","actor_type":"criminal","attribution":"PCDF cybercrime unit identified a group operating from a fake marketing office in Taguatinga; one suspect confessed.","motive":"Payments for non-existent discount vouchers.","vector":"Deepfake videos of Marcos Mion in paid social media ads directing victims to cloned sites that collected payments to gang-controlled accounts.","root_cause":"Cheap deepfake tooling plus paid ad distribution of celebrity endorsements.","timeline":[{"date":"2025-01-10","event":"27 complaints about fake Mion promotion received in four days"},{"date":"2025-01-16","event":"Operacao VoiceOver: three arrested, four search warrants served"},{"date":"2025-05-07","event":"Second phase: 24-year-old site builder arrested in Santa Helena de Goias"}],"impact":"Dozens of victims; two imported vehicles and electronics seized; combined charges carry up to 21 years.","response":"Arrests, account freezes and charges of electronic fraud, criminal association and money laundering.","status":"under investigation","cve":null,"verification":"confirmed","sources":[{"name":"Portal Tela (PCDF)","url":"https://www.portaltela.com/noticias/2025/01/16/policia-desarticula-quadrilha-que-usava-deepfake-de-marcos-mion-para-fraudes-digitais/"},{"name":"Jornal Opcao","url":"https://www.jornalopcao.com.br/ultimas-noticias/jovem-e-preso-em-goias-por-usar-deepfake-de-marcos-mion-em-golpes-com-sites-falsos-705126/"},{"name":"SBT News"," ter withdrawn after online harassment"},{"date":"2025-01-17","event":"Police in La Reunion open probe to trace the receiving accounts"}],"impact":"About 830,000 euros lost; the case became a global reference for AI-enabled celebrity romance fraud and prompted a statement from Pitt's representatives","response":"Criminal complaint filed and investigation opened in La Reunion; Pitt's spokesperson warned fans about unsolicited outreach","status":"under investigation","cve":null,"verification":"reported","sources":[{"name":"AFP via Free Malaysia Today","url":"https://www.freemalaysiatoday.com/category/leisure/2025/01/17/france-launches-probe-into-ai-brad-pitt-scam"},{"name":"Global News","url":"https://globalnews.ca/news/10959758/brad-pitt-scam"}]},{"id":"ghostgpt-criminal-chatbot","date":"2025-01-23","title":"GhostGPT: uncensored chatbot sold on Telegram to write malware and phishing for criminals","category":"AI phishing","direction":"with-ai","severity":"medium","country":"GL","region":"Global","target":"Businesses targeted by phishing and BEC","loss_usd":null,"summary":"Abnormal Security documented GhostGPT, a jailbroken LLM wrapper sold via Telegram with a no-logs claim, that produced a convincing DocuSign phishing email on request and is marketed for malware and exploit work.","source":"Abnormal AI","url":"https://abnormal.ai/blog/ghostgpt-uncensored-ai-chatbot","actor":"Unknown","actor_type":"criminal","attribution":"Abnormal Security researchers identified the service on underground forums; operator identity not established.","motive":"Selling uncensored AI access to cybercriminals for profit","vector":"Telegram-delivered chatbot, likely a wrapper around a jailbroken commercial or open-source model, with guardrails removed","root_cause":"Commercial LLM guardrails can be bypassed by wrapper services, giving low-skill actors ready-made phishing and malware generation","timeline":[{"date":"2024-11-01","event":"GhostGPT advertisements accumulate thousands of views on cybercrime forums"},{"date":"2025-01-23","event":"Abnormal Security publishes analysis after testing the tool with a DocuSign phishing request"}],"impact":"Forum posts with thousands of views indicated real criminal demand; the tool lowered the barrier for BEC and phishing lures with no jailbreak skills needed.","response":"Abnormal published indicators and warned defenders; no takedown reported.","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"Abnormal AI","url":"https://abnormal.ai/blog/ghostgpt-uncensored-ai-chatbot"},{"name":"TechRepublic","url":"https://www.techrepublic.com/article/what-is-ghostgpt/"},{"name":"Security Boulevard","url":"https://securityboulevard.com/2025/01/ghostgpt-a-malicious-ai-chatbot-for-hackers"}]},{"id":"storm-1516-bundestag-deepfakes","date":"2025-01-23","title":"Storm-1516 floods German election with 100+ AI-written fake news sites and deepfakes","category":"State actor AI ops","direction":"with-ai","severity":"high","country":"DE","region":"Europe","target":"German Bundestag election candidates and voters","loss_usd":null,"summary":"CORRECTIV and NewsGuard exposed a Russian network of more than 100 German-language fake news sites filled with LLM-rewritten articles and deepfake videos smearing Habeck, Baerbock and Faber before the February 2025 vote.","source":"CORRECTIV","url":"https://correctiv.org/faktencheck/russische-desinformation/2025/01/23/angriff-aus-russland-auf-bundestageswahl-deepfake-ki/","actor":"Storm-1516 (John Mark Dougan network)","actor_type":"state","attribution":"Linked by researchers to Moscow-based former US officer John Mark Dougan and to the GRU; the German government formally blamed Russia and summoned its ambassador in December 2025.","motive":"Undermine trust in pro-Ukraine candidates and influence the Bundestag election.","vector":"Domains registered in waves from November 2024, LLM-rewritten articles, fake whistleblower videos including a face-swap deepfake of FDP politician Marcus Faber, amplified by pro-Russian influencers.","root_cause":"Low cost of LLM content generation and deepfake tooling let a small team run a large synthetic media network ahead of a snap election.","timeline":[{"date":"2024-11-19","event":"First wave of German-language fake news domains registered"},{"date":"2025-01-23","event":"CORRECTIV publishes investigation listing 102 Storm-1516 domains"},{"date":"2025-02-23","event":"Bundestag election held"},{"date":"2025-12-12","event":"German Foreign Office summons Russian ambassador over Storm-1516 interference"}],"impact":"Fabricated abuse and espionage claims against leading candidates circulated on social media; most individual fakes did not go viral but the network persisted into 2026 state elections.","response":"Media fact-checks and domain exposure; German authorities confirmed the operation and summoned Russia's ambassador; Storm-1516 videos reappeared during the 2026 Mecklenburg-Vorpommern vote.","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"CORRECTIV","url":"https://correctiv.org/faktencheck/russische-desinformation/2025/01/23/angriff-aus-russland-auf-bundestageswahl-deepfake-ki/"},{"name":"CORRECTIV","url":"https://correctiv.org/aktuelles/hybride-kriegsfuehrung/2025/12/12/russlands-botschafter-einbestellt-behoerden-bestaetigen-correctiv-recherche-zu-einflussoperation/"},{"name":"ZDFheute","url":"https://www.zdfheute.de/politik/deutschland/faktencheck-manipulierte-stimmzettel-wahl-mecklenburg-vorpommern-100.html"}]},{"id":"indonesia-prabowo-deepfake-aid-scam","date":"2025-01-24","title":"Indonesian police arrest two over deepfake videos of President Prabowo promising cash aid","category":"Deepfake fraud","direction":"with-ai","severity":"medium","country":"ID","region":"Asia-Pacific","target":"Indonesian social media users across 20 provinces","loss_usd":5800,"summary":"Indonesian police arrested suspects AMA and JS for spreading AI videos of President Prabowo, VP Gibran and M -by-the-police"},{"name":"OECD.AI Incidents Monitor","url":"https://oecd.ai/en/incidents/2025-04-24-4595"}]},{"id":"deepseek-ddos-registration-halt","date":"2025-01-28","title":"DeepSeek halts new sign-ups after month-long DDoS and brute-force campaign peaks","category":"LLMjacking","direction":"on-ai","severity":"high","country":"CN","region":"Asia-Pacific","target":"DeepSeek chat and API services","loss_usd":null,"summary":"DeepSeek said its services were under large-scale malicious attack on 28 January 2025 and limited sign-ups to Chinese mobile numbers; Qi An Xin XLab traced a month of escalating DDoS and brute-force traffic.","source":"The Paper (澎湃新闻)","url":"https://www.thepaper.cn/newsDetail_forward_30058949","actor":"Unknown","actor_type":"unknown","attribution":"Qi An Xin XLab said attack and brute-force IPs were located in the United States; no group was named and DeepSeek did not attribute the attack.","motive":"Unknown; analysts suggested disruption of the newly popular R1 service.","vector":"Three phases: HTTP proxy floods from 3 January, SSDP and NTP reflection amplification from 20 January, then application-layer HTTP proxy attacks and password brute-forcing peaking 27 to 28 January.","root_cause":"Sudden global demand for DeepSeek R1 outpaced the startup's DDoS mitigation and account-protection capacity.","timeline":[{"date":"2025-01-03","event":"XLab observes first suspected HTTP proxy attacks against DeepSeek"},{"date":"2025-01-27","event":"Application-layer attacks surge; DeepSeek reports degraded web and API performance"},{"date":"2025-01-28","event":"DeepSeek status page cites large-scale malicious attack and restricts registration to +86 numbers"},{"date":"2025-01-29","event":"The Paper publishes Qi An Xin XLab analysis of the three attack phases"}],"impact":"Hours of outages and degraded API performance for users worldwide; new registrations blocked for non-Chinese phone numbers; existing users could still log in.","response":"DeepSeek switched IP addresses at 00:58 on 28 January, restricted sign-ups and restored service in stages; no user-data theft was confirmed.","status":"resolved","cve":null,"verification":"confirmed","sources":[{"name":"The Paper (澎湃新闻)","url":"https://www.thepaper.cn/newsDetail_forward_30058949"},{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/deepseek-halts-new-signups-amid-large-scale-cyberattack"},{"name":"GIGAZINE","url":"https://gigazine.net/gsc_news/en/20250128-deepseek-large-scale-cyber-attack"}]},{"id":"deepseeek-pypi-packages","date":"2025-01-29","title":"Fake 'deepseeek' and 'deepseekai' PyPI packages steal secrets from DeepSeek developers","category":"AI supply chain","direction":"on-ai","severity":"medium","country":"GL","region":"Global","target":"Developers integrating the DeepSeek API","loss_usd":null,"summary":"Two PyPI packages posing as DeepSeek client libraries harvested user, host and environment-variable data to a Pipedream endpoint; they were pulled within an hour after a few hundred downloads.","source":"Positive Technologies PT ESC","url":"https://global.ptsecurity.com/research/pt-esc-threat-intelligence/malicious-packages-deepseeek-and-deepseekai-published-in-python-package-index","actor":"PyPI account 'bvk'","actor_type":"criminal","attribution":"Uploaded by the dormant PyPI account 'bvk' created in June 2023; PT ESC noted code comments suggesting the payload was written with an AI assistant. No further attribution.","motive":"Theft of API keys, cloud and database credentials stored in developer environment variables","vector":"Typosquatted PyPI packages riding DeepSeek hype; payload ran when the deepseeek or deepseekai CLI commands were executed and exfiltrated via Pipedream","root_cause":"Open package registry with no vetting of trending-name lookalikes; developers installing unofficial SDKs for a newly popular model","timeline":[{"date":"2025-01-29","event":"deepseeek 0.0.8 published at 15:52 UTC and deepseekai 0.0.8 at 16:13 UTC"},{"date":"2025-01-29","event":"PT ESC detects the packages within minutes and alerts PyPI, which removes them"},{"date":"2025-02-03","event":"PT ESC publishes analysis; press reports over 200 downloads, more than 100 from the United States"}],"impact":"PT counted 36 downloads via pip and bandersnatch plus 186 via browsers and other tools before removal; any victim's environment variables and host details were sent to the attacker","response":"PyPI administrators deleted both packages within about an hour of notification; PT ESC published indicators and advised victims to rotate exposed credentials","status":"resolved","cve":null,"verification":"confirmed","sources":[{"name":"Positive Technologies PT ESC","url":"https://global.ptsecurity.com/research/pt-esc-threat-intelligence/malicious-packages-deepseeek-and-deepseekai-published-in-python-package-index"},{"name":"SecurityWeek","url":"https://www.securityweek.com/developers-targeted-with-malware-disguised-as-deepseek-package/"},{"name":"Help Net Security","url":"https://www.helpnetsecurity.com/2025/02/03/deepseeks-popularity-exploited-to-push-malicious-packages-via-pypi/"}]},{"id":"deepseek-db-exposure","date":"2025-01-29","title":"DeepSeek leaves ClickHouse database with chat logs and API secrets open","category":"Model & data leak","direction":"on-ai","severity":"high","country":"CN","region":"Asia-Pacific","target":"DeepSeek","loss_usd":null,"summary":"Wiz found a publicly reachable DeepSeek ClickHouse database exposing over a million log lines including user chat history, API secrets and backend details; it was locked down after disclosure.","source":"Wiz Research","url":"https://www.wiz.io/blog/wiz-research-uncovers-exposed-deepseek-database-leak","actor":"Misconfiguration by DeepSeek; found by Wiz Research (responsible disclosure)","actor_type":"accident","attribution":"Self-evident misconfiguration; discovered and disclosed by Wiz Research, which notified DeepSeek before publishing","motive":"None (accidental exposure); Wiz motive was security research","vector":"Unauthenticated ClickHouse database reachable on ports 8123 and 9000 at oauth2callback.deepseek.com and dev.deepseek.com, queried via the HTTP interface","root_cause":"Internal ClickHouse log database deployed with no authentication and exposed to the public internet; sensitive data (chat history, API keys) written to plaintext logs","timeline":[{"date":"2025-01-06","event":"Oldest entries in the exposed log_stream table are dated from this day"},{"date":"2025-01","event":"Wiz Research finds the open database within minutes while assessing DeepSeek's external attack surface"},{"date":"2025-01-29","event":"Wiz publishes findings after DeepSeek promptly locks down the database following disclosure"},{"date":"2025-01-30","event":"Wide press coverage (BleepingComputer, Fortune) amid scrutiny of DeepSeek's security and privacy posture"}],"impact":"Over one million log lines exposed: user chat history, API secret keys, backend details and operational metadata; Wiz said an attacker could have taken full control of the database and potentially escalated privileges","response":"DeepSeek secured the database promptly after Wiz's disclosure; no public statement from DeepSeek on whether anyone else accessed the data","status":"resolved","cve":null,"verification":"reported","sources":[{"name":"Wiz Research","url":"https://www.wiz.io/blog/wiz-research-uncovers-exposed-deepseek-database-leak"},{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/deepseek-ai-exposed-databases-with-user-chat-history-api-keys/"},{"name":"Fortune","url":"https://fortune.com/2025/01/31/deepseek-sensitive-information-exposed-wiz-researchers"}]},{"id":"openai-deepseek-distillation","date":"2025-01-29","title":"OpenAI says it has evidence DeepSeek distilled its models through blocked API accounts","category":"Model & data leak","direction":"on-ai","severity":"medium","country":"CN","region":"Asia-Pacific","target":"OpenAI models (via API)","loss_usd":null,"summary":"OpenAI told the Financial Times it found signs DeepSeek used its outputs to train a rival in breach of its terms; Microsoft reportedly saw accounts pulling large data volumes via the API and blocked them. No proof shown.","source":"Financial Times / Bloomberg","url":"https://www.eweek.com/news/openai-accuses-deepseek/","actor":"DeepSeek (alleged)","actor_type":"unknown","attribution":"Alleged by OpenAI and reported via anonymous Microsoft sources; DeepSeek did not respond; evidence not published","motive":"Alleged low-cost model training via distillation","vector":"High-volume API queries from accounts later attributed to DeepSeek","root_cause":"Model outputs available via API can be used as training data in breach of terms of service","timeline":[{"date":"2024-10","event":"Microsoft security reportedly notices unusual API extraction"},{"date":"2025-01-29","event":"OpenAI tells the FT it has evidence of distillation"},{"date":"2025-01-29","event":"White House adviser David Sacks says there is substantial evidence"}],"impact":"Unknown; dispute over intellectual property and terms of service","response":"OpenAI and Microsoft blocked suspected accounts; OpenAI said it was working with the US government","status":"unresolved","cve":null,"verification":"disputed","sources":[{"name":"eWeek","url":"https://www.eweek.com/news/openai-accuses-deepseek/"},{"name":"Computing","url":"https://computing.co.uk/news/2025/ai/openai-deepseek-stealing-ip"},{"name":"The Decoder","url":"https://the-decoder.com/?p=20884"}]},{"id":"thailand-poipet-ai-police-scam","date":"2025-02-04","title":"Thai police arrest two from Poipet gang using AI face-altering to pose as police","category":"Deepfake fraud","direction":"with-ai","severity":"high","country":"TH","region":"Asia-Pacific","target":"Thai residents including beauty queen Charlotte Austin","loss_usd":118000,"summary":"Thai police arrested two members of a Poipet, Cambodia call centre that used AI to alter faces on video calls while posing as police; 163 victims, including Charlotte Austin who lost 4 million baht (about $118,000).","source":"Bangkok Post","url":"https://www.bangkokpost.com/thailand/general/2953450/two-men-arrested-for-alleged-b4m-ai-aided-scam-against-beauty-queen","actor":"Poipet-based call-centre gang run by Chinese leaders with Thai members","actor_type":"criminal","attribution":"Thai police arrested Ramil Pantawong and Thanawut Kanyaphan as alleged gang members; scripts said to come from Chinese gang leaders in Cambodia","motive":"Financial gain through law-enforcement impersonation fraud","vector":"Video calls in which scammers used AI face-altering tools to appear as uniformed Thai police officers, telling victims they were under investigation and must transfer funds","root_cause":"Real-time AI face manipulation defeated victims' visual verification of officials; cross-border scam compounds beyond Thai jurisdiction","timeline":[{"date":"2025-01","event":"Charlotte Austin transfers 4 million baht after video calls with fake police officers"},{"date":"2025-02-04","event":"Thai police announce two arrests and identify at least 163 victims of the Poipet gang"}],"impact":"At least 163 victims; the most prominent lost about 4 million baht; total losses not published","response":"Two arrests in Thailand; investigation into the Cambodia-based operation continued","status":"under investigation","cve":null,"verification":"confirmed","sources":[{"name":"Bangkok Post","url":"https://www.bangkokpost.com/thailand/general/2953450/two-men-arrested-for-alleged-b4m-ai-aided-scam-against-beauty-queen"},{"name":"South China Morning Post","url":"https://www.scmp.com/week-asia/people/article/3297396/ai-assisted-scam-costs-thai-beauty-queen-us118000-two-arrested"},{"name":"AI Incident Database","url":"https://incidentdatabase.ai/cite/918/"}]},{"id":"mexico-condusef-voice-clone-alert","date":"2025-02-06","title":"Mexico's Condusef warns of AI voice-cloning calls used to request large bank transfers","category":"Deepfake fraud","direction":"with-ai","severity":"low","country":"MX","region":"Latin America","target":"Mexican bank customers","loss_usd":null,"summary":"Financial consumer regulator Condusef alerted the public that fraudsters were using AI to clone familiar voices in phone calls, typically to request large bank transfers, and linked it to a parallel WhatsApp scam.","source":"Condusef via Posta","url":"https://www.posta.com.mx/share/condusef-alerta-sobre-fraude-de-clonacion-de-voz-con-inteligencia-artificial/vl1753226","actor":"Unknown","actor_type":"criminal","attribution":"Unknown.","motive":"Fraudulent bank transfers.","vector":"Phone calls using AI-cloned voices of relatives or acquaintances.","root_cause":"Voice samples available from social media and messaging.","timeline":[{"date":"2025-01-14","event":"Condusef warns of WhatsApp fraud using AI-generated voice notes"},{"date":"2025-02-06","event":"Condusef publishes voice-cloning phone fraud alert"}],"impact":"No case counts or losses published.","response":"Public awareness alert.","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"Posta (citing Condusef)","url":"https://www.posta.com.mx/share/condusef-alerta-sobre-fraude-de-clonacion-de-voz-con-inteligencia-artificial/vl1753226"},{"name":"Record","url":"https://www.record.com.mx/contra/condusef-alerta-por-clonacion-de-voz-con-ia-que-suplanta-tus-familiares"}]},{"id":"nullifai-hugging-face-pickle","date":"2025-02-06","title":"nullifAI: broken-pickle models on Hugging Face evade Picklescan and carry reverse shells","category":"AI supply chain","direction":"on-ai","severity":"medium","country":"GL","region":"Global","target":"Hugging Face Hub users loading PyTorch models","loss_usd":null,"summary":"ReversingLabs found two Hugging Face models whose 7z-compressed, deliberately corrupted pickle streams hid a reverse shell to a hard-coded IP while passing Hugging Face's Picklescan checks.","source":"ReversingLabs","url":"https://www.reversinglabs.com/blog/rl-identifies-malware-ml-model-hosted-on-hugging-face","actor":"Unknown","actor_type":"unknown","attribution":"Uploaded by accounts glockr1 and who-r-u0000; ReversingLabs assessed the models as closer to a proof of concept than an active campaign and did not attribute them","motive":"Unknown; payload gave remote shell access to any machine that deserialised the model","vector":"PyTorch model files packed with 7z instead of ZIP and a pickle stream broken after the malicious opcodes, so scanners errored out before flagging the embedded reverse shell","root_cause":"Pickle deserialisation executes arbitrary code by design; Picklescan stopped analysing on malformed streams and did not recognise non-ZIP archives","timeline":[{"date":"2025-01-20","event":"ReversingLabs reports the two malicious repositories to Hugging Face"},{"date":"2025-01-21","event":"Hugging Face removes the models within 24 hours and updates Picklescan to handle broken pickle files"},{"date":"2025-02-06","event":"ReversingLabs publishes the nullifAI technique write-up with indicators of compromise"}],"impact":"Two models with a platform-aware reverse shell to 107.173.7.141 were publicly hosted and undetected by Picklescan, ProtectAI and ClamAV scanning; no confirmed victims","response":"Hugging Face removed the repositories and patched Picklescan; ReversingLabs published IOCs and urged use of safetensors over pickle-based formats","status":"patched","cve":null,"verification":"confirmed","sources":[{"name":"ReversingLabs","url":"https://www.reversinglabs.com/blog/rl-identifies-malware-ml-model-hosted-on-hugging-face"},{"name":"The Hacker News","url":"https://thehackernews.com/2025/02/malicious-ml-models-found-on-hugging.html"},{"name":"Help Net Security","url":"https://www.helpnetsecurity.com/2025/02/10/malicious-ml-models-found-on-hugging-face-hub/"}]},{"id":"sysdig-llmjacking-deepseek","date":"2025-02-07","title": yments totalling almost EUR 1M, then files a complaint with Milan prosecutors"},{"date":"2025-02-12","event":"Italian police announce the funds were traced to a Dutch account and completely frozen"},{"date":"2025-02-13","event":"ANSA reports two Dutch nationals under investigation; Milan prosecutors probe organised-crime group formation"}],"impact":"Massimo Moratti wired almost EUR 1 million; Giorgio Armani, Patrizio Bertelli and other elites targeted but did not pay; funds later frozen","response":"Moratti filed a complaint; Milan prosecutors opened an organised-crime probe; funds traced and frozen in the Netherlands; two suspects identified","status":"under investigation","cve":null,"verification":"confirmed","sources":[{"name":"Reuters (via Yahoo News)","url":"https://www.yahoo.com/news/italian-police-freeze-cash-ai-191616980.html"},{"name":"ANSA","url":"https://www.ansa.it/english/news/general_news/2025/02/13/two-probed-over-crosetto-fraud-case_32818e79-b700-4d77-a94a-1a8938e7dcee.html"},{"name":"Cyprus Mail (Reuters)","url":"https://cyprus-mail.com/2025/02/12/italian-police-freeze-cash-from-ai-voice-scam-that-targeted-business-leaders"}]},{"id":"openai-cambodia-romance-baiting","date":"2025-02-21","title":"Cambodia-based romance-baiting scam used ChatGPT to generate multilingual social lures","category":"AI phishing","direction":"with-ai","severity":"medium","country":"GL","region":"Asia-Pacific","target":"Social-media users in Japan, China and English markets","loss_usd":null,"summary":"A likely Cambodia-based network translated and generated comments in Japanese, Chinese and English for romance and investment scams, which OpenAI disrupted alongside a separate Urdu-English task scam.","source":"OpenAI","url":"https://cdn.openai.com/threat-intelligence-reports/disrupting-malicious-uses-of-our-models-february-2025-update.pdf","actor":"Unknown Cambodia-based scam network","actor_type":"criminal","attribution":"OpenAI assessed the accounts as likely originating in ations convincing and cheap","timeline":[{"date":"2025-02-21","event":"OpenAI publishes the Deceptive Employment Scheme case"},{"date":"2025-06-09","event":"OpenAI reports a further IT-worker cluster in its June 2025 report"}],"impact":"Fraudulent applications to Western employers; hires and losses not quantified by OpenAI.","response":"Accounts banned; findings shared with industry partners.","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"OpenAI February 2025 report PDF","url":"https://cdn.openai.com/threat-intelligence-reports/disrupting-malicious-uses-of-our-models-february-2025-update.pdf"},{"name":"AI Incident Database report","url":"https://incidentdatabase.ai/reports/4741"}]},{"id":"openai-kimsuky-bluenoroff-rdp","date":"2025-02-21","title":"Kimsuky and BlueNoroff used ChatGPT to debug RDP brute-force code and research intrusion","category":"State actor AI ops","direction":"with-ai","severity":"medium","country":"GL","region":"Global","target":"Cryptocurrency and intrusion targets of North Korean groups","loss_usd":null,"summary":"OpenAI banned accounts linked to North Korea's Kimsuky and BlueNoroff that gathered information on cyber intrusion tools and cryptocurrency topics and debugged code for RDP brute-force attacks.","source":"OpenAI","url":"https://cdn.openai.com/threat-intelligence-reports/disrupting-malicious-uses-of-our-models-february-2025-update.pdf","actor":"Kimsuky and BlueNoroff (North Korea)","actor_type":"state","attribution":"OpenAI attributed the accounts to the two DPRK groups with industry-partner input.","motive":"Espionage and cryptocurrency theft","vector":"ChatGPT used for tool research and debugging of brute-force code","root_cause":"Low-level coding help provided to accounts later tied to state actors","timeline":[{"date":"2025-02-21","event":"OpenAI publishes the cyber threat actor case and bans the accounts"},{"date":"2025-06-09","event":"OpenAI June 2025 report reiterates DPRK cyber actor activity"}], e individual using commercial breach-data platforms.","motive":"Unauthorised access to security cameras and the networks behind them","vector":"Claude used to refactor an open-source scraper, write URL-scraping scripts, parse stealer-log Telegram posts and improve the tool's search backend","root_cause":"General-purpose coding assistance applied to dual-use credential-harvesting tooling; abuse detected by behavioural classifiers rather than blocked at prompt level","timeline":[{"date":"2025-03","event":"Anthropic detects account building the camera-credential toolkit and bans it"},{"date":"2025-04-23","event":"Case published in Anthropic's March 2025 misuse report"}],"impact":"Potential compromise of camera credentials and network penetration; Anthropic did not confirm real-world success.","response":"Account banned; Anthropic cited the case as an example of AI-enhanced credential operations and fed indicators into its detection systems.","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"Anthropic March 2025 misuse report","url":"https://www.anthropic.com/news/detecting-and-countering-malicious-uses-of-claude-march-2025"},{"name":"OpenAI June 2025 report (cites the Anthropic report)","url":"https://cdn.openai.com/threat-intelligence-reports/5f73af09-a3a3-4a55-992e-069237681620/disrupting-malicious-uses-of-ai-june-2025.pdf"}]},{"id":"anthropic-novice-malware-builder","date":"2025-04-23","title":"Novice coder grows doxing toolkit and evasive malware builder with Claude's help","category":"AI-assisted malware","direction":"with-ai","severity":"medium","country":"GL","region":"Global","target":"Individuals targeted by doxing and remote-access malware","loss_usd":null,"summary":"An individual with little coding skill used Claude to grow a basic toolkit into a suite with facial recognition and dark-web scanning, and a batch-script generator into a GUI malware builder with evasion and persistence.","source":"Anthropic","url":"https://www.anthropic.com/news/detecting-and-countering-malicious-uses-of-claude-march-2025","actor":"Unknown individual","actor_type":"criminal","attribution":"Anthropic Threat Intelligence; single low-skill actor, not named.","motive":"Doxing and remote access to victims' machines","vector":"Iterative code generation requests to Claude to add capabilities to doxing tools and a payload builder","root_cause":"AI coding assistance lowered the skill barrier for building security-evading payloads","timeline":[{"date":"2025-03","event":"Anthropic detects and bans the actor"},{"date":"2025-04-23","event":"Case published in Anthropic's misuse report"}],"impact":"Demonstrated capability uplift for an unskilled actor; real-world deployment not confirmed.","response":"Actor banned; Anthropic highlighted the case as an example of AI lowering the barrier to malware development.","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"Anthropic March 2025 misuse report","url":"https://www.anthropic.com/news/detecting-and-countering-malicious-uses-of-claude-march-2025"},{"name":"OpenAI June 2025 report (cites the Anthropic report)","url":"https://cdn.openai.com/threat-intelligence-reports/5f73af09-a3a3-4a55-992e-069237681620/disrupting-malicious-uses-of-ai-june-2025.pdf"}]},{"id":"anthropic-recruitment-fraud-2025","date":"2025-04-23","title":"Recruitment-fraud ring used Claude to polish fake hiring-manager lures in Eastern Europe","category":"AI phishing","direction":"with-ai","severity":"medium","country":"GL","region":"Europe","target":"Job seekers in Eastern European countries","loss_usd":null,"summary":"A moderately sophisticated group impersonating hiring managers at real companies had Claude rewrite non-native English into fluent messages, craft interview scripts and format lures to harvest applicants' personal data.","source":"Anthropic","url":"https://www.anthropic.com/news/detecting-and-countering-malicious-uses-of-claude-march-2025","actor":"Unknown recruitment-fraud group","actor_type":"criminal","attribution":"Anthropic Threat Intelligence; group not named, assessed as moderately sophisticated.","motive":"Theft of job seekers' personal information for fraud","vector":"Real-time language sanitisation of scam messages, persuasive recruitment narratives and interview questions generated by Claude","root_cause":"Scam text generation is hard to distinguish from legitimate HR writing; detection relied on account-level behavioural analysis","timeline":[{"date":"2025-03","event":"Anthropic identifies and bans the recruitment-fraud accounts"},{"date":"2025-04-23","event":"Case disclosed in Anthropic's first misuse report"}],"impact":"Group sought applicants' personal information; Anthropic did not confirm successful scams.","response":"Accounts banned; Anthropic noted the case as evidence of AI lowering the language barrier for fraud.","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"Anthropic March 2025 misuse report","url":"https://www.anthropic.com/news/detecting-and-countering-malicious-uses-of-claude-march-2025"},{"name":"OpenAI June 2025 report (cites the Anthropic report)","url":"https://cdn.openai.com/threat-intelligence-reports/5f73af09-a3a3-4a55-992e-069237681620/disrupting-malicious-uses-of-ai-june-2025.pdf"}]},{"id":"east-java-khofifah-deepfake-arrests","date":"2025-04-24","title":"Indonesian police arrest three over TikTok deepfake of governor selling Rp500k motorbikes","category":"Deepfake fraud","direction":"with-ai","severity":"low","country":"ID","region":"Asia-Pacific","target":"Indonesian TikTok users; Governor Khofifah Indar Parawansa","loss_usd":5200,"summary":"Three men from Pangandaran edited videos of Governor Khofifah with AI to advertise a fake programme offering motorbikes for Rp500,000, taking about Rp87 million from roughly 100 victims before arrest.","source":"Metro TV News","url":"https://www.metrotvnews.com/read/KvJCLaYx-polri-tangkap-3-pelaku-penipuan-ai-deepfake-gubernur-jatim","actor":"Suspects HMP, UP and AH from Pangandaran","actor_type":"criminal","attribution":"Arrested 16 April 2025 by Ditressiber Polda Jatim with Bareskrim support; roles were video creation, uploading and WhatsApp contact.","motive":"Petty fraud through fake subsidised vehicle offers.","vector":"Deepfake video edits posted from accounts imitating the governor on TikTok, with payments collected via WhatsApp.","root_cause":"Cheap AI editing tools plus public trust in official-looking social accounts.","timeline":[{"date":"2025-04-16","event":"Three suspects arrested in Pangandaran, West Java"},{"date":"2025-04-24","event":"Bareskrim announces arrests"},{"date":"2025-04-28","event":"Polda Jatim press conference details roles and proceeds"}],"impact":"About 100 victims and roughly Rp87 million, about US$5,200, in losses; similar deepfakes used governors of Central and West Java.","response":"Arrests and charges under the ITE law and criminal code; police warned of a wider deepfake fraud syndicate.","status":"resolved","cve":null,"verification":"confirmed","sources":[{"name":"Metro TV News","url":"https://www.metrotvnews.com/read/KvJCLaYx-polri-tangkap-3-pelaku-penipuan-ai-deepfake-gubernur-jatim"},{"name":"detikJatim","url":"https://www.detik.com/jatim/hukum-dan-kriminal/d-7890165/3-pelaku-penipuan-deepfake-berbasis-ai-gubernur-khofifah-ditangkap"},{"name":"Metro TV News","url":"https://www.metrotvnews.com/read/NnjCe4jx-3-pelaku-video-hoaks-khofifah-pakai-ai-dibekuk"}]},{"id":"korea-pipc-deepseek-prompt-transfer","date":"2025-04-24","title":"Korea's PIPC: DeepSeek sent Korean users' prompts to ByteDance-linked Volcano Engine","category":"Model & data leak","direction":"on-ai","severity":"high","country":"KR","region":"Asia-Pacific","target":"South Korean DeepSeek app users","loss_usd":null,"summary":"Korea's PIPC found DeepSeek sent user data and AI prompts to five firms in China and the US, including ByteDance affiliate Volcano Engine, without consent, and ordered corrective measures.","source":"Newsis","url":"https://www.newsis.com/view/NISX20250424_0003153087","actor":"DeepSeek (Hangzhou DeepSeek AI)","actor_type":"accident","attribution":"PIPC pre-inspection established the transfers; DeepSeek said Volcano Engine was used for security and UX analytics, not marketing.","motive":"Service analytics and model training; no malicious intent established.","vector":"App automatically sent device, network and prompt data to overseas cloud providers on each session, with no Korean privacy policy, opt-out or age check.","root_cause":"Launch without a Korean-language privacy notice, consent flow or cross-border transfer safeguards required under PIPA.","timeline":[{"date":"2025-02-17","event":"PIPC confirms data flow to ByteDance-linked servers; DeepSeek suspends new Korean downloads"},{"date":"2025-04-10","event":"DeepSeek blocks new cross-border transfers of prompt data"},{"date":"2025-04-24","event":"PIPC publishes findings and issues corrective recommendations"}],"impact":"Prompts and metadata of Korean users, over one million downloads, sent abroad without consent; app removed from Korean stores pending fixes.","response":"DeepSeek added an opt-out for training use, a Korean privacy policy and age verification, destroyed transferred prompt data and was required to report compliance within 60 days.","status":"resolved","cve":null,"verification":"confirmed","sources":[{"name":"Newsis","url":"https://www.newsis.com/view/NISX20250424_0003153087"},{"name":"Hankyoreh via Daum","url":"https://v.daum.net/v/20250217135901030"},{"name":"Malwarebytes Labs","url":"https://www.malwarebytes.com/blog/news/2025/02/deepseek-found-to-be-sharing-user-data-with-tiktok-parent-company-bytedance"}]},{"id":"vietnam-deepfake-extortion-ring","date":"2025-04-25","title":"Vietnam busts Chinese deepfake sextortion ring that hit nearly 1,000 executives for $8M","category":"Deepfake fraud","direction":"with-ai","severity":"critical","country":"VN","region":"Asia-Pacific","target":"Vietnamese business executives and officials","loss_usd":8000000,"summary":"Vietnam's Ministry of Public Security said Chinese nationals used AI deepfakes to fabricate explicit images of nearly 1,000 Vietnamese executives and demanded USDT; losses about VND 200 billion (about $8M).","source":"VietNamNet","url":"https://vietnamnet.vn/en/chinese-scammers-use-ai-deepfakes-to-extort-vietnamese-entrepreneurs-2395223.html","actor":"Chinese extortion network with Vietnamese accomplices","actor_type":"criminal","attribution":"Ministry of Public Security investigation; three arrested in Bac Giang, nine detained in China, masterminds believed to be in Cambodia","motive":"Extortion via threats to publish fabricated explicit material","vector":"AI-generated explicit deepfakes of victims delivered by phone, social media and physical letters with demands of about $80,000 in USDT within three days","root_cause":"Easily sourced victim photos, roaming SIMs obtained via intermediaries, and 71 rented bank accounts opened by abusing facial-recognition onboarding","timeline":[{"date":"2025-02-18","event":"Investigation Department begins arrests of suspects in Binh Duong and Binh Phuoc"},{"date":"2025-04","event":"Three arrested in Bac Giang; Chinese authorities detain nine related suspects"},{"date":"2025-04-25","event":"Ministry of Public Security publishes case details and public warning"}],"impact":"Nearly 1,000 victims targeted and about VND 200 billion extorted; funds laundered through rented accounts into USDT on Binance and OKX","response":"Arrests in Vietnam and China, bank account freezes, public warnings about AI deepfake extortion","status":"under investigation","cve":null,"verification":"confirmed","sources":[{"name":"VietNamNet","url":"https://vietnamnet.vn/en/chinese-scammers-use-ai-deepfakes-to-extort-vietnamese-entrepreneurs-2395223.html"},{"name":"Frank on Fraud","url":"https://frankonfraud.com/inside-the-8-million-deepfake-ai-extortion-scheme/"},{"name":"Viet Nam News","url":"https://vietnamnews.vn/society/1694933/vietnamese-authorities-warn-of-rising-ai-driven-deepfake-extortion-scams.html"}]},{"id":"xai-key-leak-spacex-tesla-llms","date":"2025-05-01","title":"xAI employee leaks API key on GitHub exposing 60 private Grok models for two months","category":"Model & data leak","direction":"on-ai","severity":"high","country":"US","region":"North America","target":"xAI private and fine-tuned LLMs","loss_usd":null,"summary":"An xAI technical staffer committed an x.ai API key to a public GitHub repo; GitGuardian found it granted access to at least 60 unreleased and private models, some fine-tuned on SpaceX and Tesla data, and it stayed valid for two months.","source":"KrebsOnSecurity","url":"https://krebsonsecurity.com/2025/05/xai-dev-leaks-api-key-for-private-spacex-tesla-llms/","actor":"xAI employee (accidental); found by Philippe Caturegli and GitGuardian","actor_type":"accident","attribution":"Accidental commit by an xAI employee; exposure publicised by Seralys' Philippe Caturegli and scoped by GitGuardian","motive":"None; accidental secret exposure","vector":"Plaintext API key in a .env file committed to a public GitHub repository, usable under the employee's identity against the x.ai API","root_cause":"No pre-commit secret scanning or key rotation; the key remained valid for almost two months after GitGuardian's first alert to the employee","timeline":[{"date":"2025-03-02","event":"GitGuardian automatically alerts the xAI employee about the exposed key"},{"date":"2025-04-30","event":"GitGuardian escalates to xAI security, noting the key is still valid; xAI points to its HackerOne program"},{"date":"2025-04-30","event":"Repository containing the key is removed from GitHub hours later"},{"date":"2025-05-01","event":"KrebsOnSecurity publishes the story; xAI does not comment"}],"impact":"Access to at least 60 fine-tuned and private LLMs including unreleased Grok versions and models named for SpaceX and Tesla data; no evidence of third-party abuse was published","response":"Repository removed after escalation; xAI directed researchers to its bug bounty program and issued no public statement","status":"resolved","cve":null,"verification":"confirmed","sources":[{"name":"KrebsOnSecurity","url":"https://krebsonsecurity.com/2025/05/xai-dev-leaks-api-key-for-private-spacex-tesla-llms/"},{"name":"CO/AI","url":"https://getcoai.com/news/xai-developer-exposes-api-key-for-spacex-and-teslas-private-llms/"},{"name":"Fullerton College Cybersecurity","url":"https://cybersecurity.fullcoll.edu/?p=304"}]},{"id":"bcp-credicorp-ceo-deepfake","date":"2025-05-08","title":"Peru's BCP denounces AI video impersonating Credicorp CEO Gianfranco Ferrari in scam","category":"Deepfake fraud","direction":"with-ai","severity":"medium","country":"PE","region":"Latin America","target":"Banco de Credito del Peru customers","loss_usd":null,"summary":"Banco de Credito del Peru said a social media video of Credicorp CEO Gianfranco Ferrari inviting the public into an investment programme was an AI simulation of his voice and appearance, and announced legal action.","source":"Banco de Credito del Peru","url":"https://www.peru-retail.com/bcp-denuncia-video-falso-con-ia-que-simula-al-ceo-de-credicorp-para-estafar-con-inversiones/","actor":"Unknown","actor_type":"criminal","attribution":"Unknown.","motive":"Lure investors using the credibility of Peru's largest bank.","vector":"Deepfake video of the CEO on social media promoting a fake investment programme.","root_cause":"Executive media appearances provide training data; social platforms carried the fake ad.","timeline":[{"date":"2025-05-07","event":"Deepfake Ferrari video circulates on social media"},{"date":"2025-05-08","event":"BCP publishes statement declaring the video false and announcing legal action"}],"impact":"No losses disclosed; reputational harm to BCP and Credicorp.","response":"Public statement, legal action announced, customers urged to verify an 3,200 downloads; infected Cursor installs ran attacker-controlled code with auto-update disabled, exposing credentials, source code and build pipelines","response":"Socket requested removal from npm and advised victims to reinstall Cursor from a trusted source, rotate credentials and audit code for unauthorized changes","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"The Hacker News","url":"https://thehackernews.com/2025/05/malicious-npm-packages-infect-3200.html"},{"name":"SecurityWeek","url":"https://www.securityweek.com/malicious-npm-packages-target-cursor-ais-macos-users/"}]},{"id":"fsca-kamlana-deepfake-nedbank","date":"2025-05-09","title":"FSCA warns of WhatsApp deepfake of its commissioner pushing fake Nedbank AI trading tool","category":"Deepfake fraud","direction":"with-ai","severity":"medium","country":"ZA","region":"Middle East & Africa","target":"South African retail investors; FSCA and Nedbank brands","loss_usd":null,"summary":"South Africa's FSCA flagged a WhatsApp deepfake in which Commissioner Unathi Kamlana appears to endorse an NBSG or Nedbank Securities AI trading tool promising 20 to 30 percent higher returns.","source":"Business Report","url":"https://businessreport.co.za/business/2025-05-09-is-your-investment-safe-fsca-warns-against-deepfake-trading-scams-on-whatsapp/","actor":"Unknown","actor_type":"criminal","attribution":"No suspects named; FSCA described a marked rise in AI-generated impersonators of licensed providers and prominent South Africans.","motive":"Lure investors into a fraudulent trading platform.","vector":"AI-generated video of the regulator's commissioner with Nedbank branding distributed via WhatsApp and Facebook groups, following a similar J532-NBSG scam the previous month.","root_cause":"Public footage of officials enables cheap voice and face cloning; messaging platforms offer little pre-publication screening.","timeline":[{"date":"2025-04-01","event":"FSCA flags earlier J532-NBSG scam on
