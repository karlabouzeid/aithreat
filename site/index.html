closure"}],"impact":"Phishing, disinformation and data exfiltration via trusted sites; no in-the-wild abuse reported","response":"Perplexity and Microsoft shipped fixes; Google rated it low severity and intended behaviour","status":"patched","cve":null,"verification":"confirmed","sources":[{"name":"The Register","url":"https://www.theregister.com/2025/11/25/hashjack_attack_ai_browser_hashtag/"},{"name":"Help Net Security","url":"https://www.helpnetsecurity.com/2025/11/26/hashjack-hijack-ai-assistants-browsers/"},{"name":"Infosecurity Magazine","url":"https://www.infosecurity-magazine.com/news/hashjack-indirect-prompt-injection"}]},{"id":"unit42-wormgpt4-kawaiigpt","date":"2025-11-25","title":"Unit 42 tests WormGPT 4 and KawaiiGPT, criminal LLMs that write ransomware scripts","category":"AI-assisted malware","direction":"with-ai","severity":"medium","country":"GL","region":"Global","target":"Phishing, BEC and ransomware victims of subscribers","loss_usd":null,"summary":"Unit 42 found WormGPT 4 sold for 50 USD a month with 500+ Telegram subscribers and free KawaiiGPT on GitHub; both produced ransomware PowerShell, ransom notes, spear-phishing and lateral movement scripts in testing.","source":"Palo Alto Networks Unit 42","url":"https://unit42.paloaltonetworks.com/dilemma-of-ai-malicious-llms/","actor":"WormGPT 4 and KawaiiGPT developers","actor_type":"criminal","attribution":"Unit 42 analysis of underground sales channels and the tools themselves; developers unidentified.","motive":"Subscription revenue and community growth around uncensored AI","vector":"Web and Telegram sales, DarknetArmy forum ads, GitHub distribution with a CLI","root_cause":"Uncensored models and jailbroken wrappers give low-skill actors polished attack content","timeline":[{"date":"2025-07-01","event":"KawaiiGPT first identified"},{"date":"2025-09-27","event":"WormGPT 4 sales campaign begins"},{"date":"2025-11-25","event":"Unit 42 publishes findings"}],"impact":"Hundreds of active users; WormGPT rus, Germany and Spain at French and Belgian request; nine arrests, about 1.5M euros seized"},{"date":"2025-11-25","event":"Phase two targets advertising and affiliate infrastructure in Belgium, Bulgaria, Germany and Israel"},{"date":"2025-12-04","event":"Europol announces the takedown"}],"impact":"Over 700 million euros laundered; about 800,000 euros in bank accounts, 415,000 euros in crypto and 300,000 euros cash seized plus luxury watches and devices","response":"Arrests, seizures and continuing investigations to trace assets and remaining members","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"Europol","url":"https://www.europol.europa.eu/media-press/newsroom/news/international-takedown-of-cryptocurrency-fraud-network-laundering-over-eur-700-million"},{"name":"Breached.company","url":"https://breached.company/europol-dismantles-eur-700-million-cryptocurrency-fraud-network-in-coordinated-international-operation/"},{"name":"TechRadar","url":"https://www.techradar.com/pro/security/europol-takes-down-crypto-and-laundering-network-worth-700-million"}]},{"id":"danang-korean-deepfake-romance-ring","date":"2025-12-05","title":"Da Nang police arrest three South Koreans wanted for Cambodia deepfake romance scam ring","category":"Deepfake fraud","direction":"with-ai","severity":"high","country":"KR","region":"Asia-Pacific","target":"South Korean men targeted online","loss_usd":1000000,"summary":"Da Nang police arrested three South Koreans under Interpol red notices for a Bavet, Cambodia network that used deepfakes to pose as women and defraud male victims of about $1 million while trafficking recruits.","source":"Tuoi Tre News","url":"https://news.tuoitre.vn/vietnamese-police-arrest-3-skoreans-wanted-by-interpol-over-cambodia-scam-ring-103251205143522735.htm","actor":"Choi Minsu, Choi Jinwoo and Seo Jaeseok (South Korean nationals)","actor_type":"criminal","attribution":"Interpol red notices at South Korea's request for fraud, criminal organisation and human trafficking; arrested by Da Nang police with the MPS Department of External Relations","motive":"Financial gain through romance fraud; labour exploitation of trafficked recruits","vector":"Deepfake personas of women used to approach male victims online; recruits lured with paid travel and forced to memorise scripts in Cambodia","root_cause":"Scam compounds in Cambodia operating with trafficked labour and synthetic identities beyond Korean jurisdiction","timeline":[{"date":"2024-08","event":"Network defrauds victims from August to December 2024"},{"date":"2025-10","event":"Da Nang police begin investigation after the suspects flee Cambodia"},{"date":"2025-12-04","event":"Suspects handed to South Korean authorities for extradition"}],"impact":"About $1 million defrauded; victims and recruits subjected to passport confiscation and detention in Cambodia","response":"Arrests in Vietnam, extradition to South Korea, Interpol coordination","status":"under investigation","cve":null,"verification":"confirmed","sources":[{"name":"Tuoi Tre News","url":"https://news.tuoitre.vn/vietnamese-police-arrest-3-skoreans-wanted-by-interpol-over-cambodia-scam-ring-103251205143522735.htm"},{"name":"Cambodia Daily","url":"https://english.cambodiadaily.com/?p=181932"}]},{"id":"geminijack-enterprise","date":"2025-12-08","title":"GeminiJack: zero-click injection in Gemini Enterprise exfiltrated Gmail, Calendar and Docs","category":"Prompt injection","direction":"on-ai","severity":"high","country":"US","region":"North America","target":"Google Gemini Enterprise and Vertex AI Search","loss_usd":null,"summary":"Noma Security found a shared Doc or calendar invite with hidden instructions was auto-retrieved by Gemini Enterprise search, run across Workspace data and leaked via a disguised image request. Google re-architected it.","source":"Noma Security","url":"https://www.infosecurity-magazine.com/news/google-fixes-gemini-enterprise-flaw","actor":"Noma Security research team","actor_type":"researcher","attribution":"Responsible disclosure to Google in mid-2025; fixed before publication","motive":"Security research","vector":"Indirect prompt injection in shared Workspace content retrieved by RAG search; exfiltration via image URL embedding sensitive data","root_cause":"Shared retrieval and LLM workflows between Vertex AI Search and Gemini Enterprise treated retrieved documents as trusted instructions","timeline":[{"date":"2025-06-05","event":"Noma discovers the flaw and reports it to Google"},{"date":"2025-08","event":"Google confirms receipt and begins remediation"},{"date":"2025-12-08","event":"Noma publishes GeminiJack after Google's fix"}],"impact":"Could have exposed corporate Gmail, Calendar and Docs content for Gemini Enterprise customers without any user action; no abuse reported","response":"Google separated Vertex AI Search from Gemini Enterprise and changed how retrieval and indexing feed the model","status":"patched","cve":null,"verification":"confirmed","sources":[{"name":"Infosecurity Magazine","url":"https://www.infosecurity-magazine.com/news/google-fixes-gemini-enterprise-flaw"},{"name":"Security Affairs","url":"https://securityaffairs.com/185574/hacking/geminijack-zero-click-flaw-in-gemini-enterprise-allowed-corporate-data-exfiltration.html"},{"name":"TechRepublic","url":"https://www.techrepublic.com/article/news-geminijack-zero-click-flaw/"}]},{"id":"fsca-banxso-deepfake-ads-r2bn","date":"2025-12-09","title":"South Africa's FSCA fines Banxso R2bn over platform fed by Musk and Rupert deepfake ads","category":"Deepfake fraud","direction":"with-ai","severity":"critical","country":"ZA","region":"Middle East & Africa","target":"South African retail investors","loss_usd":null,"summary":"The FSCA imposed about R2bn (about $115M) in penalties on Banxso and its directors plus 30-year debarments after finding the platform benefited from deceptive deepfake adverts of Elon Musk and Johann Rupert.","source":"Moonstone (citing FSCA)","url": onse":"Prosecutors ordered removal, source tracing and technical analysis by the Interior Ministry with legal action to follow.","status":"under investigation","cve":null,"verification":"confirmed","sources":[{"name":"An-Nahar (النهار)","url":"https://www.annahar.com/lifestyle/arts/264512/فيدوات-هيفا-وهبي-المزيفة-النيابة-المصرية-تتحرك-بعد-شكوى-النجمة-اللبنانية"},{"name":"OECD.AI Incidents Monitor","url":"https://oecd.ai/en/incidents/2026-01-02-2d6d"}]},{"id":"kuwait-cbk-nbk-deepfake-warning","date":"2026-01-08","title":"NBK warns of deepfake investment ads under Central Bank of Kuwait Let's Be Aware campaign","category":"Deepfake fraud","direction":"with-ai","severity":"low","country":"KW","region":"Middle East & Africa","target":"Kuwaiti bank customers","loss_usd":null,"summary":"National Bank of Kuwait, under the Central Bank of Kuwait's Let's Be Aware campaign, warned that deepfake videos making trusted figures appear to endorse investments or trading platforms were used to steal money.","source":"Kuwait Times","url":"https://kuwaittimes.com/article/38210/business/nbk-warns-against-fake-investment-ads-on-social-media/","actor":"Unknown","actor_type":"criminal","attribution":"Unknown.","motive":"Investment fraud and credential theft.","vector":"Social media ads with AI-altered video or audio of well-known figures promoting fake trading platforms.","root_cause":"Unverified financial advertising on social platforms.","timeline":[{"date":"2025-12-01","event":"Central Bank of Kuwait runs Let's Be Aware anti-fraud campaign with local banks"},{"date":"2026-01-08","event":"NBK publishes deepfake investment ad warning"}],"impact":"No specific incidents or losses published.","response":"Awareness campaign by central bank, banks and Kuwait Banking Association.","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"Kuwait Times","url":"https://kuwaittimes.com/article/38210/business/nbk-warns-against-fake-investment-ads-on-social-media/"},{"name":"Al Jarida","url":"https://www.aljarida.com/article/76884"}]},{"id":"reprompt-copilot","date":"2026-01-14","title":"Reprompt: one-click attack hijacks Microsoft Copilot sessions to steal data","category":"Prompt injection","direction":"on-ai","severity":"medium","country":"GL","region":"Global","target":"Microsoft Copilot Personal","loss_usd":null,"summary":"Varonis showed a crafted Microsoft link could pre-fill Copilot prompts via URL parameter and keep exfiltrating a victim's data and memory even after the chat closed.","source":"Varonis","url":"https://www.varonis.com/blog/reprompt","actor":"Varonis Threat Labs (responsible disclosure)","actor_type":"researcher","attribution":"Self-disclosed by Varonis; confirmed and patched by Microsoft","motive":"Security research; no exploitation in the wild reported","vector":"Phishing link to a legitimate copilot.microsoft.com URL whose q parameter auto-executes a prompt, with follow-up instructions fetched from attacker server","root_cause":"Copilot Personal auto-ran prompts passed via URL parameter and allowed persistent exfiltration after the chat window closed","timeline":[{"date":"2025-08-31","event":"Varonis reports the flaw to Microsoft"},{"date":"2026-01-13","event":"Microsoft ships fix in January Patch Tuesday"},{"date":"2026-01-14","event":"Varonis publishes Reprompt research"}],"impact":"Proof of concept only; could have exfiltrated personal data and Copilot memory from consumer users. Microsoft 365 Copilot not affected. No victims reported.","response":"Microsoft rolled out protections against the scenario and said it is adding defense-in-depth measures; Varonis published guidance.","status":"patched","cve":null,"verification":"confirmed","sources":[{"name":"Varonis","url":"https://www.varonis.com/blog/reprompt"},{"name":"TechRepublic","url":"https://techrepublic.com/article/news-reprompt-attack-microsoft-copilot"},{"name":"Windows Report","url":"https://windowsreport.com/microsoft-patches-copilot-vulnerability-as-hackers-eye-to-exploit-with-new-reprompt-attack/"}]},{"id":"anthropic-git-mcp-injection","date":"2026-01-20","title":"Prompt injection flaws in Anthropic's Git MCP server enable file access and code execution","category":"Prompt injection","direction":"on-ai","severity":"medium","country":"GL","region":"Global","target":"Anthropic mcp-server-git","loss_usd":null,"summary":"Researchers showed malicious repository content could steer agents using Anthropic's reference Git MCP server into reading or deleting files and running code; fixes shipped.","source":"OECD AI Incidents Monitor","url":"https://oecd.ai/en/incidents/2026-01-20-c1f6","actor":"Cyata security researchers (responsible disclosure)","actor_type":"researcher","attribution":"Self-disclosed by Cyata; fixes acknowledged by Anthropic","motive":"Security research; no in-the-wild exploitation reported","vector":"Prompt injection via malicious README, issue text or webpage steering an agent to call git_init, git_diff with injected flags, or out-of-scope repository paths","root_cause":"Missing path validation on repo_path, unrestricted git_init and unsanitized git_diff target argument passed to the git CLI","timeline":[{"date":"2025-06","event":"Cyata begins reporting the issues to Anthropic (June-July)"},{"date":"2025-12-18","event":"Anthropic releases mcp-server-git 2025.12.18 fixing all three flaws"},{"date":"2026-01-20","event":"Cyata and media publish details"}],"impact":"Proof of concept allowing arbitrary file read, file deletion and, chained with the filesystem MCP server, code execution on agent hosts. No victims reported.","response":"Anthropic validated repository paths, removed the git_init tool and fixed argument injection; users told to upgrade to 2025.12.18 or later.","status":"patched","cve":"CVE-2025-68143, CVE-2025-68144, CVE-2025-68145","verification":"confirmed","sources":[{"name":"OECD AI Incidents Monitor","url":"https://oecd.ai/en/incidents/2026-01-20-c1f6"},{"name":"The Register","url":"https://www.theregister.com/2026/01/20/anthropic_prompt_injection_flaws/"},{"name":"SecurityWeek","url":"https://www.securityweek.com/anthropic-mcp-server-flaws-lead-to-code-execution-data-exposure/"},{"name":"Infosecurity Magazine","url":"https://www.infosecurity-magazine.com/news/prompt-injection-bugs-anthropic/"}]},{"id":"voidlink-ai-built","date":"2026-01-20","title":"VoidLink cloud malware framework found to be built mostly by an AI agent","category":"AI-assisted malware","direction":"with-ai","severity":"high","country":"GL","region":"Global","target":"Linux cloud environments","loss_usd":null,"summary":"Check Point concluded the 30+ module VoidLink Linux implant was planned and coded largely by an AI agent under one developer, reaching ~88,000 lines in about a week.","source":"The Register","url":"https://www.theregister.com/2026/01/20/voidlink_ai_developed/","actor":"Single unnamed developer, assessed by Check Point as likely Chinese","actor_type":"criminal","attribution":"Check Point Research assessment based on leaked sprint plans and documentation; no formal attribution","motive":"Development of a commercial-grade Linux cloud implant; large-scale deployment not yet observed","vector":"AI agent (TRAE SOLO IDE assistant) used to plan architecture, split work into virtual teams and write a 30-plus module implant","root_cause":"AI coding agents let a lone actor produce complex offensive tooling at team scale; developer OPSEC failures exposed the artifacts","timeline":[{"date":"2025-11","event":"Development begins using TRAE SOLO; first functional implant in under a week"},{"date":"2025-12","event":"Codebase reaches about 88,000 lines"},{"date":"2026-01","event":"Check Point publishes initial VoidLink analysis"},{"date":"2026-01-20","event":"Check Point follow-up concludes the framework was mostly AI-built"}],"impact":"No confirmed victims or large-scale exploitation reported; framework includes loaders, rootkit modules and dozens of plugins targeting Linux cloud environments.","response":"Check Point published detections and analysis; no takedown or law-enforcement action reported.","status":"under investigation","cve":null,"verification":"reported","sources":[{"name":"The Register","url":"https://www.theregister.com/2026/01/20/voidlink_ai_developed/"},{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/voidlink-cloud-malware-shows-clear-signs-of-being-ai-generated/"},{"name":"Dark Reading","url":"https://darkreading.com/threat-intelligence/voidlink-linux-malware-ai"}]},{"id":"bodysnatcher-servicenow","date":"2026-01-21","title":"BodySnatcher: unauthenticated impersonation via ServiceNow Virtual Agent (CVE-2025-12420)","category":"Agent hijack","direction":"on-ai","severity":"critical","country":"US","region":"North America","target":"ServiceNow Now Assist AI Agents and Virtual Agent API","loss_usd":null,"summary":"AppOmni found an attacker with only an employee email could impersonate that user via ServiceNow's Virtual Agent API and drive Now Assist agents to create admin users, bypassing MFA and SSO. Patched October 2025.","source":"AppOmni","url":"https://www.ampcuscyber.com/shadowopsintel/cve-2025-12420-broken-authentication-and-privileged-workflow-execution-in-servicenow/","actor":"AppOmni Labs","actor_type":"researcher","attribution":"Responsible disclosure to ServiceNow in October 2025; CVSS 9.3","motive":"Security research","vector":"Broken authentication in the Virtual Agent API allowed unauthenticated conversations attributed to another user, which were then used to trigger privileged AI agent workflows","root_cause":"Virtual Agent API did not verify the identity of the conversation initiator before letting AI agents act with that user's entitlements","timeline":[{"date":"2025-10","event":"AppOmni discovers and reports BodySnatcher"},{"date":"2025-10-30","event":"ServiceNow deploys security updates to hosted instances"},{"date":"2026-01","event":"CVE-2025-12420 and AppOmni write-up published"}],"impact":"Potential full takeover of enterprise ServiceNow instances; no public evidence of exploitation before patching","response":"ServiceNow patched hosted instances and published fixed versions for self-hosted customers (KB2587329)","status":"patched","cve":"CVE-2025-12420","verification":"confirmed","sources":[{"name":"Ampcus Cyber (AppOmni summary)","url":"https://www.ampcuscyber.com/shadowopsintel/cve-2025-12420-broken-authentication-and-privileged-workflow-execution-in-servicenow/"},{"name":"SecurityBrief UK","url":"https://securitybrief.co.uk/story/bodysnatcher-flaw-lets-hackers-hijack-servicenow-ai-agents"},{"name":"TechInformed","url":"https://techinformed.com/the-bodysnatcher-breach-that-wasnt-what-servicenows-agentic-ai-flaw-teaches/"}]},{"id":"copilot-confidential-emails-bug","date":"2026-01-21","title":"Microsoft 365 Copilot bug summarises confidential emails despite DLP policies","category":"Model & data leak","direction":"on-ai","severity":"medium","country":"US","region":"North America","target":"Microsoft 365 Copilot Chat customers","loss_usd":null,"summary":"Microsoft confirmed (CW1226324) that a code error let Copilot Chat's work tab read and summarise Drafts and Sent Items emails carrying labels such as Confidential despite DLP policies. A fix rolled out in February 2026.","source":"Microsoft 365 admin center","url":"https://bleepingcomputer.com/news/microsoft/microsoft-says-bug-causes-copilot-to-summarize-confidential-emails","actor":"Microsoft (software defect)","actor_type":"accident","attribution":"Acknowledged by Microsoft in a service alert","motive":"None (bug)","vector":"Copilot Chat processing labelled mail outside intended scope","root_cause":"Code error in Copilot's handling of sensitivity labels and DLP enforcement","timeline":[{"date":"2026-01-21","event":"Issue identified"},{"date":"2026-02","event":"Fix rollout begins"}],"impact":"Unknown number of tenants; confidential content exposed to Copilot summaries","response":"Microsoft deployed a fix and tracked the issue in the admin center","status":"patched","cve":null,"verification":"confirmed","sources":[{"name":"BleepingComputer","url":"https://bleepingcomputer.com/news/microsoft/microsoft-says-bug-causes-copilot-to-summarize-confidential-emails"},{"name":"Petri","url":"https://petri.com/microsoft-365-copilot-bug-confidential-emails/"},{"name":"TechRadar","url":"https://techradar.com/pro/security/microsoft-admits-an-office-bug-exposed-confidential-user-emails-to-copilot"}]},{"id":"maliciouscorgi-vscode-ai-extensions","date":"2026-01-23","title":"MaliciousCorgi: 'ChatGPT' and 'ChatMoss' VS Code AI extensions with 1.5M installs exfiltrate open files","category":"AI supply chain","direction":"on-ai","severity":"high","country":"CN","region":"Asia-Pacific","target":"VS Code users of AI coding assistant extensions","loss_usd":null,"summary":"Koi found two Marketplace extensions marketed as AI coding assistants that read every opened file, let a server pull up to 50 workspace files on command and loaded hidden analytics trackers, sending data to China-based servers.","source":"Koi (via BleepingComputer)","url":"https://www.bleepingcomputer.com/news/security/malicious-ai-extensions-on-vscode-marketplace-steal-developer-data/","actor":"Publishers WhenSunset and zhukunpeng","actor_type":"unknown","attribution":"Extensions published by WhenSunset and zhukunpeng share code and backend; publisher could not be reached and motive was not established","motive":"Unknown; behaviour consistent with source code harvesting and user profiling","vector":"Extension code that base64-encodes file contents on open and edit, a server-controlled file harvesting command and a zero-pixel iframe loading four analytics SDKs","root_cause":"Marketplace review did not catch undisclosed exfiltration in popular extensions presented as AI assistants","timeline":[{"date":"2026-01-23","event":"Koi publishes MaliciousCorgi findings on the two extensions"},{"date":"2026-01-24","event":"Microsoft says it is investigating and will take appropriate action"}],"impact":"About 1.34 million installs of ChatGPT - Chinese edition and 150,000 of ChatMoss; source code, configuration files, cloud credentials and .env secrets of users could have been exposed","response":"Microsoft opened an investigation; Koi advised removal of the extensions and rotation of any secrets in affected workspaces","status":"under investigation","cve":null,"verification":"confirmed","sources":[{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/malicious-ai-extensions-on-vscode-marketplace-steal-developer-data/"},{"name":"BleepingComputer VS Code tag","url":"https://www.bleepingcomputer.com/tag/vs-code/"}]},{"id":"openclaw-exposed-gateways","date":"2026-01-27","title":"Tens of thousands of OpenClaw agent gateways exposed online leaking API keys and chats","category":"Model & data leak","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"Self-hosted OpenClaw (Clawdbot/Moltbot) instances","loss_usd":null,"summary":"After the viral OpenClaw agent framework spread, researchers found its gateway bound to public interfaces without authentication on tens of thousands of hosts, exposing API keys, credentials and private chat histories.","source":"The Register","url":"https://www.theregister.com/2026/02/03/openclaw_security_problems/","actor":"Misconfigured deployments; multiple opportunistic attackers","actor_type":"unknown","attribution":"Exposure measured by SlowMist, Censys, SecurityScorecard and Shodan; attribution of subsequent abuse not established","motive":"Credential theft and abuse of exposed agents","vector":"Default gateway port 18789 reachable from the internet with weak or no authentication, revealing environment variables, tokens and agent controls","root_cause":"Framework listened on all interfaces by default and cloud tutorials told users to open the port; long-lived API keys stored in plaintext configs","timeline":[{"date":"2026-01-27","event":"SlowMist warns that hundreds of API keys and chat logs are exposed on public Clawdbot gateways"},{"date":"2026-01-30","event":"One-click RCE flaw CVE-2026-25253 fixed in v2026.1.29"},{"date":"2026-01-31","event":"Censys counts 21,639 exposed instances"},{"date":"2026-02-03","event":"JFrog, The Register and others document thousands of exposed agents and malicious ClawHub skills"}],"impact":"Between roughly 21,000 and 42,000 exposed instances depending on scanner; leaked API keys, auth tokens and private messages enabled agent impersonation and account hijacking","response":"Project patched the RCE, defaulted TLS 1.3 for the gateway and shipped a security audit command; researchers urged users to keep gateways off the internet","status":"ongoing","cve":"CVE-2026-25253","verification":"confirmed","sources":[{"name":"The Register","url":"https://www.theregister.com/2026/02/03/openclaw_security_problems/"},{"name":"JFrog","url":"https://jfrog.com/blog/giving-openclaw-the-keys-to-your-kingdom-read-this-first/"},{"name":"OECD AI Incidents Monitor","url":"https://oecd.ai/en/incidents/2026-01-30-9567"}]},{"id":"bizarre-bazaar-llmjacking","date":"2026-01-28","title":"Operation Bizarre Bazaar: hijacked LLM endpoints resold through commercial marketplace","category":"LLMjacking","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"Exposed Ollama, vLLM and MCP endpoints","loss_usd":null,"summary":"Pillar Security logged ~35,000 attack sessions scanning for exposed AI endpoints, validating access and reselling it via a marketplace covering 30+ LLM providers.","source":"Pillar Security","url":"https://www.pillar.security/blog/operation-bizarre-bazaar-first-attributed-llmjacking-campaign-with-commercial-marketplace-monetization","actor":"Threat actor using aliases Hecker, Sakuya and LiveGamer101","actor_type":"criminal","attribution":"Attributed by Pillar Security based on honeypot telemetry and marketplace infrastructure","motive":"Financial: reselling stolen LLM access through a marketplace","vector":"Shodan and Censys scanning for exposed Ollama, vLLM and MCP endpoints, automated API validation via silver.inc, resale via NeXeonAI storefront","root_cause":"Self-hosted LLM servers and MCP endpoints exposed on default ports without authentication","timeline":[{"date":"2025-12","event":"Pillar honeypots begin logging campaign activity"},{"date":"2026-01","event":"About 35,000 attack sessions recorded across the campaign window"},{"date":"2026-01-28","event":"Pillar Security publishes Operation Bizarre Bazaar report"}],"impact":"Hijacked compute, exposure of prompt data and potential pivoting via MCP servers; marketplace resold access to over 30 LLM providers. No dollar figure reported.","response":"Pillar published indicators of compromise; no takedown or arrests reported.","status":"ongoing","cve":null,"verification":"reported","sources":[{"name":"Pillar Security","url":"https://www.pillar.security/blog/operation-bizarre-bazaar-first-attributed-llmjacking-campaign-with-commercial-marketplace-monetization"},{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/hackers-hijack-exposed-llm-endpoints-in-bizarre-bazaar-operation/"},{"name":"SecurityWeek","url":"https://www.securityweek.com/llms-hijacked-monetized-in-operation-bizarre-bazaar/"}]},{"id":"chat-ask-ai-leak","date":"2026-01-29","title":"Chat & Ask AI app leaks ~300M messages from 25M users via open Firebase","category":"Model & data leak","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"Codeway Chat & Ask AI","loss_usd":null,"summary":"A researcher found the popular AI chat wrapper's Firebase rules left full chat histories readable, exposing about 300 million messages tied to more than 25 million users.","source":"Malwarebytes","url":"https://www.malwarebytes.com/blog/news/2026/02/ai-chat-app-leak-exposes-300-million-messages-tied-to-25-million-users","actor":"Independent researcher known as Harry (responsible disclosure)","actor_type":"researcher","attribution":"Self-disclosed by the researcher; reported by Malwarebytes","motive":"Research; no malicious exploitation reported","vector":"Firebase Security Rules set to public, allowing unauthenticated read, write and delete of the chat database","root_cause":"Misconfigured Firebase backend shared across Codeway apps; no access controls on user chat collections","timeline":[{"date":"2026-01-20","event":"Researcher finds the open Firebase backend and reports it to Codeway"},{"date":"2026-01-29","event":"Researcher publishes findings"},{"date":"2026-02-09","event":"Malwarebytes reports the leak"}],"impact":"About 300 million messages tied to roughly 25 million users exposed, including sensitive content such as self-harm and drug queries; data from other Codeway apps also exposed.","response":"Codeway reportedly fixed the rules across its apps within hours of the report; no regulatory action reported.","status":"patched","cve":null,"verification":"reported","sources":[{"name":"Malwarebytes","url":"https://www.malwarebytes.com/blog/news/2026/02/ai-chat-app-leak-exposes-300-million-messages-tied-to-25-million-users"},{"name":"Fox News","url":"https://www.foxnews.com/tech/millions-ai-chat-messages-exposed-app-data-leak"},{"name":"Hackmag","url":"https://hackmag.com/news/chat-ask-ai"}]},{"id":"hugging-face-android-rat-cdn","date":"2026-01-29","title":"Hugging Face datasets abused to serve polymorphic Android RAT payloads every 15 minutes","category":"AI supply chain","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"Android users; Hugging Face CDN","loss_usd":null,"summary":"Bitdefender found a scareware dropper app, TrustBastion, fetching an accessibility-abusing Android trojan from a Hugging Face dataset repository that regenerated its payload every 15 minutes and had over 6,000 commits in 29 days.","source":"Bitdefender (via BleepingComputer)","url":"https://www.bleepingcomputer.com/news/security/hugging-face-abused-to-spread-thousands-of-android-malware-variants/","actor":"Unknown","actor_type":"criminal","attribution":"Unattributed; fake Alipay and WeChat login overlays suggest targeting of Chinese-speaking users","motive":"Financial fraud via credential overlays, PIN theft and device control","vector":"Dropper app sideloaded via scareware ads redirects through an intermediary server to APKs hosted on Hugging Face's CDN","root_cause":"Trusted AI model and dataset hosting with clean reputation used as a malware distribution channel; server-side polymorphism defeats hash detection","timeline":[{"date":"2026-01","event":"Bitdefender analyses a 29-day-old Hugging Face repository with more than 6,000 commits of malware variants"},{"date":"2026-01-29","event":"Hugging Face removes the datasets after Bitdefender's report; campaign reappears as 'Premium Club'"},{"date":"2026-02-04","event":"Further coverage notes the operation re-emerged with the same code"}],"impact":"Thousands of Android RAT variants distributed; victims risk screen capture, overlay phishing of Alipay and WeChat, PIN theft and blocked uninstallation","response":"Hugging Face removed the malicious datasets; Google said Play Protect blocks the apps and none were on Google Play","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/hugging-face-abused-to-spread-thousands-of-android-malware-variants/"},{"name":"Netzwoche","url":"https://www.netzwoche.ch/news/2026-02-04/cyberkriminelle-verteilen-android-malware-ueber-hugging-face"}]},{"id":"taichung-chatgpt-deepfake-japan-police","date":"2026-01-29","title":"Taichung indicts ring using ChatGPT scripts and deepfake Japanese police on video calls","category":"Deepfake fraud","direction":"with-ai","severity":"medium","country":"TW","region":"Asia-Pacific","target":"Japanese residents called from a Kuala Lumpur call centre","loss_usd":120000,"summary":"A Taiwan-Japan-Malaysia ring wrote fraud scripts with ChatGPT and used AI face-swaps to appear as Japanese police when victims asked for video proof; about 18.65 million yen was laundered into USDT.","source":"ETtoday","url":"https://www.ettoday.net/news/20260129/3109640.htm","actor":"Ring led by Taiwanese suspect surnamed Yang","actor_type":"criminal","attribution":"Taichung District Prosecutors Office indicted Yang and three others under anti-fraud, money-laundering and organised-crime laws after Malaysian police raids.","motive":"Telephone fraud against Japanese victims.","vector":"Random VoIP calls claiming unpaid phone bills and investigations, followed by deepfake video calls with impersonated officers in seized Japanese police uniforms.","root_cause":"Generative AI removed language and visual barriers for a cross-border scam crew targeting a foreign population.","timeline":[{"date":"2025-05-01","event":"Yang establishes the call centre in Kuala Lumpur"},{"date":"2025-10-01","event":"Royal Malaysia Police raid the site and seize uniforms and fake badges"},{"date":"2026-01-29","event":"Taichung prosecutors indict four and seek heavy sentences"}],"impact":"About 18,653,667 yen, roughly US$120,000, taken from Japanese victims and converted to USDT; no restitution made.","response":"International cooperation among Taiwan, Japan and Malaysia; indictment of four with confiscation sought.","status":"under investigation","cve":null,"verification":"confirmed","sources":[{"name":"ETtoday","url":"https://www.ettoday.net/news/20260129/3109640.htm"},{"name":"People News (民報)","url":"https://www.peoplenews.tw/?p=14492"}]},{"id":"moltbook-db-exposure","date":"2026-02-02","title":"Moltbook AI-agent social network exposes 1.5M agent API tokens","category":"Model & data leak","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"Moltbook","loss_usd":null,"summary":"Wiz found Moltbook's Supabase database lacked row-level security, letting anyone read and write 1.5M agent tokens, 35,000 emails and private messages containing third-party API keys.","source":"BankInfoSecurity","url":"https://www.bankinfosecurity.com/moltbook-gave-everyone-control-every-ai-agent-a-30710","actor":"Wiz Research and researcher Jameson O'Reilly (responsible disclosure)","actor_type":"researcher","attribution":"Self-disclosed by Wiz; Moltbook confirmed and fixed","motive":"Research; no malicious exploitation confirmed","vector":"Supabase API key in client-side JavaScript combined with missing row-level security policies on production tables","root_cause":"Vibe-coded platform shipped without row-level security, so the public anon key granted full read and write access","timeline":[{"date":"2026-01-31","event":"Researchers discover the exposed Supabase database"},{"date":"2026-02-01","event":"Moltbook secures the database within hours with Wiz help"},{"date":"2026-02-02","event":"Wiz publishes findings"}],"impact":"1.5 million agent API tokens, about 35,000 owner emails and private agent messages containing third-party API keys readable and writable; any agent could be impersonated.","response":"Moltbook enabled row-level security and rotated tokens; Wiz deleted data accessed during research.","status":"patched","cve":null,"verification":"confirmed","sources":[{"name":"BankInfoSecurity","url":"https://www.bankinfosecurity.com/moltbook-gave-everyone-control-every-ai-agent-a-30710"},{"name":"Wiz","url":"https://www.wiz.io/blog/exposed-moltbook-database-reveals-millions-of-api-keys"},{"name":"Infosecurity Magazine","url":"https://www.infosecurity-magazine.com/news/moltbook-exposes-user-data-api/"},{"name":"TechRadar","url":"https://www.techradar.com/pro/security/ai-agent-social-media-network-moltbook-is-a-security-disaster-millions-of-credentials-and-other-details-left-unsecured"}]},{"id":"taiwan-starlink-deepfake-ecny","date":"2026-02-02","title":"Taiwan ring used Starlink and deepfake faces to beat e-CNY checks and drain NT$200M","category":"Deepfake fraud","direction":"with-ai","severity":"high","country":"TW","region":"Asia-Pacific","target":"Digital yuan app users in mainland China","loss_usd":6100000,"summary":"Taiwan's CIB and Thai police arrested a Taichung man backing a Chinese fraud network that built AI 3D face videos from brokered photos to pass e-CNY facial login and drain about NT$200 million from 55 victims.","source":"PTS News (公視新聞)","url":"https://news.pts.org.tw/article/793506","actor":"Taichung man surnamed Lin and Chinese fraud network","actor_type":"criminal","attribution":"Taichung prosecutors indicted Lin and three accomplices for fraud, computer interference and organised crime; Lin allegedly took a 10 percent cut of about NT$18 million.","motive":"Financial theft from victims' bank accounts via the digital yuan wallet.","vector":"Victim photos and personal data bought from Chinese photo brokers, deepfake liveness videos fed to the e-CNY app camera check, Starlink satellite links to evade IP tracing from Thailand.","root_cause":"Facial liveness verification on the wallet accepted pre-recorded synthetic video as a live camera feed.","timeline":[{"date":"2025-06-01","event":"Ring operates from Thailand using Starlink connectivity"},{"date":"2026-02-02","event":"CIB announces arrests with Thai police and prosecutors indict four"}],"impact":"At least 55 victims in mainland China lost about NT$200 million, roughly US$6.1 million; first Taiwanese case combining satellite internet with deepfake KYC bypass.","response":"Four indicted and released on bail of NT$200,000 to NT$1 million; CIB shared the method with Taiwan's Financial Supervisory Commission to harden local banks.","status":"under investigation","cve":null,"verification":"confirmed","sources":[{"name":"PTS News (公視新聞)","url":"https://news.pts.org.tw/article/793506"},{"name":"World Journal (世界日報)","url":"https://www.worldjournal.com/wj/amp/story/121475/9305011"}]},{"id":"surrey-martin-lewis-deepfake-20k","date":"2026-02-03","title":"Surrey PCC: retired engineer loses £20,000 to deepfake Martin Lewis investment video","category":"Deepfake fraud","direction":"with-ai","severity":"low","country":"GB","region":"Europe","target":"Retired engineer in Surrey","loss_usd":25000,"summary":"Surrey's Police and Crime Commissioner publicised a retired engineer who invested after a Facebook deepfake of Martin Lewis, then paid repeated fees to withdraw, losing about £20,000 (about $25,000).","source":"Office of the Police and Crime Commissioner for Surrey","url":"https://www.surrey-pcc.gov.uk/pcc-question-everything-surrey-victim-loses-life-savings-deepfake-video/","actor":"Unknown","actor_type":"criminal","attribution":"Unknown; the scammers were not identified by police.","motive":"Financial gain via fake investment platform and withdrawal fees.","vector":"Facebook video deepfake of Martin Lewis promoting an investment scheme; victim invested £200, then £5,000, then was asked for £5,000 and £10,000 in fees to release about £25,000 in supposed gains.","root_cause":"Convincing AI-generated celebrity endorsement on social media combined with advance-fee withdrawal pressure.","timeline":[{"date":"2025-12-01","event":"Victim sees deepfake Martin Lewis video on Facebook and invests £200"},{"date":"2026-01-15","event":"Victim pays fees demanded to withdraw funds before realising it is a scam"},{"date":"2026-02-03","event":"Surrey PCC publishes the case under its Question EVERYTHING campaign"}],"impact":"Victim lost about £20,000 of life savings and continues to receive near-daily recovery-scam approaches.","response":"Surrey PCC launched a public awareness campaign including a deepfake of the Commissioner herself to show how convincing the technology is.","status":"unresolved","cve":null,"verification":"confirmed","sources":[{"name":"Surrey PCC","url":"https://www.surrey-pcc.gov.uk/pcc-question-everything-surrey-victim-loses-life-savings-deepfake-video/"},{"name":"Surrey PCC news listing","url":"https://www.surrey-pcc.gov.uk/category/communication-and-engagement/page/2/"}]},{"id":"certfr-genai-threat-2026","date":"2026-02-04","title":"CERT-FR: 42 attacker groups actively use generative AI, none yet autonomous against France","category":"State actor AI ops","direction":"with-ai","severity":"medium","country":"FR","region":"Europe","target":"French public and private entities","loss_usd":null,"summary":"ANSSI's CERT-FR published CERTFR-2026-CTI-001, a TLP:CLEAR synthesis reporting that 42 groups use GenAI such as Gemini for profiling, lures and malware, while no attack on a French entity is attributed to autonomous AI.","source":"ANSSI CERT-FR","url":"https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-001.pdf","actor":"Multiple state-linked groups (China, Iran, North Korea, Russia)","actor_type":"state","attribution":"CERT-FR synthesis of vendor and partner reporting; press coverage cites 20 Chinese, 10 Iranian, 9 North Korean and 3 Russian groups.","motive":"Espionage, fraud and sabotage enabled by AI productivity gains","vector":"GenAI services used for reconnaissance, social engineering content and malware development; models also targeted via poisoning and data exfiltration","root_cause":"Dual-use AI services are accessible to attackers at each stage of the intrusion chain","timeline":[{"date":"2026-02-04","event":"CERT-FR publishes CERTFR-2026-CTI-001 (12 pages)"},{"date":"2026-02-05","event":"Report circulates publicly; press coverage breaks down the 42 groups by country"}],"impact":"Advisory-level; documents attacker GenAI adoption across state groups and sets expectations for French defenders.","response":"ANSSI recommends regular reassessment and hardening of AI deployments; no specific French victim named.","status":"ongoing","cve":null,"verification":"reported","sources":[{"name":"CERT-FR","url":"https://www.cert.ssi.gouv.fr/uploads/CERTFR-2026-CTI-001.pdf"},{"name":"ActuIA","url":"https://www.actuia.com/acteur/anssi/"}]},{"id":"clawhub-malicious-skills","date":"2026-02-04","title":"Over 230 malicious OpenClaw skills on ClawHub push password stealers","category":"AI supply chain","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"OpenClaw agent users","loss_usd":null,"summary":"Researchers found hundreds of ClawHub skills posing as crypto and social tools that told users to install a fake 'AuthTool', delivering infostealers such as AMOS on macOS.","source":"ThaiCERT","url":"https://www.thaicert.or.th/en/2026/02/04/researchers-discover-over-200-malicious-skills-on-openclaw-distributing-password-stealing-malware/","actor":"ClawHavoc operation (unnamed group) plus smaller unrelated uploaders","actor_type":"criminal","attribution":"Koi Security linked 335 of 341 malicious skills to a single coordinated operation it calls ClawHavoc; no named group","motive":"Financial: credential and crypto wallet theft via infostealers","vector":"Fake Prerequisites sections in skill docs instructing users to download password-protected ZIPs or run obfuscated scripts delivering AMOS and other stealers","root_cause":"Unvetted skill marketplace with no code review; users trusting install instructions for crypto and social tools","timeline":[{"date":"2026-01-27","event":"First wave of malicious skill uploads to ClawHub"},{"date":"2026-02-01","event":"Koi Security completes audit of 2,857 skills, flagging 341"},{"date":"2026-02-04","event":"Findings published; OpenClaw adds user reporting"}],"impact":"341 malicious skills identified, over 100 posing as crypto tools; payloads included AMOS stealer, reverse shells and config exfiltration. Infection counts not confirmed.","response":"Malicious skills removed from ClawHub; OpenClaw maintainer added a reporting feature; Koi published indicators.","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"ThaiCERT","url":"https://www.thaicert.or.th/en/2026/02/04/researchers-discover-over-200-malicious-skills-on-openclaw-distributing-password-stealing-malware/"},{"name":"The Hacker News","url":"https://thehackernews.com/2026/02/researchers-find-341-malicious-clawhub.html"},{"name":"SC World","url":"https://www.scworld.com/news/openclaw-agents-targeted-with-341-malicious-clawhub-skills"}]},{"id":"unc1069-deepfake-zoom","date":"2026-02-09","title":"North Korea's UNC1069 uses AI deepfake video in fake Zoom calls against crypto firms","category":"Deepfake fraud","direction":"with-ai","severity":"high","country":"GL","region":"Global","target":"Fintech and crypto companies","loss_usd":null,"summary":"Mandiant tied a fintech intrusion to DPRK-linked UNC1069, which paired a hijacked Telegram account, a spoofed Zoom meeting with AI-generated video, and ClickFix lures to plant macOS malware.","source":"The Record","url":"https://therecord.media/north-korean-hackers-targeted-crypto-exec-clickfix","actor":"UNC1069 (North Korea-linked, aka Masan)","actor_type":"state","attribution":"Attributed by Mandiant with high confidence to a DPRK-nexus group tracked since 2018","motive":"Cryptocurrency theft and harvesting identities for future social engineering","vector":"Compromised executive Telegram account, Calendly link to spoofed Zoom page with AI-generated video of a CEO, ClickFix command installing macOS loaders","root_cause":"Trust in known contacts on messaging apps and willingness to run pasted terminal commands to fix a fake meeting issue","timeline":[{"date":"2025-11","event":"GTIG notes UNC1069 using Gemini for wallet-targeting scripts and lures"},{"date":"2026-02-09","event":"Mandiant publishes intrusion analysis with new SILENCELIFT, DEEPBREATH and CHROMEPUSH malware"}],"impact":"Seven macOS malware families on one victim host; credentials, browser data, session tokens, Keychain items, Telegram data and Apple Notes collected. Losses not disclosed.","response":"Mandiant incident response, publication of indicators and hardening guidance on unsigned script execution.","status":"ongoing","cve":null,"verification":"reported","sources":[{"name":"The Record","url":"https://therecord.media/north-korean-hackers-targeted-crypto-exec-clickfix"},{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/north-korean-hackers-use-new-macos-malware-in-crypto-theft-attacks/"},{"name":"SOC Prime","url":"https://socprime.com/active-threats/unc1069-targets-cryptocurrency-sector/"}]},{"id":"nigeria-okonjo-iweala-ai-video-scam","date":"2026-02-11","title":"Okonjo-Iweala alerts Nigerians to AI video using her image for fake investment scheme","category":"Deepfake fraud","direction":"with-ai","severity":"medium","country":"NG","region":"Middle East & Africa","target":"Nigerian social media users","loss_usd":null,"summary":"WTO Director-General Ngozi Okonjo-Iweala warned on X of an AI-manipulated video using her likeness to promote a supposedly government-backed scheme promising up to N2.66M in a week from a N380,000 deposit.","source":"Ripples Nigeria","url":"https://www.ripplesnigeria.com/okonjo-iweala-alerts-nigerians-to-fake-ai-video-scam/","actor":"Unknown","actor_type":"criminal","attribution":"Unknown.","motive":"Collect deposits for a fake automated investment programme capped at 4,000 accounts.","vector":"AI-manipulated video spread on Instagram, Facebook and WhatsApp, platforms she does not use.","root_cause":"Trusted public figure impersonated with generative video.","timeline":[{"date":"2026-02-10","event":"Fake video circulates on social media"},{"date":"2026-02-11","event":"Okonjo-Iweala posts alert on X; authorities said to be investigating"}],"impact":"No losses disclosed.","response":"Public alert; authorities investigating the source.","status":"under investigation","cve":null,"verification":"reported","sources":[{"name":"Ripples Nigeria","url":"https://www.ripplesnigeria.com/okonjo-iweala-alerts-nigerians-to-fake-ai-video-scam/"},{"name":"Technext","url":"https://technext24.com/news/deepfake-ngozi-okonjo-iweala-ai-video/"},{"name":"Nigeria SEC via VON","url":"https://von.gov.ng/sec-warns-nigerians-of-ai-investment-scams/"}]},{"id":"turkey-osmaniye-deepfake-410m-tl","date":"2026-02-11","title":"Turkish police jail five over 410M lira investment scam using deepfakes of officials","category":"Deepfake fraud","direction":"with-ai","severity":"high","country":"TR","region":"Middle East & Africa","target":"Turkish social media users","loss_usd":9500000,"summary":"An Osmaniye-based police operation detained eight suspects, five later jailed, for promoting fake investments on social media with AI images and voices of Turkish officials; losses put at 410 million lira (about $9.5M).","source":"Sabah","url":"https://www.sabah.com.tr/yasam/yapay-zeka-ile-vatandasi-dolandiran-5-kisi-tutuklandi-7522144","actor":"Osmaniye-based investment fraud group","actor_type":"criminal","attribution":"Turkish police cybercrime operation across six provinces; five suspects formally arrested pending trial","motive":"Financial gain through fake high-return investment schemes","vector":"Deepfake video and audio of senior officials in sponsored social media ads leading to fake investment platforms","root_cause":"Generative tools made official endorsements easy to fabricate; ad platforms carried the content","timeline":[{"date":"2026-02-11","event":"Eight suspects detained in coordinated raids; five jailed"},{"date":"2026-05-24","event":"Follow-on 'Yapay Zeka-2' operation detains 16 more suspects in nine provinces"}],"impact":"About 410 million lira in reported victim losses","response":"Detentions, judicial arrests and continued operations against similar networks","status":"under investigation","cve":null,"verification":"confirmed","sources":[{"name":"Sabah","url":"https://www.sabah.com.tr/yasam/yapay-zeka-ile-vatandasi-dolandiran-5-kisi-tutuklandi-7522144"},{"name":"Turkiye Gazetesi","url":"https://www.turkiyegazetesi.com.tr/gundem/sosyal-medyadan-410-milyonluk-vurgun-yaptilar-5-kisi-tutuklandi-1770138"},{"name":"OECD.AI Incidents Monitor","url":"https://oecd.ai/en/incidents/2026-02-11-a158"}]},{"id":"gtig-coinbait-lovable-phish","date":"2026-02-12","title":"COINBAIT crypto-exchange phishing kit built with Lovable AI app builder","category":"AI phishing","direction":"with-ai","severity":"medium","country":"GL","region":"Global","target":"Cryptocurrency exchange customers","loss_usd":null,"summary":"GTIG found COINBAIT, a React single-page phishing kit imitating a crypto exchange, attributed to financially motivated cluster UNC5356, with Supabase and lovable.app artefacts showing Lovable AI-built code.","source":"Google Threat Intelligence Group","url":"https://www.bleepingcomputer.com/news/security/google-says-hackers-are-abusing-gemini-ai-for-all-attacks-stages/","actor":"UNC5356","actor_type":"criminal","attribution":"GTIG attributes the kit to UNC5356 and assesses Lovable-based development from code artefacts.","motive":"Credential theft and crypto fraud","vector":"AI-generated phishing site harvesting exchange logins","root_cause":"No-code AI app builders lower the cost of convincing phishing front-ends","timeline":[{"date":"2025","event":"COINBAIT kit observed in UNC5356 crypto phishing"},{"date":"2026-02-12","event":"GTIG publishes the kit in its AI Threat Tracker"}],"impact":"Credential harvesting kit in circulation; victims not quantified.","response":"Google documented indicators such as Analytics-prefixed log messages for defenders.","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"BleepingComputer on GTIG February 2026 report","url":"https://www.bleepingcomputer.com/news/security/google-says-hackers-are-abusing-gemini-ai-for-all-attacks-stages/"},{"name":"HackMag coverage","url":"https://hackmag.com/news/gemini-abuse"},{"name":"Decryption Digest analysis","url":"https://www.decryptiondigest.com/blog/honestcue-ai-malware-gemini-apt-live-operations"}]},{"id":"gtig-gemini-state-misuse","date":"2026-02-12","title":"Google: state hackers use Gemini across all attack stages; 100K-prompt extraction try","category":"State actor AI ops","direction":"with-ai","severity":"medium","country":"GL","region":"Global","target":"Google Gemini / multiple sectors","loss_usd":null,"summary":"GTIG reported Chinese, Iranian, North Korean and Russian groups using Gemini for recon, exploit research and lures, and blocked a 100,000+ prompt campaign to extract its reasoning.","source":"BleepingComputer","url":"https://bleepingcomputer.com/news/security/google-says-hackers-are-abusing-gemini-ai-for-all-attacks-stages/","actor":"APT31, Temp.HEX, APT42, UNC2970 and Russian groups; unnamed distillers","actor_type":"state","attribution":"Attributed by Google Threat Intelligence Group; distillation campaign actors not publicly named","motive":"Espionage support (recon, lures, exploit research) and intellectual property theft via model extraction","vector":"Abuse of legitimate Gemini accounts and APIs; reasoning trace coercion prompts to extract internal chain of thought","root_cause":"General-purpose AI assistants accessible to state actors; API access enables large-scale output harvesting for distillation","timeline":[{"date":"2025-11","event":"Previous GTIG AI Threat Tracker covers PROMPTFLUX-era findings"},{"date":"2026-02-12","event":"GTIG publishes report on state misuse and a 100,000-plus prompt extraction campaign"}],"impact":"No breakthrough capabilities observed; Google says extraction attempt was flagged in real time and reasoning traces protected. Accounts and infrastructure disabled.","response":"Google disabled abusive accounts and infrastructure, hardened Gemini classifiers and warned of takedowns and legal action.","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"BleepingComputer","url":"https://bleepingcomputer.com/news/security/google-says-hackers-are-abusing-gemini-ai-for-all-attacks-stages/"},{"name":"SecurityBrief","url":"https://securitybrief.co.uk/story/google-warns-of-ai-model-theft-state-backed-misuse"},{"name":"TechInformed","url":"https://techinformed.com/google-disrupts-gemini-model-extraction-attempts/"}]},{"id":"gtig-honestcue-gemini-loader","date":"2026-02-12","title":"HONESTCUE loader asks Gemini to write fresh C# second-stage code and compiles it in memory","category":"AI-assisted malware","direction":"with-ai","severity":"medium","country":"GL","region":"Global","target":"Windows hosts targeted by the proof-of-concept framework","loss_usd":null,"summary":"GTIG described HONESTCUE, a downloader framework seen in late 2025 that prompts the Gemini API for a unique C# program to fetch and run a .NET payload from Discord CDN, compiling it in memory so no file touches disk.","source":"Google Threat Intelligence Group","url":"https://www.bleepingcomputer.com/news/security/google-says-hackers-are-abusing-gemini-ai-for-all-attacks-stages/","actor":"Unknown single actor or small group","actor_type":"criminal","attribution":"GTIG assessed a single actor or small group in a testing phase.","motive":"Evasion of signature-based detection","vector":"Runtime LLM code generation for just-in-time payload compilation","root_cause":"Public LLM APIs provide polymorphic code on demand","timeline":[{"date":"2025-09","event":"HONESTCUE first observed by GTIG"},{"date":"2026-02-12","event":"GTIG publishes the family in its AI Threat Tracker"}],"impact":"Proof of concept; no confirmed victims published.","response":"Google disabled associated accounts and infrastructure and tuned classifiers.","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"BleepingComputer on GTIG February 2026 report","url":"https://www.bleepingcomputer.com/news/security/google-says-hackers-are-abusing-gemini-ai-for-all-attacks-stages/"},{"name":"HackMag coverage","url":"https://hackmag.com/news/gemini-abuse"},{"name":"Decryption Digest analysis","url":"https://www.decryptiondigest.com/blog/honestcue-ai-malware-gemini-apt-live-operations"}]},{"id":"vidar-steals-openclaw-secrets","date":"2026-02-16","title":"Infostealer captures OpenClaw gateway token, device keys and agent memory files","category":"Model & data leak","direction":"on-ai","severity":"medium","country":"GL","region":"Global","target":"OpenClaw users","loss_usd":null,"summary":"Hudson Rock documented the first infostealer log containing an OpenClaw .openclaw directory: openclaw.json with a gateway auth token, device.json with signing keys and soul.md and memory files holding private messages and calendar data.","source":"Hudson Rock (via BleepingComputer)","url":"https://www.bleepingcomputer.com/news/security/infostealer-malware-found-stealing-openclaw-secrets-for-first-time/","actor":"Vidar infostealer operators","actor_type":"criminal","attribution":"Hudson Rock assessed the malware as a Vidar variant; it was not built for OpenClaw but swept files matching keywords such as token and private key","motive":"Credential theft for resale and account takeover","vector":"Generic infostealer keyword search over the user's home directory capturing the agent's plaintext configuration and memory files","root_cause":"OpenClaw stores gateway tokens, device private keys and agent memory in plaintext files on the host","timeline":[{"date":"2026-02-13","event":"Victim machine infected; infostealer log includes the .openclaw directory"},{"date":"2026-02-16","event":"Hudson Rock and BleepingComputer report the first observed OpenClaw secret theft"}],"impact":"Stolen gateway token and device private key allow remote connection, client impersonation and bypass of Safe Device checks; memory files exposed private messages and activity logs","response":"Researchers advised rotating gateway tokens and re-pairing devices; expected infostealers to target agent frameworks routinely","status":"ongoing","cve":null,"verification":"confirmed","sources":[{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/infostealer-malware-found-stealing-openclaw-secrets-for-first-time/"},{"name":"BleepingComputer OpenClaw tag","url":"https://www.bleepingcomputer.com/tag/openclaw/"}]},{"id":"cline-cli-openclaw","date":"2026-02-17","title":"Compromised Cline CLI npm release silently installs OpenClaw agent","category":"AI supply chain","direction":"on-ai","severity":"medium","country":"GL","region":"Global","target":"Cline CLI users","loss_usd":null,"summary":"A stolen npm token was used to publish cline@2.3.0 with a postinstall script that globally installed the OpenClaw agent; it was live about 8 hours and downloaded ~4,000 times.","source":"Dark Reading","url":"https://www.darkreading.com/application-security/supply-chain-attack-openclaw-cline-users","actor":"Unknown party using a stolen npm publish token","actor_type":"unknown","attribution":"No public attribution; Cline says a compromised npm token was used. One vendor report ties it to prior AI triage workflow research by Adnan Khan","motive":"Unclear; payload was a legitimate package, possibly a prank or demonstration","vector":"Unauthorized npm publish of cline@2.3.0 with a postinstall script running npm install -g openclaw@latest","root_cause":"Long-lived npm publish token exposed via a GitHub Actions workflow; no trusted publishing or provenance enforcement","timeline":[{"date":"2026-02-17","event":"cline@2.3.0 published at 3:26 AM PT with malicious postinstall"},{"date":"2026-02-17","event":"Clean 2.4.0 published at 11:23 AM PT and 2.3.0 deprecated at 11:30 AM PT"},{"date":"2026-02-18","event":"GHSA-9ppg-jx86-fqw7 advisory and media coverage"}],"impact":"About 4,000 downloads in an eight-hour window installed OpenClaw globally without consent; no credential theft or malicious payload reported.","response":"Cline revoked the token, moved publishing to OIDC provenance via GitHub Actions, published 2.4.0 and told users to uninstall OpenClaw if unwanted.","status":"resolved","cve":null,"verification":"confirmed","sources":[{"name":"Dark Reading","url":"https://www.darkreading.com/application-security/supply-chain-attack-openclaw-cline-users"},{"name":"The Hacker News","url":"https://thehackernews.com/2026/02/cline-cli-230-supply-chain-attack.html"},{"name":"Endor Labs","url":"https://endorlabs.com/learn/supply-chain-attack-targeting-cline-installs-openclaw"},{"name":"GitHub Advisory via OSV","url":"https://osv.dev/vulnerability/GHSA-9ppg-jx86-fqw7"}]},{"id":"lagos-peter-obi-ai-forex-fraud","date":"2026-02-18","title":"Lagos court remands man over N230M forex scam using AI-cloned image of Peter Obi","category":"Deepfake fraud","direction":"with-ai","severity":"medium","country":"NG","region":"Middle East & Africa","target":"Nigerian investor Fredrick Amaechi; Peter Obi's likeness","loss_usd":150000,"summary":"Nigerian police arraigned Olayinka Adesiyan in Lagos on six counts for allegedly using AI-altered images of Peter Obi endorsing the Modmut International forex platform to obtain about N230 million in 2025.","source":"THISDAY","url":"https://www.thisdaylive.com/2026/02/18/court-remands-businessman-accused-of-using-ai-to-impersonate-peter-obi-in-n230m-forex-fraud","actor":"Olayinka Adesiyan and others at large","actor_type":"criminal","attribution":"Charged by the Federal Republic of Nigeria; defendant pleaded not guilty and the case is pending.","motive":"Investment fraud using a prominent politician's endorsement.","vector":"AI-cloned Facebook image and adverts presenting Obi as a beneficiary of a forex trading partnership.","root_cause":"Unverified social media advertising and public trust in political figures.","timeline":[{"date":"2025-07-01","event":"Alleged fraudulent adverts begin circulating"},{"date":"2025-10-31","event":"Alleged scheme ends after N230 million received"},{"date":"2026-02-18","event":"Defendant arraigned and remanded at Ikoyi"}],"impact":"About N230 million, roughly US$150,000, allegedly obtained from one investor and diverted.","response":"Police prosecution on conspiracy, false pretence, fraudulent pt injection","direction":"on-ai","severity":"high","country":"IL","region":"Middle East & Africa","target":"OpenAI ChatGPT code execution runtime","loss_usd":null,"summary":"Check Point Research found ChatGPT's supposedly offline Python container could reach the internet via DNS, so one malicious prompt or custom GPT could exfiltrate messages and files or open a remote shell. OpenAI fixed it","source":"Check Point Research","url":"https://research.checkpoint.com/2026/chatgpt-data-leakage-via-a-hidden-outbound-channel-in-the-code-execution-runtime/","actor":"Check Point Research","actor_type":"researcher","attribution":"Responsible disclosure; OpenAI said it had identified the problem internally","motive":"Security research","vector":"Prompt injection causing the runtime to encode data in DNS subdomain lookups; DNS responses carried commands back","root_cause":"DNS resolution remained enabled inside a sandbox described as having no outbound network access","timeline":[{"date":"2026-02-20","event":"OpenAI fix fully deployed"},{"date":"2026-03-30","event":"Check Point publishes the research"}],"impact":"Silent exfiltration of conversation data including health and financial content; no exploitation reported","response":"OpenAI closed the DNS channel in the code execution environment","status":"patched","cve":null,"verification":"confirmed","sources":[{"name":"Check Point Research","url":"https://research.checkpoint.com/2026/chatgpt-data-leakage-via-a-hidden-outbound-channel-in-the-code-execution-runtime/"},{"name":"The Register","url":"https://www.theregister.com/security/2026/03/30/openai-chatgpt-fixes-dns-data-smuggling-flaw/5222414"},{"name":"CSO Online","url":"https://www.csoonline.com/article/4152393/openai-patches-twin-leaks-as-codex-slips-and-chatgpt-spills.html"}]},{"id":"claude-code-leak-lures","date":"2026-03-31","title":"Claude Code source map leak followed by malware-laced fake 'leak' repos","category":"Model & data leak","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"Anthropic Claude Code / developers","loss_usd":null,"summary":"Anthropic accidentally shipped a source map exposing ~513,000 lines of Claude Code; attackers then used fake leaked-code GitHub repos to spread malware to developers.","source":"Zscaler ThreatLabz","url":"https://www.zscaler.com/blogs/security-research/anthropic-claude-code-leak","actor":"Anthropic packaging error; GitHub user idbzoomh spreading Vidar and GhostSocks","actor_type":"criminal","attribution":"Leak self-disclosed by Anthropic as human error; malware lures identified by Zscaler and Trend Micro, operator not named","motive":"Leak accidental; follow-on campaign financially motivated credential theft and proxy botnet building","vector":"Source map in npm package 2.1.88 exposing TypeScript source; SEO-optimized fake leak repos with a Rust dropper in GitHub Releases","root_cause":"Build pipeline shipped a 59.8 MB source map; developers downloading unverified archives from repositories claiming to host the leak","timeline":[{"date":"2026-03-31","event":"Anthropic publishes @anthropic-ai/claude-code 2.1.88 with full source map"},{"date":"2026-04-01","event":"Fake leaked Claude Code repos appear on GitHub pushing Vidar and GhostSocks"},{"date":"2026-04-02","event":"Zscaler, Trend Micro and media report the malware campaign"}],"impact":"About 513,000 lines of Claude Code source exposed; developers who ran the fake leak archive infected with Vidar infostealer and GhostSocks proxy malware.","response":"Anthropic pulled the package and called it a packaging error; researchers warned against downloading leak repos; malicious repos reported to GitHub.","status":"contained","cve":null,"verification":"confirmed","sources":[{"name":"Zscaler ThreatLabz","url":"https://www.zscaler.com/blogs/security-research/anthropic-claude-code-leak"},{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/claude-code-leak-used-to-push-infostealer-malware-on-github/"},{"name":"The Register","url":"https://www.theregister.com/2026/04/02/trojanized_claude_code_leak_github/"},{"name":"Help Net Security","url":"https://www.helpnetsecurity.com/2026/04/03/claude-code-leak-github-malware/"}]},{"id":"codex-branch-name-injection","date":"2026-03-31","title":"OpenAI Codex branch-name command injection exposed GitHub tokens in cloud tasks","category":"Agent hijack","direction":"on-ai","severity":"high","country":"US","region":"North America","target":"OpenAI Codex (web, CLI, SDK, IDE extension)","loss_usd":null,"summary":"BeyondTrust found Codex did not sanitise the GitHub branch name when cloning repos, so a crafted request could run shell commands in the task container and steal the GitHub token. OpenAI fixed it on 5 February 2026.","source":"BeyondTrust Phantom Labs","url":"https://www.csoonline.com/article/4152393/openai-patches-twin-leaks-as-codex-slips-and-chatgpt-spills.html","actor":"BeyondTrust Phantom Labs","actor_type":"researcher","attribution":"Reported to OpenAI on 16 December 2025; fixed before disclosure","motive":"Security research","vector":"Command injection via unvalidated branch name parameter, with Unicode obfuscation to hide the payload in the UI","root_cause":"Shell command construction from untrusted input in the Codex task runner","timeline":[{"date":"2025-12-16","event":"BeyondTrust reports the flaw"},{"date":"2026-02-05","event":"OpenAI patches input validation"},{"date":"2026-03-31","event":"Public disclosure"}],"impact":"Token theft and lateral movement across shared repositories was possible; no exploitation reported","response":"OpenAI tightened branch-name validation and hardened command construction","status":"patched","cve":null,"verification":"confirmed","sources":[{"name":"CSO Online","url":"https://www.csoonline.com/article/4152393/openai-patches-twin-leaks-as-codex-slips-and-chatgpt-spills.html"},{"name":"Hackmag","url":"https://hackmag.com/news/chatgpt-codex-flaws"}]},{"id":"vertex-ai-double-agent","date":"2026-03-31","title":"Vertex AI 'Double Agent': over-privileged agents leak credentials and code","category":"Agent hijack","direction":"on-ai","severity":"medium","country":"GL","region":"Global","target":"Google Cloud Vertex AI Agent Engine","loss_usd":null,"summary":"Unit 42 showed agents deployed on Vertex AI inherited broad default service-account rights, letting a compromised agent steal credentials and reach restricted images and source code.","source":"Unit 42 (Palo Alto Networks)","url":"https://unit42.paloaltonetworks.com/double-agents-vertex-ai/","actor":"Security researchers at Palo Alto Networks Unit 42 (responsible disclosure)","actor_type":"researcher","attribution":"Self-attributed research by Unit 42; Google confirmed and worked with researchers on the fix","motive":"Security research and responsible disclosure","vector":"Code running inside a deployed ADK agent queried the GCP instance metadata service to obtain the OAuth token of the Google-managed service agent (P4SA)","root_cause":"Vertex AI Agent Engine attached a default per-product service agent with broad permissions, so any compromised or malicious agent inherited over-privileged, Google-managed identity","timeline":[{"date":"2026-03","event":"Unit 42 demonstrates credential extraction and access to customer data and Google-internal Artifact Registry images"},{"date":"2026-03-31","event":"Unit 42 publishes Double Agents research after responsible disclosure to Google"},{"date":"2026-04-01","event":"Google confirms production image tampering was blocked and updates Vertex AI permissions documentation"}],"impact":"Proof of concept only: a deployed agent could return service-agent credentials, reach customer data, internal Dockerfiles and Google internal Artifact Registry contents; no confirmed real-world victims","response":"Google worked with Unit 42, confirmed internal controls block tampering with production images, rewrote agent permission docs and recommends Bring Your the JavaScript Function() constructor with full Node.js privileges; only an API token required","root_cause":"CustomMCP node executed user-supplied configuration as JavaScript without validation, giving access to child_process and fs modules","timeline":[{"date":"2025-09","event":"Flaw disclosed and patched in Flowise 3.0.6; CVE-2025-59528 assigned with CVSS 10.0"},{"date":"2026-04-07","event":"VulnCheck reports first in-the-wild exploitation; 12,000-15,000 instances exposed online"},{"date":"2026-04-07","event":"BleepingComputer and others urge upgrade to 3.1.1 or later"}],"impact":"Remote code execution on exposed Flowise servers; exploitation limited to one source IP at time of reporting; number of compromised instances unknown","response":"Vendor fix already available (3.0.6+); researchers urged upgrading, removing instances from the internet and rotating API tokens; VulnCheck shared signatures with customers","status":"patched","cve":"CVE-2025-59528","verification":"reported","sources":[{"name":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/max-severity-flowise-rce-vulnerability-now-exploited-in-attacks/"},{"name":"The Hacker News","url":"https://thehackernews.com/2026/04/flowise-ai-agent-builder-under-active.html"},{"name":"Security Affairs","url":"https://securityaffairs.com/190471/security/attackers-exploit-critical-flowise-flaw-cve-2025-59528-for-remote-code-execution.html"},{"name":"SecurityWeek","url":"https://www.securityweek.com/critical-flowise-vulnerability-in-attacker-crosshairs/"}]},{"id":"grafanaghost","date":"2026-04-07","title":"GrafanaGhost: indirect prompt injection makes Grafana AI leak enterprise data","category":"Prompt injection","direction":"on-ai","severity":"medium","country":"GL","region":"Global","target":"Grafana AI assistant","loss_usd":null,"summary":"Researchers showed hidden instructions in external content could make Grafana's AI render an attacker image URL carrying enterprise data; Grafana patched it.","source":"SecurityWeek","url":"https://www.securityweek.com/grafanaghost-attackers-can-abuse-grafana-to-leak-enterprise-data/","actor":"Security researchers at Noma Security (Sasi Levi), responsible disclosure","actor_type":"researcher","attribution":"Self-attributed research by Noma Security; Grafana Labs validated the flaw but disputed its severity","motive":"Security research and responsible disclosure","vector":"Crafted URL path carrying hidden instructions, an INTENT keyword to bypass guardrails, and a protocol-relative image URL that evaded external-image domain validation","root_cause":"Grafana AI assistant trusted content in URL paths and external pages, and URL validation failed to block protocol-relative links, enabling zero-click exfiltration via image rendering","timeline":[{"date":"2026-03","event":"Noma Security discovers the chained bypass and reports it to Grafana Labs"},{"date":"2026-04-07","event":"Grafana patches the core issue; Noma publishes GrafanaGhost research"},{"date":"2026-04-07","event":"SecurityWeek, CyberScoop and Dark Reading cover the disclosure"}],"impact":"Proof of concept only; no confirmed data breach. Attack could have leaked dashboard data including financial metrics, infrastructure and customer telemetry to an attacker server","response":"Grafana Labs validated the report and rolled out a fix for the URL validation and guardrail bypass; disputed the severity, noting repeated user involvement was needed","status":"patched","cve":null,"verification":"disputed","sources":[{"name":"SecurityWeek","url":"https://www.securityweek.com/grafanaghost-attackers-can-abuse-grafana-to-leak-enterprise-data/"},{"name":"CyberScoop","url":"https://cyberscoop.com/grafanaghost-grafana-prompt-injection-vulnerability-data-exfiltration/"},{"name":"Dark Reading","url":"https://darkreading.com/application-security/grafana-patches-ai-bug-leaked-user-data"},{"name":"CSO Online","url":"https://www.csoonline.com/article/4155004/zero-click-grafana-ai-attack-can-enable-enterprise-data-exfiltration.html"}]},{"id":"copilot-agentforce-injection","date":"2026-04-15","title":"Prompt injection leaks data from Microsoft Copilot Studio and Salesforce Agentforce agents","category":"Prompt injection","direction":"on-ai","severity":"high","country":"GL","region":"Global","target":"Copilot Studio, Salesforce Agentforce","loss_usd":null,"summary":"Researchers demonstrated indirect prompt injection that exfiltrated data from enterprise agents built on Copilot Studio (CVE-2026-21520) and Agentforce despite earlier patches.","source":"OECD AI Incidents Monitor","url":"https://oecd.ai/en/incidents/2026-04-15-d934","actor":"Security researchers at Capsule Security (responsible disclosure)","actor_type":"researcher","attribution":"Self-attributed research by Capsule Security; Microsoft assigned CVE-2026-21520 (ShareLeak); Salesforce confirmed addressing PipeLeak","motive":"Security research and responsible disclosure","vector":"Indirect prompt injection via ordinary business inputs: a SharePoint form comment field (Copilot Studio) and a public lead form (Agentforce) carrying fake system instructions","root_cause":"Untrusted form input was concatenated into agent system prompts with no separation between trusted instructions and user data, so agents followed injected commands through authorized tools","timeline":[{"date":"2026-01-15","event":"Microsoft patches the Copilot Studio flaw server-side"},{"date":"2026-01-22","event":"CVE-2026-21520 published (CVSS 7.5)"},{"date":"2026-04-15","event":"Capsule Security publicly discloses ShareLeak and PipeLeak alongside its launch"}],"impact":"Demonstrated exfiltration of SharePoint list data by email and misuse of Agentforce workflows; Microsoft safety filters flagged but did not stop the payload; no confirmed real-world victims","response":"Microsoft mitigated internally with no customer action required; Salesforce said it addressed the issue; researchers warned the attack class remains open","status":"patched","cve":"CVE-2026-21520","verification":"confirmed","sources":[{"name":"OECD AI Incidents Monitor","url":"https://oecd.ai/en/incidents/2026-04-15-d934"},{"name":"CSO Online","url":"https://www.csoonline.com/article/4159079/copilot-and-agentforce-fall-to-form-based-prompt-injection-tricks.html"},{"name":"SiliconANGLE","url":"https://siliconangle.com/2026/04/15/capsule-security-launches-7m-secure-ai-agents-runtime/"}]},{"id":"marimo-rce-nkabuse-hugging-face","date":"2026-04-16","title":"Marimo notebook RCE (CVE-2026-39987) exploited in hours; NKAbuse RAT staged on Hugging Face Spaces","category":"AI supply chain","direction":"on-ai","severity":"critical","country":"GL","region":"Global","target":"Marimo Python notebook servers","loss_usd":null,"summary":"An unauthenticated terminal WebSocket in marimo before 0.23.0 gave shell access; Sysdig saw credential theft under 10 hours after disclosure and a campaign using a typosquatted Hugging Face Space to drop a new NKAbuse variant.","source":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/hackers-exploit-marimo-flaw-to-deploy-nkabuse-malware-from-hugging-face/","actor":"Multiple actors incl. Germany- and Hong Kong-based operators","actor_type":"criminal","attribution":"Sysdig observed distinct operators: one testing 15 reverse-shell techniques and dumping PostgreSQL credentials, another using stolen .env data against Redis; NKAbuse campaign unattributed","motive":"Credential theft, data dumping and remote access","vector":"Connection to /terminal/ws without authentication to open a PTY shell, then curl of a dropper hosted on a Hugging Face Space named to mimic VS Code","root_cause":"Terminal WebSocket endpoint skipped the authentication check used by other endpoints","timeline":[{"date":"2026-04-09","event":"CVE-2026-39987 published; fixed in marimo 0.23.0"},{"date":"2026-04-10","event":"Credential theft attacks begin less than 10 hours after technical details appear"},{"date":"2026- ed to a third-party AI tool, and Vercel environment variables not marked sensitive being readable in plaintext","timeline":[{"date":"2026-02","event":"Context.ai employee reportedly infected with Lumma Stealer; OAuth tokens later compromised"},{"date":"2026-03","event":"Context.ai discloses unauthorized access to its AWS environment and hires CrowdStrike"},{"date":"2026-04-19","event":"Vercel detects unauthorized access to internal systems via employee Google Workspace account"},{"date":"2026-04-21","event":"Vercel publishes bulletin, notifies affected customers and publishes OAuth app IOC"}],"impact":"Attacker accessed some Vercel environments and customer environment variables not marked sensitive for a limited set of customers; sensitive-flagged variables showed no evidence of access","response":"Vercel engaged Google Mandiant, notified affected customers, recommended credential rotation, published an OAuth app IOC and confirmed with GitHub, npm and Socket that its packages were untouched","status":"under investigation","cve":null,"verification":"confirmed","sources":[{"name":"Trend Micro","url":"https://trendmicro.com/en_us/research/26/d/vercel-breach-oauth-supply-chain.html"},{"name":"Help Net Security","url":"https://helpnetsecurity.com/2026/04/20/vercel-breached"},{"name":"The Register","url":"https://www.theregister.com/2026/04/20/vercel_context_ai_security_incident/"}]},{"id":"lovable-pre-nov-2025-projects","date":"2026-04-20","title":"Researcher: free Lovable account could read source, Supabase keys and chats of pre-Nov 2025 projects","category":"Model & data leak","direction":"on-ai","severity":"high","country":"SE","region":"Europe","target":"Lovable projects created before November 2025","loss_usd":null,"summary":"A researcher posting as weezerOSINT disclosed that any free Lovable account could access other users' source code, Supabase database credentials, AI chat histories and connected customer data for projects created before November 2025.","source
