[build]
  publish = "site"
  command = ""

# Open data: let researchers, notebooks and other sites fetch the JSON directly.
[[headers]]
  for = "/data/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*.xml"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Access-Control-Allow-Origin = "*"

# Case files merged on 2026-10-15 (two files described one incident). The removed ids keep
# working: each old URL, in every language, sends readers to the file that was kept.
[[redirects]]
